<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0a1a">
<title>원페이지 학습</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', sans-serif; background: #0a0a1a; color: #e5e7eb; }
body {
  line-height: 1.6; -webkit-text-size-adjust: 100%;
  -webkit-user-select: none; -moz-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  overflow-x: hidden;
}
button { font: inherit; cursor: pointer; border: none; }
input { font: inherit; outline: none; }
a { color: #4fc3f7; text-decoration: none; }
/* 인쇄 차단 */
@media print { html, body { display: none !important; } }

/* ─────────────────────────────────────────────
   워터마크 — 전체 화면 대각선 반복 (캡쳐 추적용)
   ───────────────────────────────────────────── */
#watermark {
  position: fixed; inset: 0; z-index: 9999;
  pointer-events: none; overflow: hidden;
  display: none;
}
#watermark.show { display: block; }
#watermark svg { width: 100%; height: 100%; }

/* ─────────────────────────────────────────────
   공통 — 헤더
   ───────────────────────────────────────────── */
.app-header {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; background: rgba(10,10,26,0.95);
  border-bottom: 1px solid #1f1f3a;
  position: sticky; top: 0; z-index: 50;
  backdrop-filter: blur(10px);
}
.app-header .brand {
  display: flex; align-items: center; gap: 6px;
  font-size: 15px; font-weight: 800; color: #fff;
}
.app-header .brand em { font-style: normal; color: #e94560; }
.app-header .back-btn {
  background: rgba(255,255,255,0.05); color: #fff;
  padding: 6px 10px; border-radius: 6px; font-size: 13px;
  margin-right: 2px;
}
.app-header .home-btn {
  background: rgba(255,255,255,0.06); color: #fff;
  width: 36px; height: 36px; border-radius: 8px;
  display: inline-flex; align-items: center; justify-content: center;
  border: none; cursor: pointer;
  transition: background 0.15s, transform 0.1s;
  -webkit-tap-highlight-color: transparent;
}
.app-header .home-btn:hover { background: rgba(255,255,255,0.12); }
.app-header .home-btn:active { transform: scale(0.92); }
.app-header .live-chip {
  display: flex; align-items: center; gap: 5px;
  background: rgba(76,175,80,0.15); border: 1px solid rgba(76,175,80,0.3);
  padding: 4px 10px; border-radius: 50px; font-size: 11px; color: #81c784;
  font-weight: 600;
}
.app-header .live-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: #4caf50; animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.4} }
.app-header .spacer { flex: 1; }
.app-header .icon-btn {
  background: rgba(255,255,255,0.05); color: #ddd;
  padding: 6px 10px; border-radius: 6px; font-size: 12px;
  display: inline-flex; align-items: center; gap: 4px;
}
.app-header .icon-btn:hover { background: rgba(255,255,255,0.1); }
/* 모두 접기 버튼 — 가운데, v^ 아이콘 + "접기" 라벨 */
.app-header .collapse-center {
  padding: 6px 14px;
  background: rgba(233,69,96,0.18); border: 1px solid rgba(233,69,96,0.45);
  color: #ff8a9e;
  display: inline-flex; align-items: center; gap: 6px;
  border-radius: 50px;
  transition: background 0.15s, transform 0.1s;
  font-size: 12px; font-weight: 700;
}
.app-header .collapse-center:hover { background: rgba(233,69,96,0.28); }
.app-header .collapse-center:active { transform: scale(0.94); }
.app-header .collapse-center svg { flex-shrink: 0; }
.app-header .collapse-center .cc-label {
  white-space: nowrap;
}
/* 암기 모음 토글 */
.app-header .memorized-toggle {
  padding: 6px 12px;
  background: rgba(165,214,167,0.12); border: 1px solid rgba(165,214,167,0.35);
  color: #a5d6a7;
  border-radius: 50px;
  transition: background 0.15s, transform 0.1s;
  font-size: 12px; font-weight: 700;
}
.app-header .memorized-toggle:hover { background: rgba(165,214,167,0.22); }
.app-header .memorized-toggle:active { transform: scale(0.94); }
.app-header .memorized-toggle.active {
  background: rgba(165,214,167,0.32);
  border-color: rgba(165,214,167,0.7);
  color: #c8e6c9;
  box-shadow: 0 0 0 2px rgba(165,214,167,0.15);
}

/* 암기 모음 헤더 — 학습 모드의 topic-head와 같은 레이아웃 (좌: 제목, 우: ⤴ 패스) */
.memo-header {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px; margin-top: 6px;
  background: linear-gradient(180deg, rgba(165,214,167,0.10) 0%, rgba(165,214,167,0.04) 100%);
  border: 1px solid rgba(165,214,167,0.3);
  border-radius: 10px;
}
.memo-header .memo-title {
  flex: 1; font-size: 15px; font-weight: 800;
  color: #c8e6c9; display: flex; align-items: center; gap: 8px;
}
.memo-header .memo-count {
  font-size: 11px; padding: 2px 8px; border-radius: 50px;
  background: rgba(165,214,167,0.18); color: #a5d6a7; font-weight: 700;
}

.memo-empty {
  text-align: center; padding: 60px 20px;
  color: rgba(255,255,255,0.5);
}
.memo-empty .memo-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }
.memo-empty .memo-hint { font-size: 12px; margin-top: 8px; color: rgba(255,255,255,0.35); }

/* ── 다지기 v2 — 오늘 클리어율 진행바 ───────────────────── */
.srs-clear {
  margin: 10px 14px 14px;
  padding: 12px 14px;
  background: linear-gradient(135deg, rgba(233,69,96,0.10), rgba(83,52,131,0.10));
  border: 1px solid rgba(233,69,96,0.28);
  border-radius: 12px;
}
.srs-clear-head {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 13px; font-weight: 700; color: #fff;
  margin-bottom: 8px;
}
.srs-clear-num { color: #ffd180; font-variant-numeric: tabular-nums; }
.srs-clear-bar {
  height: 8px; background: rgba(255,255,255,0.06);
  border-radius: 50px; overflow: hidden;
  margin-bottom: 6px;
}
.srs-clear-fill {
  height: 100%;
  background: linear-gradient(90deg, #e94560 0%, #ff8a9e 100%);
  border-radius: 50px;
  transition: width 0.35s ease;
}
.srs-clear-foot { font-size: 11px; color: rgba(255,255,255,0.55); text-align: right; }

/* ── 능동 회상 (Active Recall) 토글 바 ─────────────────── */
.recall-toggle-bar {
  margin: 12px 14px 4px;
  padding: 10px 14px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 12px;
  cursor: pointer;
  user-select: none;
  transition: background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
}
.recall-toggle-bar:hover {
  background: rgba(186,156,245,0.08);
  border-color: rgba(186,156,245,0.30);
}
.recall-toggle-bar.on {
  background: linear-gradient(135deg, rgba(186,156,245,0.16), rgba(149,117,219,0.10));
  border-color: rgba(186,156,245,0.50);
  box-shadow: 0 0 18px rgba(186,156,245,0.18);
}
.recall-toggle-inner {
  display: flex; align-items: center; gap: 10px;
}
.recall-toggle-icon { font-size: 18px; line-height: 1; }
.recall-toggle-label {
  flex: 1; font-size: 13px; font-weight: 700;
  color: rgba(255,255,255,0.85); letter-spacing: 0.2px;
}
.recall-toggle-bar.on .recall-toggle-label { color: #d1b3ff; }
.recall-toggle-state {
  font-size: 11px; font-weight: 800;
  padding: 3px 10px; border-radius: 50px;
  background: rgba(255,255,255,0.10); color: rgba(255,255,255,0.55);
  letter-spacing: 0.5px;
}
.recall-toggle-bar.on .recall-toggle-state {
  background: rgba(186,156,245,0.30); color: #fff;
  box-shadow: 0 0 12px rgba(186,156,245,0.40);
}
.recall-toggle-hint {
  margin-top: 8px; padding-top: 8px;
  border-top: 1px dashed rgba(186,156,245,0.20);
  font-size: 11.5px; color: rgba(209,179,255,0.75);
  line-height: 1.5;
}

/* ── 능동 회상 — 본문 블러 + 정답 보기 버튼 ────────────── */
.recall-blur-wrap {
  position: relative;
  min-height: 80px;
}
.recall-blurred {
  filter: blur(9px);
  opacity: 0.55;
  user-select: none;
  pointer-events: none;
  transition: filter 0.4s ease, opacity 0.4s ease;
}
.recall-reveal-btn {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: linear-gradient(135deg, rgba(186,156,245,0.95), rgba(149,117,219,0.95));
  border: none; color: #fff;
  font-size: 14px; font-weight: 800;
  padding: 12px 26px; border-radius: 30px;
  cursor: pointer; letter-spacing: 0.4px;
  box-shadow: 0 6px 20px rgba(149,117,219,0.45), 0 0 0 4px rgba(186,156,245,0.18);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  white-space: nowrap;
}
.recall-reveal-btn:hover {
  transform: translate(-50%, -50%) scale(1.05);
  box-shadow: 0 8px 28px rgba(149,117,219,0.55), 0 0 0 6px rgba(186,156,245,0.22);
}
.recall-reveal-btn:active {
  transform: translate(-50%, -50%) scale(0.98);
}

/* ── 능동 회상 — 자기평가 바 ───────────────────────────── */
.recall-assess-bar {
  display: flex; gap: 10px;
  padding: 12px 14px 14px;
  margin-top: 10px;
  border-top: 1px solid rgba(255,255,255,0.08);
}
.recall-btn {
  flex: 1;
  padding: 13px 8px;
  border-radius: 12px;
  border: 1.5px solid;
  font-size: 14px; font-weight: 800;
  cursor: pointer; letter-spacing: 0.3px;
  transition: transform 0.12s ease, box-shadow 0.18s ease, background 0.18s ease;
}
.recall-btn:active { transform: scale(0.96); }
.recall-correct {
  background: rgba(76,175,80,0.12);
  border-color: rgba(76,175,80,0.45);
  color: #a5d6a7;
}
.recall-correct:hover {
  background: rgba(76,175,80,0.22);
  box-shadow: 0 0 18px rgba(76,175,80,0.35);
}
.recall-wrong {
  background: rgba(233,69,96,0.12);
  border-color: rgba(233,69,96,0.45);
  color: #ff8a9e;
}
.recall-wrong:hover {
  background: rgba(233,69,96,0.22);
  box-shadow: 0 0 18px rgba(233,69,96,0.35);
}

/* ── 음성 퀴즈 (Voice Quiz) ────────────────────────────── */
.vq-settings {
  display: flex; gap: 8px;
  margin: 10px 14px 6px;
  align-items: stretch;
}
.vq-seg {
  display: inline-flex;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 10px;
  padding: 3px;
  flex-shrink: 0;
}
.vq-seg-btn {
  background: transparent; border: none;
  color: rgba(255,255,255,0.55);
  padding: 7px 14px;
  font-size: 12.5px; font-weight: 700;
  cursor: pointer; border-radius: 7px;
  transition: background 0.18s ease, color 0.18s ease;
}
.vq-seg-btn.on {
  background: linear-gradient(135deg, rgba(79,195,247,0.85), rgba(38,150,210,0.85));
  color: #fff;
  box-shadow: 0 2px 8px rgba(79,195,247,0.40);
}
.vq-read-btn {
  flex: 1;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.10);
  color: rgba(255,255,255,0.65);
  padding: 8px 12px;
  font-size: 12.5px; font-weight: 700;
  cursor: pointer; border-radius: 10px;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease;
}
.vq-read-btn.on {
  background: linear-gradient(135deg, rgba(255,138,0,0.20), rgba(233,69,96,0.18));
  border-color: rgba(255,138,0,0.50);
  color: #ffb74d;
  box-shadow: 0 2px 10px rgba(255,138,0,0.30);
}
.vq-read-btn.on strong { color: #fff; }

.vq-toggle {
  display: block;
  width: calc(100% - 28px);
  margin: 4px 14px 4px;
  padding: 12px 16px;
  border: none; border-radius: 12px;
  font-size: 14px; font-weight: 800;
  cursor: pointer; letter-spacing: 0.4px;
  transition: transform 0.12s ease, box-shadow 0.18s ease;
}
.vq-toggle-start {
  background: linear-gradient(135deg, rgba(79,195,247,0.92), rgba(38,150,210,0.92));
  color: #fff;
  box-shadow: 0 4px 14px rgba(79,195,247,0.35);
}
.vq-toggle-start:hover { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(79,195,247,0.50); }
.vq-toggle-stop {
  background: rgba(233,69,96,0.20);
  border: 1px solid rgba(233,69,96,0.50);
  color: #ff8a9e;
}
/* 작은 중단 버튼 — 퀴즈 stage-head 안에 배치 */
.vq-stop-small {
  background: rgba(233,69,96,0.18);
  border: 1px solid rgba(233,69,96,0.45);
  color: #ff8a9e;
  font-size: 11px; font-weight: 700;
  padding: 5px 10px;
  border-radius: 8px;
  cursor: pointer;
  letter-spacing: 0.3px;
  flex-shrink: 0;
  transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  -webkit-tap-highlight-color: transparent;
}
.vq-stop-small:hover {
  background: rgba(233,69,96,0.30);
  border-color: rgba(233,69,96,0.65);
}
.vq-stop-small:active { transform: scale(0.94); }
/* 시작 버튼 row — 음성 퀴즈 + 첫글자 퀴즈 나란히 */
.vq-start-row {
  display: flex; gap: 8px;
  margin: 4px 14px 6px;
}
.vq-half {
  flex: 1;
  width: auto !important;
  margin: 0 !important;
  font-size: 13.5px;
  padding: 12px 10px;
}
.vq-toggle-fl {
  background: linear-gradient(135deg, rgba(186,156,245,0.92), rgba(149,117,219,0.92));
  color: #fff;
  box-shadow: 0 4px 14px rgba(149,117,219,0.35);
}
.vq-toggle-fl:hover { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(149,117,219,0.55); }

/* 남은 퀴즈 카드 수 badge — 시작 버튼 오른쪽 */
.vq-pending-badge {
  flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 38px;
  padding: 10px 12px;
  background: linear-gradient(180deg, rgba(255,138,0,0.22), rgba(255,138,0,0.12));
  border: 1.5px solid rgba(255,138,0,0.50);
  color: #ffb74d;
  border-radius: 10px;
  font-size: 16px; font-weight: 900;
  letter-spacing: -0.5px;
  box-shadow: 0 2px 10px rgba(255,138,0,0.20);
  text-shadow: 0 1px 3px rgba(0,0,0,0.30);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
.vq-pending-badge.zero {
  background: linear-gradient(180deg, rgba(76,175,80,0.25), rgba(76,175,80,0.12));
  border-color: rgba(76,175,80,0.55);
  color: #a5d6a7;
  box-shadow: 0 2px 10px rgba(76,175,80,0.22);
}

/* 퀴즈 모두 클리어 안내 — 시작 버튼 자리에 대체 표시 */
.quiz-cleared-notice {
  margin: 10px 14px 6px;
  padding: 22px 22px 24px;
  background:
    linear-gradient(180deg, rgba(76,175,80,0.20), rgba(76,175,80,0.06)),
    radial-gradient(ellipse at 30% 0%, rgba(129,199,132,0.18), transparent 70%);
  border: 1.5px solid rgba(76,175,80,0.50);
  border-radius: 16px;
  text-align: center;
  box-shadow:
    0 10px 28px rgba(76,175,80,0.18),
    inset 0 1px 0 rgba(255,255,255,0.10);
  animation: quizClearedPop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
}
@keyframes quizClearedPop {
  0%   { transform: scale(0.88) translateY(8px); opacity: 0; }
  100% { transform: scale(1)    translateY(0);    opacity: 1; }
}
.qc-icon {
  font-size: 44px;
  margin-bottom: 10px;
  display: block;
  animation: qcIconBounce 2s ease-in-out infinite;
}
@keyframes qcIconBounce {
  0%, 100% { transform: translateY(0) rotate(0); }
  50%      { transform: translateY(-5px) rotate(-3deg); }
}
.qc-title {
  font-size: 17px; font-weight: 900;
  color: #a5d6a7;
  letter-spacing: 0.6px;
  margin-bottom: 12px;
  text-shadow: 0 0 16px rgba(76,175,80,0.40);
}
.qc-body {
  font-size: 13px;
  color: rgba(255,255,255,0.82);
  line-height: 1.75;
}
.qc-body strong {
  color: #ffb74d;
  font-weight: 800;
}

/* 첫글자 퀴즈 — 선택지 큰 버튼 */
.fl-card { min-height: 320px; }
.fl-choices {
  display: flex; gap: 16px;
  justify-content: center; align-items: center;
  padding: 26px 8px 18px;
  flex: 1;
}
.fl-choice {
  flex: 1; max-width: 140px;
  padding: 32px 12px;
  font-size: 42px; font-weight: 900;
  color: #fff;
  background: linear-gradient(135deg, rgba(186,156,245,0.30), rgba(149,117,219,0.18));
  border: 2px solid rgba(186,156,245,0.55);
  border-radius: 18px;
  cursor: pointer;
  letter-spacing: 0.5px;
  transition: transform 0.12s ease, box-shadow 0.18s ease, border-color 0.18s ease, background 0.18s ease;
  box-shadow: 0 6px 18px rgba(0,0,0,0.32), inset 0 1px 0 rgba(255,255,255,0.10);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
  text-shadow: 0 2px 10px rgba(0,0,0,0.40);
}
.fl-choice:hover {
  transform: translateY(-3px);
  border-color: rgba(186,156,245,0.85);
  background: linear-gradient(135deg, rgba(186,156,245,0.42), rgba(149,117,219,0.26));
  box-shadow: 0 12px 28px rgba(149,117,219,0.45), inset 0 1px 0 rgba(255,255,255,0.15);
}
.fl-choice:active { transform: scale(0.96); }
.fl-hint {
  text-align: center;
  font-size: 12px;
  color: rgba(255,255,255,0.55);
  letter-spacing: 2px;
  margin-top: 6px;
  padding-bottom: 16px;
  animation: tapHintPulse 2s ease-in-out infinite;
}
.vq-card { min-height: 320px; }
.vq-card .focus-title { margin-bottom: 24px; }

.vq-listening {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 20px 12px 28px;
  flex: 1;
}
.vq-mic-ring {
  width: 92px; height: 92px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(79,195,247,0.40), rgba(79,195,247,0.10));
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 18px;
  position: relative;
  animation: vqMicPulse 1.2s ease-in-out infinite;
  box-shadow: 0 0 0 0 rgba(79,195,247,0.5);
}
@keyframes vqMicPulse {
  0%   { box-shadow: 0 0 0 0 rgba(79,195,247,0.55); transform: scale(1); }
  70%  { box-shadow: 0 0 0 22px rgba(79,195,247,0); transform: scale(1.04); }
  100% { box-shadow: 0 0 0 0 rgba(79,195,247,0); transform: scale(1); }
}
.vq-mic-icon { font-size: 44px; }
.vq-hint {
  font-size: 13px; font-weight: 700;
  color: rgba(255,255,255,0.85);
  letter-spacing: 1px;
  margin-bottom: 18px;
}
.vq-timer-bar {
  width: 80%; max-width: 280px;
  height: 6px;
  background: rgba(255,255,255,0.10);
  border-radius: 50px;
  overflow: hidden;
}
.vq-timer-fill {
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, #81c784, #ffb74d, #ff8a9e);
  border-radius: 50px;
  transform-origin: left center;
  animation: vqTimerShrink 4s linear forwards;
}
@keyframes vqTimerShrink { 0% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
/* 문제 읽기 단계 — 마이크 대신 스피커 아이콘, 다른 색조 */
.vq-reading-ring {
  background: radial-gradient(circle, rgba(255,138,0,0.40), rgba(255,138,0,0.10));
}
.vq-reading-ring { animation: vqReadingPulse 1.0s ease-in-out infinite; }
@keyframes vqReadingPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,138,0,0.55); transform: scale(1); }
  50%      { box-shadow: 0 0 0 18px rgba(255,138,0,0); transform: scale(1.06); }
}
/* 자동 모드 진행 안내 */
.vq-auto-next-hint {
  margin-top: 14px;
  font-size: 12px;
  color: rgba(255,255,255,0.5);
  letter-spacing: 1px;
  text-align: center;
  animation: vqAutoNextBlink 1.2s ease-in-out infinite;
}
@keyframes vqAutoNextBlink {
  0%, 100% { opacity: 0.5; }
  50%      { opacity: 1; }
}

.vq-result {
  padding: 18px 14px 22px;
  text-align: center;
  flex: 1; display: flex; flex-direction: column;
}
.vq-result-icon {
  font-size: 56px;
  margin-bottom: 6px;
  line-height: 1;
}
.vq-result-text {
  font-size: 22px; font-weight: 900;
  margin-bottom: 16px;
  letter-spacing: 0.5px;
}
.vq-correct .vq-result-icon { color: #81c784; text-shadow: 0 0 24px rgba(129,199,132,0.6); animation: vqResultPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) backwards; }
.vq-correct .vq-result-text { color: #a5d6a7; }
.vq-wrong .vq-result-icon { color: #ff8a9e; text-shadow: 0 0 24px rgba(233,69,96,0.6); animation: vqResultPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) backwards; }
.vq-wrong .vq-result-text { color: #ff8a9e; }
@keyframes vqResultPop {
  0% { transform: scale(0.5); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
.vq-you-said, .vq-correct-answer {
  font-size: 13px;
  color: rgba(255,255,255,0.78);
  margin: 4px 0;
}
.vq-correct-answer strong { color: #ffb74d; font-weight: 900; font-size: 15px; }
.vq-explain {
  margin-top: 14px;
  padding: 12px 14px;
  background: rgba(0,0,0,0.22);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  text-align: left;
  font-size: 13px;
  color: rgba(255,255,255,0.85);
  line-height: 1.65;
  flex: 1;
  overflow-y: auto;
}
.vq-correct .vq-explain { animation: vqExplainFade 0.4s ease backwards; }
@keyframes vqExplainFade { 0% { opacity: 0; transform: translateY(4px); } 100% { opacity: 1; transform: translateY(0); } }
.vq-next-btn {
  margin-top: 16px;
  padding: 12px 16px;
  background: linear-gradient(135deg, rgba(186,156,245,0.95), rgba(149,117,219,0.95));
  border: none; color: #fff;
  font-size: 14px; font-weight: 800;
  border-radius: 12px; cursor: pointer; letter-spacing: 0.4px;
  box-shadow: 0 4px 16px rgba(149,117,219,0.40);
}
.vq-loading { padding: 30px; text-align: center; color: rgba(255,255,255,0.55); }

/* 결과 phase — 사진 찍히듯 단어+뜻 각인 스냅샷 */
.vq-card.vq-correct-flash {
  background:
    linear-gradient(180deg, rgba(76,175,80,0.32) 0%, rgba(76,175,80,0.14) 100%),
    radial-gradient(ellipse at 50% 30%, rgba(129,199,132,0.30), transparent 70%);
  border-color: rgba(76,175,80,0.75) !important;
  box-shadow:
    0 0 50px rgba(76,175,80,0.42),
    0 0 0 1.5px rgba(76,175,80,0.40),
    inset 0 0 40px rgba(76,175,80,0.18);
}
.vq-card.vq-wrong-reveal,
.vq-card.vq-timeout {
  background:
    linear-gradient(180deg, rgba(233,69,96,0.32) 0%, rgba(233,69,96,0.14) 100%),
    radial-gradient(ellipse at 50% 30%, rgba(255,138,158,0.30), transparent 70%);
  border-color: rgba(233,69,96,0.75) !important;
  box-shadow:
    0 0 50px rgba(233,69,96,0.42),
    0 0 0 1.5px rgba(233,69,96,0.40),
    inset 0 0 40px rgba(233,69,96,0.18);
}
.vq-snapshot {
  position: relative;
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 32px 20px 28px;
  text-align: center;
  animation: vqSnapPop 0.45s cubic-bezier(0.22, 0.95, 0.30, 1.12) backwards;
}
@keyframes vqSnapPop {
  0%   { transform: scale(0.92); opacity: 0; }
  100% { transform: scale(1);    opacity: 1; }
}
/* 사진 플래시 효과 — 처음 0.4초 동안 흰빛이 사라짐 */
.vq-snap-flash {
  position: absolute; inset: 0;
  background: rgba(255,255,255,0.55);
  border-radius: inherit;
  pointer-events: none;
  animation: vqSnapFlash 0.45s ease-out backwards;
}
@keyframes vqSnapFlash {
  0%   { opacity: 1; }
  60%  { opacity: 0.35; }
  100% { opacity: 0; }
}
.vq-snap-word {
  font-size: 40px; font-weight: 900;
  color: #fff;
  letter-spacing: 0.5px;
  line-height: 1.18;
  margin-bottom: 22px;
  word-break: break-word;
  text-shadow: 0 0 28px rgba(255,255,255,0.36), 0 2px 14px rgba(0,0,0,0.40);
  z-index: 1;
}
.vq-snap-divider {
  width: 64px; height: 2px;
  background: rgba(255,255,255,0.55);
  margin-bottom: 22px;
  border-radius: 2px;
  box-shadow: 0 0 12px rgba(255,255,255,0.40);
  z-index: 1;
}
.vq-snap-meaning {
  font-size: 30px; font-weight: 800;
  color: #fff;
  letter-spacing: 0.3px;
  line-height: 1.32;
  word-break: break-word;
  text-shadow: 0 0 22px rgba(255,255,255,0.30), 0 2px 12px rgba(0,0,0,0.40);
  z-index: 1;
}
.vq-snap-next {
  margin-top: 22px;
  background: rgba(255,255,255,0.18);
  color: #fff;
  border: 1.5px solid rgba(255,255,255,0.42);
  box-shadow: 0 4px 14px rgba(0,0,0,0.30);
  z-index: 1;
}
.vq-snap-next:hover {
  background: rgba(255,255,255,0.28);
  border-color: rgba(255,255,255,0.60);
}

/* ── 자정 넘김 안내 오버레이 ───────────────────────────── */
.day-rollover-overlay {
  position: fixed; inset: 0;
  background: rgba(10, 6, 24, 0.75);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  z-index: 9999;
  display: flex; align-items: center; justify-content: center;
  animation: rolloverFadeIn 0.35s ease forwards;
}
.day-rollover-overlay.fade-out { animation: rolloverFadeOut 0.4s ease forwards; }
@keyframes rolloverFadeIn  { from { opacity: 0; } to { opacity: 1; } }
@keyframes rolloverFadeOut { from { opacity: 1; } to { opacity: 0; } }
.day-rollover-card {
  background:
    linear-gradient(180deg, rgba(70,45,120,0.52), rgba(35,20,68,0.72)),
    radial-gradient(ellipse at 30% 0%, rgba(186,156,245,0.30), transparent 65%);
  border: 1.5px solid rgba(186,156,245,0.55);
  border-radius: 22px;
  padding: 32px 30px 26px;
  text-align: center;
  max-width: 320px;
  width: calc(100% - 56px);
  box-shadow:
    0 24px 64px rgba(0,0,0,0.55),
    0 0 0 1px rgba(186,156,245,0.22),
    inset 0 1px 0 rgba(255,255,255,0.14);
  animation: rolloverCardPop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
}
@keyframes rolloverCardPop {
  0%   { transform: scale(0.72) translateY(20px); opacity: 0; }
  100% { transform: scale(1)    translateY(0);    opacity: 1; }
}
.day-rollover-icon {
  font-size: 56px;
  margin-bottom: 14px;
  display: block;
  animation: rolloverIconFloat 2.5s ease-in-out infinite;
}
@keyframes rolloverIconFloat {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-6px); }
}
.day-rollover-title {
  font-size: 17px; font-weight: 800;
  color: #d1b3ff;
  letter-spacing: 0.6px;
  margin-bottom: 12px;
}
.day-rollover-body {
  font-size: 14px;
  color: rgba(255,255,255,0.88);
  line-height: 1.7;
  margin-bottom: 18px;
}
.day-rollover-body strong {
  color: #ffb74d;
  font-size: 18px;
  font-weight: 900;
}
.day-rollover-hint {
  font-size: 11.5px;
  color: rgba(255,255,255,0.45);
  letter-spacing: 1.2px;
  animation: rolloverHintBlink 1.4s ease-in-out infinite;
}
@keyframes rolloverHintBlink {
  0%, 100% { opacity: 0.45; }
  50%      { opacity: 0.85; }
}

/* ── 단일 카드 스테이지 (오늘 학습 박스 대체) ───────────── */
.srs-today-stage {
  margin: 14px 14px 18px;
  background: linear-gradient(180deg, rgba(233,69,96,0.06), rgba(233,69,96,0.02));
  border: 1px solid rgba(233,69,96,0.30);
  border-radius: 16px;
  padding: 18px 16px 16px;
  position: relative;
  display: flex; flex-direction: column;
}
.srs-today-stage.open { min-height: 360px; }
.srs-today-stage.closed { padding-bottom: 14px; }
.srs-today-stage.closed .stage-head { margin-bottom: 0; }
.stage-head {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 12px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.stage-head .srs-box-arrow {
  font-size: 11px; color: rgba(233,69,96,0.70); width: 14px;
}
.stage-name {
  font-size: 13px; font-weight: 800;
  color: #ff8a9e; letter-spacing: 0.5px; flex: 1;
}
/* 우상단 카드 더미 — 다층 그라데이션 + inner highlight로 입체감 */
.srs-deck-stack {
  position: relative;
  width: 54px; height: 74px;
  flex-shrink: 0;
}
.deck-back-card {
  position: absolute;
  inset: 0;
  border-radius: 10px;
  background: linear-gradient(135deg, rgba(233,69,96,0.42), rgba(180,30,60,0.28));
  border: 1.5px solid rgba(233,69,96,0.55);
  box-shadow:
    0 3px 8px rgba(0,0,0,0.32),
    inset 0 1px 0 rgba(255,255,255,0.12);
}
/* 4장까지 stacked. 뒤로 갈수록 살짝 회전 + opacity */
.deck-back-card:nth-child(1) { transform: translate(9px, 9px) rotate(6deg);  opacity: 0.35; z-index: 1; }
.deck-back-card:nth-child(2) { transform: translate(5px, 5px) rotate(3.5deg);opacity: 0.55; z-index: 2; }
.deck-back-card:nth-child(3) { transform: translate(2px, 2px) rotate(1.5deg);opacity: 0.78; z-index: 3; }
/* 맨 위 카드 — 강조 (밝은 그라데이션 + 강한 inner highlight) */
.deck-back-card:nth-child(4) {
  z-index: 4;
  background: linear-gradient(135deg, rgba(255,138,158,0.70), rgba(233,69,96,0.55));
  border-color: rgba(255,138,158,0.85);
  box-shadow:
    0 6px 14px rgba(0,0,0,0.42),
    inset 0 1px 0 rgba(255,255,255,0.25),
    inset 0 -1px 0 rgba(0,0,0,0.15);
}
.deck-count {
  position: absolute;
  inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 900;
  color: #fff;
  text-shadow: 0 2px 6px rgba(0,0,0,0.7);
  z-index: 10;
  letter-spacing: -0.5px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

/* 중앙 포커스 카드 — 글래스 모피즘 + 다층 그림자 */
.focus-card {
  background:
    linear-gradient(180deg, rgba(110,80,170,0.28) 0%, rgba(70,45,120,0.18) 100%),
    radial-gradient(ellipse at 30% 20%, rgba(186,156,245,0.18), transparent 60%);
  border: 1.5px solid rgba(186,156,245,0.42);
  border-radius: 18px;
  padding: 28px 22px 78px; /* 하단 평가 바 공간 (있을 때) */
  position: relative;
  min-height: 290px;
  display: flex; flex-direction: column;
  box-shadow:
    0 14px 36px rgba(0,0,0,0.45),
    0 0 0 1px rgba(186,156,245,0.18),
    inset 0 1px 0 rgba(255,255,255,0.10);
  animation: focusCardEnter 0.45s cubic-bezier(0.22, 0.95, 0.30, 1.12) backwards;
  overflow: hidden;
}
.focus-card.clickable {
  cursor: pointer;
  transition: box-shadow 0.25s ease, transform 0.12s ease, border-color 0.25s ease;
}
.focus-card.clickable:hover {
  border-color: rgba(186,156,245,0.62);
  box-shadow:
    0 18px 44px rgba(0,0,0,0.52),
    0 0 0 1px rgba(186,156,245,0.32),
    0 0 32px rgba(186,156,245,0.18),
    inset 0 1px 0 rgba(255,255,255,0.14);
}
.focus-card.clickable:active { transform: scale(0.992); }
@keyframes focusCardEnter {
  0% { transform: translateY(-26px) scale(0.92) rotate(-2deg); opacity: 0; }
  100% { transform: translateY(0) scale(1) rotate(0); opacity: 1; }
}
.focus-card.flying-correct {
  animation: focusCardFlyRight 0.55s cubic-bezier(0.55, 0, 0.55, 1) forwards;
  pointer-events: none;
}
.focus-card.flying-wrong {
  animation: focusCardFlyLeft 0.55s cubic-bezier(0.55, 0, 0.55, 1) forwards;
  pointer-events: none;
}
@keyframes focusCardFlyRight {
  0%   { transform: translateX(0) rotate(0); opacity: 1; }
  100% { transform: translateX(140vw) rotate(32deg); opacity: 0; }
}
@keyframes focusCardFlyLeft {
  0%   { transform: translateX(0) rotate(0); opacity: 1; }
  100% { transform: translateX(-140vw) rotate(-32deg); opacity: 0; }
}
.focus-title {
  font-size: 30px; font-weight: 900;
  color: #fff;
  text-align: center;
  margin-bottom: 18px;
  letter-spacing: 0.6px;
  line-height: 1.25;
  word-break: break-word;
  text-shadow: 0 2px 12px rgba(0,0,0,0.45);
}
.focus-title .speak-btn {
  margin-left: 8px; vertical-align: middle;
}
.focus-body-wrap {
  flex: 1;
  position: relative;
  display: flex;
  align-items: center;       /* 본문 세로 중앙 정렬 */
  justify-content: center;
  min-height: 150px;
}
.focus-body {
  width: 100%;
  font-size: 13.5px;
  color: rgba(255,255,255,0.88);
  line-height: 1.7;
  text-align: center;        /* 본문 가로 중앙 정렬 */
}
/* 포커스 카드 대표 이미지 (subtopic.image_b64) — 본문 위에 노출 */
.focus-preview {
  margin: 0 0 14px 0;
  text-align: center;
}
.focus-preview img {
  max-width: 100%;
  max-height: 260px;
  border-radius: 10px;
  display: inline-block;
  box-shadow: 0 6px 18px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.06);
}
.focus-preview-cap {
  font-size: 12px;
  color: rgba(255,255,255,0.65);
  margin-top: 8px;
  font-style: italic;
}
.focus-body.blurred {
  filter: blur(13px);
  opacity: 0.40;
  user-select: none;
  pointer-events: none;
}
/* 본문 reveal 애니메이션 — 블러 해제 시 부드럽게 등장 */
.focus-body:not(.blurred) {
  animation: focusBodyReveal 0.55s cubic-bezier(0.25, 0.46, 0.45, 0.94) backwards;
}
@keyframes focusBodyReveal {
  0%   { filter: blur(13px); opacity: 0.40; transform: scale(0.985); }
  100% { filter: blur(0);    opacity: 1;    transform: scale(1); }
}
/* "카드터치" 옅은 힌트 — 블러 본문 위에 부드럽게 펄스 */
.focus-tap-hint {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-size: 13px;
  font-weight: 600;
  color: rgba(255,255,255,0.32);
  letter-spacing: 5px;
  pointer-events: none;
  user-select: none;
  text-transform: none;
  animation: tapHintPulse 2.2s ease-in-out infinite;
  text-shadow: 0 1px 3px rgba(0,0,0,0.5);
}
@keyframes tapHintPulse {
  0%, 100% { opacity: 0.40; transform: translate(-50%, -50%) scale(1); }
  50%      { opacity: 0.85; transform: translate(-50%, -50%) scale(1.06); }
}
/* 하단 평가 바 — 두 버튼 (정답 보기 버튼 제거됨, 카드 터치로 통합) */
.focus-bottom-bar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0.18), rgba(0,0,0,0.38));
  border-top: 1px solid rgba(255,255,255,0.08);
  border-radius: 0 0 16px 16px;
  padding: 11px 12px;
  display: flex; gap: 10px;
}
.focus-bottom-bar .recall-btn {
  flex: 1; padding: 12px 8px;
  font-size: 14px;
}
/* 스테이지 빈 상태 (오늘 분량 끝) */
.stage-empty {
  text-align: center;
  padding: 50px 18px 30px;
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}
.stage-empty-icon { font-size: 56px; margin-bottom: 14px; animation: stageEmptyPulse 2.5s ease-in-out infinite; }
@keyframes stageEmptyPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.10); }
}
.stage-empty-text {
  font-size: 18px; font-weight: 800; color: #ff8a9e;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}
.stage-empty-hint {
  font-size: 12.5px; color: rgba(255,255,255,0.55);
  line-height: 1.6;
}

/* ── 다지기 v2 — 6 박스 ────────────────────────────────── */
.srs-box {
  margin: 8px 14px;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  background: rgba(255,255,255,0.03);
  overflow: hidden;
}
.srs-box-head {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 14px;
  cursor: pointer; user-select: none;
  font-size: 14px; font-weight: 700;
  color: #fff;
}
.srs-box-head:hover { background: rgba(255,255,255,0.04); }
.srs-box-arrow { font-size: 11px; color: rgba(255,255,255,0.45); width: 14px; }
.srs-box-name { flex: 1; }
.srs-box-count {
  background: rgba(255,255,255,0.08);
  color: #e5e7eb;
  font-size: 12px; font-weight: 700;
  padding: 3px 10px; border-radius: 50px;
  font-variant-numeric: tabular-nums;
}
.srs-box-pass {
  background: rgba(233,69,96,0.18);
  color: #ff8a9e;
  border: 1px solid rgba(233,69,96,0.4);
  padding: 6px 12px; border-radius: 8px;
  font-size: 12px; font-weight: 700; cursor: pointer;
  transition: all 0.18s ease;
}
.srs-box-pass:hover { background: rgba(233,69,96,0.28); }
.srs-box-body { display: none; padding: 0 8px 8px; }
.srs-box.opened .srs-box-body { display: block; }
/* 박스별 색조 — 오늘 빨강, 내일 주황, 4~32 점점 멀어짐 */
.srs-box.srs-box-today  { border-color: rgba(233,69,96,0.40); background: rgba(233,69,96,0.06); }
.srs-box.srs-box-today .srs-box-name { color: #ff8a9e; }
.srs-box.srs-box-tomo   { border-color: rgba(255,152,0,0.32); background: rgba(255,152,0,0.04); }
.srs-box.srs-box-tomo .srs-box-name { color: #ffb74d; }
.srs-box.srs-box-d4     { border-color: rgba(255,213,79,0.28); }
.srs-box.srs-box-d4 .srs-box-name { color: #ffe082; }
.srs-box.srs-box-d8     { border-color: rgba(129,199,132,0.25); }
.srs-box.srs-box-d8 .srs-box-name { color: #a5d6a7; }
.srs-box.srs-box-d16    { border-color: rgba(79,195,247,0.25); }
.srs-box.srs-box-d16 .srs-box-name { color: #81d4fa; }
.srs-box.srs-box-d32    { border-color: rgba(176,190,197,0.25); }
.srs-box.srs-box-d32 .srs-box-name { color: #cfd8dc; }

/* ── 암기 모음 — due 그룹 (간격 반복) ─────────────────────── */
.memo-group { margin-bottom: 18px; }
.memo-group-head {
  font-size: 13px; font-weight: 700;
  padding: 10px 14px;
  margin: 14px 14px 8px;
  border-radius: 8px;
  display: flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,0.03);
  border-left: 4px solid rgba(255,255,255,0.2);
}
.memo-group-head .memo-group-count {
  margin-left: auto;
  font-size: 11px; font-weight: 700;
  background: rgba(255,255,255,0.08); color: #e5e7eb;
  padding: 2px 8px; border-radius: 50px;
}
/* 오늘 = 강조 빨강 */
.memo-grp-today .memo-group-head {
  background: rgba(233,69,96,0.10);
  border-left-color: #e94560;
  color: #ff8a9e;
}
/* 가까운 미래 (1~2일 후) = 주황 */
.memo-grp-soon .memo-group-head {
  background: rgba(255,152,0,0.07);
  border-left-color: #ff9800;
  color: #ffb74d;
}
.memo-grp-soon .subtopic { opacity: 0.82; }
/* 이번 주 = 노랑 */
.memo-grp-week .memo-group-head {
  background: rgba(255,213,79,0.06);
  border-left-color: #ffd54f;
  color: #ffe082;
}
.memo-grp-week .subtopic { opacity: 0.65; }
/* 이후 = 회색 */
.memo-grp-future .memo-group-head {
  background: rgba(176,190,197,0.05);
  border-left-color: #90a4ae;
  color: #b0bec5;
}
.memo-grp-future .subtopic { opacity: 0.5; }

/* ─────────────────────────────────────────────
   로그인/회원가입
   ───────────────────────────────────────────── */
#authScreen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
.auth-card {
  width: 100%; max-width: 380px;
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  border: 1px solid #2a2a4e; border-radius: 18px;
  padding: 26px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}
.auth-card h1 {
  text-align: center; font-size: 1.5em; font-weight: 800;
  color: #fff; margin-bottom: 4px;
}
.auth-card .sub {
  text-align: center; font-size: 13px;
  color: rgba(255,255,255,0.55); margin-bottom: 18px;
}
.auth-tabs {
  display: flex; gap: 4px; background: rgba(0,0,0,0.3);
  border-radius: 8px; padding: 4px; margin-bottom: 16px;
}
.auth-tabs button {
  flex: 1; padding: 8px; background: transparent;
  color: rgba(255,255,255,0.5); border-radius: 6px;
  font-size: 13px; font-weight: 600; transition: all 0.15s;
}
.auth-tabs button.active {
  background: rgba(233,69,96,0.2); color: #fff;
}
.auth-card label {
  display: block; font-size: 12px; color: rgba(255,255,255,0.6);
  margin-bottom: 4px; margin-top: 10px; font-weight: 600;
}
.auth-card input {
  width: 100%; padding: 10px 12px;
  background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px; color: #fff; font-size: 14px;
  -webkit-user-select: text; user-select: text;
}
.auth-card input:focus { border-color: #e94560; }
.auth-card .err {
  background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.4);
  color: #fca5a5; padding: 9px 12px; border-radius: 8px;
  font-size: 13px; margin-top: 12px; display: none;
}
.auth-card .err.show { display: block; }
.auth-card .ref-info {
  background: rgba(255,193,7,0.1); border: 1px solid rgba(255,193,7,0.3);
  color: #ffd54f; padding: 8px 12px; border-radius: 6px;
  font-size: 12px; margin-top: 8px; display: none;
}
.auth-card .ref-info.show { display: block; }
.auth-card button.primary {
  width: 100%; margin-top: 18px; padding: 12px;
  background: linear-gradient(135deg, #e94560, #ff6b6b);
  color: #fff; font-weight: 700; border-radius: 8px;
  font-size: 14px;
}
.auth-card button.primary:disabled { opacity: 0.5; cursor: wait; }

/* ─────────────────────────────────────────────
   홈 — 챕터 카드 목록
   ───────────────────────────────────────────── */
#homeScreen { display: none; }
.home-top {
  background: linear-gradient(180deg, #16213e 0%, #0a0a1a 100%);
  padding: 20px 18px 26px;
}
.home-greeting {
  font-size: 18px; font-weight: 700; color: #fff;
  margin-bottom: 6px;
}
.home-meta {
  font-size: 13px; color: rgba(255,255,255,0.55);
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
}
.home-meta .point-chip {
  display: inline-flex; align-items: center; gap: 4px;
  background: rgba(255,193,7,0.15); border: 1px solid rgba(255,193,7,0.3);
  padding: 5px 14px; border-radius: 50px; color: #ffd54f; font-weight: 700;
  cursor: pointer; font-size: 13px; transition: background 0.15s;
  -webkit-tap-highlight-color: rgba(255,193,7,0.3);
}
.home-meta .point-chip:hover { background: rgba(255,193,7,0.25); }
.home-meta .point-chip:active { transform: scale(0.97); }
.home-meta .refer-chip {
  background: rgba(79,195,247,0.15); border-color: rgba(79,195,247,0.35);
  color: #4fc3f7;
}
.home-meta .refer-chip:hover { background: rgba(79,195,247,0.25); }
.home-actions {
  display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap;
}
.home-actions button {
  background: rgba(255,255,255,0.08); color: #fff;
  padding: 8px 14px; border-radius: 50px; font-size: 13px;
  display: inline-flex; align-items: center; gap: 5px;
}
.home-actions button.featured {
  background: linear-gradient(135deg, #e94560, #ff6b6b); color: #fff;
}
.home-actions button:hover { background: rgba(255,255,255,0.15); }
.home-actions button.featured:hover { filter: brightness(1.1); }

.home-content {
  max-width: 760px; margin: 0 auto; padding: 22px 16px 60px;
}
.subject-section {
  margin-bottom: 26px;
}
.subject-title {
  font-size: 12px; color: rgba(255,255,255,0.5);
  margin-bottom: 10px; padding-left: 4px; letter-spacing: 0.08em;
  font-weight: 700;
}
.chapter-cards {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
}
.chapter-card {
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  border: 1px solid #2a2a4e; border-radius: 14px;
  padding: 16px; cursor: pointer; transition: all 0.2s;
  position: relative; overflow: hidden;
  -webkit-tap-highlight-color: rgba(233,69,96,0.15);
  touch-action: manipulation;
  /* 박스 크기 고정 — 2줄 제목 카드도 안에 다 들어가는 높이.
     내용은 자연스럽게 위에서부터 흐름 → 1줄 제목 카드는 아래쪽 여백이 생기지만 박스 크기는 동일 */
  min-height: 184px;
}
.chapter-card .ch-corner-badge {
  position: absolute; top: 8px; right: 10px;
  background: rgba(76,175,80,0.25); color: #81c784;
  padding: 3px 9px; border-radius: 50px;
  font-size: 10px; font-weight: 800; letter-spacing: 0.02em;
  border: 1px solid rgba(76,175,80,0.3);
}
.chapter-card:hover { transform: translateY(-3px); border-color: rgba(233,69,96,0.4); }
.chapter-card.expired { opacity: 0.7; }
.chapter-card .ch-icon { font-size: 32px; margin-bottom: 8px; }
.chapter-card .ch-title {
  font-size: 16px; font-weight: 700; color: #fff;
  margin-bottom: 8px; word-break: keep-all;
  /* 2줄 분량 공간 예약 → 1줄/2줄 제목 모두 다음 요소(무료 배지·열기 버튼) 위치 동일.
     line-height 1.55 기준 2줄 = 3.1em, 약간의 여유 포함해서 3.2em */
  min-height: 3.2em;
}
.chapter-card .ch-desc { font-size: 11px; color: rgba(255,255,255,0.5); margin-bottom: 12px; min-height: 16px; }
.chapter-card .ch-status {
  display: inline-block; padding: 3px 10px; border-radius: 50px;
  font-size: 10px; font-weight: 700;
}
.chapter-card .ch-status.active { background: rgba(76,175,80,0.2); color: #81c784; }
.chapter-card .ch-status.expired { background: rgba(255,152,0,0.2); color: #ffb74d; }
.chapter-card .ch-status.never { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); }
.chapter-card .ch-status.free { background: rgba(76,175,80,0.25); color: #81c784; }
.chapter-card .ch-actions {
  display: flex; gap: 5px; margin-top: 10px;
}
.chapter-card .ch-actions button {
  flex: 1; padding: 7px; font-size: 11px; font-weight: 600;
  background: rgba(255,255,255,0.08); color: #fff; border-radius: 6px;
}
.chapter-card .ch-actions button.primary {
  background: linear-gradient(135deg, #e94560, #ff6b6b);
}
.chapter-card .ch-actions button:disabled { opacity: 0.4; cursor: not-allowed; }
.chapter-card .ch-progress {
  margin-top: 8px; font-size: 10px; color: rgba(255,255,255,0.4);
}

/* ─────────────────────────────────────────────
   챕터 상세 — 트리
   ───────────────────────────────────────────── */
#chapterScreen { display: none; }
.chapter-header {
  background: linear-gradient(180deg, #16213e 0%, #0a0a1a 100%);
  padding: 14px 18px 16px;
  text-align: center;
}
/* 일반 모드 3탭 — new / 별표 / all (각 목차 안 학습 카드 위) */
.mode-tabs {
  display: flex; gap: 5px;
  padding: 8px 10px 4px;
  margin: 2px 4px 4px;
}
.mode-tabs.hide { display: none; }
.mode-tab {
  flex: 1; padding: 7px 6px;
  background: rgba(255,255,255,0.04);
  color: rgba(255,255,255,0.55);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px;
  font-size: 12px; font-weight: 700;
  cursor: pointer; transition: all 0.18s ease;
}
.mode-tab:hover { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.8); }
.mode-tab.active {
  background: linear-gradient(135deg, rgba(233,69,96,0.18), rgba(83,52,131,0.12));
  border-color: rgba(233,69,96,0.5);
  color: #ff8a9e;
  box-shadow: 0 2px 6px rgba(233,69,96,0.15);
}
.chapter-header .ch-subj {
  display: none; /* 과목 태그 숨김 — 제목만 노출 */
}
.chapter-header .ch-name {
  font-size: 20px; font-weight: 800; color: #fff;
  word-break: keep-all; line-height: 1.3;
}
.chapter-header .ch-meta {
  display: none; /* 상태 배지(전체 무료 공개 등) 숨김 — 제목만 노출 */
}
.chapter-tree {
  max-width: 760px; margin: 0 auto;
  /* padding-bottom: 100vh — 콘텐츠가 줄어도 페이지 최대 스크롤이 변하지 않도록
     마지막 목차 아래에 항상 화면 1개 분의 여유 공간 (브라우저 자동 위로 스크롤 방지) */
  padding: 16px 14px 100vh;
  overflow-anchor: none;
}

.topic-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px; margin-bottom: 10px; overflow: hidden;
  transition: border-color 0.2s;
}
.topic-card.opened { border-color: rgba(233,69,96,0.4); }
.topic-card.locked { background: rgba(255,255,255,0.02); }

/* 학습 컨트롤 — 목차 헤더 안에 표시 (펼친 상태일 때) */
.study-controls {
  display: flex; gap: 4px; flex-shrink: 0;
  margin-left: auto;
  pointer-events: auto;
}
.study-controls * { pointer-events: auto; }
.study-btn {
  height: 28px; padding: 0 9px;
  border-radius: 14px;
  font-size: 11px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid transparent;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.1s, background 0.15s;
  white-space: nowrap;
}
.study-btn.skip   { background: rgba(79,195,247,0.18); color: #4fc3f7; border-color: rgba(79,195,247,0.3); }
.study-btn.expand { background: rgba(255,193,7,0.18); color: #ffd54f; border-color: rgba(255,193,7,0.3); }
.study-btn.done   { background: rgba(76,175,80,0.2); color: #81c784; border-color: rgba(76,175,80,0.35); }
.study-btn.reset  { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.7); border-color: rgba(255,255,255,0.15); }
.study-btn:active { transform: scale(0.92); }

/* 현재 학습 대상 (맨 위 미학습 학습 카드) — 주황 강조 */
.subtopic.current {
  background: linear-gradient(180deg, rgba(255,138,0,0.22) 0%, rgba(255,138,0,0.10) 100%) !important;
  border-color: rgba(255,138,0,0.55) !important;
  box-shadow: 0 0 0 1px rgba(255,138,0,0.25);
}
.subtopic.current .subtopic-title { color: #ffb74d; }

/* 학습 카드마다 액션 버튼 — head 안 우측에 표시 */
.subtopic-actions {
  display: flex; gap: 4px; flex-shrink: 0;
  pointer-events: auto;
}
.subtopic-head > .subtopic-actions,
.subtopic-head > .subtopic-actions * { pointer-events: auto; }
.sa-btn {
  height: 26px; padding: 0 8px;
  border-radius: 13px;
  border: 1px solid transparent;
  font-size: 11px; font-weight: 700;
  cursor: pointer; white-space: nowrap;
  display: inline-flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.1s, background 0.15s;
}
.sa-btn:active { transform: scale(0.92); }
.sa-btn.skip   { background: rgba(79,195,247,0.16); color: #4fc3f7;  border-color: rgba(79,195,247,0.3); }
.sa-btn.expand { background: rgba(255,193,7,0.16);  color: #ffd54f;  border-color: rgba(255,193,7,0.3); }
.sa-btn.done   { background: rgba(76,175,80,0.2);   color: #81c784;  border-color: rgba(76,175,80,0.35); }
.sa-btn.redo   { background: rgba(255,138,0,0.18);  color: #ffb74d;  border-color: rgba(255,138,0,0.3); }

/* 큰 패스 버튼 — 목차 헤더 오른쪽, 항상 같은 크기로 고정 */
.study-btn.skip-big {
  padding: 0 22px; width: 110px; height: 30px;
  border-radius: 50px;
  background: rgba(79,195,247,0.22);
  color: #81d4fa;
  border: 1px solid rgba(79,195,247,0.45);
  font-size: 13px; font-weight: 800;
  letter-spacing: 0.02em;
  box-shadow: 0 2px 12px rgba(79,195,247,0.15);
  flex-shrink: 0;
}
.study-btn.skip-big:active {
  background: rgba(79,195,247,0.4);
  transform: scale(0.94);
}

/* ───── 축하 폭죽 오버레이 ───── */
.celebration {
  position: fixed; inset: 0;
  background: rgba(10,10,26,0.88);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999; overflow: hidden;
  animation: celFadeIn 0.3s ease-out;
}
@keyframes celFadeIn { from { opacity: 0; } to { opacity: 1; } }
.cel-content {
  text-align: center; position: relative; z-index: 2;
  animation: celPop 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes celPop {
  0%   { transform: scale(0.3); opacity: 0; }
  100% { transform: scale(1);   opacity: 1; }
}
.cel-icon {
  font-size: 88px;
  animation: celBounce 0.9s ease-in-out infinite alternate;
}
@keyframes celBounce {
  0%   { transform: scale(1)    rotate(-10deg); }
  100% { transform: scale(1.15) rotate(10deg);  }
}
.cel-text {
  font-size: 30px; font-weight: 900;
  color: #ffd54f; margin-top: 14px;
  text-shadow: 0 4px 24px rgba(0,0,0,0.6);
  word-break: keep-all;
}
.cel-sub {
  font-size: 14px; color: rgba(255,255,255,0.75);
  margin-top: 8px; word-break: keep-all;
}
.confetti-piece {
  position: absolute; top: -50px;
  animation: confettiFall linear forwards;
  pointer-events: none; z-index: 1;
}
@keyframes confettiFall {
  to { transform: translateY(120vh) rotate(720deg); opacity: 0; }
}
.topic-head {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px; cursor: pointer;
  /* 패스 버튼 누를 때 헤더 전체가 핑크색으로 깜빡이는 것 방지 */
  -webkit-tap-highlight-color: transparent;
}
.topic-head > * { pointer-events: none; }
.topic-head > .study-controls,
.topic-head > .study-controls * { pointer-events: auto; }
.topic-head:hover { background: rgba(255,255,255,0.02); }
.topic-arrow {
  color: #e94560; font-size: 12px; width: 12px; text-align: center;
  transition: transform 0.2s; flex-shrink: 0;
}
.topic-card.opened .topic-arrow { transform: rotate(90deg); }
.topic-card.locked .topic-arrow { color: rgba(255,255,255,0.3); }
.topic-title {
  font-size: 15px; font-weight: 700; color: #fff;
  min-width: 0; flex-shrink: 1;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.topic-title .free-tag {
  display: inline-block; background: rgba(76,175,80,0.25); color: #81c784;
  font-size: 10px; padding: 2px 8px; border-radius: 50px;
  margin-left: 8px; font-weight: 700; vertical-align: middle;
}
.topic-title .lock-icon { color: rgba(255,255,255,0.4); font-size: 14px; margin-left: 6px; }
.topic-count {
  background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.7);
  font-size: 10px; padding: 3px 9px; border-radius: 50px; font-weight: 600;
  flex-shrink: 0;
}
/* 진도 바 — 목차 옆에 암기/전체 비율 시각화 */
.topic-progress {
  position: relative; flex-shrink: 0;
  width: 88px; height: 18px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 50px; overflow: hidden;
}
.topic-progress-fill {
  position: absolute; left: 0; top: 0; bottom: 0;
  background: linear-gradient(90deg, rgba(76,175,80,0.55) 0%, rgba(129,199,132,0.7) 100%);
  border-radius: 50px;
  transition: width 0.3s ease;
}
.topic-progress-fill.done {
  background: linear-gradient(90deg, rgba(76,175,80,0.85) 0%, rgba(165,214,167,0.95) 100%);
}
.topic-progress-text {
  position: relative; z-index: 1;
  display: flex; align-items: center; justify-content: center;
  height: 100%; font-size: 10px; font-weight: 700;
  color: rgba(255,255,255,0.85); letter-spacing: 0.02em;
  text-shadow: 0 1px 2px rgba(0,0,0,0.4);
}
@media (max-width: 480px) {
  .topic-progress { width: 72px; height: 16px; }
  .topic-progress-text { font-size: 9px; }
}
.topic-body { display: none; padding: 0 14px 14px; }
.topic-card.opened > .topic-body { display: block; }

.locked-banner {
  background: linear-gradient(135deg, rgba(233,69,96,0.1), rgba(83,52,131,0.1));
  border: 1px solid rgba(233,69,96,0.3); border-radius: 10px;
  padding: 16px; text-align: center; margin: 8px 0;
}
.locked-banner h4 {
  font-size: 14px; color: #fff; font-weight: 700; margin-bottom: 6px;
}
.locked-banner p {
  font-size: 12px; color: rgba(255,255,255,0.6); margin-bottom: 12px;
}
.locked-banner button {
  background: linear-gradient(135deg, #e94560, #ff6b6b); color: #fff;
  padding: 9px 22px; font-size: 13px; font-weight: 700; border-radius: 50px;
}

/* 학습 카드 = 보라 톤 (제목·미리보기 영역) */
.subtopic {
  background: linear-gradient(180deg, rgba(83,52,131,0.18) 0%, rgba(83,52,131,0.10) 100%);
  border: 1px solid rgba(179,157,219,0.25);
  border-radius: 10px;
  margin-top: 10px; overflow: hidden;
  /* transition 제거 — 패스 시 다음 단어 등장할 때 번쩍임 방지 */
}
.subtopic.understood {
  border-color: rgba(76,175,80,0.45);
  background: linear-gradient(180deg, rgba(76,175,80,0.14) 0%, rgba(76,175,80,0.06) 100%);
}
/* 다지기에서 실패해 챕터 뷰로 돌아온 카드 — 청색 강조 + ↺ 배지 */
.subtopic.failed-from-memo {
  border-color: rgba(79,195,247,0.45);
  background: linear-gradient(180deg, rgba(79,195,247,0.10) 0%, rgba(79,195,247,0.03) 100%);
}
.failed-memo-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 18px; height: 18px; min-width: 18px;
  background: rgba(79,195,247,0.85); color: #fff;
  border-radius: 50%; font-size: 11px; font-weight: 700;
  margin-right: 4px;
}
/* 다지기 모드 미래 박스 → 오늘 학습 강등 시 신비로운 dissolve */
/*  카드가 살짝 떠오르며 보랏빛 글로우가 차오르고, blur로 흩어지며 사라짐 */
.subtopic.srs-demoting {
  animation: srsDemoteAnim 1.4s cubic-bezier(0.45, 0.05, 0.55, 0.95) forwards;
  pointer-events: none;
  position: relative;
  z-index: 1;
}
.subtopic.srs-demoting::before {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 14px;
  background: radial-gradient(ellipse at center,
    rgba(186, 156, 245, 0.55) 0%,
    rgba(149, 117, 219, 0.25) 40%,
    transparent 70%);
  opacity: 0;
  animation: srsDemoteHalo 1.4s ease-out forwards;
  pointer-events: none;
  z-index: -1;
  filter: blur(8px);
}
@keyframes srsDemoteAnim {
  0% {
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: blur(0) brightness(1) saturate(1);
    box-shadow: 0 0 0 rgba(186, 156, 245, 0);
    max-height: 240px;
  }
  18% {
    opacity: 1;
    transform: translateY(-2px) scale(1.015);
    filter: blur(0) brightness(1.18) saturate(1.2);
    box-shadow:
      0 0 18px 2px rgba(186, 156, 245, 0.55),
      0 0 48px 8px rgba(149, 117, 219, 0.32);
  }
  45% {
    opacity: 0.85;
    transform: translateY(-6px) scale(1.0);
    filter: blur(1.5px) brightness(1.22) saturate(1.25);
    box-shadow:
      0 0 32px 6px rgba(186, 156, 245, 0.6),
      0 0 80px 16px rgba(149, 117, 219, 0.4);
  }
  70% {
    opacity: 0.45;
    transform: translateY(-12px) scale(0.96);
    filter: blur(5px) brightness(1.15) saturate(1.15);
    box-shadow:
      0 0 40px 8px rgba(186, 156, 245, 0.42),
      0 0 90px 24px rgba(149, 117, 219, 0.28);
  }
  100% {
    opacity: 0;
    transform: translateY(-20px) scale(0.88);
    filter: blur(14px) brightness(1) saturate(1);
    box-shadow: 0 0 0 rgba(186, 156, 245, 0);
    max-height: 0;
    margin-top: 0;
    margin-bottom: 0;
    padding-top: 0;
    padding-bottom: 0;
    border-width: 0;
  }
}
@keyframes srsDemoteHalo {
  0%   { opacity: 0; transform: scale(0.9); }
  30%  { opacity: 0.9; transform: scale(1.05); }
  60%  { opacity: 0.7; transform: scale(1.15); }
  100% { opacity: 0; transform: scale(1.35); }
}
/* 챕터에서 펼친 미암기 카드 ("틀린 단어") — 앰버 톤 */
.subtopic.peeked {
  border-color: rgba(255,193,7,0.45);

}
/* 펼친 학습 카드 — 테두리·그림자 강조로 다른 항목과 시각적 분리 (집중 학습) */
.subtopic.opened {

/* 암기 모음 모드: current면 주황색이 암기 초록을 이김 */

  memorizedClearedToday: false, // 이번 라운드에서 오늘 학습 카드를 한 번이라도 클리어(effPrev=1 → effNxt≠1)했는가

  activeRecallMode: false, // 능동 회상 모드 — 본문 블러 + "정답 보기" 강제 + 자기평가 (localStorage 영속화)
  activeRecallRevealed: new Set(), // 능동 회상에서 "정답 보기" 누른 카드 (블러 해제 + 평가 버튼 노출). 다지기 진입 시 리셋
  lastStudyDate: (() => { try { return localStorage.getItem('op_last_study_date') || ''; } catch { return ''; } })(), // 마지막 다지기 학습 KST 날짜 — 자정 넘김 안내용

// ============================================================
// API
// ============================================================
async function api(method, path, body) {
  const token = localStorage.getItem(TOKEN_KEY);
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API + path, {
    method, headers,
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch (_) {}
  if (!res.ok) {
    const err = new Error((data && data.error) || `HTTP ${res.status}`);
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

// ============================================================
// 유틸
// ============================================================
function $(id) { return document.getElementById(id); }
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}
function toast(msg, isError) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'show' + (isError ? ' error' : '');
  setTimeout(() => t.className = '', 2400);
}
function showLoading(on) { $('loading').classList.toggle('show', !!on); }
function formatPhone(p) {
  p = String(p || '').replace(/\D/g, '');
  if (p.length === 11) return `${p.slice(0,3)}-${p.slice(3,7)}-${p.slice(7)}`;
  if (p.length === 10) return `${p.slice(0,3)}-${p.slice(3,6)}-${p.slice(6)}`;
  return p;
}
function daysLeft(iso) {
  if (!iso) return null;
  // 서버의 expires_at은 KST wall-clock을 UTC 표기로 저장한 값.
  // 클라이언트의 '지금'도 같은 KST 프레임으로 옮겨 비교해야 D-N이 정확함.
  const nowKstMs = Date.now() + KST_OFFSET_MS;
  const expMs = new Date(iso).getTime();
  const diff = Math.ceil((expMs - nowKstMs) / (1000 * 60 * 60 * 24));
  return diff;
}

// 서버가 보낸 KST-as-UTC ISO 문자열을 사람이 읽는 한국 시간 표기로 변환
function fmtKst(iso, opts) {
  if (!iso) return '';
  // KST-as-UTC: 문자열 그대로 Date로 파싱하면 9시간 뒤 UTC로 해석되므로
  // 9시간 빼서 실제 의도된 시점(KST wall-clock)으로 되돌린 뒤 Asia/Seoul로 포맷.
  const realUtcMs = new Date(iso).getTime() - KST_OFFSET_MS;
  const d = new Date(realUtcMs);
  return d.toLocaleString('ko-KR', Object.assign({
    timeZone: KST_TZ,
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit',
  }, opts || {}));
}
function fmtKstDate(iso) {
  return fmtKst(iso, { hour: undefined, minute: undefined });
}
// JSON 컬럼에서 base64가 문자열 따옴표로 한번 더 감싸여 올 수 있는 경우 처리
function unwrapImage(b) {
  if (!b) return '';
  if (typeof b === 'string' && b.startsWith('"') && b.endsWith('"')) {
    try { return JSON.parse(b); } catch {}
  }
  return b;
}

// ============================================================
// 워터마크 — 전화번호 SVG 패턴
// ============================================================
function renderWatermark() {
  const wm = $('watermark');
  if (!state.user || !state.user.phone) {
    wm.classList.remove('show');
    wm.innerHTML = '';
    return;
  }
  // 전화번호 뒤 5자리만 표시 — 식별 가능하면서 노출 최소화
  const digits = String(state.user.phone || '').replace(/\D/g, '');
  const text = digits.slice(-5);
  // SVG 패턴: 대각선 반복, 알파 더 옅게
  wm.innerHTML = `
    <svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
      <defs>
        <pattern id="wmPat" x="0" y="0" width="320" height="180" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
          <text x="0" y="80" fill="rgba(255,255,255,0.03)" font-size="22" font-weight="600" font-family="monospace">${escapeHtml(text)}</text>
          <text x="160" y="160" fill="rgba(255,255,255,0.03)" font-size="22" font-weight="600" font-family="monospace">${escapeHtml(text)}</text>
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#wmPat)"/>
    </svg>
  `;
  wm.classList.add('show');
}

// ============================================================
// 복사·우클릭 차단
// ============================================================
document.addEventListener('contextmenu', e => { if (state.user) e.preventDefault(); });
document.addEventListener('keydown', e => {
  if (!state.user) return;
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && ['c','a','s','p','u'].includes(k)) {
    // 입력 필드에서는 허용
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    e.preventDefault();
    if (k === 'p' || k === 's') toast('인쇄·저장은 차단됩니다', true);
  }
});

// ============================================================
// 인증 — 탭 전환 / 로그인 / 회원가입
// ============================================================
function switchTab(tab) {
  const isLogin = tab === 'login';
  $('tabLogin').classList.toggle('active', isLogin);
  $('tabSignup').classList.toggle('active', !isLogin);
  $('loginForm').style.display = isLogin ? 'block' : 'none';
  $('signupForm').style.display = isLogin ? 'none' : 'block';
}

async function doLogin() {
  const email = $('li_email').value.trim();
  const password = $('li_password').value;
  if (!email || !password) return showAuthErr('login', '이메일/비밀번호 입력');
  $('loginBtn').disabled = true;
  hideAuthErr();
  try {
    const r = await api('POST', '/auth/login', { email, password });
    localStorage.setItem(TOKEN_KEY, r.token);
    state.user = r.user;
    state.point = Number(r.user.point) || 0;
    await loadMeAndEnter();
  } catch (e) {
    showAuthErr('login', e.message);
  } finally {
    $('loginBtn').disabled = false;
  }
}

async function doSignup() {
  const name = $('su_name').value.trim();
  const phone = $('su_phone').value.trim();
  const email = $('su_email').value.trim();
  const password = $('su_password').value;
  const ref = $('su_ref').value.trim().toUpperCase();
  if (!name || !phone || !email || !password) return showAuthErr('signup', '모든 필수 항목을 입력하세요');
  if (password.length < 6) return showAuthErr('signup', '비밀번호는 6자 이상');
  $('signupBtn').disabled = true;
  hideAuthErr();
  try {
    const body = { name, phone, email, password };
    if (ref) body.referral_code = ref;
    const utm = loadUtm();
    if (utm) body.utm = utm;
    const pendingInterests = loadPendingInterests();
    if (pendingInterests.length) body.interests = pendingInterests;
    const r = await api('POST', '/auth/signup', body);
    localStorage.setItem(TOKEN_KEY, r.token);
    localStorage.removeItem(REF_KEY);
    localStorage.removeItem(UTM_KEY);
    localStorage.removeItem(INTERESTS_KEY);
    state.user = r.user;
    state.point = 0;
    await loadMeAndEnter();
    toast('가입 완료! 환영합니다.');
  } catch (e) {
    showAuthErr('signup', e.message);
  } finally {
    $('signupBtn').disabled = false;
  }
}

// ============================================================
// UTM 어트리뷰션 — URL → localStorage (30일 유지)
// ============================================================
function captureUtmFromUrl() {
  try {
    const u = new URL(window.location.href);
    const utm = {
      source: u.searchParams.get('utm_source') || '',
      medium: u.searchParams.get('utm_medium') || '',
      campaign: u.searchParams.get('utm_campaign') || '',
      content: u.searchParams.get('utm_content') || '',
      term: u.searchParams.get('utm_term') || '',
      landing_url: window.location.href.slice(0, 500),
      referrer: (document.referrer || '').slice(0, 500),
      captured_at: Date.now(),
    };
    // 어트리뷰션 정보가 하나라도 있을 때만 저장
    if (utm.source || utm.medium || utm.campaign || utm.content || utm.term) {
      localStorage.setItem(UTM_KEY, JSON.stringify(utm));
    }
    // ?interest=수능,토익 또는 ?interest=수능&interest=토익 캡쳐
    const interestParams = u.searchParams.getAll('interest');
    const newInterests = [];
    for (const v of interestParams) {
      for (const s of String(v).split(',')) {
        const t = s.trim();
        if (t) newInterests.push(t);
      }
    }
    if (newInterests.length) {
      // 누적 — 이전 방문에서 캡쳐한 관심 주제와 합침 (Set으로 중복 제거)
      // ?interest=한자 방문 → ?interest=영어 방문 = localStorage에 [한자, 영어]
      const prev = loadPendingInterests();
      const merged = [...new Set([...prev, ...newInterests])].slice(0, 20);
      localStorage.setItem(INTERESTS_KEY, JSON.stringify({ interests: merged, at: Date.now() }));
    }
  } catch {}
}
function loadPendingInterests() {
  try {
    const raw = localStorage.getItem(INTERESTS_KEY);
    if (!raw) return [];
    const o = JSON.parse(raw);
    if (o.at && Date.now() - o.at > UTM_TTL_MS) {
      localStorage.removeItem(INTERESTS_KEY);
      return [];
    }
    return Array.isArray(o.interests) ? o.interests : [];
  } catch { return []; }
}
function loadUtm() {
  try {
    const raw = localStorage.getItem(UTM_KEY);
    if (!raw) return null;
    const utm = JSON.parse(raw);
    if (utm.captured_at && Date.now() - utm.captured_at > UTM_TTL_MS) {
      localStorage.removeItem(UTM_KEY);
      return null;
    }
    return utm;
  } catch { return null; }
}

async function tryAutoLogin() {
  // ?ref=CODE URL 캡쳐
  try {
    const u = new URL(window.location.href);
    const ref = u.searchParams.get('ref');
    if (ref) localStorage.setItem(REF_KEY, ref);
  } catch {}
  // UTM 어트리뷰션 캡쳐 (가입 시 함께 전송)
  captureUtmFromUrl();
  const saved = localStorage.getItem(REF_KEY);
  if (saved && !localStorage.getItem(TOKEN_KEY)) {
    switchTab('signup');
    $('su_ref').value = saved.toUpperCase();
    checkRefCode(saved);
  }
  if (!localStorage.getItem(TOKEN_KEY)) return;
  try {
    await loadMeAndEnter();

    localStorage.removeItem(TOKEN_KEY);
  }

async function loadMeAndEnter() {
  showLoading(true);
  try {
    const r = await api('GET', '/auth/me');
    state.user = r.user;
    state.point = Number(r.user.point) || 0;
    state.chapterAccess = r.chapter_access || {};
    state.interests = Array.isArray(r.user.interests) ? r.user.interests : [];
    // 필터 ON/OFF: localStorage에 저장한 값이 있으면 그대로, 없으면 interests 있을 때 기본 ON
    const savedToggle = localStorage.getItem(INTEREST_FILTER_KEY + '_' + (r.user.phone || ''));
    if (savedToggle === '1') state.interestFilterOn = state.interests.length > 0;
    else if (savedToggle === '0') state.interestFilterOn = false;
    else state.interestFilterOn = state.interests.length > 0;

    await enterHome();
  } finally {

  for (const subj in groups) {

// 홈 화면 카드 정렬 우선순위 — 작을수록 위
// 0: 구독 활성 (D-N 보이는 챕터)
// 1: 학습 진행 있음 (passedSet localStorage 비어있지 않음 — 무료/만료/미구매 막론)
// 2: 구매 이력 있음 (만료)
// 3: 그 외 (미구매 + 진행 없음)
function chapterPriority(c) {
  const access = state.chapterAccess[c.id];
  const dLeft = access ? daysLeft(access.expires_at) : null;
  const isPaidActive = dLeft != null && dLeft > 0;
  if (isPaidActive) return 0;
  try {
    const raw = localStorage.getItem('op_passed_' + c.id);
    if (raw) {
      const arr = JSON.parse(raw);
      if (Array.isArray(arr) && arr.length > 0) return 1;
    }
  } catch {}
  if (access) return 2;
  return 3;
}

function renderChapterCard(c) {
  const isTeacher = state.user && state.user.role === 'teacher';
  const access = state.chapterAccess[c.id];
  const dLeft = access ? daysLeft(access.expires_at) : null;
  const isAllFree = Number(c.is_all_free) === 1;
  const isPaidActive = !isTeacher && !isAllFree && dLeft != null && dLeft > 0;
  const isActive = isTeacher || isAllFree || isPaidActive;

  // 우측 상단 코너 배지 — 유료 활성 챕터의 남은 기간 (만료 KST 시각 tooltip)
  let cornerBadge = '';
  if (isPaidActive) {
    const expTip = `만료: ${fmtKst(access.expires_at)} (KST)`;
    cornerBadge = `<span class="ch-corner-badge" title="${escapeHtml(expTip)}">D-${dLeft}</span>`;
  }

  // 카드 본문의 인라인 상태 (D-N은 코너에 있으니 생략)
  let statusBadge = '', statusClass = '';
  if (isTeacher) { statusBadge = '🛠 관리자'; statusClass = 'free'; }
  else if (isAllFree) { statusBadge = '✨ 무료'; statusClass = 'free'; }
  else if (isPaidActive) { statusBadge = ''; }
  else if (access) { statusBadge = '만료됨'; statusClass = 'expired'; }
  else { statusBadge = '미구매'; statusClass = 'never'; }

  const price = Number(c.monthly_price) || 3000;
  const canRedeem = state.point >= REDEEM_COST;

  // 미구매 챕터도 카드 클릭으로 진입 → 무료 목차는 열람, 유료 목차는 🔒
  let actions;
  if (isActive) {
    actions = `<button class="primary" onclick="event.stopPropagation();enterChapter(${c.id})">열기 →</button>`;
  } else {
    actions = `
      <button onclick="event.stopPropagation();enterChapter(${c.id})">무료 보기 →</button>
      <button onclick="event.stopPropagation();openPayModal(${c.id})">${price.toLocaleString()}원 결제</button>
      <button onclick="event.stopPropagation();confirmRedeem(${c.id})" ${canRedeem ? '' : 'disabled'}>${REDEEM_COST}P 사용</button>
    `;
  }

  return `
    <div class="chapter-card ${access && !isActive && !isTeacher ? 'expired' : ''}" onclick="enterChapter(${c.id})">
      ${cornerBadge}
      <div class="ch-icon">${escapeHtml(c.icon || '📘')}</div>
      <div class="ch-title">${escapeHtml(c.title)}</div>
      <div class="ch-desc">${escapeHtml(c.description || '')}</div>
      ${statusBadge ? `<span class="ch-status ${statusClass}">${statusBadge}</span>` : ''}
      <div class="ch-actions">${actions}</div>
    </div>
  `;
}
