<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0a1a">
<title>원페이지 학습</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', sans-serif; background: #0a0a1a; color: #e5e7eb; }
body {
  line-height: 1.6; -webkit-text-size-adjust: 100%;
  -webkit-user-select: none; -moz-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  overflow-x: hidden;
}
button { font: inherit; cursor: pointer; border: none; }
input { font: inherit; outline: none; }
a { color: #4fc3f7; text-decoration: none; }
/* 인쇄 차단 */
@media print { html, body { display: none !important; } }

/* ─────────────────────────────────────────────
   워터마크 — 전체 화면 대각선 반복 (캡쳐 추적용)
   ───────────────────────────────────────────── */
#watermark {
  position: fixed; inset: 0; z-index: 9999;
  pointer-events: none; overflow: hidden;
  display: none;
}
#watermark.show { display: block; }
#watermark svg { width: 100%; height: 100%; }

/* ─────────────────────────────────────────────
   공통 — 헤더
   ───────────────────────────────────────────── */
.app-header {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; background: rgba(10,10,26,0.95);
  border-bottom: 1px solid #1f1f3a;
  position: sticky; top: 0; z-index: 50;
  backdrop-filter: blur(10px);
}
.app-header .brand {
  display: flex; align-items: center; gap: 6px;
  font-size: 15px; font-weight: 800; color: #fff;
}
.app-header .brand em { font-style: normal; color: #e94560; }
.app-header .back-btn {
  background: rgba(255,255,255,0.05); color: #fff;
  padding: 6px 10px; border-radius: 6px; font-size: 13px;
  margin-right: 2px;
}
.app-header .home-btn {
  background: rgba(255,255,255,0.06); color: #fff;
  width: 36px; height: 36px; border-radius: 8px;
  display: inline-flex; align-items: center; justify-content: center;
  border: none; cursor: pointer;
  transition: background 0.15s, transform 0.1s;
  -webkit-tap-highlight-color: transparent;
}
.app-header .home-btn:hover { background: rgba(255,255,255,0.12); }
.app-header .home-btn:active { transform: scale(0.92); }
.app-header .live-chip {
  display: flex; align-items: center; gap: 5px;
  background: rgba(76,175,80,0.15); border: 1px solid rgba(76,175,80,0.3);
  padding: 4px 10px; border-radius: 50px; font-size: 11px; color: #81c784;
  font-weight: 600;
}
.app-header .live-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: #4caf50; animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.4} }
.app-header .spacer { flex: 1; }
.app-header .icon-btn {
  background: rgba(255,255,255,0.05); color: #ddd;
  padding: 6px 10px; border-radius: 6px; font-size: 12px;
  display: inline-flex; align-items: center; gap: 4px;
}
.app-header .icon-btn:hover { background: rgba(255,255,255,0.1); }
/* 모두 접기 버튼 — 가운데, v^ 아이콘 + "접기" 라벨 */
.app-header .collapse-center {
  padding: 6px 14px;
  background: rgba(233,69,96,0.18); border: 1px solid rgba(233,69,96,0.45);
  color: #ff8a9e;
  display: inline-flex; align-items: center; gap: 6px;
  border-radius: 50px;
  transition: background 0.15s, transform 0.1s;
  font-size: 12px; font-weight: 700;
}
.app-header .collapse-center:hover { background: rgba(233,69,96,0.28); }
.app-header .collapse-center:active { transform: scale(0.94); }
.app-header .collapse-center svg { flex-shrink: 0; }
.app-header .collapse-center .cc-label {
  white-space: nowrap;
}
/* 암기 모음 토글 */
.app-header .memorized-toggle {
  padding: 6px 12px;
  background: rgba(165,214,167,0.12); border: 1px solid rgba(165,214,167,0.35);
  color: #a5d6a7;
  border-radius: 50px;
  transition: background 0.15s, transform 0.1s;
  font-size: 12px; font-weight: 700;
}
.app-header .memorized-toggle:hover { background: rgba(165,214,167,0.22); }
.app-header .memorized-toggle:active { transform: scale(0.94); }
.app-header .memorized-toggle.active {
  background: rgba(165,214,167,0.32);
  border-color: rgba(165,214,167,0.7);
  color: #c8e6c9;
  box-shadow: 0 0 0 2px rgba(165,214,167,0.15);
}

/* 암기 모음 헤더 — 학습 모드의 topic-head와 같은 레이아웃 (좌: 제목, 우: ⤴ 패스) */
.memo-header {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px; margin-top: 6px;
  background: linear-gradient(180deg, rgba(165,214,167,0.10) 0%, rgba(165,214,167,0.04) 100%);
  border: 1px solid rgba(165,214,167,0.3);
  border-radius: 10px;
}
.memo-header .memo-title {
  flex: 1; font-size: 15px; font-weight: 800;
  color: #c8e6c9; display: flex; align-items: center; gap: 8px;
}
.memo-header .memo-count {
  font-size: 11px; padding: 2px 8px; border-radius: 50px;
  background: rgba(165,214,167,0.18); color: #a5d6a7; font-weight: 700;
}

.memo-empty {
  text-align: center; padding: 60px 20px;
  color: rgba(255,255,255,0.5);
}
.memo-empty .memo-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }
.memo-empty .memo-hint { font-size: 12px; margin-top: 8px; color: rgba(255,255,255,0.35); }

/* ── 다지기 v2 — 오늘 클리어율 진행바 ───────────────────── */
.srs-clear {
  margin: 10px 14px 14px;
  padding: 12px 14px;
  background: linear-gradient(135deg, rgba(233,69,96,0.10), rgba(83,52,131,0.10));
  border: 1px solid rgba(233,69,96,0.28);
  border-radius: 12px;
}
.srs-clear-head {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 13px; font-weight: 700; color: #fff;
  margin-bottom: 8px;
}
.srs-clear-num { color: #ffd180; font-variant-numeric: tabular-nums; }
.srs-clear-bar {
  height: 8px; background: rgba(255,255,255,0.06);
  border-radius: 50px; overflow: hidden;
  margin-bottom: 6px;
}
.srs-clear-fill {
  height: 100%;
  background: linear-gradient(90deg, #e94560 0%, #ff8a9e 100%);
  border-radius: 50px;
  transition: width 0.35s ease;
}
.srs-clear-foot { font-size: 11px; color: rgba(255,255,255,0.55); text-align: right; }

/* ── 다지기 v2 — 6 박스 ────────────────────────────────── */
.srs-box {
  margin: 8px 14px;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  background: rgba(255,255,255,0.03);
  overflow: hidden;
}
.srs-box-head {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 14px;
  cursor: pointer; user-select: none;
  font-size: 14px; font-weight: 700;
  color: #fff;
}
.srs-box-head:hover { background: rgba(255,255,255,0.04); }
.srs-box-arrow { font-size: 11px; color: rgba(255,255,255,0.45); width: 14px; }
.srs-box-name { flex: 1; }
.srs-box-count {
  background: rgba(255,255,255,0.08);
  color: #e5e7eb;
  font-size: 12px; font-weight: 700;
  padding: 3px 10px; border-radius: 50px;
  font-variant-numeric: tabular-nums;
}
.srs-box-pass {
  background: rgba(233,69,96,0.18);
  color: #ff8a9e;
  border: 1px solid rgba(233,69,96,0.4);
  padding: 6px 12px; border-radius: 8px;
  font-size: 12px; font-weight: 700; cursor: pointer;
  transition: all 0.18s ease;
}
.srs-box-pass:hover { background: rgba(233,69,96,0.28); }
.srs-box-body { display: none; padding: 0 8px 8px; }
.srs-box.opened .srs-box-body { display: block; }
/* 박스별 색조 — 오늘 빨강, 내일 주황, 4~32 점점 멀어짐 */
.srs-box.srs-box-today  { border-color: rgba(233,69,96,0.40); background: rgba(233,69,96,0.06); }
.srs-box.srs-box-today .srs-box-name { color: #ff8a9e; }
.srs-box.srs-box-tomo   { border-color: rgba(255,152,0,0.32); background: rgba(255,152,0,0.04); }
.srs-box.srs-box-tomo .srs-box-name { color: #ffb74d; }
.srs-box.srs-box-d4     { border-color: rgba(255,213,79,0.28); }
.srs-box.srs-box-d4 .srs-box-name { color: #ffe082; }
.srs-box.srs-box-d8     { border-color: rgba(129,199,132,0.25); }
.srs-box.srs-box-d8 .srs-box-name { color: #a5d6a7; }
.srs-box.srs-box-d16    { border-color: rgba(79,195,247,0.25); }
.srs-box.srs-box-d16 .srs-box-name { color: #81d4fa; }
.srs-box.srs-box-d32    { border-color: rgba(176,190,197,0.25); }
.srs-box.srs-box-d32 .srs-box-name { color: #cfd8dc; }

/* ── 암기 모음 — due 그룹 (간격 반복) ─────────────────────── */
.memo-group { margin-bottom: 18px; }
.memo-group-head {
  font-size: 13px; font-weight: 700;
  padding: 10px 14px;
  margin: 14px 14px 8px;
  border-radius: 8px;
  display: flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,0.03);
  border-left: 4px solid rgba(255,255,255,0.2);
}
.memo-group-head .memo-group-count {
  margin-left: auto;
  font-size: 11px; font-weight: 700;
  background: rgba(255,255,255,0.08); color: #e5e7eb;
  padding: 2px 8px; border-radius: 50px;
}
/* 오늘 = 강조 빨강 */
.memo-grp-today .memo-group-head {
  background: rgba(233,69,96,0.10);
  border-left-color: #e94560;
  color: #ff8a9e;
}
/* 가까운 미래 (1~2일 후) = 주황 */
.memo-grp-soon .memo-group-head {
  background: rgba(255,152,0,0.07);
  border-left-color: #ff9800;
  color: #ffb74d;
}
.memo-grp-soon .subtopic { opacity: 0.82; }
/* 이번 주 = 노랑 */
.memo-grp-week .memo-group-head {
  background: rgba(255,213,79,0.06);
  border-left-color: #ffd54f;
  color: #ffe082;
}
.memo-grp-week .subtopic { opacity: 0.65; }
/* 이후 = 회색 */
.memo-grp-future .memo-group-head {
  background: rgba(176,190,197,0.05);
  border-left-color: #90a4ae;
  color: #b0bec5;
}
.memo-grp-future .subtopic { opacity: 0.5; }

/* ─────────────────────────────────────────────
   로그인/회원가입
   ───────────────────────────────────────────── */
#authScreen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
.auth-card {
  width: 100%; max-width: 380px;
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  border: 1px solid #2a2a4e; border-radius: 18px;
  padding: 26px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}
.auth-card h1 {
  text-align: center; font-size: 1.5em; font-weight: 800;
  color: #fff; margin-bottom: 4px;
}
.auth-card .sub {
  text-align: center; font-size: 13px;
  color: rgba(255,255,255,0.55); margin-bottom: 18px;
}
.auth-tabs {
  display: flex; gap: 4px; background: rgba(0,0,0,0.3);
  border-radius: 8px; padding: 4px; margin-bottom: 16px;
}
.auth-tabs button {
  flex: 1; padding: 8px; background: transparent;
  color: rgba(255,255,255,0.5); border-radius: 6px;
  font-size: 13px; font-weight: 600; transition: all 0.15s;
}
.auth-tabs button.active {
  background: rgba(233,69,96,0.2); color: #fff;
}
.auth-card label {
  display: block; font-size: 12px; color: rgba(255,255,255,0.6);
  margin-bottom: 4px; margin-top: 10px; font-weight: 600;
}
.auth-card input {
  width: 100%; padding: 10px 12px;
  background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px; color: #fff; font-size: 14px;
  -webkit-user-select: text; user-select: text;
}
.auth-card input:focus { border-color: #e94560; }
.auth-card .err {
  background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.4);
  color: #fca5a5; padding: 9px 12px; border-radius: 8px;
  font-size: 13px; margin-top: 12px; display: none;
}
.auth-card .err.show { display: block; }
.auth-card .ref-info {
  background: rgba(255,193,7,0.1); border: 1px solid rgba(255,193,7,0.3);
  color: #ffd54f; padding: 8px 12px; border-radius: 6px;
  font-size: 12px; margin-top: 8px; display: none;
}
.auth-card .ref-info.show { display: block; }
.auth-card button.primary {
  width: 100%; margin-top: 18px; padding: 12px;
  background: linear-gradient(135deg, #e94560, #ff6b6b);
  color: #fff; font-weight: 700; border-radius: 8px;
  font-size: 14px;
}
.auth-card button.primary:disabled { opacity: 0.5; cursor: wait; }

/* ─────────────────────────────────────────────
   홈 — 챕터 카드 목록
   ───────────────────────────────────────────── */
#homeScreen { display: none; }
.home-top {
  background: linear-gradient(180deg, #16213e 0%, #0a0a1a 100%);
  padding: 20px 18px 26px;
}
.home-greeting {
  font-size: 18px; font-weight: 700; color: #fff;
  margin-bottom: 6px;
}
.home-meta {
  font-size: 13px; color: rgba(255,255,255,0.55);
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
}
.home-meta .point-chip {
  display: inline-flex; align-items: center; gap: 4px;
  background: rgba(255,193,7,0.15); border: 1px solid rgba(255,193,7,0.3);
  padding: 5px 14px; border-radius: 50px; color: #ffd54f; font-weight: 700;
  cursor: pointer; font-size: 13px; transition: background 0.15s;
  -webkit-tap-highlight-color: rgba(255,193,7,0.3);
}
.home-meta .point-chip:hover { background: rgba(255,193,7,0.25); }
.home-meta .point-chip:active { transform: scale(0.97); }
.home-meta .refer-chip {
  background: rgba(79,195,247,0.15); border-color: rgba(79,195,247,0.35);
  color: #4fc3f7;
}
.home-meta .refer-chip:hover { background: rgba(79,195,247,0.25); }
.home-actions {
  display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap;
}
.home-actions button {
  background: rgba(255,255,255,0.08); color: #fff;
  padding: 8px 14px; border-radius: 50px; font-size: 13px;
  display: inline-flex; align-items: center; gap: 5px;
}
.home-actions button.featured {
  background: linear-gradient(135deg, #e94560, #ff6b6b); color: #fff;
}
.home-actions button:hover { background: rgba(255,255,255,0.15); }
.home-actions button.featured:hover { filter: brightness(1.1); }

.home-content {
  max-width: 760px; margin: 0 auto; padding: 22px 16px 60px;
}
.subject-section {
  margin-bottom: 26px;
}
.subject-title {
  font-size: 12px; color: rgba(255,255,255,0.5);
  margin-bottom: 10px; padding-left: 4px; letter-spacing: 0.08em;
  font-weight: 700;
}
.chapter-cards {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
}
.chapter-card {
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  border: 1px solid #2a2a4e; border-radius: 14px;
  padding: 16px; cursor: pointer; transition: all 0.2s;
  position: relative; overflow: hidden;
  -webkit-tap-highlight-color: rgba(233,69,96,0.15);
  touch-action: manipulation;
  /* 박스 크기 고정 — 2줄 제목 카드도 안에 다 들어가는 높이.
     내용은 자연스럽게 위에서부터 흐름 → 1줄 제목 카드는 아래쪽 여백이 생기지만 박스 크기는 동일 */
  min-height: 184px;
}
.chapter-card .ch-corner-badge {
  position: absolute; top: 8px; right: 10px;
  background: rgba(76,175,80,0.25); color: #81c784;
  padding: 3px 9px; border-radius: 50px;
  font-size: 10px; font-weight: 800; letter-spacing: 0.02em;
  border: 1px solid rgba(76,175,80,0.3);
}
.chapter-card:hover { transform: translateY(-3px); border-color: rgba(233,69,96,0.4); }
.chapter-card.expired { opacity: 0.7; }
.chapter-card .ch-icon { font-size: 32px; margin-bottom: 8px; }
.chapter-card .ch-title {
  font-size: 16px; font-weight: 700; color: #fff;
  margin-bottom: 8px; word-break: keep-all;
  /* 2줄 분량 공간 예약 → 1줄/2줄 제목 모두 다음 요소(무료 배지·열기 버튼) 위치 동일.
     line-height 1.55 기준 2줄 = 3.1em, 약간의 여유 포함해서 3.2em */
  min-height: 3.2em;
}
.chapter-card .ch-desc { font-size: 11px; color: rgba(255,255,255,0.5); margin-bottom: 12px; min-height: 16px; }
.chapter-card .ch-status {
  display: inline-block; padding: 3px 10px; border-radius: 50px;
  font-size: 10px; font-weight: 700;
}
.chapter-card .ch-status.active { background: rgba(76,175,80,0.2); color: #81c784; }
.chapter-card .ch-status.expired { background: rgba(255,152,0,0.2); color: #ffb74d; }
.chapter-card .ch-status.never { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); }
.chapter-card .ch-status.free { background: rgba(76,175,80,0.25); color: #81c784; }
.chapter-card .ch-actions {
  display: flex; gap: 5px; margin-top: 10px;
}
.chapter-card .ch-actions button {
  flex: 1; padding: 7px; font-size: 11px; font-weight: 600;
  background: rgba(255,255,255,0.08); color: #fff; border-radius: 6px;
}
.chapter-card .ch-actions button.primary {
  background: linear-gradient(135deg, #e94560, #ff6b6b);
}
.chapter-card .ch-actions button:disabled { opacity: 0.4; cursor: not-allowed; }
.chapter-card .ch-progress {
  margin-top: 8px; font-size: 10px; color: rgba(255,255,255,0.4);
}

/* ─────────────────────────────────────────────
   챕터 상세 — 트리
   ───────────────────────────────────────────── */
#chapterScreen { display: none; }
.chapter-header {
  background: linear-gradient(180deg, #16213e 0%, #0a0a1a 100%);
  padding: 14px 18px 16px;
  text-align: center;
}
/* 일반 모드 3탭 — new / 별표 / all (각 목차 안 학습 카드 위) */
.mode-tabs {
  display: flex; gap: 5px;
  padding: 8px 10px 4px;
  margin: 2px 4px 4px;
}
.mode-tabs.hide { display: none; }
.mode-tab {
  flex: 1; padding: 7px 6px;
  background: rgba(255,255,255,0.04);
  color: rgba(255,255,255,0.55);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px;
  font-size: 12px; font-weight: 700;
  cursor: pointer; transition: all 0.18s ease;
}
.mode-tab:hover { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.8); }
.mode-tab.active {
  background: linear-gradient(135deg, rgba(233,69,96,0.18), rgba(83,52,131,0.12));
  border-color: rgba(233,69,96,0.5);
  color: #ff8a9e;
  box-shadow: 0 2px 6px rgba(233,69,96,0.15);
}
.chapter-header .ch-subj {
  display: inline-block;
  font-size: 11px; color: rgba(255,255,255,0.6);
  letter-spacing: 0.08em; margin-bottom: 4px;
  background: rgba(255,255,255,0.06);
  padding: 2px 10px; border-radius: 50px;
}
.chapter-header .ch-name {
  font-size: 20px; font-weight: 800; color: #fff;
  word-break: keep-all; line-height: 1.3;
}
.chapter-header .ch-meta {
  margin-top: 6px; font-size: 11px; color: rgba(255,255,255,0.5);
}
.chapter-tree {
  max-width: 760px; margin: 0 auto;
  /* padding-bottom: 100vh — 콘텐츠가 줄어도 페이지 최대 스크롤이 변하지 않도록
     마지막 목차 아래에 항상 화면 1개 분의 여유 공간 (브라우저 자동 위로 스크롤 방지) */
  padding: 16px 14px 100vh;
  overflow-anchor: none;
}

.topic-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px; margin-bottom: 10px; overflow: hidden;
  transition: border-color 0.2s;
}
.topic-card.opened { border-color: rgba(233,69,96,0.4); }
.topic-card.locked { background: rgba(255,255,255,0.02); }

/* 학습 컨트롤 — 목차 헤더 안에 표시 (펼친 상태일 때) */
.study-controls {
  display: flex; gap: 4px; flex-shrink: 0;
  margin-left: auto;
  pointer-events: auto;
}
.study-controls * { pointer-events: auto; }
.study-btn {
  height: 28px; padding: 0 9px;
  border-radius: 14px;
  font-size: 11px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid transparent;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.1s, background 0.15s;
  white-space: nowrap;
}
.study-btn.skip   { background: rgba(79,195,247,0.18); color: #4fc3f7; border-color: rgba(79,195,247,0.3); }
.study-btn.expand { background: rgba(255,193,7,0.18); color: #ffd54f; border-color: rgba(255,193,7,0.3); }
.study-btn.done   { background: rgba(76,175,80,0.2); color: #81c784; border-color: rgba(76,175,80,0.35); }
.study-btn.reset  { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.7); border-color: rgba(255,255,255,0.15); }
.study-btn:active { transform: scale(0.92); }

/* 현재 학습 대상 (맨 위 미학습 학습 카드) — 주황 강조 */
.subtopic.current {
  background: linear-gradient(180deg, rgba(255,138,0,0.22) 0%, rgba(255,138,0,0.10) 100%) !important;
  border-color: rgba(255,138,0,0.55) !important;
  box-shadow: 0 0 0 1px rgba(255,138,0,0.25);
}
.subtopic.current .subtopic-title { color: #ffb74d; }

/* 학습 카드마다 액션 버튼 — head 안 우측에 표시 */
.subtopic-actions {
  display: flex; gap: 4px; flex-shrink: 0;
  pointer-events: auto;
}
.subtopic-head > .subtopic-actions,
.subtopic-head > .subtopic-actions * { pointer-events: auto; }
.sa-btn {
  height: 26px; padding: 0 8px;
  border-radius: 13px;
  border: 1px solid transparent;
  font-size: 11px; font-weight: 700;
  cursor: pointer; white-space: nowrap;
  display: inline-flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.1s, background 0.15s;
}
.sa-btn:active { transform: scale(0.92); }
.sa-btn.skip   { background: rgba(79,195,247,0.16); color: #4fc3f7;  border-color: rgba(79,195,247,0.3); }
.sa-btn.expand { background: rgba(255,193,7,0.16);  color: #ffd54f;  border-color: rgba(255,193,7,0.3); }
.sa-btn.done   { background: rgba(76,175,80,0.2);   color: #81c784;  border-color: rgba(76,175,80,0.35); }
.sa-btn.redo   { background: rgba(255,138,0,0.18);  color: #ffb74d;  border-color: rgba(255,138,0,0.3); }

/* 큰 패스 버튼 — 목차 헤더 오른쪽, 항상 같은 크기로 고정 */
.study-btn.skip-big {
  padding: 0 22px; width: 110px; height: 30px;
  border-radius: 50px;
  background: rgba(79,195,247,0.22);
  color: #81d4fa;
  border: 1px solid rgba(79,195,247,0.45);
  font-size: 13px; font-weight: 800;
  letter-spacing: 0.02em;
  box-shadow: 0 2px 12px rgba(79,195,247,0.15);
  flex-shrink: 0;
}
.study-btn.skip-big:active {
  background: rgba(79,195,247,0.4);
  transform: scale(0.94);
}

/* ───── 축하 폭죽 오버레이 ───── */
.celebration {
  position: fixed; inset: 0;
  background: rgba(10,10,26,0.88);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999; overflow: hidden;
  animation: celFadeIn 0.3s ease-out;
}
@keyframes celFadeIn { from { opacity: 0; } to { opacity: 1; } }
.cel-content {
  text-align: center; position: relative; z-index: 2;
  animation: celPop 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes celPop {
  0%   { transform: scale(0.3); opacity: 0; }
  100% { transform: scale(1);   opacity: 1; }
}
.cel-icon {
  font-size: 88px;
  animation: celBounce 0.9s ease-in-out infinite alternate;
}
@keyframes celBounce {
  0%   { transform: scale(1)    rotate(-10deg); }
  100% { transform: scale(1.15) rotate(10deg);  }
}
.cel-text {
  font-size: 30px; font-weight: 900;
  color: #ffd54f; margin-top: 14px;
  text-shadow: 0 4px 24px rgba(0,0,0,0.6);
  word-break: keep-all;
}
.cel-sub {
  font-size: 14px; color: rgba(255,255,255,0.75);
  margin-top: 8px; word-break: keep-all;
}
.confetti-piece {
  position: absolute; top: -50px;
  animation: confettiFall linear forwards;
  pointer-events: none; z-index: 1;
}
@keyframes confettiFall {
  to { transform: translateY(120vh) rotate(720deg); opacity: 0; }
}
.topic-head {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px; cursor: pointer;
  /* 패스 버튼 누를 때 헤더 전체가 핑크색으로 깜빡이는 것 방지 */
  -webkit-tap-highlight-color: transparent;
}
.topic-head > * { pointer-events: none; }
.topic-head > .study-controls,
.topic-head > .study-controls * { pointer-events: auto; }
.topic-head:hover { background: rgba(255,255,255,0.02); }
.topic-arrow {
  color: #e94560; font-size: 12px; width: 12px; text-align: center;
  transition: transform 0.2s; flex-shrink: 0;
}
.topic-card.opened .topic-arrow { transform: rotate(90deg); }
.topic-card.locked .topic-arrow { color: rgba(255,255,255,0.3); }
.topic-title {
  font-size: 15px; font-weight: 700; color: #fff;
  min-width: 0; flex-shrink: 1;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.topic-title .free-tag {
  display: inline-block; background: rgba(76,175,80,0.25); color: #81c784;
  font-size: 10px; padding: 2px 8px; border-radius: 50px;
  margin-left: 8px; font-weight: 700; vertical-align: middle;
}
.topic-title .lock-icon { color: rgba(255,255,255,0.4); font-size: 14px; margin-left: 6px; }
.topic-count {
  background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.7);
  font-size: 10px; padding: 3px 9px; border-radius: 50px; font-weight: 600;
  flex-shrink: 0;
}
/* 진도 바 — 목차 옆에 암기/전체 비율 시각화 */
.topic-progress {
  position: relative; flex-shrink: 0;
  width: 88px; height: 18px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 50px; overflow: hidden;
}
.topic-progress-fill {
  position: absolute; left: 0; top: 0; bottom: 0;
  background: linear-gradient(90deg, rgba(76,175,80,0.55) 0%, rgba(129,199,132,0.7) 100%);
  border-radius: 50px;
  transition: width 0.3s ease;
}
.topic-progress-fill.done {
  background: linear-gradient(90deg, rgba(76,175,80,0.85) 0%, rgba(165,214,167,0.95) 100%);
}
.topic-progress-text {
  position: relative; z-index: 1;
  display: flex; align-items: center; justify-content: center;
  height: 100%; font-size: 10px; font-weight: 700;
  color: rgba(255,255,255,0.85); letter-spacing: 0.02em;
  text-shadow: 0 1px 2px rgba(0,0,0,0.4);
}
@media (max-width: 480px) {
  .topic-progress { width: 72px; height: 16px; }
  .topic-progress-text { font-size: 9px; }
}
.topic-body { display: none; padding: 0 14px 14px; }
.topic-card.opened > .topic-body { display: block; }

.locked-banner {
  background: linear-gradient(135deg, rgba(233,69,96,0.1), rgba(83,52,131,0.1));
  border: 1px solid rgba(233,69,96,0.3); border-radius: 10px;
  padding: 16px; text-align: center; margin: 8px 0;
}
.locked-banner h4 {
  font-size: 14px; color: #fff; font-weight: 700; margin-bottom: 6px;
}
.locked-banner p {
  font-size: 12px; color: rgba(255,255,255,0.6); margin-bottom: 12px;
}
.locked-banner button {
  background: linear-gradient(135deg, #e94560, #ff6b6b); color: #fff;
  padding: 9px 22px; font-size: 13px; font-weight: 700; border-radius: 50px;
}

/* 학습 카드 = 보라 톤 (제목·미리보기 영역) */
.subtopic {
  background: linear-gradient(180deg, rgba(83,52,131,0.18) 0%, rgba(83,52,131,0.10) 100%);
  border: 1px solid rgba(179,157,219,0.25);
  border-radius: 10px;
  margin-top: 10px; overflow: hidden;
  /* transition 제거 — 패스 시 다음 단어 등장할 때 번쩍임 방지 */
}
.subtopic.understood {
  border-color: rgba(76,175,80,0.45);
  background: linear-gradient(180deg, rgba(76,175,80,0.14) 0%, rgba(76,175,80,0.06) 100%);
}
/* 다지기에서 실패해 챕터 뷰로 돌아온 카드 — 청색 강조 + ↺ 배지 */
.subtopic.failed-from-memo {
  border-color: rgba(79,195,247,0.45);
  background: linear-gradient(180deg, rgba(79,195,247,0.10) 0%, rgba(79,195,247,0.03) 100%);
}
.failed-memo-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 18px; height: 18px; min-width: 18px;
  background: rgba(79,195,247,0.85); color: #fff;
  border-radius: 50%; font-size: 11px; font-weight: 700;
  margin-right: 4px;
}
/* 챕터에서 펼친 미암기 카드 ("틀린 단어") — 앰버 톤 */
.subtopic.peeked {
  border-color: rgba(255,193,7,0.45);
  background: linear-gradient(180deg, rgba(255,193,7,0.09) 0%, rgba(255,193,7,0.03) 100%);
}
/* 펼친 학습 카드 — 테두리·그림자 강조로 다른 항목과 시각적 분리 (집중 학습) */
.subtopic.opened {
  border-color: rgba(179,157,219,0.7);
  border-width: 2px;
  box-shadow: 0 0 0 1px rgba(179,157,219,0.35), 0 8px 24px rgba(0,0,0,0.35);
  margin-top: 14px; margin-bottom: 6px;
}
.subtopic.understood.opened {
  border-color: rgba(76,175,80,0.75);
  box-shadow: 0 0 0 1px rgba(76,175,80,0.35), 0 8px 24px rgba(0,0,0,0.35);
}
.subtopic.current.opened {
  border-color: rgba(255,138,0,0.85);
  box-shadow: 0 0 0 1px rgba(255,138,0,0.5), 0 8px 24px rgba(0,0,0,0.4) !important;
}
.subtopic-head {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.subtopic-head > * { pointer-events: none; }
.subtopic-head:hover { background: rgba(255,255,255,0.03); }
.subtopic-dot {
  width: 12px; height: 12px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.3); flex-shrink: 0;
  transition: all 0.2s;
}
.subtopic.understood .subtopic-dot {
  background: #4caf50; border-color: #4caf50;
  box-shadow: 0 0 10px rgba(76,175,80,0.5);
}
.subtopic-arrow {
  color: #b39ddb; font-size: 11px; width: 11px; text-align: center;
  transition: transform 0.2s; flex-shrink: 0;
}
.subtopic.opened .subtopic-arrow { transform: rotate(90deg); }
.subtopic-title {
  flex: 1; font-size: 14px; color: rgba(255,255,255,0.92); font-weight: 600;
}
.subtopic.understood .subtopic-title { color: #a5d6a7; }
/* 암기 모음 모드: current면 주황색이 암기 초록을 이김 */
.subtopic.understood.current { /* 배경·테두리는 .current의 !important로 이미 우선됨 */ }
.subtopic.understood.current .subtopic-title { color: #ffb74d; }
.subtopic.understood.current .subtopic-dot {
  background: #ffb74d; border-color: #ffb74d;
  box-shadow: 0 0 10px rgba(255,138,0,0.55);
}
.subtopic-hint {
  font-size: 10px; color: rgba(255,255,255,0.35);
}
/* 발음 듣기 버튼 — 학습 카드 제목 옆 */
.speak-btn {
  background: rgba(79,195,247,0.12);
  border: 1px solid rgba(79,195,247,0.3);
  color: #4fc3f7;
  width: 30px; height: 26px;
  border-radius: 50px;
  font-size: 13px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  pointer-events: auto;
  transition: background 0.12s, transform 0.08s;
}
.speak-btn:hover { background: rgba(79,195,247,0.22); }
.speak-btn:active { transform: scale(0.9); background: rgba(79,195,247,0.35); }
/* 본문 = 어두운 다른 톤 (학습 카드와 명확히 분리) */
.subtopic-body {
  display: none; padding: 14px 16px 14px 28px;
  background: #0a0a1a;
  border-top: 1px solid rgba(179,157,219,0.2);
}
.subtopic.opened > .subtopic-body { display: block; }
.subtopic-preview {
  padding: 8px 14px 12px 38px; cursor: pointer;
  -webkit-tap-highlight-color: rgba(233,69,96,0.15);
  touch-action: manipulation;
}
.subtopic-preview img {
  max-width: 100%; max-height: 220px; border-radius: 6px;
  display: block; pointer-events: none; -webkit-user-drag: none;
}
.subtopic-preview .cap {
  font-size: 11px; color: rgba(255,255,255,0.5);
  margin-top: 6px; pointer-events: none;
}

/* 아이템 카드 = 본문 안의 개별 내용 — 좌측 시안색 라인으로 강조 */
.item {
  background: rgba(255,255,255,0.04);
  border-radius: 8px; padding: 12px 14px;
  margin-top: 10px;
  border-left: 3px solid rgba(79,195,247,0.5);
}
.item:first-child { margin-top: 0; }
.item .item-text {
  font-size: 14px; color: rgba(255,255,255,0.92);
  white-space: pre-wrap; word-break: break-word; line-height: 1.7;
  -webkit-user-select: none; user-select: none;
}
.item .item-image {
  max-width: 100%; max-height: 500px; border-radius: 6px; display: block;
  pointer-events: none; -webkit-user-drag: none;
}
.item .item-caption {
  font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 6px;
}
/* 텍스트 안 자동 링크 — body의 user-select:none / touch-callout:none 효과 해제 */
.item-text .inline-link {
  color: #4fc3f7; text-decoration: underline;
  word-break: break-all;
  cursor: pointer; pointer-events: auto;
  -webkit-touch-callout: default;
  -webkit-user-select: auto; user-select: auto;
}
.item-text .inline-link:hover { color: #81d4fa; }

/* ─── 동영상 embed (item kind=link, Gumlet만) — 16:9 반응형 ─── */
.video-embed {
  position: relative; padding-bottom: 56.25%; height: 0;
  overflow: hidden; border-radius: 8px;
  background: rgba(0,0,0,0.4);
}
.video-embed iframe {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%; border: 0;
}

/* ─── 링크 카드 (item kind=link) ─── */
.link-card {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; text-decoration: none;
  background: rgba(79,195,247,0.08);
  border: 1px solid rgba(79,195,247,0.3);
  border-radius: 8px;
  transition: background 0.15s;
  /* body의 user-select·touch-callout 차단을 무시하고 클릭 가능하게 */
  cursor: pointer; pointer-events: auto;
  -webkit-touch-callout: default;
  -webkit-tap-highlight-color: rgba(79,195,247,0.25);
}
.link-card:hover { background: rgba(79,195,247,0.18); }
.link-card .link-icon {
  font-size: 22px; flex-shrink: 0;
}
.link-card .link-thumb {
  width: 96px; height: 54px; border-radius: 4px;
  object-fit: cover; flex-shrink: 0;
  pointer-events: none;
}
.link-card .link-body { flex: 1; min-width: 0; }
.link-card .link-title {
  font-size: 14px; font-weight: 600; color: #4fc3f7;
  word-break: break-word;
}
.link-card .link-url {
  font-size: 11px; color: rgba(255,255,255,0.45);
  margin-top: 3px; word-break: break-all;
}
.link-card-yt { background: rgba(229,57,53,0.10); border-color: rgba(229,57,53,0.35); }
.link-card-yt:hover { background: rgba(229,57,53,0.20); }
.link-card-yt .link-title { color: #ff5252; }

.empty-state {
  text-align: center; padding: 30px 16px;
  color: rgba(255,255,255,0.4); font-size: 13px;
}

/* ─────────────────────────────────────────────
   모달
   ───────────────────────────────────────────── */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.75);
  display: flex; align-items: center; justify-content: center;
  z-index: 200; padding: 20px; backdrop-filter: blur(4px);
}
.modal {
  width: 100%; max-width: 420px;
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  border: 1px solid #2a2a4e; border-radius: 16px;
  overflow: hidden; max-height: 90vh; display: flex; flex-direction: column;
}
.modal-head {
  padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-head h3 { font-size: 16px; font-weight: 700; color: #fff; }
.modal-head .close {
  background: transparent; color: rgba(255,255,255,0.5);
  padding: 4px 10px; font-size: 22px;
}
.modal-body { padding: 22px; overflow-y: auto; }
.modal-foot {
  padding: 14px 20px; border-top: 1px solid rgba(255,255,255,0.08);

.modal-foot button {

  padding: 9px 16px; border-radius: 8px; font-size: 13px; font-weight: 600;
}
.modal-foot button.primary {
  background: linear-gradient(135deg, #e94560, #ff6b6b);
}

.referral-modal .ref-link {
  background: rgba(0,0,0,0.4); padding: 12px;
  border-radius: 8px; font-family: monospace; font-size: 12px;
  color: #4fc3f7; word-break: break-all; margin: 12px 0;
  -webkit-user-select: all; user-select: all;
}
.referral-modal .ref-steps {
  display: grid; gap: 8px; margin-top: 16px;
}
.referral-modal .ref-step {
  display: flex; gap: 10px; align-items: flex-start;
  background: rgba(255,255,255,0.04); padding: 10px 12px; border-radius: 8px;
  font-size: 12px; color: rgba(255,255,255,0.8);
}
.referral-modal .ref-step b {
  flex-shrink: 0; width: 22px; height: 22px;
  background: #e94560; color: #fff; border-radius: 50%;

  font-size: 11px; font-weight: 800;
}
.referral-modal .ref-stats {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px;
}
.referral-modal .ref-stat {
  background: rgba(0,0,0,0.3); padding: 10px 12px; border-radius: 8px;
  text-align: center;
}
.referral-modal .ref-stat .v {
  font-size: 20px; font-weight: 800; color: #ffd54f; display: block;
}
.referral-modal .ref-stat .l {
  font-size: 10px; color: rgba(255,255,255,0.5); margin-top: 2px;
}

/* ─── 내 계정 모달 ─── */
.account-modal .acc-info-row {
  display: grid; grid-template-columns: 70px 1fr;
  gap: 6px 12px; margin-bottom: 14px;
  padding: 12px 14px; background: rgba(0,0,0,0.25);
  border-radius: 8px; font-size: 13px; align-items: center;
}
.account-modal .acc-info-label { color: rgba(255,255,255,0.5); font-size: 11px; }
.account-modal .acc-section-title {
  font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.6);
  margin: 16px 0 6px; letter-spacing: 0.03em;
}
.account-modal .acc-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; background: rgba(0,0,0,0.25);
  border: 1px solid rgba(255,255,255,0.05); border-radius: 8px;
  margin-bottom: 4px; font-size: 13px;
}
.account-modal .acc-row-main { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
.account-modal .acc-row-icon { font-size: 18px; flex-shrink: 0; }

<script>
'use strict';

// ============================================================
// 설정
// ============================================================
const API = 'https://onepage-api.memoryking.workers.dev';
const TOKEN_KEY = 'op_user_token';
const REF_KEY = 'op_ref_code';
const UTM_KEY = 'op_utm';
const INTERESTS_KEY = 'op_interests_pending'; // 가입 전 URL에서 캡쳐한 관심 주제
const INTEREST_FILTER_KEY = 'op_interest_filter'; // 필터 ON/OFF 토글 저장 (사용자별 phone 기준)
const UTM_TTL_MS = 30 * 24 * 3600 * 1000;   // 30일 유지 (재방문 시까지 어트리뷰션 유지)
const LANDING_URL = 'https://vipup.site/onepage';   // 결제 안내 페이지
const REDEEM_COST = 3000;
// 모든 시간은 KST(한국 표준시) 기준. 서버는 expires_at 등을 KST wall-clock으로 저장.
const KST_OFFSET_MS = 9 * 60 * 60 * 1000;
const KST_TZ = 'Asia/Seoul';

// ============================================================
// 상태
// ============================================================
const state = {
  user: null,
  point: 0,
  chapterAccess: {},          // chapter_id → { expires_at, source }
  chapters: [],
  currentChapter: null,
  topicsByChapter: {},
  subtopicsByTopic: {},
  itemsBySubtopic: {},
  understoodSet: new Set(),
  understoodMarkedAt: {},     // subtopic_id → marked_at (YYYY-MM-DD HH:MM:SS) — 암기 모음 정렬용
  understoodBox: {},          // subtopic_id → Leitner box 1~6 (간격 반복 단계, v2: 1=오늘 2=내일 3=4일 4=8일 5=16일 6=32일)
  understoodNextReview: {},   // subtopic_id → next_review_at (KST DATETIME) — 다지기 due 그룹핑
  understoodMissCount: {},    // subtopic_id → miss_count (v2: 누적 펼친 횟수, 별표 표시용)
  understoodLastMovedAt: {},  // subtopic_id → last_moved_at (v2: 박스 이동 시각, 다지기 박스 안 정렬용)
  normalMode: 'new',          // v2: 'new' | 'star' | 'all' — 일반 모드 탭. 챕터 진입 시 'new' 기본
  memorizedBoxOpen: {1:true, 2:false, 3:false, 4:false, 5:false, 6:false}, // v2: 다지기 6박스 펼침 상태. 오늘만 기본 펼침
  todayStatsEntered: 0,       // v2: 오늘 박스에 들어온 누적 카드 (klika 분모)
  todayStatsCleared: 0,       // v2: 오늘 박스에서 내일 박스로 진급한 카드 (klika 분자)
  todayStatsDate: '',         // v2: KST 날짜 키 — 자정 지나면 자동 리셋
  passedSet: new Set(),       // 이번 회 패스한 학습 카드 (세션만 — 새로고침 시 복원)
  memorizedView: false,       // 챕터 내 암기 모음 모드 (꾹누른 학습 카드만 모아보기)
  memoSnapshotIds: new Set(), // 암기 모음 진입 시 보여줄 학습 카드 스냅샷 — 펼친 항목이 미암기로 분류돼도 이번 회는 그대로 보이게
  everExpandedSet: new Set(), // 이 챕터 진입 후 한 번이라도 펼쳐본 학습 카드 — 패스 시 자동 ●/미암기 판정에 사용. 챕터 나가면 초기화
  recentlyFailedFromMemo: new Set(), // 이번 챕터 진입 중 다지기에서 실패(펼침)해서 챕터 뷰로 돌아온 카드 — 챕터 뷰 정렬 시 맨 아래로
  peekedPassedSet: new Set(), // 펼친 뒤 패스해서 "틀린 단어"로 확정된 카드 — 챕터 뷰 정렬·색 구분용. 펼치는 순간이 아니라 패스 후에야 추가
  expanded: { topic: new Set(), subtopic: new Set() },
  liveCount: 0,
  pingTimer: null,
  liveTimer: null,
  interests: [],          // 사용자가 저장한 관심 주제 (subject 배열)
  interestFilterOn: false, // 홈 필터 ON/OFF — interests가 있으면 기본 ON
};

// ============================================================
// API
// ============================================================
async function api(method, path, body) {
  const token = localStorage.getItem(TOKEN_KEY);
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API + path, {
    method, headers,
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch (_) {}
  if (!res.ok) {
    const err = new Error((data && data.error) || `HTTP ${res.status}`);
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

// ============================================================
// 유틸
// ============================================================
function $(id) { return document.getElementById(id); }
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}
function toast(msg, isError) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'show' + (isError ? ' error' : '');
  setTimeout(() => t.className = '', 2400);
}
function showLoading(on) { $('loading').classList.toggle('show', !!on); }
function formatPhone(p) {
  p = String(p || '').replace(/\D/g, '');
  if (p.length === 11) return `${p.slice(0,3)}-${p.slice(3,7)}-${p.slice(7)}`;
  if (p.length === 10) return `${p.slice(0,3)}-${p.slice(3,6)}-${p.slice(6)}`;
  return p;
}
function daysLeft(iso) {
  if (!iso) return null;
  // 서버의 expires_at은 KST wall-clock을 UTC 표기로 저장한 값.
  // 클라이언트의 '지금'도 같은 KST 프레임으로 옮겨 비교해야 D-N이 정확함.
  const nowKstMs = Date.now() + KST_OFFSET_MS;
  const expMs = new Date(iso).getTime();
  const diff = Math.ceil((expMs - nowKstMs) / (1000 * 60 * 60 * 24));
  return diff;
}

// 서버가 보낸 KST-as-UTC ISO 문자열을 사람이 읽는 한국 시간 표기로 변환
function fmtKst(iso, opts) {
  if (!iso) return '';
  // KST-as-UTC: 문자열 그대로 Date로 파싱하면 9시간 뒤 UTC로 해석되므로
  // 9시간 빼서 실제 의도된 시점(KST wall-clock)으로 되돌린 뒤 Asia/Seoul로 포맷.
  const realUtcMs = new Date(iso).getTime() - KST_OFFSET_MS;
  const d = new Date(realUtcMs);
  return d.toLocaleString('ko-KR', Object.assign({
    timeZone: KST_TZ,
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit',
  }, opts || {}));
}
function fmtKstDate(iso) {
  return fmtKst(iso, { hour: undefined, minute: undefined });
}
// JSON 컬럼에서 base64가 문자열 따옴표로 한번 더 감싸여 올 수 있는 경우 처리
function unwrapImage(b) {
  if (!b) return '';
  if (typeof b === 'string' && b.startsWith('"') && b.endsWith('"')) {
    try { return JSON.parse(b); } catch {}
  }
  return b;
}

// ============================================================
// 워터마크 — 전화번호 SVG 패턴
// ============================================================
function renderWatermark() {
  const wm = $('watermark');
  if (!state.user || !state.user.phone) {
    wm.classList.remove('show');
    wm.innerHTML = '';
    return;
  }
  // 전화번호 뒤 5자리만 표시 — 식별 가능하면서 노출 최소화
  const digits = String(state.user.phone || '').replace(/\D/g, '');
  const text = digits.slice(-5);
  // SVG 패턴: 대각선 반복, 알파 더 옅게
  wm.innerHTML = `
    <svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
      <defs>
        <pattern id="wmPat" x="0" y="0" width="320" height="180" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
          <text x="0" y="80" fill="rgba(255,255,255,0.03)" font-size="22" font-weight="600" font-family="monospace">${escapeHtml(text)}</text>
          <text x="160" y="160" fill="rgba(255,255,255,0.03)" font-size="22" font-weight="600" font-family="monospace">${escapeHtml(text)}</text>
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#wmPat)"/>
    </svg>
  `;
  wm.classList.add('show');
}

// ============================================================
// 복사·우클릭 차단
// ============================================================
document.addEventListener('contextmenu', e => { if (state.user) e.preventDefault(); });
document.addEventListener('keydown', e => {
  if (!state.user) return;
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && ['c','a','s','p','u'].includes(k)) {
    // 입력 필드에서는 허용
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    e.preventDefault();
    if (k === 'p' || k === 's') toast('인쇄·저장은 차단됩니다', true);
  }
});

// ============================================================
// 인증 — 탭 전환 / 로그인 / 회원가입
// ============================================================
function switchTab(tab) {
  const isLogin = tab === 'login';
  $('tabLogin').classList.toggle('active', isLogin);
  $('tabSignup').classList.toggle('active', !isLogin);
  $('loginForm').style.display = isLogin ? 'block' : 'none';
  $('signupForm').style.display = isLogin ? 'none' : 'block';
}

async function doLogin() {
  const email = $('li_email').value.trim();
  const password = $('li_password').value;
  if (!email || !password) return showAuthErr('login', '이메일/비밀번호 입력');
  $('loginBtn').disabled = true;
  hideAuthErr();
  try {
    const r = await api('POST', '/auth/login', { email, password });

async function doSignup() {

// ============================================================
// UTM 어트리뷰션 — URL → localStorage (30일 유지)
// ============================================================
function captureUtmFromUrl() {
  try {
    const u = new URL(window.location.href);
    const utm = {
      source: u.searchParams.get('utm_source') || '',
      medium: u.searchParams.get('utm_medium') || '',
      campaign: u.searchParams.get('utm_campaign') || '',
      content: u.searchParams.get('utm_content') || '',
      term: u.searchParams.get('utm_term') || '',
      landing_url: window.location.href.slice(0, 500),
      referrer: (document.referrer || '').slice(0, 500),
      captured_at: Date.now(),
    };
    // 어트리뷰션 정보가 하나라도 있을 때만 저장
    if (utm.source || utm.medium || utm.campaign || utm.content || utm.term) {
      localStorage.setItem(UTM_KEY, JSON.stringify(utm));
    }
    // ?interest=수능,토익 또는 ?interest=수능&interest=토익 캡쳐
    const interestParams = u.searchParams.getAll('interest');
    const newInterests = [];
    for (const v of interestParams) {
      for (const s of String(v).split(',')) {
        const t = s.trim();
        if (t) newInterests.push(t);
      }
    }
    if (newInterests.length) {
      // 누적 — 이전 방문에서 캡쳐한 관심 주제와 합침 (Set으로 중복 제거)
      // ?interest=한자 방문 → ?interest=영어 방문 = localStorage에 [한자, 영어]
      const prev = loadPendingInterests();
      const merged = [...new Set([...prev, ...newInterests])].slice(0, 20);
      localStorage.setItem(INTERESTS_KEY, JSON.stringify({ interests: merged, at: Date.now() }));
    }
  } catch {}
}
function loadPendingInterests() {
  try {
    const raw = localStorage.getItem(INTERESTS_KEY);
    if (!raw) return [];
    const o = JSON.parse(raw);
    if (o.at && Date.now() - o.at > UTM_TTL_MS) {
      localStorage.removeItem(INTERESTS_KEY);
      return [];
    }
    return Array.isArray(o.interests) ? o.interests : [];
  } catch { return []; }
}
function loadUtm() {
  try {
    const raw = localStorage.getItem(UTM_KEY);
    if (!raw) return null;
    const utm = JSON.parse(raw);
    if (utm.captured_at && Date.now() - utm.captured_at > UTM_TTL_MS) {
      localStorage.removeItem(UTM_KEY);
      return null;
    }
    return utm;
  } catch { return null; }
}

async function tryAutoLogin() {
  // ?ref=CODE URL 캡쳐
  try {
    const u = new URL(window.location.href);
    const ref = u.searchParams.get('ref');
    if (ref) localStorage.setItem(REF_KEY, ref);
  } catch {}
  // UTM 어트리뷰션 캡쳐 (가입 시 함께 전송)

    checkRefCode(saved);

  }
}

async function loadMeAndEnter() {
  showLoading(true);
  try {
    const r = await api('GET', '/auth/me');
    state.user = r.user;
    state.point = Number(r.user.point) || 0;
    state.chapterAccess = r.chapter_access || {};
    state.interests = Array.isArray(r.user.interests) ? r.user.interests : [];
    // 필터 ON/OFF: localStorage에 저장한 값이 있으면 그대로, 없으면 interests 있을 때 기본 ON
    const savedToggle = localStorage.getItem(INTEREST_FILTER_KEY + '_' + (r.user.phone || ''));
    if (savedToggle === '1') state.interestFilterOn = state.interests.length > 0;
    else if (savedToggle === '0') state.interestFilterOn = false;

    showLoading(false);

function renderHome() {

  $('homePoint').textContent = state.point.toLocaleString();

  const cards = $('chapterCards');
  if (!state.chapters.length) {
    cards.innerHTML = '<div class="empty-state">아직 공개된 챕터가 없습니다.</div>';
    return;
  }

  // 관심 주제 필터 (ON이고 interests 있을 때만 적용)
  let visibleChapters = state.chapters;
  if (state.interestFilterOn && state.interests.length > 0) {
    visibleChapters = state.chapters.filter(c =>
      state.interests.includes(c.subject || '기타')
    );
  }
  if (!visibleChapters.length) {
    cards.innerHTML = `
      <div class="empty-state">
        선택한 관심 주제에 해당하는 챕터가 없습니다.<br>
        <button onclick="openInterestModal()" style="margin-top:10px;background:rgba(233,69,96,0.2);border:1px solid rgba(233,69,96,0.5);color:#ff8a9e;padding:8px 18px;border-radius:50px;cursor:pointer;font-size:13px;">🎯 관심 주제 편집</button>
      </div>`;
    return;
  }

  // 과목별 그룹핑
  const groups = {};
  for (const c of visibleChapters) {
    const s = c.subject || '기타';
    if (!groups[s]) groups[s] = [];
    groups[s].push(c);
  }
  // 그룹 안 정렬: 구독 중 → 학습 진행 있음 → 구매 이력(만료) → 그 외
  // (같은 우선순위 안에서는 원래 순서 유지 — JS sort는 안정 정렬)
  for (const subj in groups) {
    groups[subj].sort((a, b) => chapterPriority(a) - chapterPriority(b));
  }
  let html = '';
  for (const subj of Object.keys(groups).sort()) {
    html += `<div class="subject-section">
      <div class="subject-title">${escapeHtml(subj).toUpperCase()}</div>
      <div class="chapter-cards">
        ${groups[subj].map(c => renderChapterCard(c)).join('')}
      </div>
    </div>`;
  }
  cards.innerHTML = html;
}

// 홈 화면 카드 정렬 우선순위 — 작을수록 위
// 0: 구독 활성 (D-N 보이는 챕터)
// 1: 학습 진행 있음 (passedSet localStorage 비어있지 않음 — 무료/만료/미구매 막론)
// 2: 구매 이력 있음 (만료)
// 3: 그 외 (미구매 + 진행 없음)
function chapterPriority(c) {
  const access = state.chapterAccess[c.id];
  const dLeft = access ? daysLeft(access.expires_at) : null;
  const isPaidActive = dLeft != null && dLeft > 0;
  if (isPaidActive) return 0;
  try {
    const raw = localStorage.getItem('op_passed_' + c.id);
    if (raw) {
      const arr = JSON.parse(raw);
      if (Array.isArray(arr) && arr.length > 0) return 1;
    }
  } catch {}
  if (access) return 2;
  return 3;
}

function renderChapterCard(c) {
  const isTeacher = state.user && state.user.role === 'teacher';
  const access = state.chapterAccess[c.id];
  const dLeft = access ? daysLeft(access.expires_at) : null;
  const isAllFree = Number(c.is_all_free) === 1;
  const isPaidActive = !isTeacher && !isAllFree && dLeft != null && dLeft > 0;
  const isActive = isTeacher || isAllFree || isPaidActive;

  // 우측 상단 코너 배지 — 유료 활성 챕터의 남은 기간 (만료 KST 시각 tooltip)
  let cornerBadge = '';
  if (isPaidActive) {
    const expTip = `만료: ${fmtKst(access.expires_at)} (KST)`;
    cornerBadge = `<span class="ch-corner-badge" title="${escapeHtml(expTip)}">D-${dLeft}</span>`;
  }

  // 카드 본문의 인라인 상태 (D-N은 코너에 있으니 생략)
  let statusBadge = '', statusClass = '';
  if (isTeacher) { statusBadge = '🛠 관리자'; statusClass = 'free'; }
  else if (isAllFree) { statusBadge = '✨ 무료'; statusClass = 'free'; }
  else if (isPaidActive) { statusBadge = ''; }
  else if (access) { statusBadge = '만료됨'; statusClass = 'expired'; }
  else { statusBadge = '미구매'; statusClass = 'never'; }

  const price = Number(c.monthly_price) || 3000;
  const canRedeem = state.point >= REDEEM_COST;

  // 미구매 챕터도 카드 클릭으로 진입 → 무료 목차는 열람, 유료 목차는 🔒
  let actions;
  if (isActive) {
    actions = `<button class="primary" onclick="event.stopPropagation();enterChapter(${c.id})">열기 →</button>`;
  } else {
    actions = `
      <button onclick="event.stopPropagation();enterChapter(${c.id})">무료 보기 →</button>
      <button onclick="event.stopPropagation();openPayModal(${c.id})">${price.toLocaleString()}원 결제</button>
      <button onclick="event.stopPropagation();confirmRedeem(${c.id})" ${canRedeem ? '' : 'disabled'}>${REDEEM_COST}P 사용</button>
    `;
  }

  return `
    <div class="chapter-card ${access && !isActive && !isTeacher ? 'expired' : ''}" onclick="enterChapter(${c.id})">
      ${cornerBadge}
      <div class="ch-icon">${escapeHtml(c.icon || '📘')}</div>
      <div class="ch-title">${escapeHtml(c.title)}</div>
      <div class="ch-desc">${escapeHtml(c.description || '')}</div>
      ${statusBadge ? `<span class="ch-status ${statusClass}">${statusBadge}</span>` : ''}
      <div class="ch-actions">${actions}</div>
    </div>
  `;
}

async function enterChapter(chapterId) {

  if (!state.currentChapter) return;
  loadPassed(chapterId);  // 저장된 패스 위치 복원 (마지막 학습 위치)
  // 챕터 진입 시 정상 모드로 시작
  state.memorizedView = false;
  state.memoSnapshotIds = new Set();
  state.everExpandedSet = new Set();   // 펼침 이력 초기화 — 챕터 단위로 유지
  state.recentlyFailedFromMemo = new Set();  // 다지기 실패 → 챕터 뷰 복귀 표시 초기화
  state.peekedPassedSet = new Set();   // 펼친 뒤 패스 = "틀린 단어" 표시 초기화
  state.normalMode = 'new';            // 챕터 진입 시 new 탭 기본
  state.memorizedBoxOpen = {1:true, 2:false, 3:false, 4:false, 5:false, 6:false}; // 다지기 박스 펼침 초기화
  loadTodayStats(chapterId);
  refreshModeTabsUI();
  const memoBtn = $('memorizedBtn');
  if (memoBtn) memoBtn.classList.remove('active');
  updateLiveChips(); // 캐시된 라이브 카운트 즉시 반영 (다음 폴링 기다리지 않음)
  $('homeScreen').style.display = 'none';
  $('chapterScreen').style.display = 'block';
  window.scrollTo(0, 0);

  const c = state.currentChapter;
  $('chSubj').textContent = c.subject || '';
  $('chName').textContent = c.title || '';

  const isTeacher = state.user && state.user.role === 'teacher';
  const access = state.chapterAccess[chapterId];
  const dLeft = access ? daysLeft(access.expires_at) : null;
  const isAllFree = Number(c.is_all_free) === 1;
  if (isTeacher) $('chStatus').textContent = '🛠 관리자';
  else if (isAllFree) $('chStatus').textContent = '✨ 무료';
  else if (dLeft != null && dLeft > 0) $('chStatus').textContent = `D-${dLeft}`;
  else $('chStatus').textContent = '미구독';

  $('chMeta').innerHTML = isTeacher
    ? '<span style="color:#ffd54f">관리자 — 모든 챕터 무제한 열람</span>'
    : (isAllFree
        ? '<span style="color:#81c784">전체 무료 공개</span>'
        : (dLeft != null && dLeft > 0
            ? `남은 기간 ${dLeft}일 <span style="color:rgba(255,255,255,0.5);font-size:12px;">(만료: ${fmtKstDate(access.expires_at)} KST)</span>`
            : `<button class="icon-btn" onclick="openPayModal(${chapterId})">구독으로 전체 보기 →</button>`));

  $('chapterTree').innerHTML = '<div class="empty-state">로딩 중…</div>';
  await loadTopics(chapterId);
  renderTree(chapterId);
}

async function loadTopics(chapterId) {

async function loadSubtopics(topicId) {

async function loadItems(subtopicId) {
  return ensureItems(subtopicId, false);
}

// 같은 학습 카드의 동시 중복 fetch 방지 + prefetch 일 때는 강제 리렌더 안 함
const _itemsLoading = new Map();   // subtopicId → Promise
async function ensureItems(subId, isPrefetch) {
  const existing = state.itemsBySubtopic[subId];
  if (existing !== undefined) return existing;
  if (_itemsLoading.has(subId)) return _itemsLoading.get(subId);

  const p = (async () => {
    try {
      const r = await api('GET', '/items?subtopic_id=' + subId);
      state.itemsBySubtopic[subId] = r.items || [];
    } catch (e) {
      if (e.status === 402) {
        state.itemsBySubtopic[subId] = { locked: true, chapter_id: e.data?.chapter_id };
      } else if (e.status === 404) {
        // 학습 카드가 삭제됨 — 자동 새로고침 (포그라운드 클릭일 때만)
        if (!isPrefetch && state.expanded.subtopic.has(Number(subId))) {
          toast('콘텐츠가 변경되었습니다. 새로고침합니다.');
          refreshChapter();
        }
        return;
      } else if (e.status !== 401) {
        state.itemsBySubtopic[subId] = { error: e.message };
      } else {
        return;
      }
    } finally {
      _itemsLoading.delete(subId);
    }
    // 현재 펼쳐진 학습 카드일 때만 리렌더 (백그라운드 prefetch는 조용히)
    if (!isPrefetch || state.expanded.subtopic.has(Number(subId))) {
      if (state.currentChapter) renderTree(state.currentChapter.id);
    }
  })();
  _itemsLoading.set(subId, p);
  return p;
}

// 펼친 목차들의 모든 학습 카드 items를 백그라운드로 미리 가져오기
function prefetchOpenTopics() {
  if (!state.currentChapter) return;
  const topics = state.topicsByChapter[state.currentChapter.id] || [];
  for (const t of topics) {
    if (!state.expanded.topic.has(t.id)) continue;
    const subs = state.subtopicsByTopic[t.id] || [];
    for (const s of subs) ensureItems(s.id, true);
  }
}

function renderTree(chapterId) {
  const topics = state.topicsByChapter[chapterId] || [];
  const c = state.currentChapter;
  const isTeacher = state.user && state.user.role === 'teacher';
  const access = state.chapterAccess[chapterId];
  const dLeft = access ? daysLeft(access.expires_at) : null;
  const hasAccess = isTeacher || Number(c.is_all_free) === 1 || (dLeft != null && dLeft > 0);

  // 암기 모음 모드 — 챕터 전체에서 understood인 학습 카드만 평면 리스트로
  if (state.memorizedView) {
    $('chapterTree').innerHTML = renderMemorizedView(chapterId, hasAccess);
    return;
  }

  if (!topics.length) {
    $('chapterTree').innerHTML = '<div class="empty-state">아직 콘텐츠가 없습니다.</div>';
    return;
  }
  $('chapterTree').innerHTML = topics.map(t => renderTopic(t, hasAccess)).join('');
}

// 다지기 모드 v2 — 6박스 (오늘/내일/4/8/16/32일) + 오늘 클리어율 진행바
// 카드의 효과적 박스 = next_review_at 가 이미 due면 box=1 로 자동 승급, 아니면 review_box
function effectiveBox(subId) {
  const days = dueDaysLeft(state.understoodNextReview[Number(subId)]);
  if (days <= 0) return 1; // overdue/due = 오늘 학습
  return Math.min(Math.max(Number(state.understoodBox[Number(subId)]) || 1, 1), 6);
}

const SRS_BOX_META = [
  null,
  { label: '오늘 학습',  tier: 'today',  defaultOpen: true  },
  { label: '내일 학습',  tier: 'tomo',   defaultOpen: false },
  { label: '4일 후',     tier: 'd4',     defaultOpen: false },
  { label: '8일 후',     tier: 'd8',     defaultOpen: false },
  { label: '16일 후',    tier: 'd16',    defaultOpen: false },
  { label: '32일 후',    tier: 'd32',    defaultOpen: false },
];

function renderMemorizedView(chapterId, hasAccess) {
  // 통계 베이스라인 갱신 (데이터 로드 늦었거나 자정 지난 경우)
  ensureTodayStatsCurrent(chapterId);
  const topics = state.topicsByChapter[chapterId] || [];

  // 스냅샷 안 카드들을 효과 박스(1~6)로 그룹화
  const byBox = {1:[], 2:[], 3:[], 4:[], 5:[], 6:[]};
  for (const t of topics) {
    const subs = state.subtopicsByTopic[t.id] || [];
    for (const s of subs) {
      if (!state.memoSnapshotIds.has(Number(s.id))) continue;
      const box = effectiveBox(s.id);
      byBox[box].push(s);
    }
  }

  // 박스 안 정렬 — last_moved_at 오름차순(오래 기다린 카드 먼저), 동률이면 sort_order
  const innerSort = (a, b) => {
    const la = state.understoodLastMovedAt[Number(a.id)] || '';
    const lb = state.understoodLastMovedAt[Number(b.id)] || '';
    if (la !== lb) return la.localeCompare(lb);
    return (Number(a.sort_order) || 0) - (Number(b.sort_order) || 0);
  };
  for (let i=1; i<=6; i++) byBox[i].sort(innerSort);

  const totalCards = Object.values(byBox).reduce((sum, arr) => sum + arr.length, 0);
  if (totalCards === 0) {
    return `
      <div class="memo-empty">
        <div class="memo-icon">●</div>
        <div>아직 다지기 카드가 없습니다.</div>
        <div class="memo-hint">일반 모드에서 패스하면 여기로 모입니다.</div>
      </div>
    `;
  }

  // 오늘 클리어율 — 분모: 오늘 박스 들어온 누적 / 분자: 오늘→내일 진급 카드
  const entered = state.todayStatsEntered || 0;
  const cleared = state.todayStatsCleared || 0;
  const pct = entered > 0 ? Math.round((cleared / entered) * 100) : 0;
  const clearBar = `
    <div class="srs-clear">
      <div class="srs-clear-head">
        <span>📊 오늘 암기 클리어율</span>
        <span class="srs-clear-num">${cleared} / ${entered}</span>
      </div>
      <div class="srs-clear-bar"><div class="srs-clear-fill" style="width:${Math.min(100, pct)}%"></div></div>
      <div class="srs-clear-foot">${pct}% — 반 절 이상 학습이 목표</div>
    </div>
  `;

  // 박스별 렌더
  let topIdx = 0;
  const boxBlocks = [];
  for (let b = 1; b <= 6; b++) {
    const cards = byBox[b];
    const meta = SRS_BOX_META[b];
    const isOpen = !!state.memorizedBoxOpen[b];
    const totalInBox = cards.length;
    const visibleCards = cards.filter(s => !state.passedSet.has(Number(s.id)));

    // 오늘 학습 박스는 항상 표시 (사용자 진행 상태 확인). 다른 박스는 비어 있으면 숨김.
    if (totalInBox === 0 && b !== 1) continue;

    // 모두 패스됐는데 박스 안 카드가 남아있으면 → 패스 자동 리셋 (다시 처음으로)
    if (visibleCards.length === 0 && totalInBox > 0) {
      for (const s of cards) state.passedSet.delete(Number(s.id));
      savePassed();
      visibleCards.push(...cards);
    }

    // 펼침 상태일 때만 카드 HTML 생성
    let cardsHtml = '';
    if (isOpen) {
      cardsHtml = visibleCards.map((s) => {
        const isTop = (b === 1 && topIdx === 0);
        if (isTop) topIdx++;
        return renderSubtopic(s, isTop);
      }).join('');
    }

    // 박스 패스 버튼은 첫 visible 카드를 패스 대상으로
    const passTarget = visibleCards[0] ? visibleCards[0].id : null;
    const passBtnHtml = passTarget != null
      ? `<button class="srs-box-pass" onclick="event.stopPropagation();memorizedPass(${passTarget})" title="박스 첫 카드 패스">⤴ 패스</button>`
      : '';

    boxBlocks.push(`
      <div class="srs-box srs-box-${meta.tier}${isOpen ? ' opened' : ''}">
        <div class="srs-box-head" onclick="toggleSrsBox(${b})">
          <span class="srs-box-arrow">${isOpen ? '▼' : '▶'}</span>
          <span class="srs-box-name">${meta.label}</span>
          <span class="srs-box-count">${visibleCards.length}</span>
          ${passBtnHtml}
        </div>
        <div class="srs-box-body">${cardsHtml}</div>
      </div>
    `);
  }

  return clearBar + boxBlocks.join('');
}

// 다지기 박스 펼침 토글
function toggleSrsBox(box) {
  const b = Number(box);
  state.memorizedBoxOpen[b] = !state.memorizedBoxOpen[b];
  if (state.currentChapter) renderTree(state.currentChapter.id);
}

function rebuildMemoSnapshot() {
  state.memoSnapshotIds = new Set();
  const cid = state.currentChapter && state.currentChapter.id;
  if (!cid) return;
  const topics = state.topicsByChapter[cid] || [];
  for (const t of topics) {
    const subs = state.subtopicsByTopic[t.id] || [];
    for (const s of subs) {
      if (state.understoodSet.has(Number(s.id))) state.memoSnapshotIds.add(Number(s.id));
    }
  }
}

// 암기 모음 스냅샷의 모든 items 백그라운드 프리페치 → 펼침 시 즉각 표시
function prefetchMemoSnapshot() {
  for (const subId of state.memoSnapshotIds) {
    ensureItems(subId, true);
  }
}

function toggleMemorizedView() {
  state.memorizedView = !state.memorizedView;
  // 모드 전환 시 펼친 학습 카드 닫기 (혼선 방지)
  state.expanded.subtopic.clear();
  const btn = $('memorizedBtn');
  if (btn) btn.classList.toggle('active', state.memorizedView);
  // ON으로 전환 → 현재 암기된 것들을 스냅샷에 고정 + items 미리 받기
  if (state.memorizedView) {
    rebuildMemoSnapshot();
    prefetchMemoSnapshot();
    // 박스 펼침 기본 상태 (오늘만 펼침) — 매 진입 시 리셋
    state.memorizedBoxOpen = {1:true, 2:false, 3:false, 4:false, 5:false, 6:false};
    // 오늘 통계 KST 자정 지났을 수 있으니 다시 로드 (자동 리셋 포함)
    if (state.currentChapter) loadTodayStats(state.currentChapter.id);
  } else {
    state.memoSnapshotIds = new Set();
    // 다지기 → 챕터 모드 복귀 시: 학습하던 모든 목차 닫음 → 목차 화면으로
    state.expanded.topic.clear();
  }
  refreshModeTabsUI();
  if (state.currentChapter) renderTree(state.currentChapter.id);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// 암기 모음 모드의 패스 — 현재 항목을 이번 회에서 제외
function memorizedPass(subId) {
  // v2 다지기 패스 — was_peeked 판정 (이 챕터 안에서 펼친 적 있는지)
  const sid = Number(subId);
  const wasPeeked = state.everExpandedSet.has(sid);

  // 낙관적 박스/통계 갱신 — UI 즉시 반영, 서버 응답은 백그라운드
  if (state.understoodSet.has(sid)) {
    const cur = Number(state.understoodBox[sid]) || 1;
    let nxt = cur;
    if (wasPeeked) {
      // 펼친 뒤 패스 → box=1 강등
      nxt = 1;
    } else if (cur === 1) {
      // 오늘 박스 + 안 펼침 → advance
      nxt = Math.min(cur + 1, 6);
    }
    // 미래 박스 + 안 펼침 → 변경 없음
    if (nxt !== cur) {
      state.understoodBox[sid] = nxt;
      bumpTodayStats(cur, nxt);
      // next_review_at 도 낙관적 계산
      const BOX_DUE_DAYS = [null, 0, 1, 4, 8, 16, 32];
      const days = BOX_DUE_DAYS[nxt] || 0;
      const due = new Date(Date.now() + 9*3600*1000 + days*86400*1000);
      state.understoodNextReview[sid] = due.toISOString().slice(0, 19).replace('T', ' ');
    }
  }
  // 서버 동기화 (백그라운드, 통계는 이미 낙관적 처리됨 — apiPass 중복 호출 X)
  api('POST', '/understood/pass', { subtopic_id: sid, was_peeked: wasPeeked }).catch(() => {});

  state.passedSet.add(sid);
  state.expanded.subtopic.delete(sid);
  savePassed();

  // 모두 검토 끝났는지 확인
  const cid = state.currentChapter && state.currentChapter.id;
  if (!cid) return;
  const topics = state.topicsByChapter[cid] || [];
  const remaining = [];
  for (const t of topics) {
    const subs = state.subtopicsByTopic[t.id] || [];
    for (const s of subs) {
      if (state.memoSnapshotIds.has(Number(s.id)) && !state.passedSet.has(Number(s.id))) remaining.push(s);
    }
  }

  if (remaining.length === 0) {
    showCelebration();
    setTimeout(() => {
      // 암기 모음 내 패스만 정리 (정상 모드의 다른 챕터 패스는 건드리지 않음)
      for (const t of topics) {
        const subs = state.subtopicsByTopic[t.id] || [];
        for (const s of subs) {
          if (state.memoSnapshotIds.has(Number(s.id))) state.passedSet.delete(Number(s.id));
        }
      }
      savePassed();
      // 미암기로 분류된 학습 카드는 다음 회 스냅샷에서 빠짐 + 새 스냅샷 items 프리페치
      rebuildMemoSnapshot();
      prefetchMemoSnapshot();
      if (state.memorizedView && state.currentChapter) renderTree(state.currentChapter.id);
    }, 2200);
    return;
  }

  if (state.currentChapter) renderTree(state.currentChapter.id);
}

function renderTopic(t, hasAccess) {
  const isFree = Number(t.is_free) === 1;
  const locked = !isFree && !hasAccess;
  const opened = state.expanded.topic.has(t.id);
  const cls = 'topic-card' + (opened ? ' opened' : '') + (locked ? ' locked' : '');

  let body = '';
  let topSubId = null;          // 학습 대상 (맨 위 미학습 = 주황)
  let hasPassed = false;        // 이 토픽에 패스된 게 있나
  if (opened) {
    if (locked) {
      body = `
        <div class="locked-banner">
          <h4>🔒 구독 후 볼 수 있는 내용입니다</h4>
          <p>이 챕터를 결제하거나, 보유 포인트로 1개월 무료 연장하세요.</p>
          <button onclick="event.stopPropagation();openPayModal(${state.currentChapter.id})">구독하기 →</button>
        </div>
      `;
    } else {
      const subs = state.subtopicsByTopic[t.id];
      if (subs === undefined) {
        loadSubtopics(t.id);
        body = '<div class="empty-state">학습 카드 로딩…</div>';
      } else if (!subs.length) {
        body = '<div class="empty-state">학습 카드 없음</div>';
      } else {
        // v2 일반 모드 — new / star / all 탭에 따라 다르게 렌더링
        let pool;
        if (state.normalMode === 'new') {
          // new: 아직 학습 안 한 카드만 (op_understood 행 없음 = understoodSet 미포함)
          pool = subs.filter(s => !state.understoodSet.has(Number(s.id)));
        } else if (state.normalMode === 'star') {
          // 별표: miss_count > 0 인 카드, 별표(miss) 많은 순
          pool = subs.filter(s => (state.understoodMissCount[Number(s.id)] || 0) > 0);
        } else {
          // all: 모든 카드, 원순 (sort_order)
          pool = subs.slice();
        }

        if (pool.length === 0) {
          const emptyMsg = state.normalMode === 'new'
            ? '이 목차의 모든 카드가 학습 시작됨 — <strong>★ 별표</strong> 또는 <strong>all</strong> 탭에서 확인'
            : state.normalMode === 'star'
            ? '아직 틀린 카드 없음'
            : '카드 없음';
          body = `<div class="empty-state" style="padding:18px 14px;text-align:center;font-size:13px;color:rgba(255,255,255,0.55);">${emptyMsg}</div>`;
          topSubId = null;
        } else {
          const allPassed = pool.every(s => state.passedSet.has(Number(s.id)));
          if (allPassed) {
            for (const s of pool) state.passedSet.delete(Number(s.id));
            savePassed();
          }
          hasPassed = pool.some(s => state.passedSet.has(Number(s.id)));
          const visible = pool.filter(s => !state.passedSet.has(Number(s.id)));

          let sortedSubs;
          if (state.normalMode === 'star') {
            sortedSubs = [...visible].sort((a, b) => {
              const ma = state.understoodMissCount[Number(a.id)] || 0;
              const mb = state.understoodMissCount[Number(b.id)] || 0;
              if (ma !== mb) return mb - ma; // miss 많은 순
              return (Number(a.sort_order) || 0) - (Number(b.sort_order) || 0);
            });
          } else {
            // new 또는 all: sort_order 순
            sortedSubs = [...visible].sort((a, b) =>
              (Number(a.sort_order) || 0) - (Number(b.sort_order) || 0)
            );
          }

          const target = sortedSubs[0];
          topSubId = target ? Number(target.id) : null;
          body = sortedSubs.map(s => renderSubtopic(s, Number(s.id) === topSubId)).join('');
        }
        // 일반 모드 — 학습 카드 위에 3탭 (다지기 ON일 땐 안 보임)
        if (!state.memorizedView) {
          body = renderModeTabs() + body;
        }
      }
    }
  }

  // 학습 컨트롤 — 큰 패스 버튼 1개 (펼친 상태 + 접근권 있을 때)
  // 펼침은 학습 카드 직접 클릭, 완료/다시는 꾹누르기로 처리되므로 버튼은 패스만
  let studyBtns = '';
  if (opened && !locked) {
    const hasTop = topSubId != null;
    studyBtns = hasTop ? `
      <div class="study-controls">
        <button class="study-btn skip-big" onclick="event.stopPropagation();studyPass(${topSubId},${t.id})" title="맨 위 항목 패스 — 이 챕터에서 펼친 적 있으면 미암기, 없으면 ● 자동">⤴ 패스</button>
      </div>` : '';
  }

  // 목차별 암기 진도 — understoodSet 기준 비율
  const subsAll = state.subtopicsByTopic[t.id] || [];
  const total = subsAll.length || Number(t.subtopic_count) || 0;
  const learned = subsAll.filter(s => state.understoodSet.has(Number(s.id))).length;
  const pct = total ? Math.round(learned / total * 100) : 0;
  const doneCls = (total > 0 && learned === total) ? ' done' : '';
  const progress = `
    <div class="topic-progress" title="암기 ${learned}/${total} (${pct}%)">
      <div class="topic-progress-fill${doneCls}" style="width:${pct}%"></div>
      <div class="topic-progress-text">${learned}/${total}</div>
    </div>
  `;

  return `
    <div class="${cls}" data-topic="${t.id}">
      <div class="topic-head" onclick="toggleTopic(${t.id})">
        <div class="topic-arrow">▶</div>
        <div class="topic-title">${escapeHtml(t.title)}${isFree ? '<span class="free-tag">✨무료</span>' : (locked ? '<span class="lock-icon">🔒</span>' : '')}</div>
        ${progress}
        ${studyBtns}
      </div>
      <div class="topic-body">${body}</div>
    </div>
  `;
}

function renderSubtopic(s, isCurrent) {
  const opened = state.expanded.subtopic.has(s.id);
  // 암기 모음 모드: 스냅샷 기준으로 understood 처리 → 펼친 직후 깜빡임(초록 → 기본) 방지
  const understood = state.memorizedView
    ? state.memoSnapshotIds.has(Number(s.id))
    : state.understoodSet.has(Number(s.id));
  // 정상 모드: understood면 current 강조 안 함 (이미 학습 완료)
  // 암기 모음 모드: understood여도 맨 위 항목은 current로 강조 (학습 대상)
  const showCurrent = isCurrent && (state.memorizedView || !understood);
  // 다지기에서 실패해 챕터 뷰로 돌아온 카드 — ↺ 표시 (정상 모드만)
  const failedFromMemo = !state.memorizedView && state.recentlyFailedFromMemo.has(Number(s.id));
  // 챕터에서 펼친 뒤 패스해 "틀린 단어"로 확정된 카드 — 색 다름 (다지기 복귀 카드와 별도)
  // 펼치는 순간이 아니라 패스 후에야 색 변경 → state.peekedPassedSet 기준
  const peeked = !state.memorizedView && !understood && !failedFromMemo
              && state.peekedPassedSet.has(Number(s.id));
  const cls = 'subtopic'
    + (opened ? ' opened' : '')
    + (understood ? ' understood' : '')
    + (showCurrent ? ' current' : '')
    + (failedFromMemo ? ' failed-from-memo' : '')
    + (peeked ? ' peeked' : '');
  const hasImg = !!s.image_b64;

  // 항상 보이는 미리보기 (제목 아래)
  const preview = hasImg ? `
    <div class="subtopic-preview"
         onclick="subClick(event,${s.id})"
         onmousedown="pressStart(${s.id})"
         onmouseup="pressEnd()"
         onmouseleave="pressEnd()"
         ontouchstart="pressStart(${s.id})"
         ontouchend="pressEnd()"
         ontouchcancel="pressEnd()">
      <img src="${escapeHtml(s.image_b64)}" alt="" oncontextmenu="return false">
      ${s.caption ? `<div class="cap">${escapeHtml(s.caption)}</div>` : ''}
    </div>
  ` : '';

  // 펼침 시 본문 (items만)
  let body = '';
  if (opened) {
    const items = state.itemsBySubtopic[s.id];
    if (items === undefined) {
      loadItems(s.id);
      body = '<div class="empty-state">로딩…</div>';
    } else if (items.locked) {
      body = `
        <div class="locked-banner">
          <h4>🔒 구독 후 볼 수 있습니다</h4>
          <button onclick="event.stopPropagation();openPayModal(${items.chapter_id})">구독하기 →</button>
        </div>`;
    } else if (items.error) {
      body = `<div class="empty-state">오류: ${escapeHtml(items.error)}</div>`;
    } else if (!items.length) {
      body = '<div class="empty-state">아직 내용이 없습니다.</div>';
    } else {
      body = items.map(it => renderItem(it)).join('');
    }
  }

  return `
    <div class="${cls}" data-sub="${s.id}">
      <div class="subtopic-head"
           onclick="subClick(event,${s.id})"
           onmousedown="pressStart(${s.id})"
           onmouseup="pressEnd()"
           onmouseleave="pressEnd()"
           ontouchstart="pressStart(${s.id})"
           ontouchend="pressEnd()"
           ontouchcancel="pressEnd()">
        <div class="subtopic-dot"></div>
        <div class="subtopic-arrow">▶</div>
        ${failedFromMemo ? `<span class="failed-memo-badge" title="다지기에서 다시 보고 싶다고 한 카드">↺</span>` : ''}
        <div class="subtopic-title">${escapeHtml(s.title)}</div>
        ${(/[a-zA-Z]/.test(s.title || '') && !/[가-힯ᄀ-ᇿ㄰-㆏]/.test(s.title || '')) ? `
        <button class="speak-btn"
                onclick="event.stopPropagation();speakText(${JSON.stringify(s.title).replace(/"/g, '&quot;')})"
                onmousedown="event.stopPropagation()"
                ontouchstart="event.stopPropagation()"
                title="발음 듣기">🔊</button>` : ''}
        <div class="subtopic-hint">${opened ? '꾹눌러 ●' : ''}</div>
      </div>
      ${preview}
      <div class="subtopic-body">${body}</div>
    </div>
  `;
}

// ── 발음 재생 (Web Speech API) ─────────────────────────────
// 라틴 문자가 하나라도 있으면 영어로 간주, 아니면 한국어
function detectSpeechLang(text) {
  return /[a-zA-Z]/.test(String(text || '')) ? 'en-US' : 'ko-KR';
}
function speakText(text) {
  if (!('speechSynthesis' in window)) {
    toast('이 브라우저는 음성 재생을 지원하지 않습니다.', true);
    return;
  }
  const t = String(text || '').trim();
  if (!t) return;
  // 진행 중인 발음 중단 → 연속 클릭에도 깔끔하게
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = detectSpeechLang(t);
  u.rate = 0.85;   // 살짝 천천히 — 학습용
  u.pitch = 1.0;
  window.speechSynthesis.speak(u);
}
window.speakText = speakText;

// YouTube URL에서 videoId 추출 — 링크 카드 썸네일용 (embed는 YouTube 정책상 안 함)
function getYouTubeId(url) {
  const patterns = [
    /[?&]v=([a-zA-Z0-9_-]{11})/,
    /youtu\.be\/([a-zA-Z0-9_-]{11})/,
    /youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/,
    /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/,
  ];
  for (const p of patterns) {
    const m = String(url || '').match(p);
    if (m) return m[1];
  }
  return null;
}

// Gumlet 동영상 — iframe embed 허용. URL을 embed 형식으로 정규화.
function getGumletEmbedUrl(url) {
  const s = String(url || '');
  // play.gumlet.io/embed/ID 또는 play.gumlet.io/ID (둘 다 embed로 변환)
  const m = s.match(/play\.gumlet\.io\/(?:embed\/)?([a-zA-Z0-9_-]+)/);
  if (!m) return null;
  return `https://play.gumlet.io/embed/${m[1]}`;
}
// URL에 프로토콜이 없으면 https:// 자동 추가 → 클릭 시 상대 경로로 잘못 가는 것 방지
function normalizeUrl(url) {
  const s = String(url || '').trim();
  if (!s) return '';
  if (/^https?:\/\//i.test(s)) return s;
  if (s.startsWith('//')) return 'https:' + s;
  return 'https://' + s;
}
// 텍스트 안의 URL(http(s)://… 또는 www.…)을 자동으로 클릭 가능한 <a>로 변환
// 텍스트 그대로 박혀있어도 링크가 동작하게 — kind='text' 아이템에도 적용됨
function autolinkText(text) {
  const s = String(text || '');
  const urlRegex = /(https?:\/\/[^\s<>"]+|www\.[^\s<>"]+)/g;
  let result = '';
  let lastIndex = 0;
  let m;
  while ((m = urlRegex.exec(s)) !== null) {
    result += escapeHtml(s.slice(lastIndex, m.index));
    const url = m[0];
    const href = /^https?:\/\//i.test(url) ? url : 'https://' + url;
    result += `<a href="${escapeHtml(href)}" target="_blank" rel="noopener" class="inline-link">${escapeHtml(url)}</a>`;
    lastIndex = m.index + url.length;
  }
  result += escapeHtml(s.slice(lastIndex));
  return result;
}

function renderItem(it) {
  if (it.kind === 'image') {
    const url = unwrapImage(it.image_b64);
    return `
      <div class="item">
        <img class="item-image" src="${escapeHtml(url)}" alt="" oncontextmenu="return false">
        ${it.caption ? `<div class="item-caption">${escapeHtml(it.caption)}</div>` : ''}
      </div>
    `;
  }
  if (it.kind === 'link') {
    const rawUrl = it.text || '';
    const url = normalizeUrl(rawUrl); // http(s):// 없으면 자동 추가
    // Gumlet만 iframe embed (YouTube는 정책상 링크로)
    const gumletUrl = getGumletEmbedUrl(url);
    if (gumletUrl) {
      return `
        <div class="item">
          <div class="video-embed">
            <iframe src="${gumletUrl}" frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen></iframe>
          </div>
          ${it.caption ? `<div class="item-caption">${escapeHtml(it.caption)}</div>` : ''}
        </div>
      `;
    }
    // YouTube → 링크 카드 + 썸네일
    const ytId = getYouTubeId(url);
    if (ytId) {
      return `
        <div class="item">
          <a href="${escapeHtml(url)}" target="_blank" rel="noopener" class="link-card link-card-yt">
            <img class="link-thumb" src="https://img.youtube.com/vi/${ytId}/mqdefault.jpg" alt="">
            <div class="link-body">
              <div class="link-title">${escapeHtml(it.caption || 'YouTube에서 보기')}</div>
              <div class="link-url">▶ ${escapeHtml(url)}</div>
            </div>
          </a>
        </div>
      `;
    }
    // 일반 URL → 링크 카드 + 🔗
    return `
      <div class="item">
        <a href="${escapeHtml(url)}" target="_blank" rel="noopener" class="link-card">
          <div class="link-icon">🔗</div>
          <div class="link-body">
            <div class="link-title">${escapeHtml(it.caption || rawUrl)}</div>
            ${it.caption ? `<div class="link-url">${escapeHtml(rawUrl)}</div>` : ''}
          </div>
        </a>
      </div>
    `;
  }
  return `
    <div class="item">
      <div class="item-text">${autolinkText(it.text)}</div>
      ${it.caption ? `<div class="item-caption">${escapeHtml(it.caption)}</div>` : ''}
    </div>
  `;
}

// ───── 학습 컨트롤 — 플래시카드 스타일 ─────
// 패스 상태 영구 저장 (챕터 단위) — 새로고침·재진입 후에도 마지막 위치 유지
function passKey(cid) { return 'op_passed_' + cid; }
function savePassed() {
  if (!state.currentChapter) return;
  try {
    localStorage.setItem(passKey(state.currentChapter.id), JSON.stringify([...state.passedSet]));
  } catch {}
}
function loadPassed(chapterId) {
  try {
    const raw = localStorage.getItem(passKey(chapterId));
    state.passedSet = new Set(raw ? JSON.parse(raw).map(Number) : []);
  } catch { state.passedSet = new Set(); }
}

// 목차 헤더의 화면 Y 위치를 고정한 채 렌더링 (스크롤 보정)
// → 패스/완료 누를 때 위쪽 콘텐츠가 흔들리지 않고 헤더가 같은 자리에 머무름
function withTopicAnchor(topicId, callback) {
  const sel = `[data-topic="${topicId}"] > .topic-head`;
  const headEl = document.querySelector(sel);
  const beforeY = headEl ? headEl.getBoundingClientRect().top : null;
  callback();
  if (beforeY == null) return;
  // 즉시 1회 보정 + 다음 frame에 한 번 더 (브라우저 auto-scroll 대응)
  const adjust = () => {
    const newHead = document.querySelector(sel);
    if (!newHead) return;
    const afterY = newHead.getBoundingClientRect().top;
    const delta = afterY - beforeY;
    if (Math.abs(delta) > 1) window.scrollBy(0, delta);
  };
  adjust();
  requestAnimationFrame(adjust);
}

// 패스 — 모드별로 다르게 동작:
//   new: 펼쳤으면 box=1 강등(miss=1) / 안 펼쳤으면 box=2 진입
//   별표/all: 서버 변화 없음 (펼침은 peek에서 이미 처리). 화면에서만 다음 카드로
//   다지기 오늘/내일/4/8/16/32: was_peeked 기준 advance/강등/유지
function studyPass(subId, topicId) {
  const wasOpened = state.everExpandedSet.has(Number(subId));
  state.passedSet.add(Number(subId));
  state.expanded.subtopic.delete(Number(subId));
  const sameTopicSubs = state.subtopicsByTopic[topicId] || [];
  for (const s of sameTopicSubs) state.expanded.subtopic.delete(Number(s.id));
  savePassed();

  // v2: 별표/all 탭은 서버 변화 없음. new 또는 다지기에서만 서버 호출.
  // 다지기 모드는 memorizedView 분기로 별도 처리 (memorizedPass)
  const skipServer = !state.memorizedView && (state.normalMode === 'star' || state.normalMode === 'all');
  if (!skipServer) {
    apiPass(Number(subId), wasOpened);
  }

  // ● 카드는 챕터 뷰에서 안 보이므로 미암기 기준으로 "다 패스했나" 판정
  const subs = state.subtopicsByTopic[topicId] || [];
  const unmastered = subs.filter(s => !state.understoodSet.has(Number(s.id)));
  const stillVisible = unmastered.filter(s => !state.passedSet.has(Number(s.id)));

  if (stillVisible.length === 0) {
    // 미암기 0개면 (모두 ●) 빈 상태 안내가 그 자리를 채움 — celebrate 호출 안 함
    if (unmastered.length === 0) {
      withTopicAnchor(topicId, () => {
        if (state.currentChapter) renderTree(state.currentChapter.id);
      });
      return;
    }
    celebrateAndReset(topicId);
    return;
  }

  // 일반 패스 — 헤더 위치 고정한 채 렌더
  withTopicAnchor(topicId, () => {
    if (state.currentChapter) renderTree(state.currentChapter.id);
  });
}

// 모두 패스 시 축하 폭죽 → 패스 자동 초기화 → 처음부터 다시 시작
function celebrateAndReset(topicId) {
  showCelebration();
  setTimeout(() => {
    const subs = state.subtopicsByTopic[topicId] || [];
    for (const s of subs) state.passedSet.delete(Number(s.id));
    savePassed();
    if (state.currentChapter) renderTree(state.currentChapter.id);
  }, 2200);
}

function showCelebration() {
