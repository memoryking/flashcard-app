// 펼침은 click이 담당, long-press(600ms)는 이해 토글
// → 모바일/데스크탑 모두 안정적 (이전 longPressEnd가 모바일에서 안 먹는 문제 해결)
let _pressTimer = null;
let _longFired = false;
function pressStart(subId) {
  _longFired = false;
  _pressTimer = setTimeout(() => {
    _longFired = true;
    if (navigator.vibrate) try { navigator.vibrate(20); } catch {}
    toggleUnderstood(subId);
  }, 600);
}
function pressEnd() {
  if (_pressTimer) { clearTimeout(_pressTimer); _pressTimer = null; }
}
function subClick(e, subId) {
  if (_longFired) { _longFired = false; e.preventDefault(); return; }

  // 클릭한 학습 카드의 화면 위치 캡쳐 (위쪽 다른 학습 카드가 닫혀도 자리 유지하려고)
  const subEl = e.currentTarget && e.currentTarget.closest('.subtopic');
  const beforeY = subEl ? subEl.getBoundingClientRect().top : null;

  if (state.expanded.subtopic.has(subId)) {
    // 이미 펼쳐진 거 다시 누름 = 접기
    state.expanded.subtopic.delete(subId);
    // reveal 진행상태 정리 — 다음 펼침은 fresh로 (스테이지에서 사용)
    state.activeRecallRevealed.delete(subId);
    // 다지기 모드 + 미래 박스(effective box ≥ 2) 카드 → 접음 = 자동 peek+pass (오늘 학습 강등)
    // "내용 살짝 확인해 보니 모르더라" 신호. 미래 박스 인벤토리는 이 인터랙션이 유일한 강등 경로.
    // 오늘 학습 스테이지 카드는 단일 카드 뷰이므로 이 분기 안 탐 (focus-card는 .subtopic이 아님).
    if (state.memorizedView && state.understoodSet.has(Number(subId))) {
      const dueDays = dueDaysLeft(state.understoodNextReview[Number(subId)]);
      const effBox = dueDays <= 0 ? 1 : (Number(state.understoodBox[Number(subId)]) || 1);
      if (effBox !== 1) {
        // 부드러운 강등 애니메이션:
        //  1) 접힌 상태로 즉시 렌더 (사용자가 접힘을 인지)
        //  2) 카드 DOM에 srs-demoting 클래스 추가 → 0.6초 fade-out + slide-out
        //  3) 애니메이션 끝나면 memorizedPass 호출 → state 갱신 + 오늘 학습으로 이동
        renderTree(state.currentChapter.id);
        const cardEl = document.querySelector(`[data-sub="${subId}"]`);
        if (cardEl) {
          cardEl.classList.add('srs-demoting');
          setTimeout(() => {
            memorizedPass(subId);
            // 미래 박스 카드가 오늘로 demote → 퀴즈 풀에 fresh 등재
            state.quizDoneSet.delete(Number(subId));
          }, 1400);
        } else {
          memorizedPass(subId); // 안전망: DOM 못 찾으면 즉시
          state.quizDoneSet.delete(Number(subId));
        }
        return;
      }
    }
  } else {
    // 아코디언: 다른 학습 카드 모두 닫고 이것만 열기
    state.expanded.subtopic.clear();
    state.expanded.subtopic.add(subId);
    // 이 챕터 안에서 한 번이라도 펼친 항목은 기억 — 일반 모드 패스 판정용
    // 같은 세션 내 같은 카드 중복 펼침은 1회만 count (중복 peek 방지)
    const firstExpand = !state.everExpandedSet.has(Number(subId));
    state.everExpandedSet.add(Number(subId));
    // 다지기 모드에서 펼친 것은 별도 추적 — 다지기 패스 판정용 (다지기 진입 시 리셋)
    if (state.memorizedView) state.memorizedExpandedSet.add(Number(subId));

    // v2: 행이 있는 카드 (별표/all/다지기에서 펼침) = miss_count +1 서버 동기화
    // 새 카드(no row, new 탭에서 펼침)는 client 상태만 — 패스 시점에 행 생성됨
    if (firstExpand && state.understoodSet.has(Number(subId))) {
      apiPeek(Number(subId));
    }
  }
  renderTree(state.currentChapter.id);

  // 렌더 후 같은 학습 카드가 화면에서 위로 이동했으면 그만큼 스크롤 보정 → 클릭 위치 고정
  if (beforeY != null) {
    const newEl = document.querySelector('[data-sub="' + subId + '"]');
    if (newEl) {
      const afterY = newEl.getBoundingClientRect().top;
      const delta = afterY - beforeY;
      if (Math.abs(delta) > 1) {
        window.scrollBy(0, delta);
      }
    }
  }
}

// ─── SRS due 일수 계산 ──────────────────────────────────────
// 레거시(next_review_at 없음) 또는 과거 due → 0 ("오늘 복습")
function kstTodayDate() {
  return new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10);
}
function dueDaysLeft(nextReviewAt) {
  if (!nextReviewAt) return 0;
  const today = kstTodayDate();
  const due = String(nextReviewAt).slice(0, 10);
  const parse = ymd => {
    const [y, m, d] = ymd.split('-').map(Number);
    return Date.UTC(y, m - 1, d);
  };
  const diffDays = Math.round((parse(due) - parse(today)) / (24 * 3600 * 1000));
  return Math.max(0, diffDays); // 과거 due 는 0 (오늘 복습)
}
// 일수에 따른 시각 강도 — 헤더 색·카드 opacity
// 0: today (빨강 강조), 1~2: soon (주황), 3~7: week (노랑), 8+: future (회색)
function dueTier(days) {
  if (days <= 0) return 'today';
  if (days <= 2) return 'soon';
  if (days <= 7) return 'week';
  return 'future';
}
// 그룹 헤더 라벨 — 정확한 일수 표시
function dueLabel(days) {
  if (days <= 0) return '📍 오늘 다지기';
  if (days === 1) return '내일 다지기';
  return `${days}일 후 다지기`;
}

// 암기 모음 모드 — 안 펼치고 패스하면 호출. 박스 진행 (Leitner advance)
async function silentAdvanceUnderstood(subId) {
  if (!state.user) return;
  if (!state.understoodSet.has(Number(subId))) return;
  try {
    const r = await api('POST', '/understood/advance', { subtopic_id: subId });
    if (r && r.review_box) {
      state.understoodBox[Number(subId)] = r.review_box;
      state.understoodNextReview[Number(subId)] = r.next_review_at || '';
    }
  } catch (e) {
    // 조용히 무시 — 다음 회 진입 시 서버에서 최신 상태 다시 로드됨
  }
}

// ─── v2 오늘 클리어율 통계 ──────────────────────────────
// 분모 = 오늘 박스(1)에 들어온 누적 카드 / 분자 = 오늘 박스에서 내일(2)로 진급한 카드
// 챕터 단위 localStorage, KST 자정 지나면 자동 리셋
function todayStatsKey(chapterId) { return 'op_today_stats_' + chapterId; }
function kstTodayStr() { return new Date(Date.now() + 9*3600*1000).toISOString().slice(0,10); }
// 현재 오늘 박스(effectiveBox=1) 카드 수 — 분모 동적 계산용
function countTodayBoxCards(chapterId) {
  const topics = state.topicsByChapter[chapterId] || [];
  let count = 0;
  for (const t of topics) {
    const subs = state.subtopicsByTopic[t.id] || [];
    for (const s of subs) {
      const sid = Number(s.id);
      if (!state.understoodSet.has(sid)) continue;
      const days = dueDaysLeft(state.understoodNextReview[sid]);
      const box = days <= 0 ? 1 : (Number(state.understoodBox[sid]) || 1);
      if (box === 1) count++;
    }
  }
  return count;
}

function loadTodayStats(chapterId) {
  try {
    const raw = localStorage.getItem(todayStatsKey(chapterId));
    const j = raw ? JSON.parse(raw) : null;
    const today = kstTodayStr();
    if (j && j.date === today) {
      state.todayStatsCleared = Number(j.cleared) || 0;
      state.todayStatsDate = today;
    } else {
      state.todayStatsCleared = 0;
      state.todayStatsDate = today;
      saveTodayStats(chapterId);
    }
  } catch {
    state.todayStatsCleared = 0;
    state.todayStatsDate = kstTodayStr();
  }
}

// 렌더 직전 호출 — 자정 지나면 cleared 자동 리셋
function ensureTodayStatsCurrent(chapterId) {
  const today = kstTodayStr();
  if (state.todayStatsDate !== today) loadTodayStats(chapterId);
}
function saveTodayStats(chapterId) {
  try {
    localStorage.setItem(todayStatsKey(chapterId), JSON.stringify({
      date: state.todayStatsDate || kstTodayStr(),
      cleared: state.todayStatsCleared,
    }));
  } catch {}
}
// 카드의 박스 전이에 따라 통계 갱신
// 분모는 동적으로 계산 (currentBox1 + cleared) — entered 별도 추적 안 함
// prevBox=null (행이 없었음, new) / prevBox=N (기존 박스), newBox=새 박스
function bumpTodayStats(prevBox, newBox) {
  if (!state.currentChapter) return;
  const cid = state.currentChapter.id;
  const today = kstTodayStr();
  if (state.todayStatsDate !== today) {
    state.todayStatsCleared = 0; state.todayStatsDate = today;
  }
  // 오늘 박스(1)에서 내일 박스(2) 이상으로 진급 — 분자 +1
  if (prevBox === 1 && newBox >= 2) state.todayStatsCleared++;
  saveTodayStats(cid);
}

// ─── v2 학습 시스템 API 액션 ──────────────────────────────
// 일반 모드 3탭 HTML 생성 — renderTopic이 body 위에 prepend
function renderModeTabs() {
  const cur = state.normalMode || 'new';
  const mk = (m, label) => `<button class="mode-tab${cur === m ? ' active' : ''}" data-mode="${m}" onclick="event.stopPropagation();switchNormalMode('${m}')">${label}</button>`;
  return `<div class="mode-tabs">${mk('new', 'new')}${mk('star', '★ 별표')}${mk('all', 'all')}</div>`;
}

// (구) refreshModeTabsUI — 현재는 renderTree 재호출로 충분. 무동작 stub.
function refreshModeTabsUI() {}

// 일반 모드 탭 전환 (new/star/all)
function switchNormalMode(mode) {
  if (state.normalMode === mode) return;
  state.normalMode = mode;
  // 탭 전환 시 펼친 항목·패스 모두 초기화 (혼선 방지)
  state.expanded.subtopic.clear();
  state.passedSet.clear();
  savePassed();
  if (state.currentChapter) renderTree(state.currentChapter.id);
}

// 펼친 시점 호출 — 행이 있으면 서버 miss_count +1
async function apiPeek(subId) {
  if (!state.user) return;
  try {
    const r = await api('POST', '/understood/peek', { subtopic_id: subId });
    if (r && !r.skipped && typeof r.miss_count === 'number') {
      state.understoodMissCount[Number(subId)] = r.miss_count;
    }
  } catch {}
}

// 패스 시점 호출 — 박스 상태 + was_peeked 기준 서버 분기
async function apiPass(subId, wasPeeked) {
  if (!state.user) return null;
  const sid = Number(subId);
  let prevEff = null;
  if (state.understoodSet.has(sid)) {
    const prevBox = Number(state.understoodBox[sid]) || 1;
    const dueDays = dueDaysLeft(state.understoodNextReview[sid]);
    prevEff = dueDays <= 0 ? 1 : prevBox;
  }
  try {
    const r = await api('POST', '/understood/pass', { subtopic_id: subId, was_peeked: !!wasPeeked });
    if (r && r.ok) {
      if (typeof r.review_box === 'number') {
        state.understoodSet.add(sid);
        state.understoodBox[sid] = r.review_box;
        bumpTodayStats(prevEff, r.review_box);
      }
      if (r.next_review_at) state.understoodNextReview[sid] = r.next_review_at;
      if (typeof r.miss_count === 'number') state.understoodMissCount[sid] = r.miss_count;
    }
    return r;
  } catch { return null; }
}

// 꾹누르기 — 무조건 다음 박스로 advance
async function apiPromote(subId) {
  if (!state.user) return null;
  const sid = Number(subId);
  const prevBox = state.understoodSet.has(sid) ? (state.understoodBox[sid] || 1) : null;
  try {
    const r = await api('POST', '/understood/promote', { subtopic_id: subId });
    if (r && r.ok) {
      state.understoodSet.add(sid);
      if (typeof r.review_box === 'number') {
        state.understoodBox[sid] = r.review_box;
        bumpTodayStats(prevBox, r.review_box);
      }
      if (r.next_review_at) state.understoodNextReview[sid] = r.next_review_at;
      if (typeof r.miss_count === 'number') state.understoodMissCount[sid] = r.miss_count;
    }
    return r;
  } catch { return null; }
}

// 패스 — 안 펼치고 패스한 경우 자동 ● 암기로 설정 (정상 모드에서 사용)
// 화면 갱신·토스트 없이 understoodSet 갱신 + 서버 동기화
async function silentMarkUnderstood(subId) {
  if (!state.user) return;
  if (state.understoodSet.has(Number(subId))) return;
  state.understoodSet.add(Number(subId));
  // 클라이언트 KST 시각 — 서버 kstDateTime() 호환 정렬 키
  const d = new Date(Date.now() + 9 * 3600 * 1000);
  state.understoodMarkedAt[Number(subId)] = d.toISOString().replace('T', ' ').slice(0, 19);
  // ●가 되면 "다지기 실패 복귀" 표시는 자동 해제 — 더 이상 미암기가 아니므로
  state.recentlyFailedFromMemo.delete(Number(subId));
  try {
    const r = await api('POST', '/understood', { subtopic_id: subId });
    // 서버가 box=1, next_review_at=내일 자동 세팅 — 받은 값 반영
    if (r && r.review_box) {
      state.understoodBox[Number(subId)] = r.review_box;
      state.understoodNextReview[Number(subId)] = r.next_review_at || '';
    }
  } catch (e) {
    // 실패 시 롤백
    state.understoodSet.delete(Number(subId));
    delete state.understoodMarkedAt[Number(subId)];
  }
}

// 다지기 모드 — 펼친 시점에 호출. 화면 갱신·토스트 없이 understoodSet/서버만 정리.
// (스냅샷이 이번 회 화면을 고정하므로 사용자 입장에선 즉시 사라지지 않음)
// understoodMarkedAt 은 정렬 키라서 건드리지 않음 — 이번 회 정렬 순서 유지.
// 다지기에서 실패한 카드는 챕터 뷰 맨 아래에 ↺ 표시로 다시 나타남 → 재학습 가능.
async function silentUnmarkUnderstood(subId) {
  if (!state.user) return;
  if (!state.understoodSet.has(Number(subId))) return;
  const wasInEverExpanded = state.everExpandedSet.has(Number(subId));
  state.understoodSet.delete(Number(subId));
  // 다지기에서 호출됐을 때 — 챕터 뷰로 복귀하면서 두 가지:
  // 1) recentlyFailedFromMemo 에 추가 → ↺ 표시 + 맨 아래 정렬
  // 2) everExpandedSet 에서 제거 → 챕터 뷰에서 안 펼치고 패스하면 "fresh" 판정으로
  //    silentMark 호출 → ● 등록 → 내일 다지기로 정상 등록
  if (state.memorizedView) {
    state.recentlyFailedFromMemo.add(Number(subId));
    state.everExpandedSet.delete(Number(subId));
  }
  try {
    await api('POST', '/understood', { subtopic_id: subId });
  } catch (e) {
    // 실패 시 롤백 — 다음 회에도 암기로 남음
    state.understoodSet.add(Number(subId));
    state.recentlyFailedFromMemo.delete(Number(subId));
    if (wasInEverExpanded) state.everExpandedSet.add(Number(subId));
  }
}

// v2 꾹누르기 — 항상 다음 박스로 advance (= "안다" 신호)
// new 카드면 box=2 (내일) 진입. 기존 카드면 현재 박스+1.
async function toggleUnderstood(subId) {
  if (!state.user) return;
  const r = await apiPromote(Number(subId));
  if (r && r.ok) {
    const labels = ['', '오늘 학습', '내일 학습', '4일 후', '8일 후', '16일 후', '32일 후'];
    const lbl = labels[Number(r.review_box) || 1] || `Box ${r.review_box}`;
    toast(`✓ ${lbl} 으로 이동`);
    renderTree(state.currentChapter.id);
  } else {
    toast('서버 통신 실패', true);
  }
}

async function refreshChapter() {
  if (!state.currentChapter) return;
  const cid = state.currentChapter.id;
  showLoading(true);   // 시각 피드백 — 사용자가 진행 중임을 알게
  try {
    // 캐시 무효화 (재진입 시 다시 fetch)
    delete state.topicsByChapter[cid];
    Object.keys(state.subtopicsByTopic).forEach(k => delete state.subtopicsByTopic[k]);
    Object.keys(state.itemsBySubtopic).forEach(k => delete state.itemsBySubtopic[k]);
    // 챕터·접근권·이해표시도 갱신
    await Promise.all([
      loadChapters(),
      loadUnderstood(),
      api('GET', '/auth/me').then(r => {
        state.point = Number(r.user.point) || 0;
        state.chapterAccess = r.chapter_access || {};
      }).catch(() => {}),
    ]);
    // 챕터 재진입 (현재 챕터 객체 갱신)
    const fresh = state.chapters.find(x => x.id === cid);
    if (!fresh) {
      toast('이 챕터는 삭제되었습니다.', true);
      goHome();
      return;
    }
    state.currentChapter = fresh;
    await loadTopics(cid);
    renderTree(cid);
    toast('최신 콘텐츠로 갱신됨');
  } catch (e) {
    toast('새로고침 실패: ' + e.message, true);
  } finally {
    showLoading(false);
  }
}

async function goPayment(chapterId) {
  closeModal();
  // 1순위: Worker가 동적으로 PayApp 결제 세션 생성 (var1=chapter_id로 매핑)
  //         → PayApp이 결제 완료 시 Worker /payapp/webhook으로 통보
  // 2순위 (fallback): 만약 Worker 호출 실패 + chapter.pay_url이 설정돼 있으면 정적 링크 사용
  try {
    toast('결제 페이지로 이동 중…');
    const r = await api('POST', '/payment/request', { chapter_id: chapterId });
    if (!r.payurl) throw new Error('payurl missing');
    window.open(r.payurl, '_blank');
    toast('결제 후 잠시 후 갱신됩니다. (Pull-to-refresh 또는 새로고침)');
  } catch (e) {
    // Fallback — 옛 정적 링크 (deprecated)
    const c = state.chapters.find(x => x.id === chapterId);
    const payUrl = c && c.pay_url ? String(c.pay_url).trim() : '';
    if (payUrl) {
      window.open(payUrl, '_blank');
      toast('결제 후 잠시 후 갱신됩니다.');
      return;
    }
    toast('결제 세션 생성 실패: ' + (e.message || ''), true);
  }
}

async function confirmRedeem(chapterId) {
  if (state.point < REDEEM_COST) {
    toast('포인트가 부족합니다.', true);
    return;
  }
  const c = state.chapters.find(x => x.id === chapterId);
  if (!confirm(`"${c.title}" 챕터를 ${REDEEM_COST.toLocaleString()}P로 30일 연장합니다.\n진행할까요?`)) return;
  showLoading(true);
  try {
    const r = await api('POST', '/access/redeem', { chapter_id: chapterId });
    state.point = Number(r.new_point) || 0;
    state.chapterAccess[chapterId] = { expires_at: r.expires_at, source: 'point_redeem' };
    closeModal();
    toast(`${REDEEM_COST.toLocaleString()}P 사용 — 30일 연장됨`);
    renderHome();
    if (state.currentChapter && state.currentChapter.id === chapterId) {
      enterChapter(chapterId);
    }
  } catch (e) { toast(e.message, true); }
  finally { showLoading(false); }
}

function openAccountModal() {
  const u = state.user || {};
  // 구독 정보 (활성 + 만료된 챕터)
  const access = state.chapterAccess || {};
  const isTeacher = u.role === 'teacher';
  const chapterMap = {};
  for (const c of state.chapters || []) chapterMap[c.id] = c;
  const now = Date.now() + 9 * 3600 * 1000; // KST
  const active = [];
  const expired = [];
  for (const cid in access) {
    const a = access[cid];
    const ch = chapterMap[cid];
    if (!ch) continue;
    const exp = new Date(a.expires_at).getTime();
    if (exp > now) active.push({ ch, expiresAt: a.expires_at, dLeft: Math.ceil((exp - now) / 86400000) });
    else expired.push({ ch, expiresAt: a.expires_at });

  active.sort((a, b) => a.dLeft - b.dLeft);

    ? '<div class="acc-row" style="color:#ffd54f;font-weight:600;">🛠 관리자 — 모든 챕터 무제한</div>'

          <div class="acc-row">

    body: `

      <button class="primary" onclick="submitChangePassword()">변경</button>
    `
  });

}

async function submitChangePassword() {
  const oldPw = $('cp_old').value;
  const newPw = $('cp_new').value;
  const confirmPw = $('cp_confirm').value;
  const err = $('cp_err');
  err.style.display = 'none';
  if (!oldPw || !newPw) { err.textContent = '모든 칸을 입력하세요.'; err.style.display = 'block'; return; }
  if (newPw.length < 6) { err.textContent = '새 비밀번호는 6자 이상.'; err.style.display = 'block'; return; }
  if (newPw !== confirmPw) { err.textContent = '새 비밀번호 확인이 일치하지 않습니다.'; err.style.display = 'block'; return; }
  showLoading(true);
  try {
    await api('POST', '/auth/change-password', { old_password: oldPw, new_password: newPw });
    closeModal();
    toast('비밀번호가 변경되었습니다.');
  } catch (e) {
    err.textContent = e.message;
    err.style.display = 'block';
  } finally {
    showLoading(false);
  }
}

function doLogout() {
  localStorage.removeItem(TOKEN_KEY);
  state.user = null;
  stopTimers();
  $('watermark').classList.remove('show');
  $('homeScreen').style.display = 'none';
  $('chapterScreen').style.display = 'none';
  $('authScreen').style.display = 'flex';
}

// ============================================================
// 비밀번호 찾기 — 이메일 → 등록 휴대폰으로 6자리 코드 SMS → 코드+새 비번
// ============================================================
function openForgotPasswordModal() {
  // 로그인 화면에 입력된 이메일이 있으면 미리 채워넣음
  const prefill = ($('li_email') && $('li_email').value.trim()) || '';
  showModal({
    title: '비밀번호 찾기',
    body: `
      <div id="fp_step1" style="display:flex;flex-direction:column;gap:10px;">
        <div style="font-size:13px;color:rgba(255,255,255,0.7);line-height:1.6;">
          가입한 이메일을 입력하시면 <strong style="color:#fff;">등록된 휴대폰</strong>으로
          6자리 인증 코드를 보내드립니다.
        </div>
        <label style="font-size:12px;color:rgba(255,255,255,0.6);margin-top:6px;">이메일</label>
        <input type="email" id="fp_email" placeholder="가입 시 사용한 이메일" autocomplete="username" value="${escapeHtml(prefill)}"
          style="padding:10px 12px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#fff;font-size:14px;">
        <div id="fp_err1" style="display:none;color:#fca5a5;font-size:12px;margin-top:4px;"></div>
      </div>
      <div id="fp_step2" style="display:none;flex-direction:column;gap:10px;">
        <div id="fp_sent_info" style="font-size:13px;color:rgba(255,255,255,0.75);line-height:1.6;background:rgba(79,195,247,0.08);border-left:3px solid #4fc3f7;padding:10px 12px;border-radius:0 8px 8px 0;"></div>
        <label style="font-size:12px;color:rgba(255,255,255,0.6);margin-top:6px;">인증 코드 (6자리)</label>
        <input type="text" id="fp_code" inputmode="numeric" pattern="\\d{6}" maxlength="6" placeholder="000000"
          style="padding:10px 12px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#fff;font-size:18px;letter-spacing:6px;text-align:center;font-family:monospace;">
        <label style="font-size:12px;color:rgba(255,255,255,0.6);margin-top:6px;">새 비밀번호 (6자 이상)</label>
        <input type="password" id="fp_new" placeholder="새 비밀번호" autocomplete="new-password"
          style="padding:10px 12px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#fff;font-size:14px;">
        <label style="font-size:12px;color:rgba(255,255,255,0.6);margin-top:6px;">새 비밀번호 확인</label>
        <input type="password" id="fp_confirm" placeholder="다시 입력" autocomplete="new-password"
          style="padding:10px 12px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#fff;font-size:14px;">
        <div id="fp_err2" style="display:none;color:#fca5a5;font-size:12px;margin-top:4px;"></div>
        <div style="text-align:right;margin-top:2px;">
          <a href="#" onclick="event.preventDefault();fpBackToStep1();" style="color:#9ca3af;font-size:12px;text-decoration:underline;">← 이메일 다시 입력</a>
        </div>
      </div>
    `,
    foot: `
      <button onclick="closeModal()">취소</button>
      <button class="primary" id="fp_submitBtn" onclick="fpSendCode()">코드 받기</button>
    `

  setTimeout(() => { $('fp_email') && $('fp_email').focus(); }, 100);

function fpBackToStep1() {
  $('fp_step1').style.display = 'flex';
  $('fp_step2').style.display = 'none';
  $('fp_submitBtn').textContent = '코드 받기';
  $('fp_submitBtn').onclick = fpSendCode;
  setTimeout(() => { $('fp_email') && $('fp_email').focus(); }, 50);
}

async function fpSendCode() {
  const email = $('fp_email').value.trim();
  const err = $('fp_err1');
  err.style.display = 'none';
  if (!email) { err.textContent = '이메일을 입력하세요.'; err.style.display = 'block'; return; }

  const btn = $('fp_submitBtn');
  btn.disabled = true;
  showLoading(true);
  try {
    const r = await api('POST', '/auth/forgot-password', { email });
    // 보안상 가입 여부 노출 안 함 — sent=false여도 동일 UI 흐름
    const info = r.sent
      ? `<strong style="color:#4fc3f7;">${escapeHtml(r.phone_masked || '등록 번호')}</strong> 번호로 6자리 코드를 보냈습니다.<br>10분 이내에 입력하세요.`
      : `등록된 이메일이 있다면 휴대폰으로 코드가 발송됐습니다.<br>10분 이내에 입력하세요.`;
    $('fp_sent_info').innerHTML = info;
    $('fp_step1').style.display = 'none';
    $('fp_step2').style.display = 'flex';
    btn.textContent = '비밀번호 변경';
    btn.onclick = fpResetPassword;
    setTimeout(() => { $('fp_code') && $('fp_code').focus(); }, 50);
  } catch (e) {
    err.textContent = e.message;
    err.style.display = 'block';
  } finally {
    btn.disabled = false;
    showLoading(false);
  }
}

async function fpResetPassword() {
  const email = $('fp_email').value.trim();
  const code = $('fp_code').value.trim();
  const newPw = $('fp_new').value;
  const confirmPw = $('fp_confirm').value;
  const err = $('fp_err2');
  err.style.display = 'none';
  if (!/^\d{6}$/.test(code)) { err.textContent = '6자리 숫자 코드를 입력하세요.'; err.style.display = 'block'; return; }
  if (newPw.length < 6) { err.textContent = '새 비밀번호는 6자 이상.'; err.style.display = 'block'; return; }
  if (newPw !== confirmPw) { err.textContent = '새 비밀번호 확인이 일치하지 않습니다.'; err.style.display = 'block'; return; }

  const btn = $('fp_submitBtn');
  btn.disabled = true;
  showLoading(true);
  try {
    await api('POST', '/auth/reset-password', { email, code, new_password: newPw });
    closeModal();
    toast('비밀번호가 변경되었습니다. 새 비밀번호로 로그인하세요.');
    // 로그인 화면 이메일 칸에 그대로 두고 비밀번호 칸에 포커스
    $('li_email').value = email;
    $('li_password').value = '';
    setTimeout(() => { $('li_password') && $('li_password').focus(); }, 100);
  } catch (e) {
    err.textContent = e.message;
    err.style.display = 'block';
  } finally {
    btn.disabled = false;
    showLoading(false);
  }
}

// 관심 주제 모달 — 필터 토글 + 주제 선택

function openInterestModal() {
  // 전체 과목 목록 — state.chapters에서 distinct subject 추출
  const allSubjects = [...new Set(state.chapters.map(c => c.subject || '기타'))].sort();
  const selectedSet = new Set(state.interests);
  const filterOn = state.interestFilterOn;
  const checkboxes = allSubjects.length === 0
    ? '<div style="text-align:center;color:rgba(255,255,255,0.5);font-size:13px;padding:20px 0;">아직 챕터가 없습니다.</div>'
    : allSubjects.map(subj => `
        <label class="interest-row">
          <input type="checkbox" class="interest-cb" value="${escapeHtml(subj)}" ${selectedSet.has(subj) ? 'checked' : ''}>
          <span>${escapeHtml(subj)}</span>
        </label>
      `).join('');
  showModal({
    title: '🎯 관심 주제',
    klass: 'interest-modal',
    body: `
      <p style="font-size:13px;color:rgba(255,255,255,0.7);line-height:1.6;margin-bottom:14px;">
        체크한 과목의 챕터만 홈 화면에 표시됩니다. 비우면 전체 노출.
      </p>
      <label class="interest-toggle">
        <input type="checkbox" id="interestFilterToggle" ${filterOn ? 'checked' : ''}>
        <span>관심 주제 필터 사용</span>
      </label>
      <div class="interest-list">
        ${checkboxes}
      </div>
    `,
    foot: `
      <button onclick="closeModal()">취소</button>
      <button class="primary" onclick="saveInterests()">저장</button>
    `
  });
}

async function saveInterests() {
  const cbs = document.querySelectorAll('.interest-cb');
  const selected = [];
  cbs.forEach(cb => { if (cb.checked) selected.push(cb.value); });
  const filterOn = $('interestFilterToggle').checked;
  showLoading(true);
  try {
    await api('PUT', '/auth/me/interests', { interests: selected });
    state.interests = selected;
    state.interestFilterOn = filterOn && selected.length > 0;
    // 필터 토글 상태도 사용자별로 localStorage 저장
    const key = INTEREST_FILTER_KEY + '_' + (state.user.phone || '');
    localStorage.setItem(key, state.interestFilterOn ? '1' : '0');
    closeModal();
    renderHome();
    toast(`관심 주제 ${selected.length}개 저장됨 (Airtable 동기화 완료)`);
  } catch (e) {
    toast('저장 실패: ' + e.message, true);
  } finally {
    showLoading(false);
  }
}

async function copyToClipboard(text, label) {
  try {
    await navigator.clipboard.writeText(text);
    toast(`${label} 복사됨`);
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast(`${label} 복사됨`); }
    catch { toast('복사 실패 — 직접 선택해주세요.', true); }
    document.body.removeChild(ta);
  }
}
async function copyReferralLink() {
  await copyToClipboard($('refLinkBox').textContent, '추천 링크');
}
async function copyMyReferralCode() {
  const code = (state.user && state.user.referral_code) || '';
  if (!code) { toast('추천 코드 없음', true); return; }
  await copyToClipboard(code, '추천 코드');
}
async function copyMyReferralLinkFromAccount() {
  const code = (state.user && state.user.referral_code) || '';
  if (!code) { toast('추천 코드 없음', true); return; }
  await copyToClipboard(`${LANDING_URL}?ref=${code}`, '추천 링크');
}

function showModal({ title, body, foot = '', klass = '' }) {
  const m = $('modal');
  m.innerHTML = `
    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal ${klass}" onclick="event.stopPropagation()">
        <div class="modal-head">
          <h3>${escapeHtml(title)}</h3>
          <button class="close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body">${body}</div>
        <div class="modal-foot">${foot}</div>
      </div>
    </div>
  `;
  $('modalBackdrop').onclick = (e) => { if (e.target.id === 'modalBackdrop') closeModal(); };
}
function closeModal() { $('modal').innerHTML = ''; }

// ============================================================
// 타이머 — ping 60초마다 + live count 30초마다
// ============================================================
function startTimers() {
  stopTimers();
  // 즉시 1회
  api('POST', '/stats/ping').catch(() => {});
  state.pingTimer = setInterval(() => api('POST', '/stats/ping').catch(() => {}), 60000);
  state.liveTimer = setInterval(loadLiveCount, 30000);
}
function stopTimers() {
  if (state.pingTimer) clearInterval(state.pingTimer);
  if (state.liveTimer) clearInterval(state.liveTimer);
  state.pingTimer = state.liveTimer = null;
}

$('signupBtn').onclick = doSignup;
$('li_password').onkeydown = (e) => { if (e.key === 'Enter') doLogin(); };
$('su_password').onkeydown = (e) => { if (e.key === 'Enter') doSignup(); };

$('su_ref').oninput = () => {
  clearTimeout(_refTimer);
  const v = $('su_ref').value.trim().toUpperCase();
  $('su_ref').value = v;
  _refTimer = setTimeout(() => checkRefCode(v), 400);
};

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

// 백그라운드/포그라운드 — 갱신
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && state.user) {

    api('GET', '/auth/me').then(r => {
      state.point = Number(r.user.point) || 0;
      state.chapterAccess = r.chapter_access || {};
      if (state.currentChapter == null) renderHome();
    }).catch(() => {});
  }
});
