<script>
'use strict';

// ============================================================
// 설정
// ============================================================
const API = 'https://onepage-api.memoryking.workers.dev';
const TOKEN_KEY = 'op_user_token';
const REF_KEY = 'op_ref_code';
const UTM_KEY = 'op_utm';
const INTERESTS_KEY = 'op_interests_pending'; // 가입 전 URL에서 캡쳐한 관심 주제
const UTM_TTL_MS = 30 * 24 * 3600 * 1000;   // 30일 유지 (재방문 시까지 어트리뷰션 유지)
const LANDING_URL = 'https://vipup.site/onepage';   // 결제 안내 페이지
const REDEEM_COST = 3000;
// 모든 시간은 KST(한국 표준시) 기준. 서버는 expires_at 등을 KST wall-clock으로 저장.
const KST_OFFSET_MS = 9 * 60 * 60 * 1000;
const KST_TZ = 'Asia/Seoul';

// ============================================================
// 상태
// ============================================================
const state = {
  user: null,
  point: 0,
  chapterAccess: {},          // chapter_id → { expires_at, source }
  chapters: [],
  currentChapter: null,
  topicsByChapter: {},
  subtopicsByTopic: {},
  itemsBySubtopic: {},
  understoodSet: new Set(),
  understoodMarkedAt: {},     // subtopic_id → marked_at (YYYY-MM-DD HH:MM:SS) — 암기 모음 정렬용
  understoodBox: {},          // subtopic_id → Leitner box 1~6 (간격 반복 단계, v2: 1=오늘 2=내일 3=4일 4=8일 5=16일 6=32일)
  understoodNextReview: {},   // subtopic_id → next_review_at (KST DATETIME) — 다지기 due 그룹핑
  understoodMissCount: {},    // subtopic_id → miss_count (v2: 누적 펼친 횟수, 별표 표시용)
  understoodLastMovedAt: {},  // subtopic_id → last_moved_at (v2: 박스 이동 시각, 다지기 박스 안 정렬용)
  normalMode: 'new',          // v2: 'new' | 'star' | 'all' — 일반 모드 탭. 챕터 진입 시 'new' 기본
  memorizedBoxOpen: {1:false, 2:false, 3:false, 4:false, 5:false, 6:false}, // v2: 다지기 6박스 펼침 상태. 모드 버튼으로만 펼침
  todayStatsCleared: 0,       // v2: 오늘 박스에서 내일 박스로 진급한 카드 (분자). 분모는 동적 계산
  todayStatsDate: '',         // v2: KST 날짜 키 — 자정 지나면 자동 리셋
  passedSet: new Set(),       // 이번 회 패스한 학습 카드 (세션만 — 새로고침 시 복원)
  memorizedView: false,       // 챕터 내 다지기 모드 (이해 완료(●) 학습 카드만 모아보기)
  memoSnapshotIds: new Set(), // 암기 모음 진입 시 보여줄 학습 카드 스냅샷 — 펼친 항목이 미암기로 분류돼도 이번 회는 그대로 보이게
  everExpandedSet: new Set(), // 이 챕터 진입 후 한 번이라도 펼쳐본 학습 카드 — 일반 모드 패스 판정용. 챕터 나가면 초기화
  memorizedExpandedSet: new Set(), // 다지기 모드 진입 후 펼친 카드 — 다지기 패스 판정용. 다지기 토글 ON 시 초기화
  memorizedAddressedSet: new Set(), // 다지기 모드 진입 후 한 번이라도 패스 처리한 카드 — 통계/디버그용
  memorizedClearedToday: false, // 이번 라운드에서 오늘 학습 카드를 한 번이라도 클리어(effPrev=1 → effNxt≠1)했는가
  celebrationActive: false, // celebration 애니메이션 진행 중 — 추가 패스가 또 celebration 발사하지 않게 가드
  activeRecallMode: false, // 능동 회상 모드 — 본문 블러 + "정답 보기" 강제 + 자기평가 (localStorage 영속화)
  activeRecallRevealed: new Set(), // 능동 회상에서 "정답 보기" 누른 카드 (블러 해제 + 평가 버튼 노출). 다지기 진입 시 리셋
  lastStudyDate: (() => { try { return localStorage.getItem('op_last_study_date') || ''; } catch { return ''; } })(), // 마지막 다지기 학습 KST 날짜 — 자정 넘김 안내용
  voiceQuizActive: false,    // 음성 퀴즈 세션 진행 중
  voiceQuizPhase: 'idle',    // 'idle' | 'reading' | 'listening' | 'correct-flash' | 'wrong-reveal' | 'timeout'
  voiceQuizTranscript: '',   // 사용자가 말한 내용 (디버그/표시용)
  voiceQuizExpected: '',     // 현재 카드의 정답 (items[0])
  voiceQuizMode: (() => { try { return localStorage.getItem('op_voice_quiz_mode') || 'manual'; } catch { return 'manual'; } })(), // 'manual' | 'auto' — 자동은 hands-free
  voiceQuizReadAloud: (() => { try { return localStorage.getItem('op_voice_quiz_read') === '1'; } catch { return false; } })(), // 문제(제목) TTS 읽어주기
  _voiceQuizRecognition: null, // SpeechRecognition 인스턴스
  _voiceQuizTimer: null,     // 4초 타이머 등
  firstLetterQuizActive: false, // 첫글자 퀴즈 세션 진행 중
  firstLetterQuizPhase: 'idle', // 'idle' | 'reading' | 'choosing' | 'correct-flash' | 'wrong-reveal'
  firstLetterQuizChoices: [],   // [{char, isCorrect}] 2개, 셔플됨
  firstLetterQuizSelected: '',  // 사용자가 고른 글자
  firstLetterQuizExpected: '',  // 정답 텍스트 (items[0])
  quizDoneSetVoice: new Set(),       // 🎤 음성 퀴즈 정답 카드 (독립 집합)
  quizDoneSetFirstLetter: new Set(), // ✏️ 첫글자 퀴즈 정답 카드 (독립 집합)
  // 정교화 ✓는 두 집합에 cascade. 정교화 ✗는 두 집합에서 cascade 제거.
  quizRecentWrongs: [],         // 최근 오답 카드 FIFO (최대 3개) — 다음 카드 선택 시 후순위로
  elaborationActive: false,     // 정교화 학습 모드 (포커스 모드) — 상단 chrome 숨기고 카드만 집중
  quizSoundEnabled: (() => { try { return localStorage.getItem('op_quiz_sound') !== '0'; } catch { return true; } })(), // 효과음 + 격려 음성 ON/OFF
  quizMilestonesHit: new Set(), // 이번 세션에 발사된 격려 milestone — 'start'/'20'/'10'/'clear'. 모드 시작마다 리셋
  stageCompletion: null,        // 자연 종료 시 "끝났어요" 문구 → 스르르 닫기 위한 임시 메시지
  stageClosing: false,          // 종료 메시지 후 dissolve 애니메이션 단계
  _stageCloseTimer1: null,
  _stageCloseTimer2: null,
  recentlyFailedFromMemo: new Set(), // 이번 챕터 진입 중 다지기에서 실패(펼침)해서 챕터 뷰로 돌아온 카드 — 챕터 뷰 정렬 시 맨 아래로
  peekedPassedSet: new Set(), // 펼친 뒤 패스해서 "틀린 단어"로 확정된 카드 — 챕터 뷰 정렬·색 구분용. 펼치는 순간이 아니라 패스 후에야 추가
  expanded: { topic: new Set(), subtopic: new Set() },
  liveCount: 0,
  liveCards: 0,           // 오늘 전체가 학습한 카드 수 (learners-now total_cards)
  studyDelta: 0,          // 마지막 ping 이후 내가 학습(pass)한 카드 수 — 다음 ping에 실어 전송
  pingTimer: null,
  liveTimer: null,
  interests: [],          // 사용자가 저장한 관심 주제 (subject 배열)
  chapterOrder: {},       // 챕터 순서 (드래그) — { 과목: [id, id, ...] }. /auth/me로부터 로드
};

// ============================================================
// API
// ============================================================
async function api(method, path, body) {
  const token = localStorage.getItem(TOKEN_KEY);
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API + path, {
    method, headers,
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch (_) {}
  if (!res.ok) {
    const err = new Error((data && data.error) || `HTTP ${res.status}`);
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

// ============================================================
// 유틸
// ============================================================
function $(id) { return document.getElementById(id); }
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}
function toast(msg, isError) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'show' + (isError ? ' error' : '');
  setTimeout(() => t.className = '', 2400);
}
function showLoading(on) { $('loading').classList.toggle('show', !!on); }
function formatPhone(p) {
  p = String(p || '').replace(/\D/g, '');
  if (p.length === 11) return `${p.slice(0,3)}-${p.slice(3,7)}-${p.slice(7)}`;
  if (p.length === 10) return `${p.slice(0,3)}-${p.slice(3,6)}-${p.slice(6)}`;
  return p;
}
function daysLeft(iso) {
  if (!iso) return null;
  // 서버의 expires_at은 KST wall-clock을 UTC 표기로 저장한 값.
  // 클라이언트의 '지금'도 같은 KST 프레임으로 옮겨 비교해야 D-N이 정확함.
  const nowKstMs = Date.now() + KST_OFFSET_MS;
  const expMs = new Date(iso).getTime();
  const diff = Math.ceil((expMs - nowKstMs) / (1000 * 60 * 60 * 24));
  return diff;
}

// 서버가 보낸 KST-as-UTC ISO 문자열을 사람이 읽는 한국 시간 표기로 변환
function fmtKst(iso, opts) {
  if (!iso) return '';
  // KST-as-UTC: 문자열 그대로 Date로 파싱하면 9시간 뒤 UTC로 해석되므로
  // 9시간 빼서 실제 의도된 시점(KST wall-clock)으로 되돌린 뒤 Asia/Seoul로 포맷.
  const realUtcMs = new Date(iso).getTime() - KST_OFFSET_MS;
  const d = new Date(realUtcMs);
  return d.toLocaleString('ko-KR', Object.assign({
    timeZone: KST_TZ,
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit',
  }, opts || {}));
}
function fmtKstDate(iso) {
  return fmtKst(iso, { hour: undefined, minute: undefined });
}
// JSON 컬럼에서 base64가 문자열 따옴표로 한번 더 감싸여 올 수 있는 경우 처리
function unwrapImage(b) {
  if (!b) return '';
  if (typeof b === 'string' && b.startsWith('"') && b.endsWith('"')) {
    try { return JSON.parse(b); } catch {}
  }
  return b;
}

// ── 단어 이미지 자동 매핑 (scripts/upload-word-images.js 가 생성한 word-images.json) ──
//    { "dog": "https://img.share.../...png", ... } — 카드 제목으로 이미지를 자동 표시.
let WORD_IMAGES = {};
// 파일명/제목 정규화 — 업로드 스크립트의 wordKey() 와 반드시 동일 규칙
function normWord(t) {
  return String(t || '').toLowerCase().replace(/\s+/g, ' ').trim();
}
async function loadWordImages() {
  try {
    const r = await fetch('word-images.json', { cache: 'no-cache' });
    if (r.ok) WORD_IMAGES = await r.json();
  } catch { /* 매핑표 없으면 단어 이미지 기능만 비활성, 나머지는 정상 */ }
}
// 단어 자동 이미지 조회 — 교사 대표이미지(image_b64)가 없을 때만 제목으로 매핑표 조회
function wordImageFor(s) {
  if (unwrapImage(s && s.image_b64)) return '';
  return WORD_IMAGES[normWord(s && s.title)] || '';
}

function renderWatermark() {
  const wm = $('watermark');
  if (!state.user || !state.user.phone) {
    wm.classList.remove('show');
    wm.innerHTML = '';
    return;
  }
  // 전화번호 뒤 5자리만 표시 — 식별 가능하면서 노출 최소화
  const digits = String(state.user.phone || '').replace(/\D/g, '');
  const text = digits.slice(-5);
  // SVG 패턴: 대각선 반복, 알파 더 옅게
  wm.innerHTML = `
    <svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
      <defs>
        <pattern id="wmPat" x="0" y="0" width="320" height="180" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
          <text x="0" y="80" fill="rgba(255,255,255,0.03)" font-size="22" font-weight="600" font-family="monospace">${escapeHtml(text)}</text>
          <text x="160" y="160" fill="rgba(255,255,255,0.03)" font-size="22" font-weight="600" font-family="monospace">${escapeHtml(text)}</text>
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#wmPat)"/>
    </svg>
  `;
  wm.classList.add('show');
}

document.addEventListener('contextmenu', e => { if (state.user) e.preventDefault(); });
document.addEventListener('keydown', e => {
  if (!state.user) return;
  // e.key는 IME 조합·일부 메타키에서 undefined일 수 있음 — 가드 필수
  const k = String(e.key || '').toLowerCase();
  if (!k) return;
  if ((e.ctrlKey || e.metaKey) && ['c','a','s','p','u'].includes(k)) {
    // 입력 필드에서는 허용
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    e.preventDefault();
    if (k === 'p' || k === 's') toast('인쇄·저장은 차단됩니다', true);
  }
});

function switchTab(tab) {
  const isLogin = tab === 'login';
  $('tabLogin').classList.toggle('active', isLogin);
  $('tabSignup').classList.toggle('active', !isLogin);
  $('loginForm').style.display = isLogin ? 'block' : 'none';
  $('signupForm').style.display = isLogin ? 'none' : 'block';
}

async function doLogin() {
  const email = $('li_email').value.trim();
  const password = $('li_password').value;
  if (!email || !password) return showAuthErr('login', '이메일/비밀번호 입력');
  $('loginBtn').disabled = true;
  hideAuthErr();
  try {
    const r = await api('POST', '/auth/login', { email, password });
    localStorage.setItem(TOKEN_KEY, r.token);
    state.user = r.user;
    state.point = Number(r.user.point) || 0;
    await loadMeAndEnter();
  } catch (e) {
    showAuthErr('login', e.message);
  } finally {
    $('loginBtn').disabled = false;
  }
}

async function doSignup() {
  const name = $('su_name').value.trim();
  const phone = $('su_phone').value.trim();
  const email = $('su_email').value.trim();
  const password = $('su_password').value;
  const ref = $('su_ref').value.trim().toUpperCase();
  if (!name || !phone || !email || !password) return showAuthErr('signup', '모든 필수 항목을 입력하세요');
  if (password.length < 6) return showAuthErr('signup', '비밀번호는 6자 이상');
  $('signupBtn').disabled = true;
  hideAuthErr();
  try {
    const body = { name, phone, email, password };
    if (ref) body.referral_code = ref;
    const utm = loadUtm();
    if (utm) body.utm = utm;
    const pendingInterests = loadPendingInterests();
    if (pendingInterests.length) body.interests = pendingInterests;
    const r = await api('POST', '/auth/signup', body);
    localStorage.setItem(TOKEN_KEY, r.token);
    localStorage.removeItem(REF_KEY);
    localStorage.removeItem(UTM_KEY);
    localStorage.removeItem(INTERESTS_KEY);
    state.user = r.user;
    state.point = 0;
    await loadMeAndEnter();
    toast('가입 완료! 환영합니다.');
  } catch (e) {
    showAuthErr('signup', e.message);
  } finally {
    $('signupBtn').disabled = false;
  }
}

// ============================================================
// UTM 어트리뷰션 — URL → localStorage (30일 유지)
// ============================================================
function captureUtmFromUrl() {
  try {
    const u = new URL(window.location.href);
    const utm = {
      source: u.searchParams.get('utm_source') || '',
      medium: u.searchParams.get('utm_medium') || '',
      campaign: u.searchParams.get('utm_campaign') || '',
      content: u.searchParams.get('utm_content') || '',
      term: u.searchParams.get('utm_term') || '',
      landing_url: window.location.href.slice(0, 500),
      referrer: (document.referrer || '').slice(0, 500),
      captured_at: Date.now(),
    };
    // 어트리뷰션 정보가 하나라도 있을 때만 저장
    if (utm.source || utm.medium || utm.campaign || utm.content || utm.term) {
      localStorage.setItem(UTM_KEY, JSON.stringify(utm));
    }
    // ?interest=수능,토익 또는 ?interest=수능&interest=토익 캡쳐
    const interestParams = u.searchParams.getAll('interest');
    const newInterests = [];
    for (const v of interestParams) {
      for (const s of String(v).split(',')) {
        const t = s.trim();
        if (t) newInterests.push(t);
      }
    }
    if (newInterests.length) {
      // 누적 — 이전 방문에서 캡쳐한 관심 주제와 합침 (Set으로 중복 제거)
      // ?interest=한자 방문 → ?interest=영어 방문 = localStorage에 [한자, 영어]
      const prev = loadPendingInterests();
      const merged = [...new Set([...prev, ...newInterests])].slice(0, 20);
      localStorage.setItem(INTERESTS_KEY, JSON.stringify({ interests: merged, at: Date.now() }));
    }
  } catch {}
}
function loadPendingInterests() {
  try {
    const raw = localStorage.getItem(INTERESTS_KEY);
    if (!raw) return [];
    const o = JSON.parse(raw);
    if (o.at && Date.now() - o.at > UTM_TTL_MS) {
      localStorage.removeItem(INTERESTS_KEY);
      return [];
    }
    return Array.isArray(o.interests) ? o.interests : [];
  } catch { return []; }
}
function loadUtm() {
  try {
    const raw = localStorage.getItem(UTM_KEY);
    if (!raw) return null;
    const utm = JSON.parse(raw);
    if (utm.captured_at && Date.now() - utm.captured_at > UTM_TTL_MS) {
      localStorage.removeItem(UTM_KEY);
      return null;
    }
    return utm;
  } catch { return null; }
}

function showAuthErr(form, msg) {
  const el = $(form === 'login' ? 'loginErr' : 'signupErr');
  el.textContent = msg;
  el.classList.add('show');
}
function hideAuthErr() {
  $('loginErr').classList.remove('show');
  $('signupErr').classList.remove('show');
}

async function checkRefCode(code) {
  const info = $('refInfo');
  if (!code || code.length < 4) { info.classList.remove('show'); return; }
  try {
    const r = await api('GET', '/referral/info?code=' + encodeURIComponent(code));
    if (r.valid) {
      info.textContent = `✓ ${r.name_masked} 님의 추천 — 가입+첫 결제 시 둘 다 1,000P`;
      info.classList.add('show');
    } else {
      info.textContent = '✗ 유효하지 않은 추천 코드';
      info.classList.add('show');
    }
  } catch { info.classList.remove('show'); }
}

function logout() {
  if (!confirm('로그아웃 하시겠습니까?')) return;
  localStorage.removeItem(TOKEN_KEY);
  state.user = null;
  stopTimers();
  $('watermark').classList.remove('show');

// ============================================================
// 자동 로그인 / 진입
// ============================================================
async function tryAutoLogin() {
  // ?ref=CODE URL 캡쳐
  try {
    const u = new URL(window.location.href);
    const ref = u.searchParams.get('ref');
    if (ref) localStorage.setItem(REF_KEY, ref);
  } catch {}
  // UTM 어트리뷰션 캡쳐 (가입 시 함께 전송)
  captureUtmFromUrl();
  const saved = localStorage.getItem(REF_KEY);
  if (saved && !localStorage.getItem(TOKEN_KEY)) {
    switchTab('signup');
    $('su_ref').value = saved.toUpperCase();
    checkRefCode(saved);
  }
  if (!localStorage.getItem(TOKEN_KEY)) return;
  try {
    await loadMeAndEnter();
  } catch (e) {
    localStorage.removeItem(TOKEN_KEY);
  }
}

async function loadMeAndEnter() {
  showLoading(true);
  try {
    const r = await api('GET', '/auth/me');
    state.user = r.user;
    state.point = Number(r.user.point) || 0;
    state.chapterAccess = r.chapter_access || {};
    state.interests = Array.isArray(r.user.interests) ? r.user.interests : [];
    // 챕터 순서 — 서버가 진실. 비어있으면 localStorage 백업에서 1회 마이그레이션.
    state.chapterOrder = (r.user.chapter_order && typeof r.user.chapter_order === 'object') ? r.user.chapter_order : {};
    if (Object.keys(state.chapterOrder).length === 0 && r.user.phone) {
      try {
        const raw = localStorage.getItem(CHAPTER_ORDER_KEY + '_' + r.user.phone);
        const local = raw ? JSON.parse(raw) : null;
        if (local && typeof local === 'object' && Object.keys(local).length > 0) {
          state.chapterOrder = local;
          // 백그라운드 동기화 — 실패해도 무시
          api('PUT', '/auth/me/chapter_order', { chapter_order: local }).catch(() => {});
        }
      } catch {}
    }
    renderWatermark();
    await enterHome();
  } finally {
    showLoading(false);
  }
}

  setTimeout(maybeShowWelcome, 350);

async function loadChapters() {
  const r = await api('GET', '/chapters');
  state.chapters = r.chapters || [];
}

async function loadUnderstood() {
  try {
    const r = await api('GET', '/understood');
    state.understoodSet = new Set((r.subtopic_ids || []).map(Number));
    state.understoodMarkedAt = {};
    state.understoodBox = {};
    state.understoodNextReview = {};
    state.understoodMissCount = {};
    state.understoodLastMovedAt = {};
    for (const it of (r.items || [])) {
      const sid = Number(it.subtopic_id);
      state.understoodMarkedAt[sid] = it.marked_at || '';
      state.understoodBox[sid] = Number(it.review_box) || 1;
      state.understoodNextReview[sid] = it.next_review_at || '';
      state.understoodMissCount[sid] = Number(it.miss_count) || 0;
      state.understoodLastMovedAt[sid] = it.last_moved_at || '';
    }
  } catch {}
}

async function loadLiveCount() {
  try {
    const r = await api('GET', '/stats/learners-now');
    state.liveCount = Number(r.count) || 0;
    state.liveCards = Number(r.total_cards) || 0;
    updateLiveChips();
  } catch {}
}
function updateLiveChips() {
  const show = state.liveCount > 0;
  const cardsTxt = state.liveCards > 0 ? ' · 오늘 ' + state.liveCards.toLocaleString() + '장' : '';
  // 홈 헤더 + 챕터 헤더 양쪽 동기화 (한 곳만 보이지만 둘 다 갱신해두면 화면 전환 시 즉시 반영)
  for (const [chipId, countId, cardsId] of [['liveChip', 'liveCount', 'liveCards'], ['liveChipCh', 'liveCountCh', 'liveCardsCh']]) {
    const chip = $(chipId);
    const count = $(countId);
    if (!chip || !count) continue;
    count.textContent = state.liveCount;
    const cardsEl = $(cardsId);
    if (cardsEl) cardsEl.textContent = cardsTxt;
    chip.style.display = show ? 'flex' : 'none';
  }
}

function renderHome() {
  $('homeGreeting').textContent = `${state.user.name || ''} 님, 안녕하세요`;
  $('homePoint').textContent = state.point.toLocaleString();

  const cards = $('chapterCards');
  if (!state.chapters.length) {
    cards.innerHTML = '<div class="empty-state">아직 공개된 챕터가 없습니다.</div>';
    return;
  }

  // 관심 주제 필터 — 체크된 주제만 표시. 비어있으면 전체 노출.
  let visibleChapters = state.chapters;
  if (state.interests.length > 0) {
    visibleChapters = state.chapters.filter(c =>
      state.interests.includes(c.subject || '기타')
    );
  }
  if (!visibleChapters.length) {
    cards.innerHTML = `
      <div class="empty-state">
        선택한 관심 주제에 해당하는 챕터가 없습니다.<br>
        <button onclick="openInterestModal()" style="margin-top:10px;background:rgba(233,69,96,0.2);border:1px solid rgba(233,69,96,0.5);color:#ff8a9e;padding:8px 18px;border-radius:50px;cursor:pointer;font-size:13px;">🎯 관심 주제 편집</button>
      </div>`;
    return;
  }

  // 과목별 그룹핑
  const groups = {};
  for (const c of visibleChapters) {
    const s = c.subject || '기타';
    if (!groups[s]) groups[s] = [];
    groups[s].push(c);
  }

  // 각 그룹 안: 사용자가 저장한 drag 순서 적용 (없으면 chapter.sort_order 기본)
  const savedOrder = loadChapterOrder();
  for (const subj in groups) {
    groups[subj] = sortChaptersBySaved(groups[subj], savedOrder[subj] || []);
  }

  let html = '';
  for (const subj of Object.keys(groups).sort()) {
    html += `<div class="subject-section">
      <div class="subject-title">${escapeHtml(subj).toUpperCase()}</div>
      <div class="chapter-cards" data-subject="${escapeHtml(subj)}">
        ${groups[subj].map(c => renderChapterCard(c)).join('')}
      </div>
    </div>`;
  }
  cards.innerHTML = html;

  // 드래그 재정렬 활성화 — 과목 그룹 안에서만 (꾹누름 250ms로 시작)
  attachChapterSortables();
}

// 사용자가 저장한 chapter id 순서대로 정렬. saved 목록에 없는 카드는 sort_order로 뒤에.
function sortChaptersBySaved(chapters, savedIds) {
  const idIdx = new Map(savedIds.map((id, i) => [Number(id), i]));
  return chapters.slice().sort((a, b) => {
    const ai = idIdx.has(Number(a.id)) ? idIdx.get(Number(a.id)) : 100000 + (Number(a.sort_order) || 0);
    const bi = idIdx.has(Number(b.id)) ? idIdx.get(Number(b.id)) : 100000 + (Number(b.sort_order) || 0);
    return ai - bi;
  });
}

const CHAPTER_ORDER_KEY = 'op_chapter_order_v1';
// 서버 동기화 — state.chapterOrder가 진실의 출처. localStorage는 오프라인/실패 시 백업.
function loadChapterOrder() {
  if (state.chapterOrder && typeof state.chapterOrder === 'object') return state.chapterOrder;
  // 로그인 전이거나 서버 응답 전 — 로컬 백업으로 폴백
  if (!state.user || !state.user.phone) return {};
  try {
    const raw = localStorage.getItem(CHAPTER_ORDER_KEY + '_' + state.user.phone);
    return raw ? JSON.parse(raw) : {};
  } catch { return {}; }
}
let _chapterOrderSaveTimer = null;
function saveChapterOrder(orderMap) {
  state.chapterOrder = orderMap;
  // 로컬 백업 — 오프라인이거나 서버 저장 실패해도 새로고침 시 살아남게
  if (state.user && state.user.phone) {
    try {
      localStorage.setItem(CHAPTER_ORDER_KEY + '_' + state.user.phone, JSON.stringify(orderMap));
    } catch {}
  }
  // 디바운스 서버 저장 — 드래그 연속 발생해도 0.8초 후 한 번만
  if (_chapterOrderSaveTimer) clearTimeout(_chapterOrderSaveTimer);
  _chapterOrderSaveTimer = setTimeout(() => {
    api('PUT', '/auth/me/chapter_order', { chapter_order: orderMap }).catch(() => {});
  }, 800);
}

// 각 .chapter-cards 컨테이너에 Sortable 부착 — 과목 그룹 안에서만 드래그
function attachChapterSortables() {
  if (typeof Sortable === 'undefined') return; // 라이브러리 로드 실패 시 무시
  document.querySelectorAll('.chapter-cards[data-subject]').forEach(el => {
    if (el._sortable) { try { el._sortable.destroy(); } catch {} }
    el._sortable = Sortable.create(el, {
      animation: 200,
      delay: 200,             // 200ms 꾹누름 → 드래그 시작 (PC·모바일 둘 다)
      delayOnTouchOnly: false,
      touchStartThreshold: 4,
      forceFallback: true,    // touch-action: manipulation 등 CSS 간섭 우회 (Sortable 자체 fallback)
      fallbackClass: 'sortable-fallback',
      fallbackTolerance: 4,
      ghostClass: 'sortable-ghost',
      chosenClass: 'sortable-chosen',
      dragClass: 'sortable-drag',
      onEnd: () => {
        const subject = el.dataset.subject;
        const ids = Array.from(el.querySelectorAll('.chapter-card[data-chapter-id]'))
          .map(c => Number(c.dataset.chapterId))
          .filter(Boolean);
        const all = loadChapterOrder();
        all[subject] = ids;
        saveChapterOrder(all);
      },
    });
  });
}

function renderChapterCard(c) {
  const isTeacher = state.user && state.user.role === 'teacher';
  const access = state.chapterAccess[c.id];
  const dLeft = access ? daysLeft(access.expires_at) : null;
  const isAllFree = Number(c.is_all_free) === 1;
  const isPaidActive = !isTeacher && !isAllFree && dLeft != null && dLeft > 0;
  const isActive = isTeacher || isAllFree || isPaidActive;

  // 우측 상단 코너 배지 — 유료 활성 챕터의 남은 기간 (만료 KST 시각 tooltip)
  let cornerBadge = '';
  if (isPaidActive) {
    const expTip = `만료: ${fmtKst(access.expires_at)} (KST)`;
    cornerBadge = `<span class="ch-corner-badge" title="${escapeHtml(expTip)}">D-${dLeft}</span>`;
  }

  // 카드 본문의 인라인 상태 (D-N은 코너에 있으니 생략)
  let statusBadge = '', statusClass = '';
  if (isTeacher) { statusBadge = '🛠 관리자'; statusClass = 'free'; }
  else if (isAllFree) { statusBadge = '✨ 무료'; statusClass = 'free'; }
  else if (isPaidActive) { statusBadge = ''; }
  else if (access) { statusBadge = '만료됨'; statusClass = 'expired'; }
  else { statusBadge = '미구매'; statusClass = 'never'; }

  const price = Number(c.monthly_price) || 3000;
  const canRedeem = state.point >= REDEEM_COST;

  // 미구매 챕터도 카드 클릭으로 진입 → 무료 목차는 열람, 유료 목차는 🔒
  let actions;
  if (isActive) {
    actions = `<button class="primary" onclick="event.stopPropagation();enterChapter(${c.id})">열기 →</button>`;
  } else {
    actions = `
      <button onclick="event.stopPropagation();enterChapter(${c.id})">무료 보기 →</button>
      <button onclick="event.stopPropagation();openPayModal(${c.id})">${price.toLocaleString()}원 결제</button>
      <button onclick="event.stopPropagation();confirmRedeem(${c.id})" ${canRedeem ? '' : 'disabled'}>${REDEEM_COST}P 사용</button>
    `;
  }

  return `
    <div class="chapter-card ${access && !isActive && !isTeacher ? 'expired' : ''}" data-chapter-id="${c.id}" onclick="enterChapter(${c.id})">
      ${cornerBadge}
      <div class="ch-icon">${escapeHtml(c.icon || '📘')}</div>
      <div class="ch-title">${escapeHtml(c.title)}</div>
      <div class="ch-desc">${escapeHtml(c.description || '')}</div>
      ${statusBadge ? `<span class="ch-status ${statusClass}">${statusBadge}</span>` : ''}
      <div class="ch-actions">${actions}</div>
    </div>
  `;
}
