<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0a1a">
<title>원페이지 학습</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', sans-serif; background: #0a0a1a; color: #e5e7eb; }
body {
  line-height: 1.6; -webkit-text-size-adjust: 100%;
  -webkit-user-select: none; -moz-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  overflow-x: hidden;
}
button { font: inherit; cursor: pointer; border: none; }
input { font: inherit; outline: none; }
a { color: #4fc3f7; text-decoration: none; }
/* 인쇄 차단 */
@media print { html, body { display: none !important; } }

/* ─────────────────────────────────────────────
   워터마크 — 전체 화면 대각선 반복 (캡쳐 추적용)
   ───────────────────────────────────────────── */
#watermark {
  position: fixed; inset: 0; z-index: 9999;
  pointer-events: none; overflow: hidden;
  display: none;
}
#watermark.show { display: block; }
#watermark svg { width: 100%; height: 100%; }

/* ─────────────────────────────────────────────
   공통 — 헤더
   ───────────────────────────────────────────── */
.app-header {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; background: rgba(10,10,26,0.95);
  border-bottom: 1px solid #1f1f3a;
  position: sticky; top: 0; z-index: 50;
  backdrop-filter: blur(10px);
}
.app-header .brand {
  display: flex; align-items: center; gap: 6px;
  font-size: 15px; font-weight: 800; color: #fff;
}
.app-header .brand em { font-style: normal; color: #e94560; }
.app-header .back-btn {
  background: rgba(255,255,255,0.05); color: #fff;
  padding: 6px 10px; border-radius: 6px; font-size: 13px;
  margin-right: 2px;
}
.app-header .home-btn {
  background: rgba(255,255,255,0.06); color: #fff;
  width: 36px; height: 36px; border-radius: 8px;
  display: inline-flex; align-items: center; justify-content: center;
  border: none; cursor: pointer;
  transition: background 0.15s, transform 0.1s;
  -webkit-tap-highlight-color: transparent;
}
.app-header .home-btn:hover { background: rgba(255,255,255,0.12); }
.app-header .home-btn:active { transform: scale(0.92); }
.app-header .live-chip {
  display: flex; align-items: center; gap: 5px;
  background: rgba(76,175,80,0.15); border: 1px solid rgba(76,175,80,0.3);
  padding: 4px 10px; border-radius: 50px; font-size: 11px; color: #81c784;
  font-weight: 600;
}
.app-header .live-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: #4caf50; animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.4} }
.app-header .spacer { flex: 1; }
.app-header .icon-btn {
  background: rgba(255,255,255,0.05); color: #ddd;
  padding: 6px 10px; border-radius: 6px; font-size: 12px;
  display: inline-flex; align-items: center; gap: 4px;
}
.app-header .icon-btn:hover { background: rgba(255,255,255,0.1); }
/* 모두 접기 버튼 — 가운데, v^ 아이콘 + "접기" 라벨 */
.app-header .collapse-center {
  padding: 6px 14px;
  background: rgba(233,69,96,0.18); border: 1px solid rgba(233,69,96,0.45);
  color: #ff8a9e;
  display: inline-flex; align-items: center; gap: 6px;
  border-radius: 50px;
  transition: background 0.15s, transform 0.1s;
  font-size: 12px; font-weight: 700;
}
.app-header .collapse-center:hover { background: rgba(233,69,96,0.28); }
.app-header .collapse-center:active { transform: scale(0.94); }
.app-header .collapse-center svg { flex-shrink: 0; }
.app-header .collapse-center .cc-label {
  white-space: nowrap;
}
/* 암기 모음 토글 */
.app-header .memorized-toggle {
  padding: 6px 12px;
  background: rgba(165,214,167,0.12); border: 1px solid rgba(165,214,167,0.35);
  color: #a5d6a7;
  border-radius: 50px;
  transition: background 0.15s, transform 0.1s;
  font-size: 12px; font-weight: 700;
}
.app-header .memorized-toggle:hover { background: rgba(165,214,167,0.22); }
.app-header .memorized-toggle:active { transform: scale(0.94); }
.app-header .memorized-toggle.active {
  background: rgba(165,214,167,0.32);
  border-color: rgba(165,214,167,0.7);
  color: #c8e6c9;
  box-shadow: 0 0 0 2px rgba(165,214,167,0.15);
}

/* 암기 모음 헤더 — 학습 모드의 topic-head와 같은 레이아웃 (좌: 제목, 우: ⤴ 패스) */
.memo-header {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px; margin-top: 6px;
  background: linear-gradient(180deg, rgba(165,214,167,0.10) 0%, rgba(165,214,167,0.04) 100%);
  border: 1px solid rgba(165,214,167,0.3);
  border-radius: 10px;
}
.memo-header .memo-title {
  flex: 1; font-size: 15px; font-weight: 800;
  color: #c8e6c9; display: flex; align-items: center; gap: 8px;
}
.memo-header .memo-count {
  font-size: 11px; padding: 2px 8px; border-radius: 50px;
  background: rgba(165,214,167,0.18); color: #a5d6a7; font-weight: 700;
}

.memo-empty {
  text-align: center; padding: 60px 20px;
  color: rgba(255,255,255,0.5);
}
.memo-empty .memo-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }
.memo-empty .memo-hint { font-size: 12px; margin-top: 8px; color: rgba(255,255,255,0.35); }

/* ─────────────────────────────────────────────
   로그인/회원가입
   ───────────────────────────────────────────── */
#authScreen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
.auth-card {
  width: 100%; max-width: 380px;
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  border: 1px solid #2a2a4e; border-radius: 18px;
  padding: 26px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}
.auth-card h1 {
  text-align: center; font-size: 1.5em; font-weight: 800;
  color: #fff; margin-bottom: 4px;
}
.auth-card .sub {
  text-align: center; font-size: 13px;
  color: rgba(255,255,255,0.55); margin-bottom: 18px;
}
.auth-tabs {
  display: flex; gap: 4px; background: rgba(0,0,0,0.3);
  border-radius: 8px; padding: 4px; margin-bottom: 16px;
}
.auth-tabs button {
  flex: 1; padding: 8px; background: transparent;
  color: rgba(255,255,255,0.5); border-radius: 6px;
  font-size: 13px; font-weight: 600; transition: all 0.15s;
}
.auth-tabs button.active {
  background: rgba(233,69,96,0.2); color: #fff;
}
.auth-card label {
  display: block; font-size: 12px; color: rgba(255,255,255,0.6);
  margin-bottom: 4px; margin-top: 10px; font-weight: 600;
}
.auth-card input {
  width: 100%; padding: 10px 12px;
  background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px; color: #fff; font-size: 14px;
  -webkit-user-select: text; user-select: text;
}
.auth-card input:focus { border-color: #e94560; }
.auth-card .err {
  background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.4);
  color: #fca5a5; padding: 9px 12px; border-radius: 8px;
  font-size: 13px; margin-top: 12px; display: none;
}
.auth-card .err.show { display: block; }
.auth-card .ref-info {
  background: rgba(255,193,7,0.1); border: 1px solid rgba(255,193,7,0.3);
  color: #ffd54f; padding: 8px 12px; border-radius: 6px;
  font-size: 12px; margin-top: 8px; display: none;
}
.auth-card .ref-info.show { display: block; }
.auth-card button.primary {
  width: 100%; margin-top: 18px; padding: 12px;
  background: linear-gradient(135deg, #e94560, #ff6b6b);
  color: #fff; font-weight: 700; border-radius: 8px;
  font-size: 14px;
}
.auth-card button.primary:disabled { opacity: 0.5; cursor: wait; }

/* ─────────────────────────────────────────────
   홈 — 챕터 카드 목록
   ───────────────────────────────────────────── */
#homeScreen { display: none; }
.home-top {
  background: linear-gradient(180deg, #16213e 0%, #0a0a1a 100%);
  padding: 20px 18px 26px;
}
.home-greeting {
  font-size: 18px; font-weight: 700; color: #fff;
  margin-bottom: 6px;
}
.home-meta {
  font-size: 13px; color: rgba(255,255,255,0.55);
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
}
.home-meta .point-chip {
  display: inline-flex; align-items: center; gap: 4px;
  background: rgba(255,193,7,0.15); border: 1px solid rgba(255,193,7,0.3);
  padding: 5px 14px; border-radius: 50px; color: #ffd54f; font-weight: 700;
  cursor: pointer; font-size: 13px; transition: background 0.15s;
  -webkit-tap-highlight-color: rgba(255,193,7,0.3);
}
.home-meta .point-chip:hover { background: rgba(255,193,7,0.25); }
.home-meta .point-chip:active { transform: scale(0.97); }
.home-actions {
  display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap;
}
.home-actions button {
  background: rgba(255,255,255,0.08); color: #fff;
  padding: 8px 14px; border-radius: 50px; font-size: 13px;
  display: inline-flex; align-items: center; gap: 5px;
}
.home-actions button.featured {
  background: linear-gradient(135deg, #e94560, #ff6b6b); color: #fff;
}
.home-actions button:hover { background: rgba(255,255,255,0.15); }
.home-actions button.featured:hover { filter: brightness(1.1); }

.home-content {
  max-width: 760px; margin: 0 auto; padding: 22px 16px 60px;
}
.subject-section {
  margin-bottom: 26px;
}
.subject-title {
  font-size: 12px; color: rgba(255,255,255,0.5);
  margin-bottom: 10px; padding-left: 4px; letter-spacing: 0.08em;
  font-weight: 700;
}
.chapter-cards {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
}
.chapter-card {
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  border: 1px solid #2a2a4e; border-radius: 14px;
  padding: 16px; cursor: pointer; transition: all 0.2s;
  position: relative; overflow: hidden;
  -webkit-tap-highlight-color: rgba(233,69,96,0.15);
  touch-action: manipulation;
  /* 박스 크기 고정 — 2줄 제목 카드도 안에 다 들어가는 높이.
     내용은 자연스럽게 위에서부터 흐름 → 1줄 제목 카드는 아래쪽 여백이 생기지만 박스 크기는 동일 */
  min-height: 184px;
}
.chapter-card .ch-corner-badge {
  position: absolute; top: 8px; right: 10px;
  background: rgba(76,175,80,0.25); color: #81c784;
  padding: 3px 9px; border-radius: 50px;
  font-size: 10px; font-weight: 800; letter-spacing: 0.02em;
  border: 1px solid rgba(76,175,80,0.3);
}
.chapter-card:hover { transform: translateY(-3px); border-color: rgba(233,69,96,0.4); }
.chapter-card.expired { opacity: 0.7; }
.chapter-card .ch-icon { font-size: 32px; margin-bottom: 8px; }
.chapter-card .ch-title {
  font-size: 16px; font-weight: 700; color: #fff;
  margin-bottom: 8px; word-break: keep-all;
  /* 2줄 분량 공간 예약 → 1줄/2줄 제목 모두 다음 요소(무료 배지·열기 버튼) 위치 동일.
     line-height 1.55 기준 2줄 = 3.1em, 약간의 여유 포함해서 3.2em */
  min-height: 3.2em;
}
.chapter-card .ch-desc { font-size: 11px; color: rgba(255,255,255,0.5); margin-bottom: 12px; min-height: 16px; }
.chapter-card .ch-status {
  display: inline-block; padding: 3px 10px; border-radius: 50px;
  font-size: 10px; font-weight: 700;
}
.chapter-card .ch-status.active { background: rgba(76,175,80,0.2); color: #81c784; }
.chapter-card .ch-status.expired { background: rgba(255,152,0,0.2); color: #ffb74d; }
.chapter-card .ch-status.never { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); }
.chapter-card .ch-status.free { background: rgba(76,175,80,0.25); color: #81c784; }
.chapter-card .ch-actions {
  display: flex; gap: 5px; margin-top: 10px;
}
.chapter-card .ch-actions button {
  flex: 1; padding: 7px; font-size: 11px; font-weight: 600;
  background: rgba(255,255,255,0.08); color: #fff; border-radius: 6px;
}
.chapter-card .ch-actions button.primary {
  background: linear-gradient(135deg, #e94560, #ff6b6b);
}
.chapter-card .ch-actions button:disabled { opacity: 0.4; cursor: not-allowed; }
.chapter-card .ch-progress {
  margin-top: 8px; font-size: 10px; color: rgba(255,255,255,0.4);
}

/* ─────────────────────────────────────────────
   챕터 상세 — 트리
   ───────────────────────────────────────────── */
#chapterScreen { display: none; }
.chapter-header {
  background: linear-gradient(180deg, #16213e 0%, #0a0a1a 100%);
  padding: 14px 18px 16px;
  text-align: center;
}
.chapter-header .ch-subj {
  display: inline-block;
  font-size: 11px; color: rgba(255,255,255,0.6);
  letter-spacing: 0.08em; margin-bottom: 4px;
  background: rgba(255,255,255,0.06);
  padding: 2px 10px; border-radius: 50px;
}
.chapter-header .ch-name {
  font-size: 20px; font-weight: 800; color: #fff;
  word-break: keep-all; line-height: 1.3;
}
.chapter-header .ch-meta {
  margin-top: 6px; font-size: 11px; color: rgba(255,255,255,0.5);
}
.chapter-tree {
  max-width: 760px; margin: 0 auto;
  /* padding-bottom: 100vh — 콘텐츠가 줄어도 페이지 최대 스크롤이 변하지 않도록
     마지막 대목차 아래에 항상 화면 1개 분의 여유 공간 (브라우저 자동 위로 스크롤 방지) */
  padding: 16px 14px 100vh;
  overflow-anchor: none;
}

.topic-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px; margin-bottom: 10px; overflow: hidden;
  transition: border-color 0.2s;
}
.topic-card.opened { border-color: rgba(233,69,96,0.4); }
.topic-card.locked { background: rgba(255,255,255,0.02); }

/* 학습 컨트롤 — 대목차 헤더 안에 표시 (펼친 상태일 때) */
.study-controls {
  display: flex; gap: 4px; flex-shrink: 0;
  margin-left: auto;
  pointer-events: auto;
}
.study-controls * { pointer-events: auto; }
.study-btn {
  height: 28px; padding: 0 9px;
  border-radius: 14px;
  font-size: 11px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid transparent;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.1s, background 0.15s;
  white-space: nowrap;
}
.study-btn.skip   { background: rgba(79,195,247,0.18); color: #4fc3f7; border-color: rgba(79,195,247,0.3); }
.study-btn.expand { background: rgba(255,193,7,0.18); color: #ffd54f; border-color: rgba(255,193,7,0.3); }
.study-btn.done   { background: rgba(76,175,80,0.2); color: #81c784; border-color: rgba(76,175,80,0.35); }
.study-btn.reset  { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.7); border-color: rgba(255,255,255,0.15); }
.study-btn:active { transform: scale(0.92); }

/* 현재 학습 대상 (맨 위 미학습 소목차) — 주황 강조 */
.subtopic.current {
  background: linear-gradient(180deg, rgba(255,138,0,0.22) 0%, rgba(255,138,0,0.10) 100%) !important;
  border-color: rgba(255,138,0,0.55) !important;
  box-shadow: 0 0 0 1px rgba(255,138,0,0.25);
}
.subtopic.current .subtopic-title { color: #ffb74d; }

/* 소목차마다 액션 버튼 — head 안 우측에 표시 */
.subtopic-actions {
  display: flex; gap: 4px; flex-shrink: 0;
  pointer-events: auto;
}
.subtopic-head > .subtopic-actions,
.subtopic-head > .subtopic-actions * { pointer-events: auto; }
.sa-btn {
  height: 26px; padding: 0 8px;
  border-radius: 13px;
  border: 1px solid transparent;
  font-size: 11px; font-weight: 700;
  cursor: pointer; white-space: nowrap;
  display: inline-flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.1s, background 0.15s;
}
.sa-btn:active { transform: scale(0.92); }
.sa-btn.skip   { background: rgba(79,195,247,0.16); color: #4fc3f7;  border-color: rgba(79,195,247,0.3); }
.sa-btn.expand { background: rgba(255,193,7,0.16);  color: #ffd54f;  border-color: rgba(255,193,7,0.3); }
.sa-btn.done   { background: rgba(76,175,80,0.2);   color: #81c784;  border-color: rgba(76,175,80,0.35); }
.sa-btn.redo   { background: rgba(255,138,0,0.18);  color: #ffb74d;  border-color: rgba(255,138,0,0.3); }

/* 큰 패스 버튼 — 대목차 헤더 오른쪽, 항상 같은 크기로 고정 */
.study-btn.skip-big {
  padding: 0 22px; width: 110px; height: 30px;
  border-radius: 50px;
  background: rgba(79,195,247,0.22);
  color: #81d4fa;
  border: 1px solid rgba(79,195,247,0.45);
  font-size: 13px; font-weight: 800;
  letter-spacing: 0.02em;
  box-shadow: 0 2px 12px rgba(79,195,247,0.15);
  flex-shrink: 0;
}
.study-btn.skip-big:active {
  background: rgba(79,195,247,0.4);
  transform: scale(0.94);
}

/* ───── 축하 폭죽 오버레이 ───── */
.celebration {
  position: fixed; inset: 0;
  background: rgba(10,10,26,0.88);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999; overflow: hidden;
  animation: celFadeIn 0.3s ease-out;
}
@keyframes celFadeIn { from { opacity: 0; } to { opacity: 1; } }
.cel-content {
  text-align: center; position: relative; z-index: 2;
  animation: celPop 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes celPop {
  0%   { transform: scale(0.3); opacity: 0; }
  100% { transform: scale(1);   opacity: 1; }
}
.cel-icon {
  font-size: 88px;
  animation: celBounce 0.9s ease-in-out infinite alternate;
}
@keyframes celBounce {
  0%   { transform: scale(1)    rotate(-10deg); }
  100% { transform: scale(1.15) rotate(10deg);  }
}
.cel-text {
  font-size: 30px; font-weight: 900;
  color: #ffd54f; margin-top: 14px;
  text-shadow: 0 4px 24px rgba(0,0,0,0.6);
  word-break: keep-all;
}
.cel-sub {
  font-size: 14px; color: rgba(255,255,255,0.75);
  margin-top: 8px; word-break: keep-all;
}
.confetti-piece {
  position: absolute; top: -50px;
  animation: confettiFall linear forwards;
  pointer-events: none; z-index: 1;
}
@keyframes confettiFall {
  to { transform: translateY(120vh) rotate(720deg); opacity: 0; }
}
.topic-head {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px; cursor: pointer;
  /* 패스 버튼 누를 때 헤더 전체가 핑크색으로 깜빡이는 것 방지 */
  -webkit-tap-highlight-color: transparent;
}
.topic-head > * { pointer-events: none; }
.topic-head > .study-controls,
.topic-head > .study-controls * { pointer-events: auto; }
.topic-head:hover { background: rgba(255,255,255,0.02); }
.topic-arrow {
  color: #e94560; font-size: 12px; width: 12px; text-align: center;
  transition: transform 0.2s; flex-shrink: 0;
}
.topic-card.opened .topic-arrow { transform: rotate(90deg); }
.topic-card.locked .topic-arrow { color: rgba(255,255,255,0.3); }
.topic-title {
  font-size: 15px; font-weight: 700; color: #fff;
  min-width: 0; flex-shrink: 1;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.topic-title .free-tag {
  display: inline-block; background: rgba(76,175,80,0.25); color: #81c784;
  font-size: 10px; padding: 2px 8px; border-radius: 50px;
  margin-left: 8px; font-weight: 700; vertical-align: middle;
}

<script>
'use strict';

// ============================================================
// 설정
// ============================================================
const API = 'https://onepage-api.memoryking.workers.dev';
const TOKEN_KEY = 'op_user_token';
const REF_KEY = 'op_ref_code';
const UTM_KEY = 'op_utm';
const UTM_TTL_MS = 30 * 24 * 3600 * 1000;   // 30일 유지 (재방문 시까지 어트리뷰션 유지)
const LANDING_URL = 'https://vipup.site/onepage';   // 결제 안내 페이지
const REDEEM_COST = 3000;
// 모든 시간은 KST(한국 표준시) 기준. 서버는 expires_at 등을 KST wall-clock으로 저장.
const KST_OFFSET_MS = 9 * 60 * 60 * 1000;
const KST_TZ = 'Asia/Seoul';

// ============================================================
// 상태
// ============================================================
const state = {
  user: null,
  point: 0,
  chapterAccess: {},          // chapter_id → { expires_at, source }
  chapters: [],
  currentChapter: null,
  topicsByChapter: {},
  subtopicsByTopic: {},
  itemsBySubtopic: {},
  understoodSet: new Set(),
  understoodMarkedAt: {},     // subtopic_id → marked_at (YYYY-MM-DD HH:MM:SS) — 암기 모음 정렬용
  passedSet: new Set(),       // 이번 회 패스한 소목차 (세션만 — 새로고침 시 복원)
  memorizedView: false,       // 챕터 내 암기 모음 모드 (꾹누른 소목차만 모아보기)
  expanded: { topic: new Set(), subtopic: new Set() },
  liveCount: 0,
  pingTimer: null,
  liveTimer: null,
};

// ============================================================
// API
// ============================================================
async function api(method, path, body) {
  const token = localStorage.getItem(TOKEN_KEY);
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API + path, {
    method, headers,
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch (_) {}
  if (!res.ok) {
    const err = new Error((data && data.error) || `HTTP ${res.status}`);
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

// ============================================================
// 유틸
// ============================================================
function $(id) { return document.getElementById(id); }
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}
function toast(msg, isError) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'show' + (isError ? ' error' : '');
  setTimeout(() => t.className = '', 2400);
}
function showLoading(on) { $('loading').classList.toggle('show', !!on); }
function formatPhone(p) {
  p = String(p || '').replace(/\D/g, '');
  if (p.length === 11) return `${p.slice(0,3)}-${p.slice(3,7)}-${p.slice(7)}`;
  if (p.length === 10) return `${p.slice(0,3)}-${p.slice(3,6)}-${p.slice(6)}`;
  return p;
}
function daysLeft(iso) {
  if (!iso) return null;
  // 서버의 expires_at은 KST wall-clock을 UTC 표기로 저장한 값.
  // 클라이언트의 '지금'도 같은 KST 프레임으로 옮겨 비교해야 D-N이 정확함.
  const nowKstMs = Date.now() + KST_OFFSET_MS;
  const expMs = new Date(iso).getTime();
  const diff = Math.ceil((expMs - nowKstMs) / (1000 * 60 * 60 * 24));
  return diff;
}

// 서버가 보낸 KST-as-UTC ISO 문자열을 사람이 읽는 한국 시간 표기로 변환
function fmtKst(iso, opts) {
  if (!iso) return '';
  // KST-as-UTC: 문자열 그대로 Date로 파싱하면 9시간 뒤 UTC로 해석되므로
  // 9시간 빼서 실제 의도된 시점(KST wall-clock)으로 되돌린 뒤 Asia/Seoul로 포맷.
  const realUtcMs = new Date(iso).getTime() - KST_OFFSET_MS;
  const d = new Date(realUtcMs);
  return d.toLocaleString('ko-KR', Object.assign({
    timeZone: KST_TZ,
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit',
  }, opts || {}));
}
function fmtKstDate(iso) {
  return fmtKst(iso, { hour: undefined, minute: undefined });
}
// JSON 컬럼에서 base64가 문자열 따옴표로 한번 더 감싸여 올 수 있는 경우 처리
function unwrapImage(b) {
  if (!b) return '';
  if (typeof b === 'string' && b.startsWith('"') && b.endsWith('"')) {
    try { return JSON.parse(b); } catch {}
  }
  return b;
}

document.addEventListener('contextmenu', e => { if (state.user) e.preventDefault(); });
document.addEventListener('keydown', e => {

function switchTab(tab) {
  const isLogin = tab === 'login';
  $('tabLogin').classList.toggle('active', isLogin);
  $('tabSignup').classList.toggle('active', !isLogin);
  $('loginForm').style.display = isLogin ? 'block' : 'none';
  $('signupForm').style.display = isLogin ? 'none' : 'block';
}

async function doLogin() {
  const email = $('li_email').value.trim();
  const password = $('li_password').value;
  if (!email || !password) return showAuthErr('login', '이메일/비밀번호 입력');
  $('loginBtn').disabled = true;
  hideAuthErr();
  try {
    const r = await api('POST', '/auth/login', { email, password });
    localStorage.setItem(TOKEN_KEY, r.token);
    state.user = r.user;
    state.point = Number(r.user.point) || 0;
    await loadMeAndEnter();
  } catch (e) {
    showAuthErr('login', e.message);
  } finally {
    $('loginBtn').disabled = false;
  }
}

async function doSignup() {
  const name = $('su_name').value.trim();
  const phone = $('su_phone').value.trim();
  const email = $('su_email').value.trim();
  const password = $('su_password').value;
  const ref = $('su_ref').value.trim().toUpperCase();
  if (!name || !phone || !email || !password) return showAuthErr('signup', '모든 필수 항목을 입력하세요');
  if (password.length < 6) return showAuthErr('signup', '비밀번호는 6자 이상');
  $('signupBtn').disabled = true;
  hideAuthErr();
  try {
    const body = { name, phone, email, password };
    if (ref) body.referral_code = ref;
    const utm = loadUtm();
    if (utm) body.utm = utm;
    const r = await api('POST', '/auth/signup', body);
    localStorage.setItem(TOKEN_KEY, r.token);
    localStorage.removeItem(REF_KEY);
    localStorage.removeItem(UTM_KEY);
    state.user = r.user;
    state.point = 0;
    await loadMeAndEnter();
    toast('가입 완료! 환영합니다.');
  } catch (e) {
    showAuthErr('signup', e.message);
  } finally {
    $('signupBtn').disabled = false;
  }
}

// ============================================================
// UTM 어트리뷰션 — URL → localStorage (30일 유지)
// ============================================================
function captureUtmFromUrl() {
  try {
    const u = new URL(window.location.href);
    const utm = {
      source: u.searchParams.get('utm_source') || '',
      medium: u.searchParams.get('utm_medium') || '',
      campaign: u.searchParams.get('utm_campaign') || '',
      content: u.searchParams.get('utm_content') || '',
      term: u.searchParams.get('utm_term') || '',
      landing_url: window.location.href.slice(0, 500),
      referrer: (document.referrer || '').slice(0, 500),
      captured_at: Date.now(),
    };
    // 어트리뷰션 정보가 하나라도 있을 때만 저장
    if (utm.source || utm.medium || utm.campaign || utm.content || utm.term) {
      localStorage.setItem(UTM_KEY, JSON.stringify(utm));
    }
  } catch {}
}
function loadUtm() {
  try {
    const raw = localStorage.getItem(UTM_KEY);
    if (!raw) return null;
    const utm = JSON.parse(raw);
    if (utm.captured_at && Date.now() - utm.captured_at > UTM_TTL_MS) {
      localStorage.removeItem(UTM_KEY);
      return null;
    }
    return utm;
  } catch { return null; }
}

function showAuthErr(form, msg) {
  const el = $(form === 'login' ? 'loginErr' : 'signupErr');
  el.textContent = msg;
  el.classList.add('show');
}
function hideAuthErr() {
  $('loginErr').classList.remove('show');
  $('signupErr').classList.remove('show');
}

async function checkRefCode(code) {
  const info = $('refInfo');
  if (!code || code.length < 4) { info.classList.remove('show'); return; }
  try {
    const r = await api('GET', '/referral/info?code=' + encodeURIComponent(code));
    if (r.valid) {
      info.textContent = `✓ ${r.name_masked} 님의 추천 — 가입+첫 결제 시 둘 다 1,000P`;
      info.classList.add('show');
    } else {
      info.textContent = '✗ 유효하지 않은 추천 코드';
      info.classList.add('show');
    }
  } catch { info.classList.remove('show'); }
}

function logout() {

  localStorage.removeItem(TOKEN_KEY);

async function tryAutoLogin() {
  // ?ref=CODE URL 캡쳐
  try {
    const u = new URL(window.location.href);
    const ref = u.searchParams.get('ref');
    if (ref) localStorage.setItem(REF_KEY, ref);
  } catch {}
  // UTM 어트리뷰션 캡쳐 (가입 시 함께 전송)
  captureUtmFromUrl();
  const saved = localStorage.getItem(REF_KEY);
  if (saved && !localStorage.getItem(TOKEN_KEY)) {
    switchTab('signup');
    $('su_ref').value = saved.toUpperCase();
    checkRefCode(saved);
  }
  if (!localStorage.getItem(TOKEN_KEY)) return;
  try {
    await loadMeAndEnter();
  } catch (e) {
    localStorage.removeItem(TOKEN_KEY);
  }
}

async function loadMeAndEnter() {
  showLoading(true);
  try {
    const r = await api('GET', '/auth/me');
    state.user = r.user;
    state.point = Number(r.user.point) || 0;
    state.chapterAccess = r.chapter_access || {};
    renderWatermark();
    await enterHome();
  } finally {
    showLoading(false);
  }
}

function updateLiveChips() {

function renderHome() {
  $('homeGreeting').textContent = `${state.user.name || ''} 님, 안녕하세요`;
  $('homePoint').textContent = state.point.toLocaleString();

  const cards = $('chapterCards');
  if (!state.chapters.length) {
    cards.innerHTML = '<div class="empty-state">아직 공개된 챕터가 없습니다.</div>';
    return;
  }

  // 과목별 그룹핑
  const groups = {};
  for (const c of state.chapters) {
    const s = c.subject || '기타';
    if (!groups[s]) groups[s] = [];
    groups[s].push(c);
  }
  let html = '';
  for (const subj of Object.keys(groups).sort()) {
    html += `<div class="subject-section">
      <div class="subject-title">${escapeHtml(subj).toUpperCase()}</div>
      <div class="chapter-cards">
        ${groups[subj].map(c => renderChapterCard(c)).join('')}
      </div>
    </div>`;
  }
  cards.innerHTML = html;
}

function renderChapterCard(c) {
  const isTeacher = state.user && state.user.role === 'teacher';
  const access = state.chapterAccess[c.id];
  const dLeft = access ? daysLeft(access.expires_at) : null;
  const isAllFree = Number(c.is_all_free) === 1;
  const isPaidActive = !isTeacher && !isAllFree && dLeft != null && dLeft > 0;
  const isActive = isTeacher || isAllFree || isPaidActive;

  // 우측 상단 코너 배지 — 유료 활성 챕터의 남은 기간 (만료 KST 시각 tooltip)
  let cornerBadge = '';
  if (isPaidActive) {
    const expTip = `만료: ${fmtKst(access.expires_at)} (KST)`;
    cornerBadge = `<span class="ch-corner-badge" title="${escapeHtml(expTip)}">D-${dLeft}</span>`;
  }

  // 카드 본문의 인라인 상태 (D-N은 코너에 있으니 생략)
  let statusBadge = '', statusClass = '';
  if (isTeacher) { statusBadge = '🛠 관리자'; statusClass = 'free'; }
  else if (isAllFree) { statusBadge = '✨ 무료'; statusClass = 'free'; }
  else if (isPaidActive) { statusBadge = ''; }
  else if (access) { statusBadge = '만료됨'; statusClass = 'expired'; }
  else { statusBadge = '미구매'; statusClass = 'never'; }

  const price = Number(c.monthly_price) || 3000;
  const canRedeem = state.point >= REDEEM_COST;

  // 미구매 챕터도 카드 클릭으로 진입 → 무료 대목차는 열람, 유료 대목차는 🔒
  let actions;
  if (isActive) {
    actions = `<button class="primary" onclick="event.stopPropagation();enterChapter(${c.id})">열기 →</button>`;
  } else {
    actions = `
      <button onclick="event.stopPropagation();enterChapter(${c.id})">무료 보기 →</button>
      <button onclick="event.stopPropagation();openPayModal(${c.id})">${price.toLocaleString()}원 결제</button>
      <button onclick="event.stopPropagation();confirmRedeem(${c.id})" ${canRedeem ? '' : 'disabled'}>${REDEEM_COST}P 사용</button>
    `;
  }

  return `
    <div class="chapter-card ${access && !isActive && !isTeacher ? 'expired' : ''}" onclick="enterChapter(${c.id})">
      ${cornerBadge}
      <div class="ch-icon">${escapeHtml(c.icon || '📘')}</div>
      <div class="ch-title">${escapeHtml(c.title)}</div>
      <div class="ch-desc">${escapeHtml(c.description || '')}</div>
      ${statusBadge ? `<span class="ch-status ${statusClass}">${statusBadge}</span>` : ''}
      <div class="ch-actions">${actions}</div>
    </div>
  `;
}

async function enterChapter(chapterId) {
  state.currentChapter = state.chapters.find(x => x.id === chapterId);
  if (!state.currentChapter) return;
  loadPassed(chapterId);  // 저장된 패스 위치 복원 (마지막 학습 위치)
  // 챕터 진입 시 정상 모드로 시작
  state.memorizedView = false;
  const memoBtn = $('memorizedBtn');
  if (memoBtn) memoBtn.classList.remove('active');
  updateLiveChips(); // 캐시된 라이브 카운트 즉시 반영 (다음 폴링 기다리지 않음)
  $('homeScreen').style.display = 'none';
  $('chapterScreen').style.display = 'block';
  window.scrollTo(0, 0);

  const c = state.currentChapter;
  $('chSubj').textContent = c.subject || '';
  $('chName').textContent = c.title || '';

  const isTeacher = state.user && state.user.role === 'teacher';
  const access = state.chapterAccess[chapterId];
  const dLeft = access ? daysLeft(access.expires_at) : null;
  const isAllFree = Number(c.is_all_free) === 1;
  if (isTeacher) $('chStatus').textContent = '🛠 관리자';
  else if (isAllFree) $('chStatus').textContent = '✨ 무료';
  else if (dLeft != null && dLeft > 0) $('chStatus').textContent = `D-${dLeft}`;
  else $('chStatus').textContent = '미구독';

  $('chMeta').innerHTML = isTeacher
    ? '<span style="color:#ffd54f">관리자 — 모든 챕터 무제한 열람</span>'
    : (isAllFree
        ? '<span style="color:#81c784">전체 무료 공개</span>'
        : (dLeft != null && dLeft > 0
            ? `남은 기간 ${dLeft}일 <span style="color:rgba(255,255,255,0.5);font-size:12px;">(만료: ${fmtKstDate(access.expires_at)} KST)</span>`
            : `<button class="icon-btn" onclick="openPayModal(${chapterId})">구독으로 전체 보기 →</button>`));

  $('chapterTree').innerHTML = '<div class="empty-state">로딩 중…</div>';
  await loadTopics(chapterId);
  renderTree(chapterId);
}

function goHome() {
  state.currentChapter = null;

  $('homeScreen').style.display = 'block';
  renderHome();
}

async function loadTopics(chapterId) {
  const r = await api('GET', '/topics?chapter_id=' + chapterId);
  state.topicsByChapter[chapterId] = r.topics || [];
  // 워커가 동봉한 subtopics를 캐시 → 토픽 펼침 시 별도 fetch 불필요
  for (const t of (r.topics || [])) {
    if (Array.isArray(t.subtopics)) state.subtopicsByTopic[t.id] = t.subtopics;
  }
}
async function loadSubtopics(topicId) {
  const r = await api('GET', '/subtopics?topic_id=' + topicId);
  state.subtopicsByTopic[topicId] = r.subtopics || [];
  renderTree(state.currentChapter.id);
}
async function loadItems(subtopicId) {
  return ensureItems(subtopicId, false);
}

// 같은 소목차의 동시 중복 fetch 방지 + prefetch 일 때는 강제 리렌더 안 함
const _itemsLoading = new Map();   // subtopicId → Promise
async function ensureItems(subId, isPrefetch) {
  const existing = state.itemsBySubtopic[subId];
  if (existing !== undefined) return existing;
  if (_itemsLoading.has(subId)) return _itemsLoading.get(subId);

  const p = (async () => {
    try {
      const r = await api('GET', '/items?subtopic_id=' + subId);
      state.itemsBySubtopic[subId] = r.items || [];
    } catch (e) {
      if (e.status === 402) {
        state.itemsBySubtopic[subId] = { locked: true, chapter_id: e.data?.chapter_id };
      } else if (e.status === 404) {
        // 소목차가 삭제됨 — 자동 새로고침 (포그라운드 클릭일 때만)
        if (!isPrefetch && state.expanded.subtopic.has(Number(subId))) {
          toast('콘텐츠가 변경되었습니다. 새로고침합니다.');
          refreshChapter();
        }
        return;
      } else if (e.status !== 401) {
        state.itemsBySubtopic[subId] = { error: e.message };
      } else {
        return;
      }
    } finally {
      _itemsLoading.delete(subId);
    }
    // 현재 펼쳐진 소목차일 때만 리렌더 (백그라운드 prefetch는 조용히)
    if (!isPrefetch || state.expanded.subtopic.has(Number(subId))) {
      if (state.currentChapter) renderTree(state.currentChapter.id);
    }
  })();
  _itemsLoading.set(subId, p);
  return p;
}

// 펼친 대목차들의 모든 소목차 items를 백그라운드로 미리 가져오기
function prefetchOpenTopics() {
  if (!state.currentChapter) return;
  const topics = state.topicsByChapter[state.currentChapter.id] || [];
  for (const t of topics) {
    if (!state.expanded.topic.has(t.id)) continue;
    const subs = state.subtopicsByTopic[t.id] || [];
    for (const s of subs) ensureItems(s.id, true);
  }
}

function renderTree(chapterId) {
  const topics = state.topicsByChapter[chapterId] || [];
  const c = state.currentChapter;
  const isTeacher = state.user && state.user.role === 'teacher';
  const access = state.chapterAccess[chapterId];
  const dLeft = access ? daysLeft(access.expires_at) : null;
  const hasAccess = isTeacher || Number(c.is_all_free) === 1 || (dLeft != null && dLeft > 0);

  // 암기 모음 모드 — 챕터 전체에서 understood인 소목차만 평면 리스트로
  if (state.memorizedView) {
    $('chapterTree').innerHTML = renderMemorizedView(chapterId, hasAccess);
    return;
  }

  if (!topics.length) {
    $('chapterTree').innerHTML = '<div class="empty-state">아직 콘텐츠가 없습니다.</div>';
    return;
  }
  $('chapterTree').innerHTML = topics.map(t => renderTopic(t, hasAccess)).join('');
}

// 암기 모음 모드 — 챕터 전체에서 understood인 소목차를 한 리스트로 (꾹누른 시각 오름차순)
// 학습 모드의 topic-head처럼 상단에 헤더(좌: 제목, 우: ⤴ 패스)
function renderMemorizedView(chapterId, hasAccess) {
  const topics = state.topicsByChapter[chapterId] || [];
  const items = [];
  for (const t of topics) {
    const subs = state.subtopicsByTopic[t.id] || [];
    for (const s of subs) {
      if (state.understoodSet.has(Number(s.id))) items.push(s);
    }
  }
  if (items.length === 0) {
    return `
      <div class="memo-empty">
        <div class="memo-icon">●</div>
        <div>아직 암기 모음이 비어 있습니다.</div>
        <div class="memo-hint">소목차를 꾹 누르면 여기로 모입니다.</div>
      </div>
    `;
  }
  items.sort((a, b) => {
    const ma = state.understoodMarkedAt[Number(a.id)] || '';
    const mb = state.understoodMarkedAt[Number(b.id)] || '';
    if (ma !== mb) return ma.localeCompare(mb);
    return (Number(a.sort_order) || 0) - (Number(b.sort_order) || 0);
  });
  const visible = items.filter(s => !state.passedSet.has(Number(s.id)));

  if (visible.length === 0) {
    return `
      <div class="memo-empty">
        <div class="memo-icon">🎉</div>
        <div>이번 회 모두 검토 완료!</div>
        <div class="memo-hint">잠시 후 처음부터 다시 시작합니다.</div>
      </div>
    `;
  }

  // 상단 헤더 — 학습 모드의 topic-head와 같은 레이아웃 (제목 좌, ⤴ 패스 우)
  // 접근권과 무관하게 표시 (본인이 표시한 데이터 정리 기능이라 구독 만료해도 사용 가능)
  const current = visible[0];
  const header = `
    <div class="memo-header">
      <div class="memo-title">● 암기 모음</div>
      <span class="memo-count">${visible.length}</span>
      <div class="study-controls">
        <button class="study-btn skip-big" onclick="memorizedPass(${current.id})" title="이번 회 패스 — 다음 단어로">⤴ 패스</button>
      </div>
    </div>
  `;

  return header + visible.map((s, i) => renderSubtopic(s, i === 0)).join('');
}

function toggleMemorizedView() {
  state.memorizedView = !state.memorizedView;
  // 모드 전환 시 펼친 소목차 닫기 (혼선 방지)
  state.expanded.subtopic.clear();
  const btn = $('memorizedBtn');
  if (btn) btn.classList.toggle('active', state.memorizedView);
  if (state.currentChapter) renderTree(state.currentChapter.id);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// 암기 모음 모드의 패스 — 현재 항목을 이번 회에서 제외
function memorizedPass(subId) {
  state.passedSet.add(Number(subId));
  state.expanded.subtopic.delete(Number(subId));
  savePassed();

  // 모두 검토 끝났는지 확인
  const cid = state.currentChapter && state.currentChapter.id;
  if (!cid) return;
  const topics = state.topicsByChapter[cid] || [];
  const remaining = [];
  for (const t of topics) {
    const subs = state.subtopicsByTopic[t.id] || [];
    for (const s of subs) {
      if (state.understoodSet.has(Number(s.id)) && !state.passedSet.has(Number(s.id))) remaining.push(s);
    }
  }

  if (remaining.length === 0) {
    showCelebration();
    setTimeout(() => {
      // 암기 모음 내 패스만 정리 (정상 모드의 다른 챕터 패스는 건드리지 않음)
      for (const t of topics) {
        const subs = state.subtopicsByTopic[t.id] || [];
        for (const s of subs) {
          if (state.understoodSet.has(Number(s.id))) state.passedSet.delete(Number(s.id));
        }
      }
      savePassed();
      if (state.memorizedView && state.currentChapter) renderTree(state.currentChapter.id);
    }, 2200);
    return;
  }

  if (state.currentChapter) renderTree(state.currentChapter.id);
}

function renderTopic(t, hasAccess) {
  const isFree = Number(t.is_free) === 1;
  const locked = !isFree && !hasAccess;
  const opened = state.expanded.topic.has(t.id);
  const cls = 'topic-card' + (opened ? ' opened' : '') + (locked ? ' locked' : '');

  let body = '';
  let topSubId = null;          // 학습 대상 (맨 위 미학습 = 주황)
  let hasPassed = false;        // 이 토픽에 패스된 게 있나
  if (opened) {
    if (locked) {
      body = `
        <div class="locked-banner">
          <h4>🔒 구독 후 볼 수 있는 내용입니다</h4>
          <p>이 챕터를 결제하거나, 보유 포인트로 1개월 무료 연장하세요.</p>
          <button onclick="event.stopPropagation();openPayModal(${state.currentChapter.id})">구독하기 →</button>
        </div>
      `;
    } else {
      const subs = state.subtopicsByTopic[t.id];
      if (subs === undefined) {
        loadSubtopics(t.id);
        body = '<div class="empty-state">소목차 로딩…</div>';
      } else if (!subs.length) {
        body = '<div class="empty-state">소목차 없음</div>';
      } else {
        // 자가 치유 — 이전 버전(↺ 버튼 있던 시절)에 모든 소목차가 패스된 채 저장된 경우,
        // 펼치면 비어 있고 다시 시작할 수단도 없어 정지 상태가 됨. 조용히 패스 집합 초기화.
        const allPassed = subs.every(s => state.passedSet.has(Number(s.id)));
        if (allPassed) {
          for (const s of subs) state.passedSet.delete(Number(s.id));
          savePassed();
        }
        // 패스된 건 안 보이게 필터 (이번 회 한정)
        hasPassed = subs.some(s => state.passedSet.has(Number(s.id)));
        const visible = subs.filter(s => !state.passedSet.has(Number(s.id)));
        // 정렬: 미학습 먼저, 학습완료 아래로
        const sortedSubs = [...visible].sort((a, b) => {
          const aDone = state.understoodSet.has(Number(a.id)) ? 1 : 0;
          const bDone = state.understoodSet.has(Number(b.id)) ? 1 : 0;
          if (aDone !== bDone) return aDone - bDone;
          return (Number(a.sort_order) || 0) - (Number(b.sort_order) || 0);
        });
        // 학습 대상 = 첫 미학습 (있으면), 없으면 첫 학습완료 (있으면)
        // → 완료된 단어만 남아도 버튼이 사라지지 않고 "다시" 모드로 동작
        const target = sortedSubs.find(s => !state.understoodSet.has(Number(s.id)))
                    || sortedSubs[0];
        topSubId = target ? Number(target.id) : null;
        body = sortedSubs.map(s => renderSubtopic(s, Number(s.id) === topSubId && target && !state.understoodSet.has(Number(target.id)))).join('');
      }
    }
  }

  // 학습 컨트롤 — 큰 패스 버튼 1개 (펼친 상태 + 접근권 있을 때)
  // 펼침은 소목차 직접 클릭, 완료/다시는 꾹누르기로 처리되므로 버튼은 패스만
  let studyBtns = '';
  if (opened && !locked) {
    const hasTop = topSubId != null;
    studyBtns = hasTop ? `
      <div class="study-controls">
        <button class="study-btn skip-big" onclick="event.stopPropagation();studyPass(${topSubId},${t.id})" title="이번 회 패스 — 다음 단어로">⤴ 패스</button>
      </div>` : '';
  }

  // 대목차별 암기 진도 — understoodSet 기준 비율
  const subsAll = state.subtopicsByTopic[t.id] || [];
  const total = subsAll.length || Number(t.subtopic_count) || 0;
  const learned = subsAll.filter(s => state.understoodSet.has(Number(s.id))).length;
  const pct = total ? Math.round(learned / total * 100) : 0;
  const doneCls = (total > 0 && learned === total) ? ' done' : '';
  const progress = `
    <div class="topic-progress" title="암기 ${learned}/${total} (${pct}%)">
      <div class="topic-progress-fill${doneCls}" style="width:${pct}%"></div>
      <div class="topic-progress-text">${learned}/${total}</div>
    </div>
  `;

  return `
    <div class="${cls}" data-topic="${t.id}">
      <div class="topic-head" onclick="toggleTopic(${t.id})">
        <div class="topic-arrow">▶</div>
        <div class="topic-title">${escapeHtml(t.title)}${isFree ? '<span class="free-tag">✨무료</span>' : (locked ? '<span class="lock-icon">🔒</span>' : '')}</div>
        ${progress}
        ${studyBtns}
      </div>
      <div class="topic-body">${body}</div>
    </div>
  `;
}

function renderSubtopic(s, isCurrent) {
  const opened = state.expanded.subtopic.has(s.id);
  const understood = state.understoodSet.has(Number(s.id));
  // 정상 모드: understood면 current 강조 안 함 (이미 학습 완료)
  // 암기 모음 모드: understood여도 맨 위 항목은 current로 강조 (학습 대상)
  const showCurrent = isCurrent && (state.memorizedView || !understood);
  const cls = 'subtopic'
    + (opened ? ' opened' : '')
    + (understood ? ' understood' : '')
    + (showCurrent ? ' current' : '');
  const hasImg = !!s.image_b64;

  // 항상 보이는 미리보기 (제목 아래)
  const preview = hasImg ? `
    <div class="subtopic-preview"
         onclick="subClick(event,${s.id})"
         onmousedown="pressStart(${s.id})"
         onmouseup="pressEnd()"
         onmouseleave="pressEnd()"
         ontouchstart="pressStart(${s.id})"
         ontouchend="pressEnd()"
         ontouchcancel="pressEnd()">
      <img src="${escapeHtml(s.image_b64)}" alt="" oncontextmenu="return false">
      ${s.caption ? `<div class="cap">${escapeHtml(s.caption)}</div>` : ''}
    </div>
  ` : '';

  // 펼침 시 본문 (items만)
  let body = '';
  if (opened) {
    const items = state.itemsBySubtopic[s.id];
    if (items === undefined) {
      loadItems(s.id);
      body = '<div class="empty-state">로딩…</div>';
    } else if (items.locked) {
      body = `
        <div class="locked-banner">
          <h4>🔒 구독 후 볼 수 있습니다</h4>
          <button onclick="event.stopPropagation();openPayModal(${items.chapter_id})">구독하기 →</button>
        </div>`;
    } else if (items.error) {
      body = `<div class="empty-state">오류: ${escapeHtml(items.error)}</div>`;
    } else if (!items.length) {
      body = '<div class="empty-state">아직 내용이 없습니다.</div>';
    } else {
      body = items.map(it => renderItem(it)).join('');
    }
  }

  return `
    <div class="${cls}" data-sub="${s.id}">
      <div class="subtopic-head"
           onclick="subClick(event,${s.id})"
           onmousedown="pressStart(${s.id})"
           onmouseup="pressEnd()"
           onmouseleave="pressEnd()"
           ontouchstart="pressStart(${s.id})"
           ontouchend="pressEnd()"
           ontouchcancel="pressEnd()">
        <div class="subtopic-dot"></div>
        <div class="subtopic-arrow">▶</div>
        <div class="subtopic-title">${escapeHtml(s.title)}</div>
        <button class="speak-btn"
                onclick="event.stopPropagation();speakText(${JSON.stringify(s.title).replace(/"/g, '&quot;')})"
                onmousedown="event.stopPropagation()"
                ontouchstart="event.stopPropagation()"
                title="발음 듣기">🔊</button>
        <div class="subtopic-hint">${opened ? '꾹눌러 ●' : ''}</div>
      </div>
      ${preview}
      <div class="subtopic-body">${body}</div>
    </div>
  `;
}

// ── 발음 재생 (Web Speech API) ─────────────────────────────
// 라틴 문자가 하나라도 있으면 영어로 간주, 아니면 한국어
function detectSpeechLang(text) {
  return /[a-zA-Z]/.test(String(text || '')) ? 'en-US' : 'ko-KR';
}
function speakText(text) {
  if (!('speechSynthesis' in window)) {
    toast('이 브라우저는 음성 재생을 지원하지 않습니다.', true);
    return;
  }
  const t = String(text || '').trim();
  if (!t) return;
  // 진행 중인 발음 중단 → 연속 클릭에도 깔끔하게
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = detectSpeechLang(t);
  u.rate = 0.85;   // 살짝 천천히 — 학습용
  u.pitch = 1.0;
  window.speechSynthesis.speak(u);
}
window.speakText = speakText;

// YouTube URL에서 videoId 추출 — 링크 카드 썸네일용 (embed는 YouTube 정책상 안 함)
function getYouTubeId(url) {
  const patterns = [
    /[?&]v=([a-zA-Z0-9_-]{11})/,
    /youtu\.be\/([a-zA-Z0-9_-]{11})/,
    /youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/,
    /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/,
  ];
  for (const p of patterns) {
    const m = String(url || '').match(p);
    if (m) return m[1];
  }
  return null;
}

// Gumlet 동영상 — iframe embed 허용. URL을 embed 형식으로 정규화.
function getGumletEmbedUrl(url) {
  const s = String(url || '');
  // play.gumlet.io/embed/ID 또는 play.gumlet.io/ID (둘 다 embed로 변환)
  const m = s.match(/play\.gumlet\.io\/(?:embed\/)?([a-zA-Z0-9_-]+)/);
  if (!m) return null;
  return `https://play.gumlet.io/embed/${m[1]}`;
}

function renderItem(it) {
  if (it.kind === 'image') {
    const url = unwrapImage(it.image_b64);
    return `
      <div class="item">
        <img class="item-image" src="${escapeHtml(url)}" alt="" oncontextmenu="return false">
        ${it.caption ? `<div class="item-caption">${escapeHtml(it.caption)}</div>` : ''}
      </div>
    `;
  }
  if (it.kind === 'link') {
    const url = it.text || '';
    // Gumlet만 iframe embed (YouTube는 정책상 링크로)
    const gumletUrl = getGumletEmbedUrl(url);
    if (gumletUrl) {
      return `
        <div class="item">
          <div class="video-embed">
            <iframe src="${gumletUrl}" frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen></iframe>
          </div>
          ${it.caption ? `<div class="item-caption">${escapeHtml(it.caption)}</div>` : ''}
        </div>
      `;
    }
    // YouTube → 링크 카드 + 썸네일
    const ytId = getYouTubeId(url);
    if (ytId) {
      return `
        <div class="item">
          <a href="${escapeHtml(url)}" target="_blank" rel="noopener" class="link-card link-card-yt">
            <img class="link-thumb" src="https://img.youtube.com/vi/${ytId}/mqdefault.jpg" alt="">
            <div class="link-body">
              <div class="link-title">${escapeHtml(it.caption || 'YouTube에서 보기')}</div>
              <div class="link-url">▶ ${escapeHtml(url)}</div>
            </div>
          </a>
        </div>
      `;
    }
    // 일반 URL → 링크 카드 + 🔗
    return `
      <div class="item">
        <a href="${escapeHtml(url)}" target="_blank" rel="noopener" class="link-card">
          <div class="link-icon">🔗</div>
          <div class="link-body">
            <div class="link-title">${escapeHtml(it.caption || url)}</div>
            ${it.caption ? `<div class="link-url">${escapeHtml(url)}</div>` : ''}
          </div>
        </a>
      </div>
    `;
  }
  return `<div class="item"><div class="item-text">${escapeHtml(it.text)}</div></div>`;
}

// ============================================================
// 펼침 토글 + 꾹누르기
// ============================================================
function toggleTopic(id) {
  if (state.expanded.topic.has(id)) state.expanded.topic.delete(id);
  else state.expanded.topic.add(id);
  renderTree(state.currentChapter.id);
  prefetchOpenTopics();   // 새로 펼친 토픽의 items 백그라운드 fetch
}

function collapseAll() {
  state.expanded.topic.clear();
  state.expanded.subtopic.clear();
  if (state.currentChapter) renderTree(state.currentChapter.id);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ───── 학습 컨트롤 — 플래시카드 스타일 ─────
// 패스 상태 영구 저장 (챕터 단위) — 새로고침·재진입 후에도 마지막 위치 유지
function passKey(cid) { return 'op_passed_' + cid; }
function savePassed() {
  if (!state.currentChapter) return;
  try {
    localStorage.setItem(passKey(state.currentChapter.id), JSON.stringify([...state.passedSet]));
  } catch {}
}
function loadPassed(chapterId) {
  try {
    const raw = localStorage.getItem(passKey(chapterId));
    state.passedSet = new Set(raw ? JSON.parse(raw).map(Number) : []);
  } catch { state.passedSet = new Set(); }
}

// 대목차 헤더의 화면 Y 위치를 고정한 채 렌더링 (스크롤 보정)
// → 패스/완료 누를 때 위쪽 콘텐츠가 흔들리지 않고 헤더가 같은 자리에 머무름
function withTopicAnchor(topicId, callback) {
  const sel = `[data-topic="${topicId}"] > .topic-head`;
  const headEl = document.querySelector(sel);
  const beforeY = headEl ? headEl.getBoundingClientRect().top : null;
  callback();
  if (beforeY == null) return;
  // 즉시 1회 보정 + 다음 frame에 한 번 더 (브라우저 auto-scroll 대응)
  const adjust = () => {
    const newHead = document.querySelector(sel);
    if (!newHead) return;
    const afterY = newHead.getBoundingClientRect().top;
    const delta = afterY - beforeY;
    if (Math.abs(delta) > 1) window.scrollBy(0, delta);
  };
  adjust();
  requestAnimationFrame(adjust);
}

// 패스: 이번 회 안 봄. 완료 포함 모든 소목차가 패스되어야 축하 → 자동 재시작
function studyPass(subId, topicId) {
  state.passedSet.add(Number(subId));
  state.expanded.subtopic.delete(Number(subId));
  savePassed();

  // 보이는 소목차가 1개라도 남았는지 확인 (완료된 단어도 패스해야 사라짐)
  const subs = state.subtopicsByTopic[topicId] || [];
  const stillVisible = subs.filter(s => !state.passedSet.has(Number(s.id)));

  if (stillVisible.length === 0) {
    celebrateAndReset(topicId);
    return;
  }

  // 일반 패스 — 헤더 위치 고정한 채 렌더
  withTopicAnchor(topicId, () => {
    if (state.currentChapter) renderTree(state.currentChapter.id);
  });
}

// 모두 패스 시 축하 폭죽 → 패스 자동 초기화 → 처음부터 다시 시작
function celebrateAndReset(topicId) {
  showCelebration();
  setTimeout(() => {
    const subs = state.subtopicsByTopic[topicId] || [];
    for (const s of subs) state.passedSet.delete(Number(s.id));
    savePassed();
    if (state.currentChapter) renderTree(state.currentChapter.id);
  }, 2200);
}

function showCelebration() {
  const c = document.createElement('div');
  c.className = 'celebration';
  c.innerHTML =
    '<div class="cel-content">' +
    '  <div class="cel-icon">🎉</div>' +
    '  <div class="cel-text">모두 학습 완료!</div>' +
    '  <div class="cel-sub">다시 처음부터 시작합니다</div>' +
    '</div>';
  const emojis = ['🎉','🎊','✨','⭐','💫','🌟','🎈','🥳'];
  for (let i = 0; i < 50; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    piece.style.left = (Math.random() * 100) + '%';
    piece.style.animationDelay = (Math.random() * 1.2) + 's';
    piece.style.animationDuration = (1.6 + Math.random() * 1.4) + 's';
    piece.style.fontSize = (18 + Math.random() * 22) + 'px';
    c.appendChild(piece);
  }
  document.body.appendChild(c);
  if (navigator.vibrate) try { navigator.vibrate([40, 60, 40, 60, 80]); } catch {}
  setTimeout(() => c.remove(), 2700);
}

// 펼침은 click이 담당, long-press(600ms)는 이해 토글
// → 모바일/데스크탑 모두 안정적 (이전 longPressEnd가 모바일에서 안 먹는 문제 해결)
let _pressTimer = null;
let _longFired = false;
function pressStart(subId) {
  _longFired = false;
  _pressTimer = setTimeout(() => {
    _longFired = true;
    if (navigator.vibrate) try { navigator.vibrate(20); } catch {}
    toggleUnderstood(subId);
  }, 600);
}
function pressEnd() {
  if (_pressTimer) { clearTimeout(_pressTimer); _pressTimer = null; }
}
function subClick(e, subId) {
  if (_longFired) { _longFired = false; e.preventDefault(); return; }

  // 클릭한 소목차의 화면 위치 캡쳐 (위쪽 다른 소목차가 닫혀도 자리 유지하려고)
  const subEl = e.currentTarget && e.currentTarget.closest('.subtopic');
  const beforeY = subEl ? subEl.getBoundingClientRect().top : null;

  if (state.expanded.subtopic.has(subId)) {
    // 이미 펼쳐진 거 다시 누름 = 접기
    state.expanded.subtopic.delete(subId);
  } else {
    // 아코디언: 다른 소목차 모두 닫고 이것만 열기
    state.expanded.subtopic.clear();
    state.expanded.subtopic.add(subId);
  }
  renderTree(state.currentChapter.id);

  // 렌더 후 같은 소목차가 화면에서 위로 이동했으면 그만큼 스크롤 보정 → 클릭 위치 고정
  if (beforeY != null) {
    const newEl = document.querySelector('[data-sub="' + subId + '"]');
    if (newEl) {
      const afterY = newEl.getBoundingClientRect().top;
      const delta = afterY - beforeY;
      if (Math.abs(delta) > 1) {
        window.scrollBy(0, delta);
      }
    }
  }
}

async function toggleUnderstood(subId) {
  if (!state.user) return;
  const had = state.understoodSet.has(Number(subId));
  const prevMarkedAt = state.understoodMarkedAt[Number(subId)];
  // 낙관적 업데이트
  if (had) {
    state.understoodSet.delete(Number(subId));
    delete state.understoodMarkedAt[Number(subId)];
  } else {
    state.understoodSet.add(Number(subId));
    // 클라이언트 시각 — 서버의 kstDateTime() 포맷과 호환되는 정렬키
    const d = new Date(Date.now() + 9 * 3600 * 1000);
    state.understoodMarkedAt[Number(subId)] =
      d.toISOString().replace('T', ' ').slice(0, 19);
  }
  renderTree(state.currentChapter.id);
  try {
    await api('POST', '/understood', { subtopic_id: subId });
    toast(had ? '이해 표시 해제' : '● 이해 완료');
  } catch (e) {
    // 롤백
    if (had) {
      state.understoodSet.add(Number(subId));
      if (prevMarkedAt !== undefined) state.understoodMarkedAt[Number(subId)] = prevMarkedAt;
    } else {
      state.understoodSet.delete(Number(subId));
      delete state.understoodMarkedAt[Number(subId)];
    }
    renderTree(state.currentChapter.id);
    // 소목차가 이미 삭제된 경우 자동 새로고침
    if (e.status === 500 || e.status === 404) {
      toast('콘텐츠가 변경되었습니다. 새로고침합니다.', false);
      refreshChapter();
    } else {
      toast(e.message, true);
    }
  }
}

async function refreshChapter() {
  if (!state.currentChapter) return;
  const cid = state.currentChapter.id;
  showLoading(true);   // 시각 피드백 — 사용자가 진행 중임을 알게
  try {
    // 캐시 무효화 (재진입 시 다시 fetch)
    delete state.topicsByChapter[cid];
    Object.keys(state.subtopicsByTopic).forEach(k => delete state.subtopicsByTopic[k]);
    Object.keys(state.itemsBySubtopic).forEach(k => delete state.itemsBySubtopic[k]);
    // 챕터·접근권·이해표시도 갱신
    await Promise.all([
      loadChapters(),
      loadUnderstood(),
      api('GET', '/auth/me').then(r => {
        state.point = Number(r.user.point) || 0;
        state.chapterAccess = r.chapter_access || {};
      }).catch(() => {}),
    ]);
    // 챕터 재진입 (현재 챕터 객체 갱신)
    const fresh = state.chapters.find(x => x.id === cid);
    if (!fresh) {
      toast('이 챕터는 삭제되었습니다.', true);
      goHome();
      return;
    }
    state.currentChapter = fresh;
    await loadTopics(cid);
    renderTree(cid);
    toast('최신 콘텐츠로 갱신됨');
  } catch (e) {
    toast('새로고침 실패: ' + e.message, true);
  } finally {
    showLoading(false);
  }
}

// 결제·포인트 사용 모달
// ============================================================
function openPayModal(chapterId) {
  if (!state.user) {
    toast('먼저 로그인하세요', true);
    logout();
    return;
  }
  const c = state.chapters.find(x => x.id === chapterId);
  if (!c) return;
  const price = Number(c.monthly_price) || 3000;
  const canRedeem = state.point >= REDEEM_COST;
  const access = state.chapterAccess[chapterId];
  const dLeft = access ? daysLeft(access.expires_at) : null;
  const statusMsg = (dLeft != null && dLeft > 0)
    ? `현재 D-${dLeft}일 (만료: ${fmtKstDate(access.expires_at)} KST). 결제하면 만료일이 30일 더 연장됩니다.`
    : '결제하면 30일 동안 이 챕터의 모든 내용을 봅니다. (한국 시간 기준)';

  showModal({
    title: c.title + ' 구독',
    klass: 'pay-modal',
    body: `
      <p style="font-size:13px;color:rgba(255,255,255,0.7);margin-bottom:14px;line-height:1.6;">${statusMsg}</p>
      <div class="pay-row">
        <div class="ico">💳</div>
        <div class="body">
          <strong>${price.toLocaleString()}원으로 결제</strong>
          <small>페이앱 결제 페이지로 이동</small>
        </div>
        <button onclick="goPayment(${chapterId})">결제 →</button>
      </div>
      <div class="pay-row">
        <div class="ico">💰</div>
        <div class="body">
          <strong>${REDEEM_COST.toLocaleString()}P 사용 (보유 ${state.point.toLocaleString()}P)</strong>
          <small>${canRedeem ? '즉시 30일 연장' : '포인트 부족 — 친구 추천으로 채우세요'}</small>
        </div>
        <button onclick="confirmRedeem(${chapterId})" ${canRedeem ? '' : 'disabled'}>포인트</button>
      </div>
      <div style="margin-top:14px;padding:10px;background:rgba(76,175,80,0.08);border-radius:8px;font-size:12px;color:#a5d6a7;">
        💡 친구 1명 추천하고 결제하면 둘 다 1,000P. 3명이면 챕터 1개월 무료.
      </div>
    `,
    foot: `<button onclick="closeModal()">닫기</button>`
  });
}

async function goPayment(chapterId) {
  closeModal();
  // 1순위: Worker가 동적으로 PayApp 결제 세션 생성 (var1=chapter_id로 매핑)
  //         → PayApp이 결제 완료 시 Worker /payapp/webhook으로 통보
  // 2순위 (fallback): 만약 Worker 호출 실패 + chapter.pay_url이 설정돼 있으면 정적 링크 사용
  try {
    toast('결제 페이지로 이동 중…');
    const r = await api('POST', '/payment/request', { chapter_id: chapterId });
    if (!r.payurl) throw new Error('payurl missing');
    window.open(r.payurl, '_blank');
    toast('결제 후 잠시 후 갱신됩니다. (Pull-to-refresh 또는 새로고침)');
  } catch (e) {
    // Fallback — 옛 정적 링크 (deprecated)
    const c = state.chapters.find(x => x.id === chapterId);
    const payUrl = c && c.pay_url ? String(c.pay_url).trim() : '';
    if (payUrl) {
      window.open(payUrl, '_blank');
      toast('결제 후 잠시 후 갱신됩니다.');
      return;
    }
    toast('결제 세션 생성 실패: ' + (e.message || ''), true);
  }
}

async function confirmRedeem(chapterId) {
  if (state.point < REDEEM_COST) {
    toast('포인트가 부족합니다.', true);
    return;
  }
  const c = state.chapters.find(x => x.id === chapterId);
  if (!confirm(`"${c.title}" 챕터를 ${REDEEM_COST.toLocaleString()}P로 30일 연장합니다.\n진행할까요?`)) return;
  showLoading(true);
  try {
    const r = await api('POST', '/access/redeem', { chapter_id: chapterId });
    state.point = Number(r.new_point) || 0;
    state.chapterAccess[chapterId] = { expires_at: r.expires_at, source: 'point_redeem' };
    closeModal();
    toast(`${REDEEM_COST.toLocaleString()}P 사용 — 30일 연장됨`);
    renderHome();
    if (state.currentChapter && state.currentChapter.id === chapterId) {
      enterChapter(chapterId);
    }
  } catch (e) { toast(e.message, true); }
  finally { showLoading(false); }
}

// 포인트 사용 모달 — 내 포인트 + 구매 가능 챕터 목록
// ============================================================
function openPointModal() {
  if (state.user && state.user.role === 'teacher') {
    toast('관리자는 모든 챕터 무제한 열람 — 포인트 사용 불필요');
    return;
  }
  const canRedeem = state.point >= REDEEM_COST;
  // 무료 챕터 제외, 모든 챕터 (이미 활성이어도 연장 가능)
  const purchasable = state.chapters.filter(c => Number(c.is_all_free) !== 1);

  let rows;
  if (!purchasable.length) {
    rows = '<div class="empty-state">현재 구매 가능한 챕터가 없습니다.</div>';
  } else {
    rows = purchasable.map(c => {
      const access = state.chapterAccess[c.id];
      const dLeft = access ? daysLeft(access.expires_at) : null;
      const isActive = dLeft != null && dLeft > 0;
      const afterDays = isActive ? dLeft + 30 : 30;
      const statusHtml = isActive
        ? `<span style="color:#81c784">현재 D-${dLeft} → 구매 후 D-${afterDays}</span>`
        : (access
            ? `<span style="color:#ffb74d">만료됨 → 구매 후 D-30</span>`
            : `<span style="color:rgba(255,255,255,0.5)">미구매 → 구매 후 D-30</span>`);
      return `
        <div class="pay-row">
          <div class="ico">${escapeHtml(c.icon || '📘')}</div>
          <div class="body">
            <strong>${escapeHtml(c.subject || '')} · ${escapeHtml(c.title)}</strong>
            <small>${statusHtml}</small>
          </div>
          <button onclick="redeemFromPointModal(${c.id})" ${canRedeem ? '' : 'disabled'}>
            ${REDEEM_COST}P 사용
          </button>
        </div>
      `;
    }).join('');
  }

  showModal({
    title: '포인트로 학습 기간 연장',
    klass: 'pay-modal',
    body: `
      <div style="text-align:center;margin-bottom:18px;padding:14px;background:rgba(255,193,7,0.08);border-radius:12px;">
        <div style="font-size:11px;color:rgba(255,255,255,0.55);">내 보유 포인트</div>
        <div style="font-size:32px;font-weight:900;color:#ffd54f;margin-top:2px;">💰 ${state.point.toLocaleString()}P</div>
        <div style="font-size:11px;color:rgba(255,255,255,0.5);margin-top:4px;">3,000P → 챕터 1개월 (잔여 기간에 +30일)</div>
      </div>
      ${!canRedeem ? '<div style="text-align:center;font-size:12px;color:#fca5a5;margin-bottom:14px;padding:8px;background:rgba(239,68,68,0.1);border-radius:8px;">⚠️ 3,000P 이상 필요 — 친구 3명 추천하면 채워집니다</div>' : ''}
      ${rows}
      <div style="margin-top:14px;padding:10px;background:rgba(76,175,80,0.08);border-radius:8px;font-size:11px;color:#a5d6a7;text-align:center;">
        💡 친구가 가입+결제 시 둘 다 +1,000P · 3명이면 챕터 1개월 무료
      </div>
    `,
    foot: `<button onclick="closeModal()">닫기</button>`
  });
}

// 포인트 모달 안에서 구매 — 확인 후 redeem, 성공 시 모달 새로고침
async function redeemFromPointModal(chapterId) {
  const c = state.chapters.find(x => x.id === chapterId);
  if (!confirm(`"${c.title}" 챕터를 ${REDEEM_COST.toLocaleString()}P 사용해 30일 연장합니다.\n진행할까요?`)) return;
  showLoading(true);
  try {
    const r = await api('POST', '/access/redeem', { chapter_id: chapterId });
    state.point = Number(r.new_point) || 0;
    state.chapterAccess[chapterId] = { expires_at: r.expires_at, source: 'point_redeem' };
    closeModal();
    toast(`${REDEEM_COST.toLocaleString()}P 사용 — "${c.title}" 30일 연장됨`);
    renderHome();
    // 잔여 포인트가 충분하면 모달 재오픈 (연속 구매 편의)
    if (state.point >= REDEEM_COST) {
      setTimeout(() => openPointModal(), 300);
    }
  } catch (e) { toast(e.message, true); }
  finally { showLoading(false); }
}

async function copyReferralLink() {
  const link = $('refLinkBox').textContent;
  try {
    await navigator.clipboard.writeText(link);
    toast('링크가 복사되었습니다.');
  } catch {
    // 폴백
    const ta = document.createElement('textarea');
    ta.value = link; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('링크가 복사되었습니다.'); } catch { toast('복사 실패 — 직접 선택해주세요.', true); }
    document.body.removeChild(ta);
  }
}

// ============================================================
// 모달 헬퍼
// ============================================================
function showModal({ title, body, foot = '', klass = '' }) {
  const m = $('modal');
  m.innerHTML = `
    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal ${klass}" onclick="event.stopPropagation()">
        <div class="modal-head">
          <h3>${escapeHtml(title)}</h3>
          <button class="close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body">${body}</div>
        <div class="modal-foot">${foot}</div>
      </div>
    </div>
  `;
  $('modalBackdrop').onclick = (e) => { if (e.target.id === 'modalBackdrop') closeModal(); };
}
function closeModal() { $('modal').innerHTML = ''; }

// 타이머 — ping 60초마다 + live count 30초마다
// ============================================================
function startTimers() {
  stopTimers();
  // 즉시 1회
  api('POST', '/stats/ping').catch(() => {});
  state.pingTimer = setInterval(() => api('POST', '/stats/ping').catch(() => {}), 60000);
  state.liveTimer = setInterval(loadLiveCount, 30000);
}
function stopTimers() {
  if (state.pingTimer) clearInterval(state.pingTimer);
  if (state.liveTimer) clearInterval(state.liveTimer);
  state.pingTimer = state.liveTimer = null;
}
