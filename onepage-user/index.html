<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0a1a">
<title>원페이지 학습</title>
<!-- 아이콘 — SVG 우선 + PNG fallback (PC 바로가기/구형 iOS 호환) -->
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="원페이지">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="msapplication-TileColor" content="#0a0a1a">
<meta name="msapplication-TileImage" content="android-chrome-192x192.png">
<!-- 챕터 카드 드래그 재정렬 (모바일 터치 지원) — Sortable.js -->
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<!-- HTML/SVG 콘텐츠 새니타이즈 — 수학 등 외부 컴파일 HTML 안전 렌더 -->
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', sans-serif; background: #0a0a1a; color: #e5e7eb; }
body {
  line-height: 1.6; -webkit-text-size-adjust: 100%;
  -webkit-user-select: none; -moz-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  overflow-x: hidden;
}
button { font: inherit; cursor: pointer; border: none; }
input { font: inherit; outline: none; }
a { color: #4fc3f7; text-decoration: none; }
/* 인쇄 차단 */
@media print { html, body { display: none !important; } }

/* ─────────────────────────────────────────────
   워터마크 — 전체 화면 대각선 반복 (캡쳐 추적용)
   ───────────────────────────────────────────── */
#watermark {
  position: fixed; inset: 0; z-index: 9999;
  pointer-events: none; overflow: hidden;
  display: none;
}
#watermark.show { display: block; }
#watermark svg { width: 100%; height: 100%; }

/* ─────────────────────────────────────────────
   공통 — 헤더
   ───────────────────────────────────────────── */
.app-header {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; background: rgba(10,10,26,0.95);
  border-bottom: 1px solid #1f1f3a;
  position: sticky; top: 0; z-index: 50;
  backdrop-filter: blur(10px);
}
.app-header .brand {
  display: flex; align-items: center; gap: 6px;
  font-size: 15px; font-weight: 800; color: #fff;
}
.app-header .brand em { font-style: normal; color: #e94560; }
.app-header .back-btn {
  background: rgba(255,255,255,0.05); color: #fff;
  padding: 6px 10px; border-radius: 6px; font-size: 13px;
  margin-right: 2px;
}
.app-header .home-btn {
  background: rgba(255,255,255,0.06); color: #fff;
  width: 36px; height: 36px; border-radius: 8px;
  display: inline-flex; align-items: center; justify-content: center;
  border: none; cursor: pointer;
  transition: background 0.15s, transform 0.1s;
  -webkit-tap-highlight-color: transparent;
}
.app-header .home-btn:hover { background: rgba(255,255,255,0.12); }
.app-header .home-btn:active { transform: scale(0.92); }
.app-header .live-chip {
  display: flex; align-items: center; gap: 5px;
  background: rgba(76,175,80,0.15); border: 1px solid rgba(76,175,80,0.3);
  padding: 4px 10px; border-radius: 50px; font-size: 11px; color: #81c784;
  font-weight: 600;
}
.app-header .live-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: #4caf50; animation: pulse 1.5s ease-in-out infinite;
}
.app-header .live-cards { color: #ffd54f; font-weight: 700; white-space: nowrap; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.4} }
.app-header .spacer { flex: 1; }
.app-header .icon-btn {
  background: rgba(255,255,255,0.05); color: #ddd;
  padding: 6px 10px; border-radius: 6px; font-size: 12px;
  display: inline-flex; align-items: center; gap: 4px;
}
.app-header .icon-btn:hover { background: rgba(255,255,255,0.1); }
/* 가이드 버튼 펄스 힌트 — 첫 방문 사용자 '둘러보기' 선택 시 10초간 */
.app-header .icon-btn.pulse-hint {
  background: rgba(233,69,96,0.30);
  border: 1px solid rgba(233,69,96,0.55);
  color: #fff;
  animation: guidePulse 1.4s ease-in-out infinite;
}
@keyframes guidePulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(233,69,96,0.55); transform: scale(1); }
  50%      { box-shadow: 0 0 0 8px rgba(233,69,96,0); transform: scale(1.04); }
}
/* 모두 접기 버튼 — 가운데, v^ 아이콘 + "접기" 라벨 */
.app-header .collapse-center {
  padding: 6px 14px;
  background: rgba(233,69,96,0.18); border: 1px solid rgba(233,69,96,0.45);
  color: #ff8a9e;
  display: inline-flex; align-items: center; gap: 6px;
  border-radius: 50px;
  transition: background 0.15s, transform 0.1s;
  font-size: 12px; font-weight: 700;
}
.app-header .collapse-center:hover { background: rgba(233,69,96,0.28); }
.app-header .collapse-center:active { transform: scale(0.94); }
.app-header .collapse-center svg { flex-shrink: 0; }
.app-header .collapse-center .cc-label {
  white-space: nowrap;
}
/* 암기 모음 토글 */
.app-header .memorized-toggle {
  padding: 6px 12px;
  background: rgba(165,214,167,0.12); border: 1px solid rgba(165,214,167,0.35);
  color: #a5d6a7;
  border-radius: 50px;
  transition: background 0.15s, transform 0.1s;
  font-size: 12px; font-weight: 700;
}
.app-header .memorized-toggle:hover { background: rgba(165,214,167,0.22); }
.app-header .memorized-toggle:active { transform: scale(0.94); }
.app-header .memorized-toggle.active {
  background: rgba(129,199,132,0.55);
  border-color: rgba(129,199,132,0.95);
  color: #fff;
  box-shadow: 0 0 0 2px rgba(129,199,132,0.30), 0 0 14px rgba(129,199,132,0.35);
  font-weight: 800;
}

/* 암기 모음 헤더 — 학습 모드의 topic-head와 같은 레이아웃 (좌: 제목, 우: ⤴ 패스) */
.memo-header {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px; margin-top: 6px;
  background: linear-gradient(180deg, rgba(165,214,167,0.10) 0%, rgba(165,214,167,0.04) 100%);
  border: 1px solid rgba(165,214,167,0.3);
  border-radius: 10px;
}
.memo-header .memo-title {
  flex: 1; font-size: 15px; font-weight: 800;
  color: #c8e6c9; display: flex; align-items: center; gap: 8px;
}
.memo-header .memo-count {
  font-size: 11px; padding: 2px 8px; border-radius: 50px;
  background: rgba(165,214,167,0.18); color: #a5d6a7; font-weight: 700;
}

.memo-empty {
  text-align: center; padding: 60px 20px;
  color: rgba(255,255,255,0.5);
}
.memo-empty .memo-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }
.memo-empty .memo-hint { font-size: 12px; margin-top: 8px; color: rgba(255,255,255,0.35); }

/* ── 다지기 v2 — 오늘 클리어율 진행바 ───────────────────── */
.srs-clear {
  margin: 10px 14px 14px;
  padding: 12px 14px;
  background: linear-gradient(135deg, rgba(233,69,96,0.10), rgba(83,52,131,0.10));
  border: 1px solid rgba(233,69,96,0.28);
  border-radius: 12px;
}
.srs-clear-head {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 13px; font-weight: 700; color: #fff;
  margin-bottom: 8px;
}
.srs-clear-num { color: #ffd180; font-variant-numeric: tabular-nums; }
.srs-clear-bar {
  height: 8px; background: rgba(255,255,255,0.06);
  border-radius: 50px; overflow: hidden;
  margin-bottom: 6px;
}
.srs-clear-fill {
  height: 100%;
  background: linear-gradient(90deg, #e94560 0%, #ff8a9e 100%);
  border-radius: 50px;
  transition: width 0.35s ease;
}
.srs-clear-foot { font-size: 11px; color: rgba(255,255,255,0.55); text-align: right; }

/* ── 능동 회상 (Active Recall) 토글 바 ─────────────────── */
.recall-toggle-bar {
  margin: 12px 14px 4px;
  padding: 10px 14px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 12px;
  cursor: pointer;
  user-select: none;
  transition: background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
}
.recall-toggle-bar:hover {
  background: rgba(186,156,245,0.08);
  border-color: rgba(186,156,245,0.30);
}
.recall-toggle-bar.on {
  background: linear-gradient(135deg, rgba(186,156,245,0.16), rgba(149,117,219,0.10));
  border-color: rgba(186,156,245,0.50);
  box-shadow: 0 0 18px rgba(186,156,245,0.18);
}
.recall-toggle-inner {
  display: flex; align-items: center; gap: 10px;
}
.recall-toggle-icon { font-size: 18px; line-height: 1; }
.recall-toggle-label {
  flex: 1; font-size: 13px; font-weight: 700;
  color: rgba(255,255,255,0.85); letter-spacing: 0.2px;
}
.recall-toggle-bar.on .recall-toggle-label { color: #d1b3ff; }
.recall-toggle-state {
  font-size: 11px; font-weight: 800;
  padding: 3px 10px; border-radius: 50px;
  background: rgba(255,255,255,0.10); color: rgba(255,255,255,0.55);
  letter-spacing: 0.5px;
}
.recall-toggle-bar.on .recall-toggle-state {
  background: rgba(186,156,245,0.30); color: #fff;
  box-shadow: 0 0 12px rgba(186,156,245,0.40);
}
.recall-toggle-hint {
  margin-top: 8px; padding-top: 8px;
  border-top: 1px dashed rgba(186,156,245,0.20);
  font-size: 11.5px; color: rgba(209,179,255,0.75);
  line-height: 1.5;
}

/* ── 능동 회상 — 본문 블러 + 정답 보기 버튼 ────────────── */
.recall-blur-wrap {
  position: relative;
  min-height: 80px;
}
.recall-blurred {
  filter: blur(9px);
  opacity: 0.55;
  user-select: none;
  pointer-events: none;
  transition: filter 0.4s ease, opacity 0.4s ease;
}
.recall-reveal-btn {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: linear-gradient(135deg, rgba(186,156,245,0.95), rgba(149,117,219,0.95));
  border: none; color: #fff;
  font-size: 14px; font-weight: 800;
  padding: 12px 26px; border-radius: 30px;
  cursor: pointer; letter-spacing: 0.4px;
  box-shadow: 0 6px 20px rgba(149,117,219,0.45), 0 0 0 4px rgba(186,156,245,0.18);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  white-space: nowrap;
}
.recall-reveal-btn:hover {
  transform: translate(-50%, -50%) scale(1.05);
  box-shadow: 0 8px 28px rgba(149,117,219,0.55), 0 0 0 6px rgba(186,156,245,0.22);
}
.recall-reveal-btn:active {
  transform: translate(-50%, -50%) scale(0.98);
}

/* ── 능동 회상 — 자기평가 바 ───────────────────────────── */
.recall-assess-bar {
  display: flex; gap: 10px;
  padding: 12px 14px 14px;
  margin-top: 10px;
  border-top: 1px solid rgba(255,255,255,0.08);
}
.recall-btn {
  flex: 1;
  padding: 13px 8px;
  border-radius: 12px;
  border: 1.5px solid;
  font-size: 14px; font-weight: 800;
  cursor: pointer; letter-spacing: 0.3px;
  transition: transform 0.12s ease, box-shadow 0.18s ease, background 0.18s ease;
}
.recall-btn:active { transform: scale(0.96); }
.recall-correct {
  background: rgba(76,175,80,0.12);
  border-color: rgba(76,175,80,0.45);
  color: #a5d6a7;
}
.recall-correct:hover {
  background: rgba(76,175,80,0.22);
  box-shadow: 0 0 18px rgba(76,175,80,0.35);
}
.recall-wrong {
  background: rgba(233,69,96,0.12);
  border-color: rgba(233,69,96,0.45);
  color: #ff8a9e;
}
.recall-wrong:hover {
  background: rgba(233,69,96,0.22);
  box-shadow: 0 0 18px rgba(233,69,96,0.35);
}

/* ── 음성 퀴즈 (Voice Quiz) ────────────────────────────── */
.vq-settings {
  display: flex; gap: 8px;
  margin: 10px 14px 6px;
  align-items: stretch;
}
.vq-seg {
  display: inline-flex;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 10px;
  padding: 3px;
  flex-shrink: 0;
}
.vq-seg-btn {
  background: transparent; border: none;
  color: rgba(255,255,255,0.55);
  padding: 7px 14px;
  font-size: 12.5px; font-weight: 700;
  cursor: pointer; border-radius: 7px;
  transition: background 0.18s ease, color 0.18s ease;
}
.vq-seg-btn.on {
  background: linear-gradient(135deg, rgba(79,195,247,0.85), rgba(38,150,210,0.85));
  color: #fff;
  box-shadow: 0 2px 8px rgba(79,195,247,0.40);
}
.vq-read-btn {
  flex: 1;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.10);
  color: rgba(255,255,255,0.65);
  padding: 8px 12px;
  font-size: 12.5px; font-weight: 700;
  cursor: pointer; border-radius: 10px;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease;
}
.vq-read-btn.on {
  background: linear-gradient(135deg, rgba(255,138,0,0.20), rgba(233,69,96,0.18));
  border-color: rgba(255,138,0,0.50);
  color: #ffb74d;
  box-shadow: 0 2px 10px rgba(255,138,0,0.30);
}
.vq-read-btn.on strong { color: #fff; }

/* 효과음 토글 — 노란 톤 (소리/알림) */
.vq-sound-btn {
  flex: 1;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.10);
  color: rgba(255,255,255,0.65);
  padding: 8px 10px;
  font-size: 12.5px; font-weight: 700;
  cursor: pointer; border-radius: 10px;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: background 0.18s, border-color 0.18s, color 0.18s;
}
.vq-sound-btn.on {
  background: linear-gradient(135deg, rgba(255,213,79,0.22), rgba(255,138,0,0.18));
  border-color: rgba(255,213,79,0.55);
  color: #ffe082;
  box-shadow: 0 2px 10px rgba(255,213,79,0.30);
}
.vq-sound-btn.on strong { color: #fff; }

.vq-toggle {
  display: block;
  width: calc(100% - 28px);
  margin: 4px 14px 4px;
  padding: 12px 16px;
  border: none; border-radius: 12px;
  font-size: 14px; font-weight: 800;
  cursor: pointer; letter-spacing: 0.4px;
  transition: transform 0.12s ease, box-shadow 0.18s ease;
}
.vq-toggle-start {
  background: linear-gradient(135deg, rgba(79,195,247,0.92), rgba(38,150,210,0.92));
  color: #fff;
  box-shadow: 0 4px 14px rgba(79,195,247,0.35);
}
.vq-toggle-start:hover { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(79,195,247,0.50); }
.vq-toggle-stop {
  background: rgba(233,69,96,0.20);
  border: 1px solid rgba(233,69,96,0.50);
  color: #ff8a9e;
}
/* 작은 중단 버튼 — 퀴즈 stage-head 안에 배치 */
.vq-stop-small {
  background: rgba(233,69,96,0.18);
  border: 1px solid rgba(233,69,96,0.45);
  color: #ff8a9e;
  font-size: 11px; font-weight: 700;
  padding: 5px 10px;
  border-radius: 8px;
  cursor: pointer;
  letter-spacing: 0.3px;
  flex-shrink: 0;
  transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  -webkit-tap-highlight-color: transparent;
}
.vq-stop-small:hover {
  background: rgba(233,69,96,0.30);
  border-color: rgba(233,69,96,0.65);
}
.vq-stop-small:active { transform: scale(0.94); }
/* 시작 버튼 row — 음성 퀴즈 + 첫글자 퀴즈 나란히 */
.vq-start-row {
  display: flex; gap: 8px;
  margin: 4px 14px 6px;
}
.vq-half {
  flex: 1;
  width: auto !important;
  margin: 0 !important;
  font-size: 13.5px;
  padding: 12px 10px;
}
.vq-toggle-fl {
  background: linear-gradient(135deg, rgba(186,156,245,0.92), rgba(149,117,219,0.92));
  color: #fff;
  box-shadow: 0 4px 14px rgba(149,117,219,0.35);
}
.vq-toggle-fl:hover { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(149,117,219,0.55); }
.vq-toggle-elab {
  background: linear-gradient(135deg, rgba(129,199,132,0.92), rgba(67,160,71,0.92));
  color: #fff;
  box-shadow: 0 4px 14px rgba(76,175,80,0.35);
}
.vq-toggle-elab:hover { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(76,175,80,0.55); }
.vq-third {
  flex: 1; width: auto !important; margin: 0 !important;
  font-size: 12.5px; padding: 12px 8px;
  letter-spacing: 0.2px;
}
.vq-start-row { gap: 6px; }

/* 모드 활성 — chapter-header(과목·제목) 숨겨서 카드가 맨 위로 */
#chapterScreen.quiz-focused .chapter-header { display: none; }

/* 남은 퀴즈 카드 수 badge — 시작 버튼 오른쪽 */
.vq-pending-badge {
  flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 38px;
  padding: 10px 12px;
  background: linear-gradient(180deg, rgba(255,138,0,0.22), rgba(255,138,0,0.12));
  border: 1.5px solid rgba(255,138,0,0.50);
  color: #ffb74d;
  border-radius: 10px;
  font-size: 16px; font-weight: 900;
  letter-spacing: -0.5px;
  box-shadow: 0 2px 10px rgba(255,138,0,0.20);
  text-shadow: 0 1px 3px rgba(0,0,0,0.30);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
.vq-pending-badge.zero {
  background: linear-gradient(180deg, rgba(76,175,80,0.25), rgba(76,175,80,0.12));
  border-color: rgba(76,175,80,0.55);
  color: #a5d6a7;
  box-shadow: 0 2px 10px rgba(76,175,80,0.22);
}

/* 퀴즈 모두 클리어 안내 — 시작 버튼 자리에 대체 표시 */
.quiz-cleared-notice {
  margin: 10px 14px 6px;
  padding: 22px 22px 24px;
  background:
    linear-gradient(180deg, rgba(76,175,80,0.20), rgba(76,175,80,0.06)),
    radial-gradient(ellipse at 30% 0%, rgba(129,199,132,0.18), transparent 70%);
  border: 1.5px solid rgba(76,175,80,0.50);
  border-radius: 16px;
  text-align: center;
  box-shadow:
    0 10px 28px rgba(76,175,80,0.18),
    inset 0 1px 0 rgba(255,255,255,0.10);
  animation: quizClearedPop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
}
@keyframes quizClearedPop {
  0%   { transform: scale(0.88) translateY(8px); opacity: 0; }
  100% { transform: scale(1)    translateY(0);    opacity: 1; }
}
.qc-icon {
  font-size: 44px;
  margin-bottom: 10px;
  display: block;
  animation: qcIconBounce 2s ease-in-out infinite;
}
@keyframes qcIconBounce {
  0%, 100% { transform: translateY(0) rotate(0); }
  50%      { transform: translateY(-5px) rotate(-3deg); }
}
.qc-title {
  font-size: 17px; font-weight: 900;
  color: #a5d6a7;
  letter-spacing: 0.6px;
  margin-bottom: 12px;
  text-shadow: 0 0 16px rgba(76,175,80,0.40);
}
.qc-body {
  font-size: 13px;
  color: rgba(255,255,255,0.82);
  line-height: 1.75;
}
.qc-body strong {
  color: #ffb74d;
  font-weight: 800;
}

/* 첫글자 퀴즈 — 선택지 큰 버튼 */
.fl-card { min-height: 320px; }
.fl-choices {
  display: flex; gap: 16px;
  justify-content: center; align-items: center;
  padding: 26px 8px 18px;
  flex: 1;
}
.fl-choice {
  flex: 1; max-width: 140px;
  padding: 32px 12px;
  font-size: 42px; font-weight: 900;
  color: #fff;
  background: linear-gradient(135deg, rgba(186,156,245,0.30), rgba(149,117,219,0.18));
  border: 2px solid rgba(186,156,245,0.55);
  border-radius: 18px;
  cursor: pointer;
  letter-spacing: 0.5px;
  transition: transform 0.12s ease, box-shadow 0.18s ease, border-color 0.18s ease, background 0.18s ease;
  box-shadow: 0 6px 18px rgba(0,0,0,0.32), inset 0 1px 0 rgba(255,255,255,0.10);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
  text-shadow: 0 2px 10px rgba(0,0,0,0.40);
}
.fl-choice:hover {
  transform: translateY(-3px);
  border-color: rgba(186,156,245,0.85);
  background: linear-gradient(135deg, rgba(186,156,245,0.42), rgba(149,117,219,0.26));
  box-shadow: 0 12px 28px rgba(149,117,219,0.45), inset 0 1px 0 rgba(255,255,255,0.15);
}
.fl-choice:active { transform: scale(0.96); }
.fl-hint {
  text-align: center;
  font-size: 12px;
  color: rgba(255,255,255,0.55);
  letter-spacing: 2px;
  margin-top: 6px;
  padding-bottom: 16px;
  animation: tapHintPulse 2s ease-in-out infinite;
}
.vq-card { min-height: 320px; }
.vq-card .focus-title { margin-bottom: 24px; }

.vq-listening {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 20px 12px 28px;
  flex: 1;
}
.vq-mic-ring {
  width: 92px; height: 92px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(79,195,247,0.40), rgba(79,195,247,0.10));
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 18px;
  position: relative;
  animation: vqMicPulse 1.2s ease-in-out infinite;
  box-shadow: 0 0 0 0 rgba(79,195,247,0.5);
}
@keyframes vqMicPulse {
  0%   { box-shadow: 0 0 0 0 rgba(79,195,247,0.55); transform: scale(1); }
  70%  { box-shadow: 0 0 0 22px rgba(79,195,247,0); transform: scale(1.04); }
  100% { box-shadow: 0 0 0 0 rgba(79,195,247,0); transform: scale(1); }
}
.vq-mic-icon { font-size: 44px; }
.vq-hint {
  font-size: 13px; font-weight: 700;
  color: rgba(255,255,255,0.85);
  letter-spacing: 1px;
  margin-bottom: 18px;
}
.vq-timer-bar {
  width: 80%; max-width: 280px;
  height: 6px;
  background: rgba(255,255,255,0.10);
  border-radius: 50px;
  overflow: hidden;
}
.vq-timer-fill {
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, #81c784, #ffb74d, #ff8a9e);
  border-radius: 50px;
  transform-origin: left center;
  animation: vqTimerShrink 4s linear forwards;
}
@keyframes vqTimerShrink { 0% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
/* 문제 읽기 단계 — 마이크 대신 스피커 아이콘, 다른 색조 */
.vq-reading-ring {
  background: radial-gradient(circle, rgba(255,138,0,0.40), rgba(255,138,0,0.10));
}
.vq-reading-ring { animation: vqReadingPulse 1.0s ease-in-out infinite; }
@keyframes vqReadingPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,138,0,0.55); transform: scale(1); }
  50%      { box-shadow: 0 0 0 18px rgba(255,138,0,0); transform: scale(1.06); }
}
/* 자동 모드 진행 안내 */
.vq-auto-next-hint {
  margin-top: 14px;
  font-size: 12px;
  color: rgba(255,255,255,0.5);
  letter-spacing: 1px;
  text-align: center;
  animation: vqAutoNextBlink 1.2s ease-in-out infinite;
}
@keyframes vqAutoNextBlink {
  0%, 100% { opacity: 0.5; }
  50%      { opacity: 1; }
}

.vq-result {
  padding: 18px 14px 22px;
  text-align: center;
  flex: 1; display: flex; flex-direction: column;
}
.vq-result-icon {
  font-size: 56px;
  margin-bottom: 6px;
  line-height: 1;
}
.vq-result-text {
  font-size: 22px; font-weight: 900;
  margin-bottom: 16px;
  letter-spacing: 0.5px;
}
.vq-correct .vq-result-icon { color: #81c784; text-shadow: 0 0 24px rgba(129,199,132,0.6); animation: vqResultPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) backwards; }
.vq-correct .vq-result-text { color: #a5d6a7; }
.vq-wrong .vq-result-icon { color: #ff8a9e; text-shadow: 0 0 24px rgba(233,69,96,0.6); animation: vqResultPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) backwards; }
.vq-wrong .vq-result-text { color: #ff8a9e; }
@keyframes vqResultPop {
  0% { transform: scale(0.5); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
.vq-you-said, .vq-correct-answer {
  font-size: 13px;
  color: rgba(255,255,255,0.78);
  margin: 4px 0;
}
.vq-correct-answer strong { color: #ffb74d; font-weight: 900; font-size: 15px; }
.vq-explain {
  margin-top: 14px;
  padding: 12px 14px;
  background: rgba(0,0,0,0.22);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  text-align: left;
  font-size: 13px;
  color: rgba(255,255,255,0.85);
  line-height: 1.65;
  flex: 1;
  overflow-y: auto;
}
.vq-correct .vq-explain { animation: vqExplainFade 0.4s ease backwards; }
@keyframes vqExplainFade { 0% { opacity: 0; transform: translateY(4px); } 100% { opacity: 1; transform: translateY(0); } }
.vq-next-btn {
  margin-top: 16px;
  padding: 12px 16px;
  background: linear-gradient(135deg, rgba(186,156,245,0.95), rgba(149,117,219,0.95));
  border: none; color: #fff;
  font-size: 14px; font-weight: 800;
  border-radius: 12px; cursor: pointer; letter-spacing: 0.4px;
  box-shadow: 0 4px 16px rgba(149,117,219,0.40);
}
.vq-loading { padding: 30px; text-align: center; color: rgba(255,255,255,0.55); }

/* 결과 phase — 사진 찍히듯 단어+뜻 각인 스냅샷 */
.vq-card.vq-correct-flash {
  background:
    linear-gradient(180deg, rgba(76,175,80,0.32) 0%, rgba(76,175,80,0.14) 100%),
    radial-gradient(ellipse at 50% 30%, rgba(129,199,132,0.30), transparent 70%);
  border-color: rgba(76,175,80,0.75) !important;
  box-shadow:
    0 0 50px rgba(76,175,80,0.42),
    0 0 0 1.5px rgba(76,175,80,0.40),
    inset 0 0 40px rgba(76,175,80,0.18);
}
.vq-card.vq-wrong-reveal,
.vq-card.vq-timeout {
  background:
    linear-gradient(180deg, rgba(233,69,96,0.32) 0%, rgba(233,69,96,0.14) 100%),
    radial-gradient(ellipse at 50% 30%, rgba(255,138,158,0.30), transparent 70%);
  border-color: rgba(233,69,96,0.75) !important;
  box-shadow:
    0 0 50px rgba(233,69,96,0.42),
    0 0 0 1.5px rgba(233,69,96,0.40),
    inset 0 0 40px rgba(233,69,96,0.18);
}
.vq-snapshot {
  position: relative;
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 32px 20px 28px;
  text-align: center;
  animation: vqSnapPop 0.45s cubic-bezier(0.22, 0.95, 0.30, 1.12) backwards;
}
@keyframes vqSnapPop {
  0%   { transform: scale(0.92); opacity: 0; }
  100% { transform: scale(1);    opacity: 1; }
}
/* 사진 플래시 효과 — 처음 0.4초 동안 흰빛이 사라짐 */
.vq-snap-flash {
  position: absolute; inset: 0;
  background: rgba(255,255,255,0.55);
  border-radius: inherit;
  pointer-events: none;
  animation: vqSnapFlash 0.45s ease-out backwards;
}
@keyframes vqSnapFlash {
  0%   { opacity: 1; }
  60%  { opacity: 0.35; }
  100% { opacity: 0; }
}
.vq-snap-word {
  font-size: 40px; font-weight: 900;
  color: #fff;
  letter-spacing: 0.5px;
  line-height: 1.18;
  margin-bottom: 22px;
  word-break: break-word;
  text-shadow: 0 0 28px rgba(255,255,255,0.36), 0 2px 14px rgba(0,0,0,0.40);
  z-index: 1;
}
.vq-snap-divider {
  width: 64px; height: 2px;
  background: rgba(255,255,255,0.55);
  margin-bottom: 22px;
  border-radius: 2px;
  box-shadow: 0 0 12px rgba(255,255,255,0.40);
  z-index: 1;
}
.vq-snap-meaning {
  font-size: 30px; font-weight: 800;
  color: #fff;
  letter-spacing: 0.3px;
  line-height: 1.32;
  word-break: break-word;
  text-shadow: 0 0 22px rgba(255,255,255,0.30), 0 2px 12px rgba(0,0,0,0.40);
  z-index: 1;
}
.vq-snap-next {
  margin-top: 22px;
  background: rgba(255,255,255,0.18);
  color: #fff;
  border: 1.5px solid rgba(255,255,255,0.42);
  box-shadow: 0 4px 14px rgba(0,0,0,0.30);
  z-index: 1;
}
.vq-snap-next:hover {
  background: rgba(255,255,255,0.28);
  border-color: rgba(255,255,255,0.60);
}

/* ── 자정 넘김 안내 오버레이 ───────────────────────────── */
.day-rollover-overlay {
  position: fixed; inset: 0;
  background: rgba(10, 6, 24, 0.75);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  z-index: 9999;
  display: flex; align-items: center; justify-content: center;
  animation: rolloverFadeIn 0.35s ease forwards;
}
.day-rollover-overlay.fade-out { animation: rolloverFadeOut 0.4s ease forwards; }
@keyframes rolloverFadeIn  { from { opacity: 0; } to { opacity: 1; } }
@keyframes rolloverFadeOut { from { opacity: 1; } to { opacity: 0; } }
.day-rollover-card {
  background:
    linear-gradient(180deg, rgba(70,45,120,0.52), rgba(35,20,68,0.72)),
    radial-gradient(ellipse at 30% 0%, rgba(186,156,245,0.30), transparent 65%);
  border: 1.5px solid rgba(186,156,245,0.55);
  border-radius: 22px;
  padding: 32px 30px 26px;
  text-align: center;
  max-width: 320px;
  width: calc(100% - 56px);
  box-shadow:
    0 24px 64px rgba(0,0,0,0.55),
    0 0 0 1px rgba(186,156,245,0.22),
    inset 0 1px 0 rgba(255,255,255,0.14);
  animation: rolloverCardPop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
}
@keyframes rolloverCardPop {
  0%   { transform: scale(0.72) translateY(20px); opacity: 0; }
  100% { transform: scale(1)    translateY(0);    opacity: 1; }
}
.day-rollover-icon {
  font-size: 56px;
  margin-bottom: 14px;
  display: block;
  animation: rolloverIconFloat 2.5s ease-in-out infinite;
}
@keyframes rolloverIconFloat {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-6px); }
}
.day-rollover-title {
  font-size: 17px; font-weight: 800;
  color: #d1b3ff;
  letter-spacing: 0.6px;
  margin-bottom: 12px;
}
.day-rollover-body {
  font-size: 14px;
  color: rgba(255,255,255,0.88);
  line-height: 1.7;
  margin-bottom: 18px;
}
.day-rollover-body strong {
  color: #ffb74d;
  font-size: 18px;
  font-weight: 900;
}
.day-rollover-hint {
  font-size: 11.5px;
  color: rgba(255,255,255,0.45);
  letter-spacing: 1.2px;
  animation: rolloverHintBlink 1.4s ease-in-out infinite;
}
@keyframes rolloverHintBlink {
  0%, 100% { opacity: 0.45; }
  50%      { opacity: 0.85; }
}

/* ── 단일 카드 스테이지 (오늘 학습 박스 대체) ───────────── */
.srs-today-stage {
  margin: 14px 14px 18px;
  background: linear-gradient(180deg, rgba(233,69,96,0.06), rgba(233,69,96,0.02));
  border: 1px solid rgba(233,69,96,0.30);
  border-radius: 16px;
  padding: 18px 22px 16px 16px;
  position: relative;
  display: flex; flex-direction: column;
  overflow: hidden; /* 우측 deck stack이 둥근 모서리 밖으로 새지 않게 */
}
.srs-today-stage.open { min-height: 360px; }
.srs-today-stage.closed { padding-bottom: 14px; }
.srs-today-stage.closed .stage-head { margin-bottom: 0; }
.srs-today-stage.stage-completing { animation: stageCompleteIn 320ms ease both; }
.srs-today-stage.stage-closing { animation: stageDissolve 700ms ease forwards; pointer-events: none; }
@keyframes stageCompleteIn {
  0%   { box-shadow: 0 0 0 0 rgba(233,69,96,0); }
  60%  { box-shadow: 0 0 24px 4px rgba(233,69,96,0.25); }
  100% { box-shadow: 0 0 0 0 rgba(233,69,96,0); }
}
@keyframes stageDissolve {
  0%   { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  100% { opacity: 0; transform: translateY(-6px) scale(0.97); filter: blur(2px); }
}
.stage-completion-body {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 36px 16px 28px;
  gap: 10px;
  animation: stageCompleteText 480ms ease both;
}
@keyframes stageCompleteText {
  0%   { opacity: 0; transform: translateY(8px); }
  100% { opacity: 1; transform: translateY(0); }
}
.stage-completion-icon { font-size: 44px; line-height: 1; }
.stage-completion-text { font-size: 18px; font-weight: 800; color: #ffb8c5; letter-spacing: 0.3px; }
.stage-completion-sub  { font-size: 12px; color: rgba(255,184,197,0.65); }
.stage-head {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 12px;
  -webkit-tap-highlight-color: transparent;
}
.stage-head.is-clickable { cursor: pointer; }
.stage-head .srs-box-arrow {
  font-size: 11px; color: rgba(233,69,96,0.70); width: 14px;
}
.stage-name {
  font-size: 13px; font-weight: 800;
  color: #ff8a9e; letter-spacing: 0.5px; flex: 1;
}
/* stage-counts — 3 deck stack 가로 배치. 우측 정렬 + 적절한 갭 */
.stage-counts {
  display: flex;
  gap: 8px;
  align-items: flex-end;
  flex-shrink: 0;
  padding-right: 4px; /* 회전·offset 여유 공간 */
}

/* 우상단 카드 더미 — 컴팩트 + 입체감.
   stacks이 박스 안에서 정돈된 3D 카드처럼 보이게 */
.srs-deck-stack {
  position: relative;
  width: 42px; height: 56px;
  flex-shrink: 0;
}
/* 부드러운 backdrop glow — 스택이 박스에서 "떠있는" 느낌 */
.srs-deck-stack::before {
  content: '';
  position: absolute;
  inset: -4px -4px -6px -4px;
  border-radius: 14px;
  background: radial-gradient(ellipse at center bottom, rgba(255,255,255,0.06), transparent 70%);
  pointer-events: none;
  z-index: 0;
}
.deck-back-card {
  position: absolute;
  inset: 0;
  border-radius: 9px;
  background: linear-gradient(135deg, rgba(233,69,96,0.42), rgba(180,30,60,0.28));
  border: 1.2px solid rgba(233,69,96,0.55);
  box-shadow:
    0 2px 6px rgba(0,0,0,0.30),
    inset 0 1px 0 rgba(255,255,255,0.10);
}
/* 맨 위 카드 — 강조 (밝은 그라데이션 + 강한 inner highlight + soft glow) */
.deck-back-card.deck-top {
  background: linear-gradient(135deg, rgba(255,138,158,0.78), rgba(233,69,96,0.62));
  border-color: rgba(255,138,158,0.95);
  box-shadow:
    0 4px 10px rgba(0,0,0,0.40),
    0 0 12px rgba(233,69,96,0.20),
    inset 0 1px 0 rgba(255,255,255,0.30),
    inset 0 -1px 0 rgba(0,0,0,0.20);
}
.deck-count {
  position: absolute;
  inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; font-weight: 900;
  color: #fff;
  text-shadow: 0 1px 3px rgba(0,0,0,0.85), 0 0 8px rgba(0,0,0,0.4);
  z-index: 10;
  letter-spacing: -0.6px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

/* Tone variants for 3 stack 색 구분 — 버튼 색상과 매칭 */
/* 정교화 풀 — 초록 (vq-toggle-elab 버튼과 동일 색) */
.srs-deck-today .deck-back-card {
  background: linear-gradient(135deg, rgba(129,199,132,0.42), rgba(67,160,71,0.28));
  border-color: rgba(129,199,132,0.55);
}
.srs-deck-today .deck-back-card.deck-top {
  background: linear-gradient(135deg, rgba(165,214,167,0.78), rgba(129,199,132,0.60));
  border-color: rgba(165,214,167,0.90);
  box-shadow: 0 6px 14px rgba(0,0,0,0.42), inset 0 1px 0 rgba(255,255,255,0.25), inset 0 -1px 0 rgba(0,0,0,0.15);
}
/* 퀴즈 풀 — 주황/노랑 톤 (레거시, 현재 미사용) */
.srs-deck-quiz .deck-back-card {
  background: linear-gradient(135deg, rgba(255,138,0,0.42), rgba(220,90,20,0.28));
  border-color: rgba(255,138,0,0.55);
}
.srs-deck-quiz .deck-back-card.deck-top {
  background: linear-gradient(135deg, rgba(255,193,7,0.70), rgba(255,138,0,0.55));
  border-color: rgba(255,193,7,0.85);
  box-shadow: 0 6px 14px rgba(0,0,0,0.42), inset 0 1px 0 rgba(255,255,255,0.25), inset 0 -1px 0 rgba(0,0,0,0.15);
}
/* 음성 퀴즈 풀 — 파랑 (vq-toggle-start 버튼과 동일 색) */
.srs-deck-voice .deck-back-card {
  background: linear-gradient(135deg, rgba(79,195,247,0.42), rgba(38,150,210,0.28));
  border-color: rgba(79,195,247,0.55);
}
.srs-deck-voice .deck-back-card.deck-top {
  background: linear-gradient(135deg, rgba(129,212,250,0.78), rgba(79,195,247,0.60));
  border-color: rgba(129,212,250,0.90);
  box-shadow: 0 6px 14px rgba(0,0,0,0.42), inset 0 1px 0 rgba(255,255,255,0.25), inset 0 -1px 0 rgba(0,0,0,0.15);
}
/* 첫글자 퀴즈 풀 — 보라 (vq-toggle-fl 버튼과 동일 색) */
.srs-deck-fl .deck-back-card {
  background: linear-gradient(135deg, rgba(186,156,245,0.42), rgba(149,117,219,0.28));
  border-color: rgba(186,156,245,0.55);
}
.srs-deck-fl .deck-back-card.deck-top {
  background: linear-gradient(135deg, rgba(206,180,255,0.78), rgba(186,156,245,0.60));
  border-color: rgba(206,180,255,0.90);
  box-shadow: 0 6px 14px rgba(0,0,0,0.42), inset 0 1px 0 rgba(255,255,255,0.25), inset 0 -1px 0 rgba(0,0,0,0.15);
}

/* 중앙 포커스 카드 — 글래스 모피즘 + 다층 그림자 */
.focus-card {
  background:
    linear-gradient(180deg, rgba(110,80,170,0.28) 0%, rgba(70,45,120,0.18) 100%),
    radial-gradient(ellipse at 30% 20%, rgba(186,156,245,0.18), transparent 60%);
  border: 1.5px solid rgba(186,156,245,0.42);
  border-radius: 18px;
  padding: 28px 22px 78px; /* 하단 평가 바 공간 (있을 때) */
  position: relative;
  min-height: 290px;
  display: flex; flex-direction: column;
  box-shadow:
    0 14px 36px rgba(0,0,0,0.45),
    0 0 0 1px rgba(186,156,245,0.18),
    inset 0 1px 0 rgba(255,255,255,0.10);
  animation: focusCardEnter 0.45s cubic-bezier(0.22, 0.95, 0.30, 1.12) backwards;
  overflow: hidden;
}
.focus-card.clickable {
  cursor: pointer;
  transition: box-shadow 0.25s ease, transform 0.12s ease, border-color 0.25s ease;
}
.focus-card.clickable:hover {
  border-color: rgba(186,156,245,0.62);
  box-shadow:
    0 18px 44px rgba(0,0,0,0.52),
    0 0 0 1px rgba(186,156,245,0.32),
    0 0 32px rgba(186,156,245,0.18),
    inset 0 1px 0 rgba(255,255,255,0.14);
}
.focus-card.clickable:active { transform: scale(0.992); }
@keyframes focusCardEnter {
  0% { transform: translateY(-26px) scale(0.92) rotate(-2deg); opacity: 0; }
  100% { transform: translateY(0) scale(1) rotate(0); opacity: 1; }
}
.focus-card.flying-correct {
  animation: focusCardFlyRight 0.55s cubic-bezier(0.55, 0, 0.55, 1) forwards;
  pointer-events: none;
}
.focus-card.flying-wrong {
  animation: focusCardFlyLeft 0.55s cubic-bezier(0.55, 0, 0.55, 1) forwards;
  pointer-events: none;
}
@keyframes focusCardFlyRight {
  0%   { transform: translateX(0) rotate(0); opacity: 1; }
  100% { transform: translateX(140vw) rotate(32deg); opacity: 0; }
}
@keyframes focusCardFlyLeft {
  0%   { transform: translateX(0) rotate(0); opacity: 1; }
  100% { transform: translateX(-140vw) rotate(-32deg); opacity: 0; }
}
.focus-title {
  font-size: 30px; font-weight: 900;
  color: #fff;
  text-align: center;
  margin-bottom: 18px;
  letter-spacing: 0.6px;
  line-height: 1.25;
  word-break: break-word;
  text-shadow: 0 2px 12px rgba(0,0,0,0.45);
}
.focus-title .speak-btn {
  margin-left: 8px; vertical-align: middle;
}
.focus-body-wrap {
  flex: 1;
  position: relative;
  display: flex;
  align-items: center;       /* 본문 세로 중앙 정렬 */
  justify-content: center;
  min-height: 150px;
}
.focus-body {
  width: 100%;
  font-size: 13.5px;
  color: rgba(255,255,255,0.88);
  line-height: 1.7;
  text-align: center;        /* 본문 가로 중앙 정렬 */
}
/* 포커스 카드 대표 이미지 (subtopic.image_b64) — 본문 위에 노출 */
.focus-preview {
  margin: 0 0 14px 0;
  text-align: center;
}
.focus-preview img {
  max-width: 100%;
  max-height: 260px;
  border-radius: 10px;
  display: inline-block;
  box-shadow: 0 6px 18px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.06);
}
.focus-preview-cap {
  font-size: 12px;
  color: rgba(255,255,255,0.65);
  margin-top: 8px;
  font-style: italic;
}
/* 일반(분리 X) 모드 — 본문 전체 blur */
.focus-body.blurred:not(.split) {
  filter: blur(13px);
  opacity: 0.40;
  user-select: none;
  pointer-events: none;
}
/* 본문 reveal 애니메이션 — 블러 해제 시 부드럽게 등장 (분리 모드는 별도 처리) */
.focus-body:not(.blurred):not(.split) {
  animation: focusBodyReveal 0.55s cubic-bezier(0.25, 0.46, 0.45, 0.94) backwards;
}
@keyframes focusBodyReveal {
  0%   { filter: blur(13px); opacity: 0.40; transform: scale(0.985); }
  100% { filter: blur(0);    opacity: 1;    transform: scale(1); }
}
/* ───── 수학 콘텐츠 분리 모드 (.split): 암기카드만 노출, 풀이는 blur ───── */
/*   다지기 카드 안에선 풀이 토글 버튼 무관 → 숨김. 풀이 영역은 항상 펼친 상태로 두고
     blur로만 가림. 카드 터치 시 blur 해제되어 자연스럽게 전체 공개됨.    */
.focus-body.split .solution-toggle { display: none; }
.focus-body.split .solution-content { display: block; animation: none; }
/* 분리 모드 + 블러: 부모 blur 없음, 풀이 item에만 blur */
.focus-body.blurred.split {
  user-select: none;
  pointer-events: none;
}
.focus-body.blurred.split .item.is-card-back {
  filter: blur(13px);
  opacity: 0.40;
  transition: filter 0.55s cubic-bezier(0.25, 0.46, 0.45, 0.94),
              opacity 0.55s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
.focus-body.split:not(.blurred) .item.is-card-back {
  animation: focusBodyReveal 0.55s cubic-bezier(0.25, 0.46, 0.45, 0.94) backwards;
}
/* "카드터치" 옅은 힌트 — 블러 본문 위에 부드럽게 펄스 */
.focus-tap-hint {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-size: 13px;
  font-weight: 600;
  color: rgba(255,255,255,0.32);
  letter-spacing: 5px;
  pointer-events: none;
  user-select: none;
  text-transform: none;
  animation: tapHintPulse 2.2s ease-in-out infinite;
  text-shadow: 0 1px 3px rgba(0,0,0,0.5);
}
@keyframes tapHintPulse {
  0%, 100% { opacity: 0.40; transform: translate(-50%, -50%) scale(1); }
  50%      { opacity: 0.85; transform: translate(-50%, -50%) scale(1.06); }
}
/* 하단 평가 바 — 두 버튼 (정답 보기 버튼 제거됨, 카드 터치로 통합) */
.focus-bottom-bar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0.18), rgba(0,0,0,0.38));
  border-top: 1px solid rgba(255,255,255,0.08);
  border-radius: 0 0 16px 16px;
  padding: 11px 12px;
  display: flex; gap: 10px;
}
.focus-bottom-bar .recall-btn {
  flex: 1; padding: 12px 8px;
  font-size: 14px;
}
/* 스테이지 빈 상태 (오늘 분량 끝) */
.stage-empty {
  text-align: center;
  padding: 50px 18px 30px;
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}
.stage-empty-icon { font-size: 56px; margin-bottom: 14px; animation: stageEmptyPulse 2.5s ease-in-out infinite; }
@keyframes stageEmptyPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.10); }
}
.stage-empty-text {
  font-size: 18px; font-weight: 800; color: #ff8a9e;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}
.stage-empty-hint {
  font-size: 12.5px; color: rgba(255,255,255,0.55);
  line-height: 1.6;
}

/* 드래그 재정렬 — Sortable.js 시각 피드백 */
.chapter-card.sortable-ghost { opacity: 0.35; }

  cursor: grabbing;

  position: relative; overflow: hidden;
  -webkit-tap-highlight-color: rgba(233,69,96,0.15);
  touch-action: manipulation;
  /* 박스 크기 고정 — 2줄 제목 카드도 안에 다 들어가는 높이.
     내용은 자연스럽게 위에서부터 흐름 → 1줄 제목 카드는 아래쪽 여백이 생기지만 박스 크기는 동일 */

.topic-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px; margin-bottom: 10px; overflow: hidden;
  transition: border-color 0.2s;
}
.topic-card.opened { border-color: rgba(233,69,96,0.4); }
.topic-card.locked { background: rgba(255,255,255,0.02); }

/* 학습 컨트롤 — 목차 헤더 안에 표시 (펼친 상태일 때) */
.study-controls {
  display: flex; gap: 4px; flex-shrink: 0;
  margin-left: auto;
  pointer-events: auto;
}
.study-controls * { pointer-events: auto; }
.study-btn {
  height: 28px; padding: 0 9px;
  border-radius: 14px;
  font-size: 11px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid transparent;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.1s, background 0.15s;
  white-space: nowrap;
}
.study-btn.skip   { background: rgba(79,195,247,0.18); color: #4fc3f7; border-color: rgba(79,195,247,0.3); }
.study-btn.expand { background: rgba(255,193,7,0.18); color: #ffd54f; border-color: rgba(255,193,7,0.3); }
.study-btn.done   { background: rgba(76,175,80,0.2); color: #81c784; border-color: rgba(76,175,80,0.35); }
.study-btn.reset  { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.7); border-color: rgba(255,255,255,0.15); }
.study-btn:active { transform: scale(0.92); }

/* 현재 학습 대상 (맨 위 미학습 학습 카드) — 주황 강조 */
.subtopic.current {
  background: linear-gradient(180deg, rgba(255,138,0,0.22) 0%, rgba(255,138,0,0.10) 100%) !important;
  border-color: rgba(255,138,0,0.55) !important;
  box-shadow: 0 0 0 1px rgba(255,138,0,0.25);
}
.subtopic.current .subtopic-title { color: #ffb74d; }

/* 학습 카드마다 액션 버튼 — head 안 우측에 표시 */
.subtopic-actions {
  display: flex; gap: 4px; flex-shrink: 0;
  pointer-events: auto;
}
.subtopic-head > .subtopic-actions,
.subtopic-head > .subtopic-actions * { pointer-events: auto; }
.sa-btn {
  height: 26px; padding: 0 8px;
  border-radius: 13px;
  border: 1px solid transparent;
  font-size: 11px; font-weight: 700;
  cursor: pointer; white-space: nowrap;
  display: inline-flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.1s, background 0.15s;
}
.sa-btn:active { transform: scale(0.92); }
.sa-btn.skip   { background: rgba(79,195,247,0.16); color: #4fc3f7;  border-color: rgba(79,195,247,0.3); }
.sa-btn.expand { background: rgba(255,193,7,0.16);  color: #ffd54f;  border-color: rgba(255,193,7,0.3); }
.sa-btn.done   { background: rgba(76,175,80,0.2);   color: #81c784;  border-color: rgba(76,175,80,0.35); }
.sa-btn.redo   { background: rgba(255,138,0,0.18);  color: #ffb74d;  border-color: rgba(255,138,0,0.3); }

/* 큰 패스 버튼 — 목차 헤더 오른쪽, 항상 같은 크기로 고정 */
.study-btn.skip-big {
  padding: 0 22px; width: 110px; height: 30px;
  border-radius: 50px;
  background: rgba(79,195,247,0.22);
  color: #81d4fa;
  border: 1px solid rgba(79,195,247,0.45);
  font-size: 13px; font-weight: 800;
  letter-spacing: 0.02em;
  box-shadow: 0 2px 12px rgba(79,195,247,0.15);
  flex-shrink: 0;
}
.study-btn.skip-big:active {
  background: rgba(79,195,247,0.4);
  transform: scale(0.94);
}

/* ───── 신규 단어: 오늘 학습 / 내일 학습 버튼 (subtopic-body 하단) ───── */
.learn-day-controls {
  display: flex; gap: 10px;
  margin-top: 18px;
  padding: 14px 0 4px;
  border-top: 1px dashed rgba(255,255,255,0.10);
}
.learn-day-btn {
  flex: 1;
  padding: 13px 12px;
  border: none; border-radius: 12px;
  font-size: 14px; font-weight: 800;
  cursor: pointer;
  letter-spacing: 0.3px;
  color: #fff;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.12s ease, box-shadow 0.18s ease, filter 0.15s ease;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.learn-day-btn:active { transform: scale(0.96); }
/* 오늘 학습 — 빨강/주황 (즉시 학습 = 긴급 톤) */
.learn-day-today {
  background: linear-gradient(135deg, rgba(255,138,158,0.95), rgba(233,69,96,0.92));
  box-shadow: 0 4px 14px rgba(233,69,96,0.35);
}
.learn-day-today:hover { filter: brightness(1.08); box-shadow: 0 6px 20px rgba(233,69,96,0.50); }
/* 내일 학습 — 파랑/보라 (미래 학습 = 침착 톤) */
.learn-day-tomorrow {
  background: linear-gradient(135deg, rgba(149,117,219,0.95), rgba(83,52,131,0.92));
  box-shadow: 0 4px 14px rgba(149,117,219,0.35);
}
.learn-day-tomorrow:hover { filter: brightness(1.08); box-shadow: 0 6px 20px rgba(149,117,219,0.50); }
@media (max-width: 480px) {
  .learn-day-btn { font-size: 13px; padding: 11px 8px; }
}

/* ───── 축하 폭죽 오버레이 ───── */
.celebration {
  position: fixed; inset: 0;
  background: rgba(10,10,26,0.88);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999; overflow: hidden;
  animation: celFadeIn 0.3s ease-out;
}
@keyframes celFadeIn { from { opacity: 0; } to { opacity: 1; } }
.cel-content {
  text-align: center; position: relative; z-index: 2;
  animation: celPop 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes celPop {
  0%   { transform: scale(0.3); opacity: 0; }
  100% { transform: scale(1);   opacity: 1; }
}
.cel-icon {
  font-size: 88px;
  animation: celBounce 0.9s ease-in-out infinite alternate;
}
@keyframes celBounce {
  0%   { transform: scale(1)    rotate(-10deg); }
  100% { transform: scale(1.15) rotate(10deg);  }
}
.cel-text {
  font-size: 30px; font-weight: 900;
  color: #ffd54f; margin-top: 14px;
  text-shadow: 0 4px 24px rgba(0,0,0,0.6);
  word-break: keep-all;
}
.cel-sub {
  font-size: 14px; color: rgba(255,255,255,0.75);
  margin-top: 8px; word-break: keep-all;
}
.confetti-piece {
  position: absolute; top: -50px;
  animation: confettiFall linear forwards;
  pointer-events: none; z-index: 1;
}
@keyframes confettiFall {
  to { transform: translateY(120vh) rotate(720deg); opacity: 0; }
}
.topic-head {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px; cursor: pointer;
  /* 패스 버튼 누를 때 헤더 전체가 핑크색으로 깜빡이는 것 방지 */
  -webkit-tap-highlight-color: transparent;
}
.topic-head > * { pointer-events: none; }
.topic-head > .study-controls,
.topic-head > .study-controls * { pointer-events: auto; }
.topic-head:hover { background: rgba(255,255,255,0.02); }
.topic-arrow {
  color: #e94560; font-size: 12px; width: 12px; text-align: center;
  transition: transform 0.2s; flex-shrink: 0;
}
.topic-card.opened .topic-arrow { transform: rotate(90deg); }
.topic-card.locked .topic-arrow { color: rgba(255,255,255,0.3); }
.topic-title {
  font-size: 15px; font-weight: 700; color: #fff;
  min-width: 0; flex-shrink: 1;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.topic-title .free-tag {
  display: inline-block; background: rgba(76,175,80,0.25); color: #81c784;
  font-size: 10px; padding: 2px 8px; border-radius: 50px;
  margin-left: 8px; font-weight: 700; vertical-align: middle;
}
.topic-title .lock-icon { color: rgba(255,255,255,0.4); font-size: 14px; margin-left: 6px; }
.topic-count {
  background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.7);
  font-size: 10px; padding: 3px 9px; border-radius: 50px; font-weight: 600;
  flex-shrink: 0;
}
/* 진도 바 — 목차 옆에 암기/전체 비율 시각화 */
.topic-progress {
  position: relative; flex-shrink: 0;
  width: 88px; height: 18px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 50px; overflow: hidden;
}
.topic-progress-fill {
  position: absolute; left: 0; top: 0; bottom: 0;
  background: linear-gradient(90deg, rgba(76,175,80,0.55) 0%, rgba(129,199,132,0.7) 100%);
  border-radius: 50px;
  transition: width 0.3s ease;
}
.topic-progress-fill.done {
  background: linear-gradient(90deg, rgba(76,175,80,0.85) 0%, rgba(165,214,167,0.95) 100%);
}
.topic-progress-text {
  position: relative; z-index: 1;
  display: flex; align-items: center; justify-content: center;
  height: 100%; font-size: 10px; font-weight: 700;
  color: rgba(255,255,255,0.85); letter-spacing: 0.02em;
  text-shadow: 0 1px 2px rgba(0,0,0,0.4);
}
@media (max-width: 480px) {
  .topic-progress { width: 72px; height: 16px; }
  .topic-progress-text { font-size: 9px; }
}
.topic-body { display: none; padding: 0 14px 14px; }
.topic-card.opened > .topic-body { display: block; }

.locked-banner {
  background: linear-gradient(135deg, rgba(233,69,96,0.1), rgba(83,52,131,0.1));
  border: 1px solid rgba(233,69,96,0.3); border-radius: 10px;
  padding: 16px; text-align: center; margin: 8px 0;
}
.locked-banner h4 {
  font-size: 14px; color: #fff; font-weight: 700; margin-bottom: 6px;
}
.locked-banner p {
  font-size: 12px; color: rgba(255,255,255,0.6); margin-bottom: 12px;
}
.locked-banner button {
  background: linear-gradient(135deg, #e94560, #ff6b6b); color: #fff;
  padding: 9px 22px; font-size: 13px; font-weight: 700; border-radius: 50px;
}

/* 학습 카드 = 보라 톤 (제목·미리보기 영역) */
.subtopic {
  background: linear-gradient(180deg, rgba(83,52,131,0.18) 0%, rgba(83,52,131,0.10) 100%);
  border: 1px solid rgba(179,157,219,0.25);
  border-radius: 10px;
  margin-top: 10px; overflow: hidden;
  /* transition 제거 — 패스 시 다음 단어 등장할 때 번쩍임 방지 */
}
.subtopic.understood {
  border-color: rgba(76,175,80,0.45);
  background: linear-gradient(180deg, rgba(76,175,80,0.14) 0%, rgba(76,175,80,0.06) 100%);
}
/* 다지기에서 실패해 챕터 뷰로 돌아온 카드 — 청색 강조 + ↺ 배지 */
.subtopic.failed-from-memo {
  border-color: rgba(79,195,247,0.45);
  background: linear-gradient(180deg, rgba(79,195,247,0.10) 0%, rgba(79,195,247,0.03) 100%);
}
.failed-memo-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 18px; height: 18px; min-width: 18px;
  background: rgba(79,195,247,0.85); color: #fff;
  border-radius: 50%; font-size: 11px; font-weight: 700;
  margin-right: 4px;
}
/* 다지기 모드 미래 박스 → 오늘 학습 강등 시 신비로운 dissolve */
/*  카드가 살짝 떠오르며 보랏빛 글로우가 차오르고, blur로 흩어지며 사라짐 */
.subtopic.srs-demoting {
  animation: srsDemoteAnim 1.4s cubic-bezier(0.45, 0.05, 0.55, 0.95) forwards;
  pointer-events: none;
  position: relative;
  z-index: 1;
}
.subtopic.srs-demoting::before {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 14px;
  background: radial-gradient(ellipse at center,
    rgba(186, 156, 245, 0.55) 0%,
    rgba(149, 117, 219, 0.25) 40%,
    transparent 70%);
  opacity: 0;
  animation: srsDemoteHalo 1.4s ease-out forwards;
  pointer-events: none;
  z-index: -1;
  filter: blur(8px);
}
@keyframes srsDemoteAnim {
  0% {
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: blur(0) brightness(1) saturate(1);
    box-shadow: 0 0 0 rgba(186, 156, 245, 0);
    max-height: 240px;
  }
  18% {
    opacity: 1;
    transform: translateY(-2px) scale(1.015);
    filter: blur(0) brightness(1.18) saturate(1.2);
    box-shadow:
      0 0 18px 2px rgba(186, 156, 245, 0.55),
      0 0 48px 8px rgba(149, 117, 219, 0.32);
  }
  45% {
    opacity: 0.85;
    transform: translateY(-6px) scale(1.0);
    filter: blur(1.5px) brightness(1.22) saturate(1.25);
    box-shadow:
      0 0 32px 6px rgba(186, 156, 245, 0.6),
      0 0 80px 16px rgba(149, 117, 219, 0.4);
  }
  70% {
    opacity: 0.45;
    transform: translateY(-12px) scale(0.96);
    filter: blur(5px) brightness(1.15) saturate(1.15);
    box-shadow:
      0 0 40px 8px rgba(186, 156, 245, 0.42),
      0 0 90px 24px rgba(149, 117, 219, 0.28);
  }
  100% {
    opacity: 0;
    transform: translateY(-20px) scale(0.88);
    filter: blur(14px) brightness(1) saturate(1);
    box-shadow: 0 0 0 rgba(186, 156, 245, 0);
    max-height: 0;
    margin-top: 0;
    margin-bottom: 0;
    padding-top: 0;
    padding-bottom: 0;
    border-width: 0;
  }
}
@keyframes srsDemoteHalo {
  0%   { opacity: 0; transform: scale(0.9); }
  30%  { opacity: 0.9; transform: scale(1.05); }
  60%  { opacity: 0.7; transform: scale(1.15); }
  100% { opacity: 0; transform: scale(1.35); }
}
/* 학습(오늘/내일) 카드 닫힘 — 카드는 발광 후 페이드 (실제 히어로 각인은 아래 overlay가 담당) */
.subtopic.srs-memorize {
  animation: srsMemorize 0.3s ease-out forwards;
  pointer-events: none; position: relative; z-index: 3; overflow: visible;
}
.subtopic.srs-memorize::before {   /* 보랏빛 발광 halo */
  content: ''; position: absolute; inset: -6px; border-radius: 16px;
  background: radial-gradient(ellipse at center,
    rgba(186,156,245,0.6) 0%, rgba(149,117,219,0.28) 45%, transparent 72%);
  opacity: 0; animation: srsMemorizeHalo 0.35s ease-out forwards;
  pointer-events: none; z-index: -1; filter: blur(10px);
}
@keyframes srsMemorize {
  0%   { opacity: 1; filter: brightness(1); }
  20%  { opacity: 1; filter: brightness(1.2); }
  100% { opacity: 0; filter: brightness(1.05); }
}
@keyframes srsMemorizeHalo {
  0%   { opacity: 0; transform: scale(0.85); }
  30%  { opacity: 0.9; transform: scale(1.06); }
  100% { opacity: 0; transform: scale(1.4); }
}

/* 기억 각인 overlay — 단어(또는 이미지)를 화면 전면 중앙에 크게 띄웠다가 한 점으로 저장.
   카드 레이아웃과 분리(fixed)라 위치·크기 제약 없이 확실하게 크게 보임. */
.memorize-fx {
  position: fixed; z-index: 9998; pointer-events: none;
  transform: translate(-50%, -50%);
  animation: mfxLift 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}
.memorize-fx-word {
  font-size: 40px; font-weight: 900; color: #fff; white-space: nowrap; letter-spacing: -0.01em;
  text-shadow: 0 0 26px rgba(186,156,245,0.95), 0 0 54px rgba(149,117,219,0.7);
  animation: mfxPop 1.2s cubic-bezier(0.34, 1.3, 0.5, 1) forwards;
}
.memorize-fx-img {
  width: 180px; height: 180px; object-fit: contain; border-radius: 12px;
  filter: drop-shadow(0 0 26px rgba(186,156,245,0.9));
  animation: mfxPop 1.2s cubic-bezier(0.34, 1.3, 0.5, 1) forwards;
}
.memorize-fx-glow {
  position: absolute; left: 50%; top: 50%; width: 300px; height: 300px;
  transform: translate(-50%, -50%); border-radius: 50%; z-index: -1;
  background: radial-gradient(circle, rgba(186,156,245,0.55) 0%, rgba(149,117,219,0.2) 45%, transparent 70%);
  filter: blur(14px); opacity: 0; animation: mfxGlow 1.2s ease-out forwards;
}
@keyframes mfxPop {   /* 전면에 크게(각인) → 오래 유지 → 한 점으로(저장) */
  0%   { transform: scale(0.7); opacity: 0; }
  12%  { transform: scale(1.7); opacity: 1; }    /* 각인: 크게 */
  55%  { transform: scale(1.5); opacity: 1; }    /* 크게 유지 (충분히 각인) */
  100% { transform: scale(0.04); opacity: 0; }   /* 저장 */
}
@keyframes mfxLift {   /* 마지막 구간에 위로 빨려 올라감 (머릿속으로 저장) */
  0%, 60% { transform: translate(-50%, -50%); }
  100%    { transform: translate(-50%, -155%); }
}
@keyframes mfxGlow {
  0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
  18%  { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
  55%  { opacity: 0.8; transform: translate(-50%, -50%) scale(1.15); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); }
}
/* 챕터에서 펼친 미암기 카드 ("틀린 단어") — 앰버 톤 */
.subtopic.peeked {
  border-color: rgba(255,193,7,0.45);
  background: linear-gradient(180deg, rgba(255,193,7,0.09) 0%, rgba(255,193,7,0.03) 100%);
}
/* 펼친 학습 카드 — 테두리·그림자 강조로 다른 항목과 시각적 분리 (집중 학습) */
.subtopic.opened {
  border-color: rgba(179,157,219,0.7);
  border-width: 2px;
  box-shadow: 0 0 0 1px rgba(179,157,219,0.35), 0 8px 24px rgba(0,0,0,0.35);
  margin-top: 14px; margin-bottom: 6px;
}
.subtopic.understood.opened {
  border-color: rgba(76,175,80,0.75);
  box-shadow: 0 0 0 1px rgba(76,175,80,0.35), 0 8px 24px rgba(0,0,0,0.35);
}
.subtopic.current.opened {
  border-color: rgba(255,138,0,0.85);
  box-shadow: 0 0 0 1px rgba(255,138,0,0.5), 0 8px 24px rgba(0,0,0,0.4) !important;
}
.subtopic-head {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.subtopic-head > * { pointer-events: none; }
.subtopic-head:hover { background: rgba(255,255,255,0.03); }
.subtopic-dot {
  width: 12px; height: 12px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.3); flex-shrink: 0;
  transition: all 0.2s;
}
.subtopic.understood .subtopic-dot {
  background: #4caf50; border-color: #4caf50;
  box-shadow: 0 0 10px rgba(76,175,80,0.5);
}
.subtopic-arrow {
  color: #b39ddb; font-size: 11px; width: 11px; text-align: center;
  transition: transform 0.2s; flex-shrink: 0;
}
.subtopic.opened .subtopic-arrow { transform: rotate(90deg); }
.subtopic-title {
  flex: 1; font-size: 14px; color: rgba(255,255,255,0.92); font-weight: 600;
}
.subtopic.understood .subtopic-title { color: #a5d6a7; }
/* 암기 모음 모드: current면 주황색이 암기 초록을 이김 */
.subtopic.understood.current { /* 배경·테두리는 .current의 !important로 이미 우선됨 */ }
.subtopic.understood.current .subtopic-title { color: #ffb74d; }
.subtopic.understood.current .subtopic-dot {
  background: #ffb74d; border-color: #ffb74d;
  box-shadow: 0 0 10px rgba(255,138,0,0.55);
}
/* 별표 — 틀린 횟수(miss_count) 시각 표시. 별표/all 탭에서 노출 */
.subtopic-stars {
  font-size: 11px; letter-spacing: 1px;
  color: #ffd54f; flex-shrink: 0;
  text-shadow: 0 0 6px rgba(255, 213, 79, 0.5);
}
/* 박스 위치 라벨 — all 탭에서 카드가 현재 어느 박스에 있는지 한 눈에 */
.subtopic-box-label {
  font-size: 10px; padding: 2px 7px;
  border-radius: 10px; flex-shrink: 0;
  font-weight: 600; letter-spacing: 0.3px;
  background: rgba(179,157,219,0.18);
  border: 1px solid rgba(179,157,219,0.35);
  color: #d1c4e9;
}
.subtopic-box-label.box-1 { background: rgba(233,69,96,0.18); border-color: rgba(233,69,96,0.40); color: #ff8a9e; }
.subtopic-box-label.box-2 { background: rgba(255,138,0,0.18);  border-color: rgba(255,138,0,0.40);  color: #ffb74d; }
.subtopic-box-label.box-3 { background: rgba(255,213,79,0.15); border-color: rgba(255,213,79,0.40); color: #ffe082; }
.subtopic-box-label.box-4 { background: rgba(129,199,132,0.15);border-color: rgba(129,199,132,0.40);color: #a5d6a7; }
.subtopic-box-label.box-5 { background: rgba(79,195,247,0.15); border-color: rgba(79,195,247,0.40); color: #81d4fa; }
.subtopic-box-label.box-6 { background: rgba(186,156,245,0.18);border-color: rgba(186,156,245,0.40);color: #d1b3ff; }
/* 발음 듣기 버튼 — 학습 카드 제목 옆 */
.speak-btn {
  background: rgba(79,195,247,0.12);
  border: 1px solid rgba(79,195,247,0.3);
  color: #4fc3f7;
  width: 30px; height: 26px;
  border-radius: 50px;
  font-size: 13px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  pointer-events: auto;
  transition: background 0.12s, transform 0.08s;
}
.speak-btn:hover { background: rgba(79,195,247,0.22); }
.speak-btn:active { transform: scale(0.9); background: rgba(79,195,247,0.35); }
/* 본문 = 어두운 다른 톤 (학습 카드와 명확히 분리) */
.subtopic-body {
  display: none; padding: 14px 16px 14px 28px;
  background: #0a0a1a;
  border-top: 1px solid rgba(179,157,219,0.2);
}
.subtopic.opened > .subtopic-body { display: block; }
.subtopic-preview {
  padding: 8px 14px 12px 38px; cursor: pointer;
  -webkit-tap-highlight-color: rgba(233,69,96,0.15);
  touch-action: manipulation;
}
.subtopic-preview img {
  max-width: 100%; max-height: 220px; border-radius: 6px;
  display: block; pointer-events: none; -webkit-user-drag: none;
}
.subtopic-preview .cap {
  font-size: 11px; color: rgba(255,255,255,0.5);
  margin-top: 6px; pointer-events: none;
}

/* 아이템 카드 = 본문 안의 개별 내용 — 좌측 시안색 라인으로 강조 */
.item {
  background: rgba(255,255,255,0.04);
  border-radius: 8px; padding: 12px 14px;
  margin-top: 10px;
  border-left: 3px solid rgba(79,195,247,0.5);
}
.item:first-child { margin-top: 0; }
.item .item-text {
  font-size: 14px; color: rgba(255,255,255,0.92);
  white-space: pre-wrap; word-break: break-word; line-height: 1.7;
  -webkit-user-select: none; user-select: none;
}
.item .item-image {
  max-width: 100%; max-height: 500px; border-radius: 6px; display: block;
  -webkit-user-drag: none;
  cursor: zoom-in;
  transition: filter 0.15s ease;
}
.item .item-image:hover { filter: brightness(1.06); }
.item .item-caption {
  font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 6px;
}
/* ───── HTML/SVG 콘텐츠 컨테이너 — 외부 컴파일 자산 안전 렌더 ───── */
/*   우선순위: 태블릿(7~12") 기본값 → 모바일에서 축소, PC에서 확대        */
/*   합본 안 <style>의 글로벌 셀렉터(h1{}, p{} 등)를 더 specific하게 덮어쓰기 */
.item .item-html, .item .item-svg {
  background: #f8fafc;
  color: #1a1a2e;
  border-radius: 10px;
  padding: 20px 22px;             /* 태블릿 기본 — 넉넉 */
  overflow-x: auto;
  font-size: 16px;                /* 태블릿 기본 — 가독성 우선 */
  line-height: 1.75;
  -webkit-user-select: text; user-select: text;
}
.item .item-svg { padding: 10px 12px; text-align: center; }
.item .item-html img, .item .item-svg svg, .item .item-html svg {
  max-width: 100%; height: auto; display: inline-block;
}
/* 모바일 (~640px) — 패딩·폰트 약간 축소 */
@media (max-width: 640px) {
  .item .item-html { padding: 14px 16px; font-size: 14.5px; line-height: 1.7; }
  .item .item-svg  { padding: 8px 10px; }
}
/* PC (1024px+) — 약간 더 넉넉 */
@media (min-width: 1024px) {
  .item .item-html { padding: 24px 28px; font-size: 17px; line-height: 1.8; }
}

/* 본문 단락 — 한국어 자연스러운 줄바꿈 */
.item .item-html p {
  margin: 0 0 12px;
  word-break: keep-all;        /* 한국어 음절 끊김 방지 */
  overflow-wrap: anywhere;     /* 긴 영문/URL은 끊기 (가로 오버플로 차단) */
}
.item .item-html p:last-child { margin-bottom: 0; }

/* 헤더 — 태블릿 기본 + 모바일/PC 분기. 합본 글로벌 h1{} 보다 우선 적용 */
.item .item-html h1, .item .item-html h2, .item .item-html h3,
.item .item-html h4, .item .item-html h5, .item .item-html h6 {
  font-weight: 800; color: #0a0a1a; word-break: keep-all; line-height: 1.4;
}
.item .item-html h1 {
  font-size: 1.55rem; margin: 16px 0 12px;
  padding-bottom: 8px; border-bottom: 2.5px solid #2563eb;
}
.item .item-html h2 { font-size: 1.25rem; margin: 22px 0 10px; color: #2563eb; }
.item .item-html h3 { font-size: 1.1rem;  margin: 18px 0 8px; }
.item .item-html h4 { font-size: 1rem;     margin: 14px 0 6px; }
@media (max-width: 640px) {
  .item .item-html h1 { font-size: 1.22rem; padding-bottom: 6px; margin: 14px 0 10px; }
  .item .item-html h2 { font-size: 1.08rem; margin: 18px 0 8px; }
  .item .item-html h3 { font-size: 1.02rem; }
}
@media (min-width: 1024px) {
  .item .item-html h1 { font-size: 1.75rem; }
  .item .item-html h2 { font-size: 1.4rem; }
  .item .item-html h3 { font-size: 1.18rem; }
}

/* 리스트 */
.item .item-html ul, .item .item-html ol { margin: 0 0 12px; padding-left: 24px; }
.item .item-html li {
  margin-bottom: 6px;
  word-break: keep-all; overflow-wrap: anywhere;
}

/* 표 — 좁은 화면에서 가로 스크롤 */
.item .item-html table {
  display: block; overflow-x: auto;
  border-collapse: collapse; width: 100%; margin: 10px 0;
}
.item .item-html th, .item .item-html td { word-break: keep-all; }

/* MathJax · KaTeX 수식 — 가로 오버플로 보호 */
.item .item-html mjx-container,
.item .item-html .MathJax {
  max-width: 100%;
  overflow-x: auto;
  overflow-y: hidden;
}
.item .item-html mjx-container[display="true"] {
  margin: 0.6em 0 !important;
}
.item .item-html code {
  background: #e5e7eb; padding: 1px 5px; border-radius: 3px;
  font-family: 'Courier New', monospace; font-size: 13px;
}
.item .item-html pre {
  background: #1a1a2e; color: #e5e7eb; padding: 12px 14px;
  border-radius: 6px; overflow-x: auto; font-size: 13px;
}
/* 표 셀 — 위 display:block table 규칙에 더해 보더/배경 (위 규칙과 합쳐 작동) */
.item .item-html th, .item .item-html td {
  border: 1px solid #cbd5e1; padding: 8px 10px; text-align: left;
}
.item .item-html th { background: #e2e8f0; font-weight: 700; }
/* KaTeX·MathJax 수식 — 가로 오버플로 보호 (긴 디스플레이 수식이 모바일 폭 초과) */
.item .item-html .katex { font-size: 1.05em; }
.item .item-html .katex-display {
  max-width: 100%; overflow-x: auto; overflow-y: hidden;
  margin: 0.6em 0;
}
.item .item-html mjx-container,
.item .item-html .MathJax {
  max-width: 100%; overflow-x: auto; overflow-y: hidden;
}
.item .item-html mjx-container[display="true"] { margin: 0.6em 0 !important; }

/* ───── 풀이 토글 (수학 콘텐츠 '내용' item 가림 → 학생이 먼저 풀어보게) ───── */
.solution-toggle {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%;
  margin: 16px 0;
  padding: 14px 20px;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
  transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
}
.solution-toggle:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(37, 99, 235, 0.45);
}
.solution-toggle:active { transform: translateY(0); }
.solution-toggle.open {
  background: linear-gradient(135deg, #475569 0%, #334155 100%);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
}
.solution-toggle-icon { font-size: 17px; line-height: 1; }
/* 펼침 전: 완전 가림. 펼침 후: 노출 + 부드러운 페이드 */
.solution-content {
  display: none;
  animation: solutionFadeIn 280ms ease;
}
.solution-content.open { display: block; }
@keyframes solutionFadeIn {
  0%   { opacity: 0; transform: translateY(-6px); }
  100% { opacity: 1; transform: translateY(0); }
}

/* 본문 안 이미지/SVG — 확대 가능 표시 + 호버 피드백 */
.item .item-html svg, .item .item-html img,
.item .item-svg svg, .item .item-svg img {
  cursor: zoom-in;
  transition: filter 0.15s ease;
}
.item .item-html svg:hover, .item .item-html img:hover,
.item .item-svg svg:hover, .item .item-svg img:hover { filter: brightness(1.06); }

/* ───── 콘텐츠 라이트박스 (이미지/SVG 풀스크린 확대) ───── */
.content-lightbox {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.94);
  z-index: 9999;
  align-items: center; justify-content: center;
  padding: 24px 16px;
  cursor: zoom-out;
  animation: contentLightboxIn 200ms ease;
  -webkit-tap-highlight-color: transparent;
}
.content-lightbox.open { display: flex; }
@keyframes contentLightboxIn { 0% { opacity: 0; } 100% { opacity: 1; } }
.content-lightbox-body {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
}
.content-lightbox-body > * {
  max-width: 95vw !important; max-height: 90vh !important;
  background: #fff;
  border-radius: 12px;
  padding: 12px;
  box-shadow: 0 24px 60px rgba(0,0,0,0.7);
  pointer-events: auto;
  animation: contentLightboxBodyIn 280ms cubic-bezier(0.22, 0.95, 0.30, 1.12);
  box-sizing: border-box;
}
/* SVG는 width="100%" 속성이라도 라이트박스에선 인트린식(300px)로 쪼그라들 수 있음 → 명시적 크기 */
.content-lightbox-body > svg {
  width: min(95vw, 1400px) !important;
  height: auto !important;
  display: block;
}
/* IMG는 비율 유지하며 최대 크기로 */
.content-lightbox-body > img {
  width: auto !important;
  height: auto !important;
  object-fit: contain;
}
@keyframes contentLightboxBodyIn {
  0%   { opacity: 0; transform: scale(0.92); }
  100% { opacity: 1; transform: scale(1); }
}
.content-lightbox-close {
  position: fixed;
  top: 16px; right: 18px;
  background: rgba(255,255,255,0.14);
  border: 1px solid rgba(255,255,255,0.28);
  color: #fff;
  width: 42px; height: 42px;
  border-radius: 50%;
  font-size: 22px; font-weight: 700; line-height: 1;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  z-index: 10000;
}
.content-lightbox-close:hover { background: rgba(255,255,255,0.26); }
/* 텍스트 안 자동 링크 — body의 user-select:none / touch-callout:none 효과 해제 */
.item-text .inline-link {
  color: #4fc3f7; text-decoration: underline;
  word-break: break-all;
  cursor: pointer; pointer-events: auto;
  -webkit-touch-callout: default;
  -webkit-user-select: auto; user-select: auto;
}
.item-text .inline-link:hover { color: #81d4fa; }

/* ─── 동영상 embed (item kind=link, Gumlet만) — 16:9 반응형 ─── */
.video-embed {
  position: relative; padding-bottom: 56.25%; height: 0;
  overflow: hidden; border-radius: 8px;
  background: rgba(0,0,0,0.4);
}
.video-embed iframe {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%; border: 0;
}

/* ─── 링크 카드 (item kind=link) ─── */
.link-card {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; text-decoration: none;
  background: rgba(79,195,247,0.08);
  border: 1px solid rgba(79,195,247,0.3);
  border-radius: 8px;
  transition: background 0.15s;
  /* body의 user-select·touch-callout 차단을 무시하고 클릭 가능하게 */
  cursor: pointer; pointer-events: auto;
  -webkit-touch-callout: default;
  -webkit-tap-highlight-color: rgba(79,195,247,0.25);
}
.link-card:hover { background: rgba(79,195,247,0.18); }
.link-card .link-icon {
  font-size: 22px; flex-shrink: 0;
}
.link-card .link-thumb {
  width: 96px; height: 54px; border-radius: 4px;
  object-fit: cover; flex-shrink: 0;
  pointer-events: none;
}
.link-card .link-body { flex: 1; min-width: 0; }
.link-card .link-title {
  font-size: 14px; font-weight: 600; color: #4fc3f7;
  word-break: break-word;
}
.link-card .link-url {
  font-size: 11px; color: rgba(255,255,255,0.45);
  margin-top: 3px; word-break: break-all;
}
.link-card-yt { background: rgba(229,57,53,0.10); border-color: rgba(229,57,53,0.35); }
.link-card-yt:hover { background: rgba(229,57,53,0.20); }
.link-card-yt .link-title { color: #ff5252; }

.empty-state {
  text-align: center; padding: 30px 16px;
  color: rgba(255,255,255,0.4); font-size: 13px;
}

/* ─────────────────────────────────────────────
   모달
   ───────────────────────────────────────────── */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.75);
  display: flex; align-items: center; justify-content: center;
  z-index: 200; padding: 20px; backdrop-filter: blur(4px);
}
.modal {
  width: 100%; max-width: 420px;
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  border: 1px solid #2a2a4e; border-radius: 16px;
  overflow: hidden; max-height: 90vh; display: flex; flex-direction: column;
}
.modal-head {
  padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-head h3 { font-size: 16px; font-weight: 700; color: #fff; }
.modal-head .close {
  background: transparent; color: rgba(255,255,255,0.5);
  padding: 4px 10px; font-size: 22px;
}
.modal-body { padding: 22px; overflow-y: auto; }
.modal-foot {
  padding: 14px 20px; border-top: 1px solid rgba(255,255,255,0.08);
  display: flex; justify-content: flex-end; gap: 8px;
}
.modal-foot button {
  background: rgba(255,255,255,0.08); color: #fff;
  padding: 9px 16px; border-radius: 8px; font-size: 13px; font-weight: 600;
}
.modal-foot button.primary {
  background: linear-gradient(135deg, #e94560, #ff6b6b);
}

.referral-modal .ref-link {
  background: rgba(0,0,0,0.4); padding: 12px;
  border-radius: 8px; font-family: monospace; font-size: 12px;
  color: #4fc3f7; word-break: break-all; margin: 12px 0;
  -webkit-user-select: all; user-select: all;
}
.referral-modal .ref-steps {
  display: grid; gap: 8px; margin-top: 16px;
}
.referral-modal .ref-step {
  display: flex; gap: 10px; align-items: flex-start;
  background: rgba(255,255,255,0.04); padding: 10px 12px; border-radius: 8px;
  font-size: 12px; color: rgba(255,255,255,0.8);
}
.referral-modal .ref-step b {
  flex-shrink: 0; width: 22px; height: 22px;
  background: #e94560; color: #fff; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800;
}
.referral-modal .ref-stats {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px;
}
.referral-modal .ref-stat {
  background: rgba(0,0,0,0.3); padding: 10px 12px; border-radius: 8px;
  text-align: center;
}
.referral-modal .ref-stat .v {
  font-size: 20px; font-weight: 800; color: #ffd54f; display: block;
}
.referral-modal .ref-stat .l {
  font-size: 10px; color: rgba(255,255,255,0.5); margin-top: 2px;
}

/* ─── 내 계정 모달 ─── */
.account-modal .acc-info-row {
  display: grid; grid-template-columns: 70px 1fr;
  gap: 6px 12px; margin-bottom: 14px;
  padding: 12px 14px; background: rgba(0,0,0,0.25);
  border-radius: 8px; font-size: 13px; align-items: center;
}
.account-modal .acc-info-label { color: rgba(255,255,255,0.5); font-size: 11px; }
.account-modal .acc-section-title {
  font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.6);
  margin: 16px 0 6px; letter-spacing: 0.03em;
}
.account-modal .acc-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; background: rgba(0,0,0,0.25);
  border: 1px solid rgba(255,255,255,0.05); border-radius: 8px;
  margin-bottom: 4px; font-size: 13px;
}
.account-modal .acc-row-main { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
.account-modal .acc-row-icon { font-size: 18px; flex-shrink: 0; }
.account-modal .acc-row-title { font-weight: 600; color: #fff; word-break: keep-all; }
.account-modal .acc-row-sub {
  font-size: 11px; color: rgba(255,255,255,0.45);
  padding: 0 12px 8px; margin-top: -2px;
}
.account-modal .acc-badge {
  background: rgba(76,175,80,0.2); color: #81c784;
  padding: 3px 10px; border-radius: 50px;
  font-size: 11px; font-weight: 800; flex-shrink: 0;
}
.account-modal .acc-badge.warn { background: rgba(255,152,0,0.2); color: #ffb74d; }
.account-modal .acc-badge.expired { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.5); }
.account-modal .acc-empty {
  text-align: center; padding: 12px; font-size: 12px;
  color: rgba(255,255,255,0.4);
}
.account-modal .acc-mini-btn {
  background: rgba(79,195,247,0.15); border: 1px solid rgba(79,195,247,0.35);
  color: #4fc3f7; padding: 6px 12px; border-radius: 50px;
  font-size: 12px; font-weight: 700; cursor: pointer;
}
.account-modal .acc-mini-btn:hover { background: rgba(79,195,247,0.25); }
.account-modal .acc-tag-row {
  display: flex; flex-wrap: wrap; gap: 6px;
}
.account-modal .acc-tag {
  background: rgba(233,69,96,0.15); border: 1px solid rgba(233,69,96,0.35);
  color: #ff8a9e; padding: 4px 10px; border-radius: 50px;
  font-size: 12px; font-weight: 600;
}

/* ─── 관심 주제 모달 ─── */
.interest-modal .interest-list {
  max-height: 320px; overflow-y: auto;
  display: flex; flex-direction: column; gap: 6px;
}
.interest-modal .interest-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; background: rgba(0,0,0,0.25);
  border: 1px solid rgba(255,255,255,0.06); border-radius: 8px;
  cursor: pointer; user-select: none; font-size: 14px;
  transition: background 0.12s;
}
.interest-modal .interest-row:hover { background: rgba(255,255,255,0.05); }
.interest-modal .interest-row input { width: 18px; height: 18px; cursor: pointer; flex-shrink: 0; }
.interest-modal .interest-row input:checked + span { color: #ff8a9e; font-weight: 700; }

.pay-modal .pay-row {
  display: flex; align-items: center; gap: 10px;
