// 컴팩트 deck stack — 박스 안에 깔끔하게 들어가게 cap
// tone: 'today' (정교화 — 초록) | 'voice' (말하기 — 파랑) | 'fl' (첫글자 — 보라)
function renderDeckStack(count, tone) {
  const toneCls = 'srs-deck-' + tone;
  if (count <= 0) {
    return `<div class="srs-deck-stack ${toneCls}"><div class="deck-count" style="color:rgba(255,255,255,0.30)">0</div></div>`;
  }
  // 시각적 깊이 cap — 카운트가 100이든 5든 비슷한 느낌 (숫자가 정확한 정보)
  //   0-2장: 2층 / 3-7: 3층 / 8+: 4층
  const layers = count <= 2 ? 2 : count <= 7 ? 3 : 4;
  // offset: 1.5 ~ 2.5px (강하게 cap → 컨테인 우선)
  const offset = Math.min(1.5 + Math.log10(count + 1) * 0.7, 2.5);
  let html = '';
  for (let i = 0; i < layers; i++) {
    const fromBack = layers - 1 - i; // 0 = top, layers-1 = back
    const tx = (fromBack * offset).toFixed(1);
    const ty = (fromBack * offset).toFixed(1);
    const rot = (fromBack * offset * 0.5).toFixed(1); // 최대 ~3.75°
    const op = (0.40 + ((i + 1) / layers) * 0.55).toFixed(2);
    const cls = i === layers - 1 ? 'deck-back-card deck-top' : 'deck-back-card';
    html += `<div class="${cls}" style="z-index:${i+1};transform:translate(${tx}px,${ty}px) rotate(${rot}deg);opacity:${op}"></div>`;
  }
  return `<div class="srs-deck-stack ${toneCls}">${html}<div class="deck-count">${count}</div></div>`;
}

// 스테이지 전체 HTML (헤더 + 더미 + 포커스 카드 OR 빈 상태)
//  - 헤더 클릭으로 펼침/접힘 (다른 박스와 아코디언 동작)
//  - 닫혀 있으면 헤더만 (더미 카운트는 그대로 보임)
function renderTodayStage(byBox1, hasAccess) {
  const remaining = byBox1.length;
  const isOpen = !!state.memorizedBoxOpen[1];

  // 세 stack — 정교화(today byBox[1]) · 음성 풀 · 첫글자 풀 (음성/첫글자는 voice_quiz_enabled 시)
  const c = state.currentChapter;
  const voiceQ = c && Number(c.voice_quiz_enabled) === 1;
  const todayStack = renderDeckStack(remaining, 'today');
  let voiceStack = '';
  let flStack = '';
  if (voiceQ) {
    const voicePending = byBox1.filter(s => !state.quizDoneSetVoice.has(Number(s.id))).length;
    const flPending = byBox1.filter(s => !state.quizDoneSetFirstLetter.has(Number(s.id))).length;
    voiceStack = renderDeckStack(voicePending, 'voice');
    flStack = renderDeckStack(flPending, 'fl');
  }
  const stopBtnHtml = state.elaborationActive
    ? `<button class="vq-stop-small" onclick="event.stopPropagation();stopElaboration()" title="정교화 학습 중단">× 중단</button>`
    : '';
  const stageName = state.elaborationActive ? '🧠 정교화 학습' : '오늘 학습';
  const head = `
    <div class="stage-head">
      <span class="stage-name">${stageName}</span>
      ${stopBtnHtml}
      <div class="stage-counts">${todayStack}${voiceStack}${flStack}</div>
    </div>
  `;

  // 자연 종료 → "끝났어요" 메시지 → 스르르 dissolve
  if (state.stageCompletion) {
    const closingCls = state.stageClosing ? ' stage-closing' : '';
    return `
      <div class="srs-today-stage open stage-completing${closingCls}">
        ${head}
        <div class="stage-completion-body">
          <div class="stage-completion-icon">🎉</div>
          <div class="stage-completion-text">${state.stageCompletion}</div>
          <div class="stage-completion-sub">잠시 후 닫혀요…</div>
        </div>
      </div>
    `;
  }

  if (!isOpen) {
    return `<div class="srs-today-stage closed">${head}</div>`;
  }

  // 펼침 상태: 본문 (포커스 카드 또는 빈 상태)
  const bodyHtml = remaining === 0
    ? `
      <div class="stage-empty">
        <div class="stage-empty-icon">🎉</div>
        <div class="stage-empty-text">오늘 분량 완료!</div>
        <div class="stage-empty-hint">미래 박스를 살펴보거나 새 단어를 추가하세요</div>
      </div>
    `
    : renderFocusCard(byBox1[0], remaining, hasAccess);

  return `
    <div class="srs-today-stage open">
      ${head}
      ${bodyHtml}
    </div>
  `;
}

// ============================================================
// 자정 넘김 (day rollover) — 마지막 학습 KST 날짜와 다르면 안내 + 자동 정렬
// ============================================================
// 미래 박스(literal box≥2)인데 next_review_at <= 오늘인 카드 수 = 오늘로 흘러내려온 카드
function countNewlyDueCards() {
  if (!state.currentChapter) return 0;
  const cid = state.currentChapter.id;
  const topics = state.topicsByChapter[cid] || [];
  let count = 0;
  for (const t of topics) {
    const subs = state.subtopicsByTopic[t.id] || [];
    for (const s of subs) {
      const sid = Number(s.id);
      if (!state.understoodSet.has(sid)) continue;
      const literalBox = Number(state.understoodBox[sid]) || 1;
      if (literalBox === 1) continue; // 이미 오늘 박스 — 카운트 대상 아님
      const dueDays = dueDaysLeft(state.understoodNextReview[sid]);
      if (dueDays <= 0) count++;
    }
  }
  return count;
}

// 다지기 진입 시 호출. 마지막 학습이 어제 이전이면 안내 모달 노출.
function maybeShowDayRollover() {
  if (!state.currentChapter) return;
  const today = kstTodayDate();
  const last = state.lastStudyDate;

  // 첫 진입: 그냥 기록 (안내 안 함)
  if (!last) {
    state.lastStudyDate = today;
    try { localStorage.setItem('op_last_study_date', today); } catch {}
    return;
  }
  // 같은 날: 통과
  if (last === today) return;

  // 날짜 바뀜 — 기록 갱신 (중복 안내 방지)
  state.lastStudyDate = today;
  try { localStorage.setItem('op_last_study_date', today); } catch {}

  // 이동된 카드 카운트. 0장이면 안내 안 함 (학습 시작에 방해)
  const count = countNewlyDueCards();
  if (count === 0) return;
  showDayRolloverNotice(count);
}

// 자정 넘김 안내 오버레이 — 2.5초 후 자동 사라짐 + render
function showDayRolloverNotice(count) {
  const overlay = document.createElement('div');
  overlay.className = 'day-rollover-overlay';
  overlay.innerHTML = `
    <div class="day-rollover-card">
      <div class="day-rollover-icon">🌅</div>
      <div class="day-rollover-title">새로운 학습 일정</div>
      <div class="day-rollover-body">
        <strong>${count}장</strong>의 카드가<br>오늘 학습으로 도착했습니다
      </div>
      <div class="day-rollover-hint">잠시 후 시작합니다…</div>
    </div>
  `;
  document.body.appendChild(overlay);
  setTimeout(() => {
    overlay.classList.add('fade-out');
    setTimeout(() => {
      overlay.remove();
      if (state.currentChapter && state.memorizedView) renderTree(state.currentChapter.id);
    }, 400);
  }, 2500);
}

function rebuildMemoSnapshot() {
  state.memoSnapshotIds = new Set();
  const cid = state.currentChapter && state.currentChapter.id;
  if (!cid) return;
  const topics = state.topicsByChapter[cid] || [];
  for (const t of topics) {
    const subs = state.subtopicsByTopic[t.id] || [];
    for (const s of subs) {
      if (state.understoodSet.has(Number(s.id))) state.memoSnapshotIds.add(Number(s.id));
    }
  }
}

// 암기 모음 스냅샷의 모든 items 백그라운드 프리페치 → 펼침 시 즉각 표시
function prefetchMemoSnapshot() {
  for (const subId of state.memoSnapshotIds) {
    ensureItems(subId, true);
  }
}

function toggleMemorizedView() {
  state.memorizedView = !state.memorizedView;
  // 모드 전환 시 펼친 학습 카드 닫기 (혼선 방지)
  state.expanded.subtopic.clear();
  // 소리 안전장치 — 진입·이탈 시 효과음 + 문제 읽기 자동 OFF (조용한 환경 보호)
  forceQuietQuizSound(state.memorizedView ? 'enter' : 'exit');
  const btn = $('memorizedBtn');
  if (btn) btn.classList.toggle('active', state.memorizedView);
  // ON으로 전환 → 현재 암기된 것들을 스냅샷에 고정 + items 미리 받기
  if (state.memorizedView) {
    rebuildMemoSnapshot();
    prefetchMemoSnapshot();
    // 박스 펼침 기본 상태 — 모두 닫힘. 모드 버튼(정교화/음성/첫글자)으로만 펼침
    state.memorizedBoxOpen = {1:false, 2:false, 3:false, 4:false, 5:false, 6:false};
    // 다지기 펼침 이력 초기화 — 다지기 안에서 펼친 것만 패스 판정에 사용
    state.memorizedExpandedSet = new Set();
    // 다지기 처리 이력 초기화 — celebration 판정용
    state.memorizedAddressedSet = new Set();
    state.memorizedClearedToday = false;
    // 능동 회상: 학습 효과 핵심이라 항상 ON. reveal 진행상태는 매 진입마다 리셋
    state.activeRecallMode = true;
    state.activeRecallRevealed = new Set();
    // 퀴즈 세션 상태 리셋 — 다지기 새 진입마다 0부터 시작
    state.voiceQuizActive = false;
    state.firstLetterQuizActive = false;
    state.elaborationActive = false;
    state.quizDoneSetVoice = new Set();
    state.quizDoneSetFirstLetter = new Set();
    state.quizRecentWrongs = [];
    // 일반 모드/이전 세션에서 누적된 passedSet 잔여 항목 제거 — 다지기에서는 카드가 다 보여야 함
    // (다지기 박스 안 카드들에 한해서만 클리어. 일반 모드의 다른 챕터/패스 이력은 보존)
    for (const sid of state.memoSnapshotIds) state.passedSet.delete(sid);
    savePassed();
    // 오늘 통계 KST 자정 지났을 수 있으니 다시 로드 (자동 리셋 포함)
    if (state.currentChapter) loadTodayStats(state.currentChapter.id);
    // 자정 넘김 안내 — 어제 이후 카드 자동 이동된 게 있으면 잠깐 모달
    maybeShowDayRollover();
  } else {
    state.memoSnapshotIds = new Set();
    // 다지기 → 챕터 모드 복귀 시: 학습하던 모든 목차 닫음 → 목차 화면으로
    state.expanded.topic.clear();
  }
  refreshModeTabsUI();
  if (state.currentChapter) renderTree(state.currentChapter.id);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// 암기 모음 모드의 패스 — 현재 항목을 이번 회에서 제외
function memorizedPass(subId, options) {
  // v2 다지기 패스 — was_peeked 판정은 '다지기 안에서 펼쳤는지'만 봄
  // (다른 모드(new/별표/all)에서 펼친 이력은 무시 — 다지기 안에서 안 펼치고 패스하면 advance)
  // options.forcePeeked: 능동 회상 모드에서 사용자 명시 자기평가(맞춤/틀림)로 wasPeeked 오버라이드
  const sid = Number(subId);
  const wasPeeked = options && typeof options.forcePeeked === 'boolean'
    ? options.forcePeeked
    : state.memorizedExpandedSet.has(sid);

  // 낙관적 박스/통계 갱신 — UI 즉시 반영, 서버 응답은 백그라운드
  if (state.understoodSet.has(sid)) {
    const cur = Number(state.understoodBox[sid]) || 1;
    // effective box: due 됐으면(시간 흘러 오늘 박스 위치) effective=1, 아니면 cur 그대로
    const dueDays = dueDaysLeft(state.understoodNextReview[sid]);
    const effPrev = dueDays <= 0 ? 1 : cur;
    let nxt = cur;
    if (wasPeeked) {
      // 펼친 뒤 패스 → box=1 강등
      nxt = 1;
    } else if (effPrev === 1) {
      // Model A (standard SRS): due 됐고 안 펼침 패스 → 다음 박스로 advance
      //  - box=1 → box=2 (내일)
      //  - box=2 → box=3 (4일 후)
      //  - box=3 → box=4 (8일 후)
      //  - ...
      nxt = Math.min(cur + 1, 6);
    }
    // 미래 박스 (due 아직 안 됨) + 안 펼침 → 변경 없음
    if (nxt !== cur) {
      state.understoodBox[sid] = nxt;
      // 통계: 오늘 박스 위치(effPrev=1)에서 미래(nxt>=2 or refresh)로 옮겨가면 cleared++
      bumpTodayStats(effPrev, nxt);
      // next_review_at 도 낙관적 계산
      const BOX_DUE_DAYS = [null, 0, 1, 4, 8, 16, 32];
      const days = BOX_DUE_DAYS[nxt] || 0;
      const due = new Date(Date.now() + 9*3600*1000 + days*86400*1000);
      state.understoodNextReview[sid] = due.toISOString().slice(0, 19).replace('T', ' ');
    }
    // last_moved_at 클라이언트 동기화 — 단일 카드 스테이지에서 "방금 본 카드가
    // 또 맨 위에 오는" 정렬 버그 차단 (peek+pass로 같은 박스에 머무는 경우 특히 필요)
    if (nxt !== cur || wasPeeked) {
      const nowKst = new Date(Date.now() + 9*3600*1000);
      state.understoodLastMovedAt[sid] = nowKst.toISOString().slice(0, 19).replace('T', ' ');
    }
    // 갱신 후의 effective box (state 반영 직후 재계산)
    const effNxt = dueDaysLeft(state.understoodNextReview[sid]) <= 0 ? 1 : (Number(state.understoodBox[sid]) || 1);
    // 박스 이동했으면 passedSet에서 제거 (새 박스에서 카드가 보여야 함).
    // 같은 박스에 머무르면 passedSet에 추가 (다음 패스가 다음 카드를 가리키도록 — 박스 내 진행).
    if (effPrev !== effNxt) {
      state.passedSet.delete(sid);
    } else {
      state.passedSet.add(sid);
    }
    // 오늘 학습에서 미래 박스로 이동(=실제 클리어) 추적 — celebration 트리거 조건
    if (effPrev === 1 && effNxt !== 1) {
      state.memorizedClearedToday = true;
    }
  } else {
    // understoodSet에 없는 카드 (이론상 다지기에서는 없어야 함) — 기존 동작 유지
    state.passedSet.add(sid);
  }
  // 서버 동기화 (백그라운드, 통계는 이미 낙관적 처리됨 — apiPass 중복 호출 X)
  api('POST', '/understood/pass', { subtopic_id: sid, was_peeked: wasPeeked }).catch(() => {});
  state.studyDelta++;   // 실시간 통계 — 카드 1장 학습 (다음 ping에 전송)

  // 다지기 처리 이력 — celebration 판정용 (박스 이동과 무관하게 "이번 라운드에서 처리한 카드")
  state.memorizedAddressedSet.add(sid);
  // 펼침 이력은 이 pass로 소비됨 — 다음 pass는 fresh 평가 (peek+pass로 강등된 카드를 다시 anpel로 advance 가능)
  state.memorizedExpandedSet.delete(sid);
  state.expanded.subtopic.delete(sid);
  savePassed();

  // 라운드 완료 조건:
  //  1) 오늘 학습(effective box=1) 박스가 비었음
  //  2) 이번 라운드에서 오늘 학습 카드를 한 번이라도 클리어했음 (미래 박스 무한 사이클로 발사 안 함)
  //  3) celebration 진행 중 아님
  const cid = state.currentChapter && state.currentChapter.id;
  if (!cid) return;
  const todayBoxCount = countTodayBoxCards(cid);

  if (todayBoxCount === 0 && state.memorizedClearedToday && !state.celebrationActive) {
    const topics = state.topicsByChapter[cid] || [];
    state.celebrationActive = true;
    showCelebration();
    setTimeout(() => {
      state.celebrationActive = false;
      state.memorizedClearedToday = false; // 새 라운드 시작
      // 암기 모음 내 패스/처리 이력 정리 (정상 모드의 다른 챕터 패스는 건드리지 않음)
      //  + 펼침 이력도 초기화 — 새 라운드 시작이므로 이전에 펼친 카드도 "안 펼침" 상태로 리셋
      for (const t of topics) {
        const subs = state.subtopicsByTopic[t.id] || [];
        for (const s of subs) {
          if (state.memoSnapshotIds.has(Number(s.id))) {
            state.passedSet.delete(Number(s.id));
            state.memorizedAddressedSet.delete(Number(s.id));
            state.memorizedExpandedSet.delete(Number(s.id));
          }
        }
      }
      savePassed();
      // 미암기로 분류된 학습 카드는 다음 회 스냅샷에서 빠짐 + 새 스냅샷 items 프리페치
      rebuildMemoSnapshot();
      prefetchMemoSnapshot();
      if (state.memorizedView && state.currentChapter) renderTree(state.currentChapter.id);
    }, 2200);
  }

  // 항상 화면 갱신 — celebration 진행 중에도 카드 이동을 즉시 반영
  if (state.currentChapter) {
    renderTree(state.currentChapter.id);
    if (options && options.scrollNext) scrollToStudyCard();   // 학습 판정(정교화)에서만 다음 카드로 스크롤
  }
}

function renderTopic(t, hasAccess) {
  const isFree = Number(t.is_free) === 1;
  const locked = !isFree && !hasAccess;
  const opened = state.expanded.topic.has(t.id);
  const cls = 'topic-card' + (opened ? ' opened' : '') + (locked ? ' locked' : '');

  let body = '';
  let topSubId = null;          // 학습 대상 (맨 위 미학습 = 주황)
  let hasPassed = false;        // 이 토픽에 패스된 게 있나
  if (opened) {
    if (locked) {
      body = `
        <div class="locked-banner">
          <h4>🔒 구독 후 볼 수 있는 내용입니다</h4>
          <p>이 챕터를 결제하거나, 보유 포인트로 1개월 무료 연장하세요.</p>
          <button onclick="event.stopPropagation();openPayModal(${state.currentChapter.id})">구독하기 →</button>
        </div>
      `;
    } else {
      const subs = state.subtopicsByTopic[t.id];
      if (subs === undefined) {
        loadSubtopics(t.id);
        body = '<div class="empty-state">학습 카드 로딩…</div>';
      } else if (!subs.length) {
        body = '<div class="empty-state">학습 카드 없음</div>';
      } else {
        // v2 일반 모드 — new / star / all 탭에 따라 다르게 렌더링
        let pool;
        if (state.normalMode === 'new') {
          // new: 아직 학습 안 한 카드만 (op_understood 행 없음 = understoodSet 미포함)
          pool = subs.filter(s => !state.understoodSet.has(Number(s.id)));
        } else if (state.normalMode === 'star') {
          // 별표: miss_count > 0 인 카드, 별표(miss) 많은 순
          pool = subs.filter(s => (state.understoodMissCount[Number(s.id)] || 0) > 0);
        } else {
          // all: 모든 카드, 원순 (sort_order)
          pool = subs.slice();
        }

        if (pool.length === 0) {
          const emptyMsg = state.normalMode === 'new'
            ? '이 목차의 모든 카드가 학습 시작됨 — <strong>★ 별표</strong> 또는 <strong>all</strong> 탭에서 확인'
            : state.normalMode === 'star'
            ? '아직 틀린 카드 없음'
            : '카드 없음';
          body = `<div class="empty-state" style="padding:18px 14px;text-align:center;font-size:13px;color:rgba(255,255,255,0.55);">${emptyMsg}</div>`;
          topSubId = null;
        } else {
          const allPassed = pool.every(s => state.passedSet.has(Number(s.id)));
          if (allPassed) {
            for (const s of pool) state.passedSet.delete(Number(s.id));
            savePassed();
          }
          hasPassed = pool.some(s => state.passedSet.has(Number(s.id)));
          const visible = pool.filter(s => !state.passedSet.has(Number(s.id)));

          let sortedSubs;
          if (state.normalMode === 'star') {
            sortedSubs = [...visible].sort((a, b) => {
              const ma = state.understoodMissCount[Number(a.id)] || 0;
              const mb = state.understoodMissCount[Number(b.id)] || 0;
              if (ma !== mb) return mb - ma; // miss 많은 순
              return (Number(a.sort_order) || 0) - (Number(b.sort_order) || 0);
            });
          } else {
            // new 또는 all: sort_order 순
            sortedSubs = [...visible].sort((a, b) =>
              (Number(a.sort_order) || 0) - (Number(b.sort_order) || 0)
            );
          }

          const target = sortedSubs[0];
          topSubId = target ? Number(target.id) : null;
          body = sortedSubs.map(s => renderSubtopic(s, Number(s.id) === topSubId)).join('');
        }
        // 일반 모드 — 학습 카드 위에 3탭 (다지기 ON일 땐 안 보임)
        if (!state.memorizedView) {
          body = renderModeTabs() + body;
        }
      }
    }
  }

  // ⤴ 패스 버튼 — 우선 숨김. 신규 단어는 카드 본문 하단의 '오늘 학습 / 내일 학습' 버튼으로 처리.
  //   복원하려면 아래 주석 해제:
  //   if (opened && !locked) {
  //     const hasTop = topSubId != null;
  //     studyBtns = hasTop ? `<div class="study-controls">...</div>` : '';
  //   }
  let studyBtns = '';

  // 목차별 암기 진도 — understoodSet 기준 비율
  const subsAll = state.subtopicsByTopic[t.id] || [];
  const total = subsAll.length || Number(t.subtopic_count) || 0;
  const learned = subsAll.filter(s => state.understoodSet.has(Number(s.id))).length;
  const pct = total ? Math.round(learned / total * 100) : 0;
  const doneCls = (total > 0 && learned === total) ? ' done' : '';
  const progress = `
    <div class="topic-progress" title="암기 ${learned}/${total} (${pct}%)">
      <div class="topic-progress-fill${doneCls}" style="width:${pct}%"></div>
      <div class="topic-progress-text">${learned}/${total}</div>
    </div>
  `;

  return `
    <div class="${cls}" data-topic="${t.id}">
      <div class="topic-head" onclick="toggleTopic(${t.id})">
        <div class="topic-arrow">▶</div>
        <div class="topic-title">${escapeHtml(t.title)}${isFree ? '<span class="free-tag">✨무료</span>' : (locked ? '<span class="lock-icon">🔒</span>' : '')}</div>
        ${progress}
        ${studyBtns}
      </div>
      <div class="topic-body">${body}</div>
    </div>
  `;
}

// miss_count → 별 개수 (1-3:★, 4-6:★★, 7-9:★★★, 10-12:★★★★, 13+:★★★★★)
function missToStarCount(miss) {
  const m = Number(miss) || 0;
  if (m <= 0) return 0;
  if (m <= 3) return 1;
  if (m <= 6) return 2;
  if (m <= 9) return 3;
  if (m <= 12) return 4;
  return 5;
}

// miss_count +1 트리거 — 클라이언트 즉시 +1 + 서버 동기화 (응답 무시: race 방지)
// 호출처: 퀴즈 오답, 다지기 미래 박스 dissolve, 학습 모드 사라짐 등
function bumpMissCount(sid) {
  const n = Number(sid);
  state.understoodMissCount[n] = (state.understoodMissCount[n] || 0) + 1;
  // 서버: 행 없으면 skip, 있으면 +1. fire-and-forget.
  api('POST', '/understood/peek', { subtopic_id: n }).catch(() => {});
}
// effective box → 짧은 라벨 (오늘/내일/4일/8일/16일/32일)
const BOX_SHORT_LABELS = [null, '오늘', '내일', '4일', '8일', '16일', '32일'];

function renderSubtopic(s, isCurrent) {
  const opened = state.expanded.subtopic.has(s.id);
  // 암기 모음 모드: 스냅샷 기준으로 understood 처리 → 펼친 직후 깜빡임(초록 → 기본) 방지
  const understood = state.memorizedView
    ? state.memoSnapshotIds.has(Number(s.id))
    : state.understoodSet.has(Number(s.id));
  // 정상 모드: understood면 current 강조 안 함 (이미 학습 완료)
  // 암기 모음 모드: understood여도 맨 위 항목은 current로 강조 (학습 대상)
  const showCurrent = isCurrent && (state.memorizedView || !understood);
  // 다지기에서 실패해 챕터 뷰로 돌아온 카드 — ↺ 표시 (정상 모드만)
  const failedFromMemo = !state.memorizedView && state.recentlyFailedFromMemo.has(Number(s.id));
  // 챕터에서 펼친 뒤 패스해 "틀린 단어"로 확정된 카드 — 색 다름 (다지기 복귀 카드와 별도)
  // 펼치는 순간이 아니라 패스 후에야 색 변경 → state.peekedPassedSet 기준
  const peeked = !state.memorizedView && !understood && !failedFromMemo
              && state.peekedPassedSet.has(Number(s.id));
  const cls = 'subtopic'
    + (opened ? ' opened' : '')
    + (understood ? ' understood' : '')
    + (showCurrent ? ' current' : '')
    + (failedFromMemo ? ' failed-from-memo' : '')
    + (peeked ? ' peeked' : '');
  // 교사 대표이미지(커버, image_b64)는 기존처럼 제목 아래 항상 노출.
  // 단어 자동 매핑 이미지는 본문 맨 끝에 노출 → 카드 접으면 같이 닫히고, 클릭 시 확대.
  const ownImg = unwrapImage(s.image_b64);
  const wordImg = wordImageFor(s);

  const preview = ownImg ? `
    <div class="subtopic-preview" onclick="subClick(event,${s.id})">
      <img src="${escapeHtml(ownImg)}" alt="" loading="lazy" oncontextmenu="return false">
      ${s.caption ? `<div class="cap">${escapeHtml(s.caption)}</div>` : ''}
    </div>
  ` : '';

  // 단어 자동 이미지 블록 — .item-image 라서 기존 라이트박스(확대)가 그대로 적용됨
  const wordImgBlock = wordImg ? `
    <div class="item">
      <img class="item-image" src="${escapeHtml(wordImg)}" alt="" loading="lazy" oncontextmenu="return false">
      ${s.caption ? `<div class="item-caption">${escapeHtml(s.caption)}</div>` : ''}
    </div>` : '';

  // 펼침 시 본문 (items만)
  let body = '';
  if (opened) {
    const items = state.itemsBySubtopic[s.id];
    if (items === undefined) {
      loadItems(s.id);
      body = '<div class="empty-state">로딩…</div>';
    } else if (items.locked) {
      body = `
        <div class="locked-banner">
          <h4>🔒 구독 후 볼 수 있습니다</h4>
          <button onclick="event.stopPropagation();openPayModal(${items.chapter_id})">구독하기 →</button>
        </div>`;
    } else if (items.error) {
      body = `<div class="empty-state">오류: ${escapeHtml(items.error)}</div>`;
    } else if (!items.length) {
      body = wordImgBlock || '<div class="empty-state">아직 내용이 없습니다.</div>';
    } else {
      body = items.map(it => renderItem(it)).join('') + wordImgBlock;
    }

    // 신규 단어용 — 본문 하단에 '오늘 학습 / 내일 학습' 버튼
    //   - 일반(학습) 모드 + 본문 정상 로드 + 아직 ●가 아닌 카드만
    //   - 클릭 시 srs-demoting 신비로운 dissolve 후 box 1 또는 2로 등록
    const itemsReady = Array.isArray(items) && !items.locked && !items.error && items.length > 0;
    const showLearnDay = !state.memorizedView && !understood && itemsReady;
    if (showLearnDay) {
      body += `
        <div class="learn-day-controls" onclick="event.stopPropagation()">
          <button class="learn-day-btn learn-day-today"
                  onclick="event.stopPropagation();studyDayPick(${s.id}, 1)"
                  title="오늘 학습 박스로 — 즉시 다지기 대상">📚 오늘 학습</button>
          <button class="learn-day-btn learn-day-tomorrow"
                  onclick="event.stopPropagation();studyDayPick(${s.id}, 2)"
                  title="내일 학습 박스로 — 내일부터 다지기 대상">📅 내일 학습</button>
        </div>
      `;
    }

    // 미래 박스 인벤토리에서는 능동 회상 흐름 사용 안 함 — 본문 즉시 노출 후
    // 카드 접으면 자동 강등(subClick의 신비로운 dissolve)으로 처리.
    // 능동 회상은 오늘 학습 스테이지(renderFocusCard)에만 적용.
  }

  return `
    <div class="${cls}" data-sub="${s.id}">
      <div class="subtopic-head" onclick="subClick(event,${s.id})">
        <div class="subtopic-dot"></div>
        <div class="subtopic-arrow">▶</div>
        ${failedFromMemo ? `<span class="failed-memo-badge" title="다지기에서 다시 보고 싶다고 한 카드">↺</span>` : ''}
        <div class="subtopic-title">${escapeHtml(s.title)}</div>
        ${(() => {
          // 별표 표시: 별표/all 탭 + miss_count > 0 일 때 (다지기에선 카드 색이 이미 정보 전달)
          if (state.memorizedView) return '';
          if (state.normalMode !== 'star' && state.normalMode !== 'all') return '';
          const miss = state.understoodMissCount[Number(s.id)] || 0;
          const stars = missToStarCount(miss);
          if (stars === 0) return '';
          return `<span class="subtopic-stars" title="틀린 횟수 ${miss}회">${'★'.repeat(stars)}</span>`;
        })()}
        ${(() => {
          // 박스 위치 라벨: all 탭에서, understoodSet 카드만 (학습 시작된 것만 박스가 있음)
          if (state.memorizedView) return '';
          if (state.normalMode !== 'all') return '';
          if (!state.understoodSet.has(Number(s.id))) return '';
          const dueDays = dueDaysLeft(state.understoodNextReview[Number(s.id)]);
          const effBox = dueDays <= 0 ? 1 : (Number(state.understoodBox[Number(s.id)]) || 1);
          const lbl = BOX_SHORT_LABELS[effBox] || '?';
          return `<span class="subtopic-box-label box-${effBox}" title="현재 박스 위치">${lbl}</span>`;
        })()}
        ${(/[a-zA-Z]/.test(s.title || '') && !/[가-힯ᄀ-ᇿ㄰-㆏]/.test(s.title || '')) ? `
        <button class="speak-btn"
                onclick="event.stopPropagation();speakText(${JSON.stringify(s.title).replace(/"/g, '&quot;')})"
                onmousedown="event.stopPropagation()"
                ontouchstart="event.stopPropagation()"
                title="발음 듣기">🔊</button>` : ''}
      </div>
      ${preview}
      <div class="subtopic-body">${body}</div>
    </div>
  `;
}

// ── 발음 재생 (Web Speech API) ─────────────────────────────
// 라틴 문자가 하나라도 있으면 영어로 간주, 아니면 한국어
function detectSpeechLang(text) {
  return /[a-zA-Z]/.test(String(text || '')) ? 'en-US' : 'ko-KR';
}
function speakText(text) {
  if (!('speechSynthesis' in window)) {
    toast('이 브라우저는 음성 재생을 지원하지 않습니다.', true);
    return;
  }
  const t = String(text || '').trim();
  if (!t) return;
  // 진행 중인 발음 중단 → 연속 클릭에도 깔끔하게
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = detectSpeechLang(t);
  u.rate = 0.85;   // 살짝 천천히 — 학습용
  u.pitch = 1.0;
  window.speechSynthesis.speak(u);
}
window.speakText = speakText;

// YouTube URL에서 videoId 추출 — 링크 카드 썸네일용 (embed는 YouTube 정책상 안 함)
function getYouTubeId(url) {
  const patterns = [
    /[?&]v=([a-zA-Z0-9_-]{11})/,
    /youtu\.be\/([a-zA-Z0-9_-]{11})/,
    /youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/,
    /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/,
  ];
  for (const p of patterns) {
    const m = String(url || '').match(p);
    if (m) return m[1];
  }
  return null;
}

// Gumlet 동영상 — iframe embed 허용. URL을 embed 형식으로 정규화.
function getGumletEmbedUrl(url) {
  const s = String(url || '');
  // play.gumlet.io/embed/ID 또는 play.gumlet.io/ID (둘 다 embed로 변환)
  const m = s.match(/play\.gumlet\.io\/(?:embed\/)?([a-zA-Z0-9_-]+)/);
  if (!m) return null;
  return `https://play.gumlet.io/embed/${m[1]}`;
}
// URL에 프로토콜이 없으면 https:// 자동 추가 → 클릭 시 상대 경로로 잘못 가는 것 방지
function normalizeUrl(url) {
  const s = String(url || '').trim();
  if (!s) return '';
  if (/^https?:\/\//i.test(s)) return s;
  if (s.startsWith('//')) return 'https:' + s;
  return 'https://' + s;
}
// 텍스트 안의 URL(http(s)://… 또는 www.…)을 자동으로 클릭 가능한 <a>로 변환
// 텍스트 그대로 박혀있어도 링크가 동작하게 — kind='text' 아이템에도 적용됨
// ============================================================
// MathJax 지연 로드 — html/svg 아이템에 LaTeX 수식이 있을 때만 활성화
// ============================================================
//   1) chapterTree에 .item-html 컨테이너가 새로 들어오면 MutationObserver가 감지
//   2) 그 컨테이너 안에 $ \\( \\[ 패턴이 있으면 MathJax CDN 지연 로드
//   3) MathJax.typesetPromise 로 수식 렌더 → "$x^2$" → 진짜 수식
//   4) 이미 로드됐으면 그냥 typeset만
let _mathJaxLoading = null;
async function _ensureMathJax() {
  if (window.MathJax && window.MathJax.typesetPromise) return;
  if (_mathJaxLoading) return _mathJaxLoading;
  window.MathJax = {
    tex: { inlineMath: [['$','$'],['\\(','\\)']], displayMath: [['$$','$$'],['\\[','\\]']] },
    svg: { fontCache: 'global' },
    startup: { typeset: false },
  };
  _mathJaxLoading = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js';
    s.async = true;
    s.onload = async () => {
      try { if (window.MathJax.startup && window.MathJax.startup.promise) await window.MathJax.startup.promise; } catch {}
      resolve();
    };
    s.onerror = () => reject(new Error('MathJax CDN 로드 실패'));
    document.head.appendChild(s);
  });
  return _mathJaxLoading;
}
async function _typesetMathInTree() {
  const tree = document.getElementById('chapterTree');
  if (!tree) return;
  const items = tree.querySelectorAll('.item-html');
  if (!items.length) return;
  let hasMath = false;
  for (const el of items) {
    if (/\$|\\\(|\\\[/.test(el.textContent)) { hasMath = true; break; }
  }
  if (!hasMath) return;
  try {
    await _ensureMathJax();
    if (window.MathJax && window.MathJax.typesetPromise) {
      await window.MathJax.typesetPromise([tree]);
    }
  } catch (e) { console.warn('[mathjax]', e); }
}
// MutationObserver — chapterTree childList 변경 시 디바운스 typeset
let _typesetDebounce = null;
const _typesetObserver = new MutationObserver(() => {
  if (_typesetDebounce) clearTimeout(_typesetDebounce);
  _typesetDebounce = setTimeout(_typesetMathInTree, 80);
});
function _initMathObserver() {
  const el = document.getElementById('chapterTree');
  if (!el) { setTimeout(_initMathObserver, 200); return; }
  _typesetObserver.observe(el, { childList: true });
}
_initMathObserver();

function autolinkText(text) {
  const s = String(text || '');
  const urlRegex = /(https?:\/\/[^\s<>"]+|www\.[^\s<>"]+)/g;
  let result = '';
  let lastIndex = 0;
  let m;
  while ((m = urlRegex.exec(s)) !== null) {
    result += escapeHtml(s.slice(lastIndex, m.index));
    const url = m[0];
    const href = /^https?:\/\//i.test(url) ? url : 'https://' + url;
    result += `<a href="${escapeHtml(href)}" target="_blank" rel="noopener" class="inline-link">${escapeHtml(url)}</a>`;
    lastIndex = m.index + url.length;
  }
  result += escapeHtml(s.slice(lastIndex));
  return result;
}

// DOMPurify 옵션 — matplotlib SVG (defs+use 글리프 패턴), MathJax 출력, KaTeX, 표·코드 모두 통과
//   script·iframe·on* 이벤트만 차단 (DOMPurify 기본). 그 외엔 다 허용.
function sanitizeOptsRich() {
  return {
    ADD_TAGS: [
      // SVG + MathML
      'svg','g','path','circle','ellipse','line','polyline','polygon','rect',
      'text','tspan','textPath','defs','use','symbol','marker','clipPath','mask',
      'linearGradient','radialGradient','stop','pattern','filter','feGaussianBlur',
      'feOffset','feBlend','feColorMatrix','feComponentTransfer','feFlood','feImage',
      'feMerge','feMergeNode','feMorphology','feTurbulence','feComposite',
      'foreignObject','title','desc','style',
      'math','mrow','mi','mo','mn','msup','msub','mfrac','msqrt','mroot',
      'annotation','semantics','mtable','mtr','mtd','mover','munder','munderover','mspace','mtext','mphantom',
    ],
    ADD_ATTR: [
      // 공통
      'class','id','style','xmlns','xmlns:xlink','xml:space','aria-hidden','role','focusable',
      // SVG geometry
      'viewBox','preserveAspectRatio','width','height','x','y','x1','y1','x2','y2',
      'cx','cy','r','rx','ry','d','points','transform','gradientUnits','gradientTransform',
      'spreadMethod','clipPathUnits','mask','filter',
      // SVG paint
      'fill','fill-rule','fill-opacity','stroke','stroke-width','stroke-linecap',
      'stroke-linejoin','stroke-dasharray','stroke-opacity','opacity',
      'stop-color','stop-opacity','offset','clip-path','clip-rule',
      // SVG text (matplotlib axis labels 등)
      'font-family','font-size','font-weight','font-style','text-anchor','dominant-baseline',
      'dx','dy','rotate','letter-spacing','word-spacing',
      // use / href (matplotlib defs+use 패턴 — 글자 글리프 참조)
      'href','xlink:href','target',
    ],
    // matplotlib SVG <use href="#m1234"> 같은 fragment URL 허용 (xlink:href 안전 통과)
    ADD_URI_SAFE_ATTR: ['href','xlink:href'],
    // <style> 안의 CSS는 그대로 유지 (DOMPurify가 KEEP_CONTENT 안 하면 보안상 비움)
    FORBID_TAGS: ['script','iframe','object','embed'],
    FORBID_ATTR: ['onload','onerror','onclick','onmouseover','onfocus','onblur'],
  };
}

function renderItem(it) {
  if (it.kind === 'image') {
    const url = unwrapImage(it.image_b64);
    return `
      <div class="item">
        <img class="item-image" src="${escapeHtml(url)}" alt="" loading="lazy" oncontextmenu="return false">
        ${it.caption ? `<div class="item-caption">${escapeHtml(it.caption)}</div>` : ''}
      </div>
    `;
  }
  // HTML 콘텐츠 — 외부에서 미리 컴파일된 수식/도표/표 등. DOMPurify로 새니타이즈.
  //   matplotlib SVG·MathJax 출력·KaTeX 출력·표준 표 등 모두 통과시키도록 ADD_ATTR 넓힘
  if (it.kind === 'html') {
    const raw = String(it.text || '');
    const clean = (typeof DOMPurify !== 'undefined')
      ? DOMPurify.sanitize(raw, sanitizeOptsRich())
      : escapeHtml(raw);
    // 수학 콘텐츠 마커 분리 결과 — caption으로 동작 분기:
    //   '암기카드': 카드 펼침 즉시 노출 (캡션은 숨김 — 학생 화면에 불필요)
    //   '내용':     "✅ 풀이 보기" 토글로 가림 (학생이 먼저 풀어보게)
    //   그 외:      기존대로 본문 + 캡션
    if (it.caption === '내용') {
      return `
        <div class="item is-card-back">
          <button class="solution-toggle" type="button"
            onclick="toggleSolution(this)">
            <span class="solution-toggle-icon">✅</span>
            <span class="solution-toggle-label">풀이 보기</span>
          </button>
          <div class="item-html solution-content">${clean}</div>
        </div>
      `;
    }
    if (it.caption === '암기카드') {
      return `
        <div class="item is-card-front">
          <div class="item-html">${clean}</div>
        </div>
      `;
    }
    return `
      <div class="item">
        <div class="item-html">${clean}</div>
        ${it.caption ? `<div class="item-caption">${escapeHtml(it.caption)}</div>` : ''}
      </div>
    `;
  }
  // SVG 인라인 — 그래프·도표 등 벡터. 동일 정책으로 matplotlib SVG 텍스트 글리프 보존
  if (it.kind === 'svg') {
    const raw = String(it.text || '');
    const clean = (typeof DOMPurify !== 'undefined')
      ? DOMPurify.sanitize(raw, sanitizeOptsRich())
      : '';
    return `
      <div class="item">
        <div class="item-svg">${clean}</div>
        ${it.caption ? `<div class="item-caption">${escapeHtml(it.caption)}</div>` : ''}
      </div>
    `;
  }
  if (it.kind === 'link') {
    const rawUrl = it.text || '';
    const url = normalizeUrl(rawUrl); // http(s):// 없으면 자동 추가
    // Gumlet만 iframe embed (YouTube는 정책상 링크로)
    const gumletUrl = getGumletEmbedUrl(url);
    if (gumletUrl) {
      return `
        <div class="item">
          <div class="video-embed">
            <iframe src="${gumletUrl}" frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen></iframe>
          </div>
          ${it.caption ? `<div class="item-caption">${escapeHtml(it.caption)}</div>` : ''}
        </div>
      `;
    }
    // YouTube → 링크 카드 + 썸네일
    const ytId = getYouTubeId(url);
    if (ytId) {
      return `
        <div class="item">
          <a href="${escapeHtml(url)}" target="_blank" rel="noopener" class="link-card link-card-yt">
            <img class="link-thumb" src="https://img.youtube.com/vi/${ytId}/mqdefault.jpg" alt="">
            <div class="link-body">
              <div class="link-title">${escapeHtml(it.caption || 'YouTube에서 보기')}</div>
              <div class="link-url">▶ ${escapeHtml(url)}</div>
            </div>
          </a>
        </div>
      `;
    }
    // 일반 URL → 링크 카드 + 🔗
    return `
      <div class="item">
        <a href="${escapeHtml(url)}" target="_blank" rel="noopener" class="link-card">
          <div class="link-icon">🔗</div>
          <div class="link-body">
            <div class="link-title">${escapeHtml(it.caption || rawUrl)}</div>
            ${it.caption ? `<div class="link-url">${escapeHtml(rawUrl)}</div>` : ''}
          </div>
        </a>
      </div>
    `;
  }
  return `
    <div class="item">
      <div class="item-text">${autolinkText(it.text)}</div>
      ${it.caption ? `<div class="item-caption">${escapeHtml(it.caption)}</div>` : ''}
    </div>
  `;
}

function toggleTopic(id) {
  if (state.expanded.topic.has(id)) state.expanded.topic.delete(id);
  else state.expanded.topic.add(id);
  renderTree(state.currentChapter.id);
  prefetchOpenTopics();   // 새로 펼친 토픽의 items 백그라운드 fetch
}

function collapseAll() {
  state.expanded.topic.clear();
  state.expanded.subtopic.clear();
  if (state.currentChapter) renderTree(state.currentChapter.id);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ───── 학습 컨트롤 — 플래시카드 스타일 ─────
// 패스 상태 영구 저장 (챕터 단위) — 새로고침·재진입 후에도 마지막 위치 유지
function passKey(cid) { return 'op_passed_' + cid; }
function savePassed() {
  if (!state.currentChapter) return;
  try {
    localStorage.setItem(passKey(state.currentChapter.id), JSON.stringify([...state.passedSet]));
  } catch {}
}
function loadPassed(chapterId) {
  try {
    const raw = localStorage.getItem(passKey(chapterId));
    state.passedSet = new Set(raw ? JSON.parse(raw).map(Number) : []);
  } catch { state.passedSet = new Set(); }
}

// 목차 헤더의 화면 Y 위치를 고정한 채 렌더링 (스크롤 보정)
// → 패스/완료 누를 때 위쪽 콘텐츠가 흔들리지 않고 헤더가 같은 자리에 머무름
function withTopicAnchor(topicId, callback) {
  const sel = `[data-topic="${topicId}"] > .topic-head`;
  const headEl = document.querySelector(sel);
  const beforeY = headEl ? headEl.getBoundingClientRect().top : null;
  callback();
  if (beforeY == null) return;
  // 즉시 1회 보정 + 다음 frame에 한 번 더 (브라우저 auto-scroll 대응)
  const adjust = () => {
    const newHead = document.querySelector(sel);
    if (!newHead) return;
    const afterY = newHead.getBoundingClientRect().top;
    const delta = afterY - beforeY;
    if (Math.abs(delta) > 1) window.scrollBy(0, delta);
  };
  adjust();
  requestAnimationFrame(adjust);
}

// 패스 — 모드별로 다르게 동작:
//   new: 펼쳤으면 box=1 강등(miss=1) / 안 펼쳤으면 box=2 진입
//   별표/all: 서버 변화 없음 (펼침은 peek에서 이미 처리). 화면에서만 다음 카드로
//   다지기 오늘/내일/4/8/16/32: was_peeked 기준 advance/강등/유지
// 신규 단어 — '오늘 학습' / '내일 학습' 선택
//   targetBox: 1 (오늘) | 2 (내일)
//   srs-demoting 신비로운 dissolve → state/서버 갱신 → 다지기 박스로 자동 분류
//   - 1 → /understood (POST) → box=1, due 내일 → effective box=1 = "오늘 학습"
//   - 2 → /understood/promote (POST) → box=2, due 내일 → "내일 학습"
async function studyDayPick(subId, targetBox) {
  if (!state.user) return;
  const sid = Number(subId);
  const box = (Number(targetBox) === 2) ? 2 : 1;
  if (state.understoodSet.has(sid)) { toast('이미 처리된 카드', true); return; }

  // 1) 각인 오버레이 + 카드 페이드
  const cardEl = document.querySelector(`.subtopic[data-sub="${sid}"]`);
  if (cardEl) { cardEl.classList.add('srs-memorize'); playMemorizeEffect(cardEl); }

  // 2) 1.4초 후 state + 서버 동시 처리 + 재렌더
  setTimeout(async () => {
    // 클라이언트 낙관 갱신 — 서버 응답 대기 없이 즉시 반영
    state.understoodSet.add(sid);
    state.understoodBox[sid] = box;
    const BOX_DUE_DAYS = [null, 0, 1, 4, 8, 16, 32];
    const days = BOX_DUE_DAYS[box] || 0;
    const due = new Date(Date.now() + 9 * 3600 * 1000 + days * 86400 * 1000);
    state.understoodNextReview[sid] = due.toISOString().slice(0, 19).replace('T', ' ');
    const nowKst = new Date(Date.now() + 9 * 3600 * 1000)
      .toISOString().replace('T', ' ').slice(0, 19);
    state.understoodMarkedAt[sid] = nowKst;
    state.understoodLastMovedAt[sid] = nowKst;

    // 세션 패스 + 펼침 정리 (자연 닫힘)
    state.passedSet.add(sid);
    state.expanded.subtopic.delete(sid);
    state.recentlyFailedFromMemo.delete(sid);
    savePassed();
    state.studyDelta++;   // 실시간 통계 — 첫 학습(오늘/내일)도 카드 1장 학습 (다음 ping에 전송)

    // 서버 동기화 — box=1은 /understood, box=2는 /understood/promote
    //   시나리오 1: 오늘 학습(box=1)만 miss=1 — "한 번 더 봐야지" 신호
    //   내일 학습(box=2)은 "안다 → 내일로" 긍정 신호라 miss 0 유지
    if (box === 1) state.understoodMissCount[sid] = 1;

    // 재렌더 — 화면 상단에 보이는 카드(학습 카드 제외)를 기준으로 스크롤 위치를 고정(앵커).
    // → 뷰가 위로/아래로 튀지 않음. 학습 카드만 빠지고:
    //    학습 카드가 앵커보다 '위'면 → 위가 내려와 붙고(아래 고정),
    //    학습 카드가 앵커보다 '아래'면 → 아래가 올라와 붙음(위 고정).
    // scrollBy는 즉시(보이지 않게) 레이아웃 이동을 상쇄 → 부드러운 스크롤 없음. 각인 뒤에서 정리.
    if (state.currentChapter) {
      const anchor = pickScrollAnchor(sid);
      renderTree(state.currentChapter.id);
      if (anchor) {
        const el = document.querySelector('.subtopic[data-sub="' + anchor.id + '"]');
        if (el) window.scrollBy(0, el.getBoundingClientRect().top - anchor.top);
      } else {
        // 학습 카드가 화면 상단의 '유일한' 단어였음(아래엔 목차 헤더뿐 = 그 목차의 마지막 단어).
        // 남은 단어들이 보이도록, 다음 학습 대상(current, 없으면 첫 단어)을 헤더 바로 아래로 즉시 이동.
        const cur = document.querySelector('.subtopic.current') || document.querySelector('.subtopic[data-sub]');
        if (cur) {
          const header = [...document.querySelectorAll('.app-header')].find(h => h.offsetParent !== null);
          const off = (header ? header.getBoundingClientRect().height : 0) + 10;
          window.scrollBy(0, cur.getBoundingClientRect().top - off);
        }
      }
    }

    // 서버 동기화 (렌더 후 백그라운드)
    try {
      if (box === 1) {
        await api('POST', '/understood', { subtopic_id: sid });
        api('POST', '/understood/peek', { subtopic_id: sid }).catch(() => {}); // 서버 miss +1
      } else {
        await api('POST', '/understood/promote', { subtopic_id: sid });
      }
    } catch {}
  }, 300);
}

function studyPass(subId, topicId) {
  const wasOpened = state.everExpandedSet.has(Number(subId));
  state.passedSet.add(Number(subId));
  state.expanded.subtopic.delete(Number(subId));
  const sameTopicSubs = state.subtopicsByTopic[topicId] || [];
  for (const s of sameTopicSubs) state.expanded.subtopic.delete(Number(s.id));
  savePassed();

  // v2: 별표/all 탭은 서버 변화 없음. new 또는 다지기에서만 서버 호출.
  // 다지기 모드는 memorizedView 분기로 별도 처리 (memorizedPass)
  const skipServer = !state.memorizedView && (state.normalMode === 'star' || state.normalMode === 'all');
  if (!skipServer) {
    apiPass(Number(subId), wasOpened);
  }

  // ● 카드는 챕터 뷰에서 안 보이므로 미암기 기준으로 "다 패스했나" 판정
  const subs = state.subtopicsByTopic[topicId] || [];
  const unmastered = subs.filter(s => !state.understoodSet.has(Number(s.id)));
  const stillVisible = unmastered.filter(s => !state.passedSet.has(Number(s.id)));

  if (stillVisible.length === 0) {
    // 미암기 0개면 (모두 ●) 빈 상태 안내가 그 자리를 채움 — celebrate 호출 안 함
    if (unmastered.length === 0) {
      withTopicAnchor(topicId, () => {
        if (state.currentChapter) renderTree(state.currentChapter.id);
      });
      return;
    }
    celebrateAndReset(topicId);
    return;
  }

  // 일반 패스 — 헤더 위치 고정한 채 렌더
  withTopicAnchor(topicId, () => {
    if (state.currentChapter) renderTree(state.currentChapter.id);
  });
}

// 모두 패스 시 축하 폭죽 → 패스 자동 초기화 → 처음부터 다시 시작
function celebrateAndReset(topicId) {
  showCelebration();
  setTimeout(() => {
    const subs = state.subtopicsByTopic[topicId] || [];
    for (const s of subs) state.passedSet.delete(Number(s.id));
    savePassed();
    if (state.currentChapter) renderTree(state.currentChapter.id);
  }, 2200);
}

function showCelebration() {
  const c = document.createElement('div');
  c.className = 'celebration';
  c.innerHTML =
    '<div class="cel-content">' +
    '  <div class="cel-icon">🎉</div>' +
    '  <div class="cel-text">모두 학습 완료!</div>' +
    '  <div class="cel-sub">다시 처음부터 시작합니다</div>' +
    '</div>';
  const emojis = ['🎉','🎊','✨','⭐','💫','🌟','🎈','🥳'];
  for (let i = 0; i < 50; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    piece.style.left = (Math.random() * 100) + '%';
    piece.style.animationDelay = (Math.random() * 1.2) + 's';
    piece.style.animationDuration = (1.6 + Math.random() * 1.4) + 's';
    piece.style.fontSize = (18 + Math.random() * 22) + 'px';
    c.appendChild(piece);
  }
  document.body.appendChild(c);
  if (navigator.vibrate) try { navigator.vibrate([40, 60, 40, 60, 80]); } catch {}
  setTimeout(() => c.remove(), 2700);
}

// 학습 카드 클릭 — 펼침/닫음 전용 (v2.3.5: 꾹누르기 제거)
//   ● 등록은 일반 모드의 오늘/내일 학습 버튼이 담당.
function subClick(e, subId) {
  // 클릭한 학습 카드의 화면 위치 캡쳐 (위쪽 다른 학습 카드가 닫혀도 자리 유지하려고)
  const subEl = e.currentTarget && e.currentTarget.closest('.subtopic');
  const beforeY = subEl ? subEl.getBoundingClientRect().top : null;

  if (state.expanded.subtopic.has(subId)) {
    // 이미 펼쳐진 거 다시 누름 = 접기
    state.expanded.subtopic.delete(subId);
    // reveal 진행상태 정리 — 다음 펼침은 fresh로 (스테이지에서 사용)
    state.activeRecallRevealed.delete(subId);
    // 다지기 모드 + 미래 박스(effective box ≥ 2) 카드 → 접음 = 자동 peek+pass (오늘 학습 강등)
    // "내용 살짝 확인해 보니 모르더라" 신호. 미래 박스 인벤토리는 이 인터랙션이 유일한 강등 경로.
    // 오늘 학습 스테이지 카드는 단일 카드 뷰이므로 이 분기 안 탐 (focus-card는 .subtopic이 아님).
    if (state.memorizedView && state.understoodSet.has(Number(subId))) {
      const dueDays = dueDaysLeft(state.understoodNextReview[Number(subId)]);
      const effBox = dueDays <= 0 ? 1 : (Number(state.understoodBox[Number(subId)]) || 1);
      if (effBox !== 1) {
        // 부드러운 강등 애니메이션:
        //  1) 접힌 상태로 즉시 렌더 (사용자가 접힘을 인지)
        //  2) 카드 DOM에 srs-demoting 클래스 추가 → 0.6초 fade-out + slide-out
        //  3) 애니메이션 끝나면 memorizedPass 호출 → state 갱신 + 오늘 학습으로 이동
        renderTree(state.currentChapter.id);
        const cardEl = document.querySelector(`[data-sub="${subId}"]`);
        if (cardEl) {
          cardEl.classList.add('srs-demoting');
          setTimeout(() => {
            memorizedPass(subId);
            // 시나리오 5/6: 미래박스 dissolve = 펼치고 닫음 → miss +1 (client 즉시)
            //   서버는 memorizedPass→apiPass(was_peeked=true)로 +1 받음
            state.understoodMissCount[Number(subId)] = (state.understoodMissCount[Number(subId)] || 0) + 1;
            // 미래 박스 카드가 오늘로 demote → 음성·첫글자 풀에 fresh 등재
            state.quizDoneSetVoice.delete(Number(subId));
            state.quizDoneSetFirstLetter.delete(Number(subId));
          }, 1400);
        } else {
          memorizedPass(subId); // 안전망: DOM 못 찾으면 즉시
          state.understoodMissCount[Number(subId)] = (state.understoodMissCount[Number(subId)] || 0) + 1;
          state.quizDoneSetVoice.delete(Number(subId));
          state.quizDoneSetFirstLetter.delete(Number(subId));
        }
        return;
      }
    }
  } else {
    // 아코디언: 다른 학습 카드 모두 닫고 이것만 열기
    state.expanded.subtopic.clear();
    state.expanded.subtopic.add(subId);
    // 이 챕터 안에서 한 번이라도 펼친 항목은 기억 — 일반 모드 패스 판정용
    // 같은 세션 내 같은 카드 중복 펼침은 1회만 count (중복 peek 방지)
    const firstExpand = !state.everExpandedSet.has(Number(subId));
    state.everExpandedSet.add(Number(subId));
    // 다지기 모드에서 펼친 것은 별도 추적 — 다지기 패스 판정용 (다지기 진입 시 리셋)
    if (state.memorizedView) state.memorizedExpandedSet.add(Number(subId));

    // v2: 행이 있는 카드 (별표/all/다지기에서 펼침) = miss_count +1 서버 동기화
    // 새 카드(no row, new 탭에서 펼침)는 client 상태만 — 패스 시점에 행 생성됨
    // 단, 다지기 미래박스(b≥2)는 dissolve 시점에 +1 처리하므로 펼침 +1 skip (중복 방지)
    if (firstExpand && state.understoodSet.has(Number(subId))) {
      const dueDays = dueDaysLeft(state.understoodNextReview[Number(subId)]);
      const effBox = dueDays <= 0 ? 1 : (Number(state.understoodBox[Number(subId)]) || 1);
      const isMemorizedFutureBox = state.memorizedView && effBox >= 2;
      if (!isMemorizedFutureBox) {
        apiPeek(Number(subId));
      }
    }
  }
  renderTree(state.currentChapter.id);

  // 렌더 후 같은 학습 카드가 화면에서 위로 이동했으면 그만큼 스크롤 보정 → 클릭 위치 고정
  if (beforeY != null) {
    const newEl = document.querySelector('[data-sub="' + subId + '"]');
    if (newEl) {
      const afterY = newEl.getBoundingClientRect().top;
      const delta = afterY - beforeY;
      if (Math.abs(delta) > 1) {
        window.scrollBy(0, delta);
      }
    }
  }
}

// ─── SRS due 일수 계산 ──────────────────────────────────────
// 레거시(next_review_at 없음) 또는 과거 due → 0 ("오늘 복습")
function kstTodayDate() {
  return new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10);
}
function dueDaysLeft(nextReviewAt) {
  if (!nextReviewAt) return 0;
  const today = kstTodayDate();
  const due = String(nextReviewAt).slice(0, 10);
  const parse = ymd => {
    const [y, m, d] = ymd.split('-').map(Number);
    return Date.UTC(y, m - 1, d);
  };
  const diffDays = Math.round((parse(due) - parse(today)) / (24 * 3600 * 1000));
  return Math.max(0, diffDays); // 과거 due 는 0 (오늘 복습)
}
// 일수에 따른 시각 강도 — 헤더 색·카드 opacity
// 0: today (빨강 강조), 1~2: soon (주황), 3~7: week (노랑), 8+: future (회색)
function dueTier(days) {
  if (days <= 0) return 'today';
  if (days <= 2) return 'soon';
  if (days <= 7) return 'week';
  return 'future';
}
// 그룹 헤더 라벨 — 정확한 일수 표시
function dueLabel(days) {
  if (days <= 0) return '📍 오늘 다지기';
  if (days === 1) return '내일 다지기';
  return `${days}일 후 다지기`;
}

// 암기 모음 모드 — 안 펼치고 패스하면 호출. 박스 진행 (Leitner advance)
async function silentAdvanceUnderstood(subId) {
  if (!state.user) return;
  if (!state.understoodSet.has(Number(subId))) return;
  try {
    const r = await api('POST', '/understood/advance', { subtopic_id: subId });
    if (r && r.review_box) {
      state.understoodBox[Number(subId)] = r.review_box;
      state.understoodNextReview[Number(subId)] = r.next_review_at || '';
    }
  } catch (e) {
    // 조용히 무시 — 다음 회 진입 시 서버에서 최신 상태 다시 로드됨
  }
}

// ─── v2 오늘 클리어율 통계 ──────────────────────────────
// 분모 = 오늘 박스(1)에 들어온 누적 카드 / 분자 = 오늘 박스에서 내일(2)로 진급한 카드
// 챕터 단위 localStorage, KST 자정 지나면 자동 리셋
function todayStatsKey(chapterId) { return 'op_today_stats_' + chapterId; }
function kstTodayStr() { return new Date(Date.now() + 9*3600*1000).toISOString().slice(0,10); }
// 현재 오늘 박스(effectiveBox=1) 카드 수 — 분모 동적 계산용
function countTodayBoxCards(chapterId) {
  const topics = state.topicsByChapter[chapterId] || [];
  let count = 0;
  for (const t of topics) {
    const subs = state.subtopicsByTopic[t.id] || [];
    for (const s of subs) {
      const sid = Number(s.id);
      if (!state.understoodSet.has(sid)) continue;
      const days = dueDaysLeft(state.understoodNextReview[sid]);
      const box = days <= 0 ? 1 : (Number(state.understoodBox[sid]) || 1);
      if (box === 1) count++;
    }
  }
  return count;
}

function loadTodayStats(chapterId) {
  try {
    const raw = localStorage.getItem(todayStatsKey(chapterId));
    const j = raw ? JSON.parse(raw) : null;
    const today = kstTodayStr();
    if (j && j.date === today) {
      state.todayStatsCleared = Number(j.cleared) || 0;
      state.todayStatsDate = today;
    } else {
      state.todayStatsCleared = 0;
      state.todayStatsDate = today;
      saveTodayStats(chapterId);
    }
  } catch {
    state.todayStatsCleared = 0;
    state.todayStatsDate = kstTodayStr();
  }
}

// 렌더 직전 호출 — 자정 지나면 cleared 자동 리셋
function ensureTodayStatsCurrent(chapterId) {
  const today = kstTodayStr();
  if (state.todayStatsDate !== today) loadTodayStats(chapterId);
}
function saveTodayStats(chapterId) {
  try {
    localStorage.setItem(todayStatsKey(chapterId), JSON.stringify({
      date: state.todayStatsDate || kstTodayStr(),
      cleared: state.todayStatsCleared,
    }));
  } catch {}
}
// 카드의 박스 전이에 따라 통계 갱신
// 분모는 동적으로 계산 (currentBox1 + cleared) — entered 별도 추적 안 함
// prevBox=null (행이 없었음, new) / prevBox=N (기존 박스), newBox=새 박스
function bumpTodayStats(prevBox, newBox) {
  if (!state.currentChapter) return;
  const cid = state.currentChapter.id;
  const today = kstTodayStr();
  if (state.todayStatsDate !== today) {
    state.todayStatsCleared = 0; state.todayStatsDate = today;
  }
  // 오늘 박스(1)에서 내일 박스(2) 이상으로 진급 — 분자 +1
  if (prevBox === 1 && newBox >= 2) state.todayStatsCleared++;
  saveTodayStats(cid);
}

// 펼친 시점 호출 — 행이 있으면 서버 miss_count +1
async function apiPeek(subId) {
  if (!state.user) return;
  try {
    const r = await api('POST', '/understood/peek', { subtopic_id: subId });
    if (r && !r.skipped && typeof r.miss_count === 'number') {
      state.understoodMissCount[Number(subId)] = r.miss_count;
    }
  } catch {}
}

// 패스 시점 호출 — 박스 상태 + was_peeked 기준 서버 분기
async function apiPass(subId, wasPeeked) {
  if (!state.user) return null;
  const sid = Number(subId);
  let prevEff = null;
  if (state.understoodSet.has(sid)) {
    const prevBox = Number(state.understoodBox[sid]) || 1;
    const dueDays = dueDaysLeft(state.understoodNextReview[sid]);
    prevEff = dueDays <= 0 ? 1 : prevBox;
  }
  try {
    const r = await api('POST', '/understood/pass', { subtopic_id: subId, was_peeked: !!wasPeeked });
    state.studyDelta++;   // 실시간 통계 — 카드 1장 학습 (다음 ping에 전송)
    if (r && r.ok) {
      if (typeof r.review_box === 'number') {
        state.understoodSet.add(sid);
        state.understoodBox[sid] = r.review_box;
        bumpTodayStats(prevEff, r.review_box);
      }
      if (r.next_review_at) state.understoodNextReview[sid] = r.next_review_at;
      if (typeof r.miss_count === 'number') state.understoodMissCount[sid] = r.miss_count;
    }
    return r;
  } catch { return null; }
}

// 패스 — 안 펼치고 패스한 경우 자동 ● 암기로 설정 (정상 모드에서 사용)
// 화면 갱신·토스트 없이 understoodSet 갱신 + 서버 동기화
async function silentMarkUnderstood(subId) {
  if (!state.user) return;
  if (state.understoodSet.has(Number(subId))) return;
  state.understoodSet.add(Number(subId));
  // 클라이언트 KST 시각 — 서버 kstDateTime() 호환 정렬 키
  const d = new Date(Date.now() + 9 * 3600 * 1000);
  state.understoodMarkedAt[Number(subId)] = d.toISOString().replace('T', ' ').slice(0, 19);
  // ●가 되면 "다지기 실패 복귀" 표시는 자동 해제 — 더 이상 미암기가 아니므로
  state.recentlyFailedFromMemo.delete(Number(subId));
  try {
    const r = await api('POST', '/understood', { subtopic_id: subId });
    // 서버가 box=1, next_review_at=내일 자동 세팅 — 받은 값 반영
    if (r && r.review_box) {
      state.understoodBox[Number(subId)] = r.review_box;
      state.understoodNextReview[Number(subId)] = r.next_review_at || '';
    }
  } catch (e) {
    // 실패 시 롤백
    state.understoodSet.delete(Number(subId));
    delete state.understoodMarkedAt[Number(subId)];
  }
}

// 다지기 모드 — 펼친 시점에 호출. 화면 갱신·토스트 없이 understoodSet/서버만 정리.
// (스냅샷이 이번 회 화면을 고정하므로 사용자 입장에선 즉시 사라지지 않음)
// understoodMarkedAt 은 정렬 키라서 건드리지 않음 — 이번 회 정렬 순서 유지.
// 다지기에서 실패한 카드는 챕터 뷰 맨 아래에 ↺ 표시로 다시 나타남 → 재학습 가능.
async function silentUnmarkUnderstood(subId) {
  if (!state.user) return;
  if (!state.understoodSet.has(Number(subId))) return;
  const wasInEverExpanded = state.everExpandedSet.has(Number(subId));
  state.understoodSet.delete(Number(subId));
  // 다지기에서 호출됐을 때 — 챕터 뷰로 복귀하면서 두 가지:
  // 1) recentlyFailedFromMemo 에 추가 → ↺ 표시 + 맨 아래 정렬
  // 2) everExpandedSet 에서 제거 → 챕터 뷰에서 안 펼치고 패스하면 "fresh" 판정으로
  //    silentMark 호출 → ● 등록 → 내일 다지기로 정상 등록
  if (state.memorizedView) {
    state.recentlyFailedFromMemo.add(Number(subId));
    state.everExpandedSet.delete(Number(subId));
  }
  try {
    await api('POST', '/understood', { subtopic_id: subId });
  } catch (e) {
    // 실패 시 롤백 — 다음 회에도 암기로 남음
    state.understoodSet.add(Number(subId));
    state.recentlyFailedFromMemo.delete(Number(subId));
    if (wasInEverExpanded) state.everExpandedSet.add(Number(subId));
  }
}

async function refreshChapter() {
  if (!state.currentChapter) return;
  const cid = state.currentChapter.id;
  showLoading(true);   // 시각 피드백 — 사용자가 진행 중임을 알게
  try {
    // 캐시 무효화 (재진입 시 다시 fetch)
    delete state.topicsByChapter[cid];
    Object.keys(state.subtopicsByTopic).forEach(k => delete state.subtopicsByTopic[k]);
    Object.keys(state.itemsBySubtopic).forEach(k => delete state.itemsBySubtopic[k]);
    // 챕터·접근권·이해표시도 갱신
    await Promise.all([
      loadChapters(),
      loadUnderstood(),
      api('GET', '/auth/me').then(r => {
        state.point = Number(r.user.point) || 0;
        state.chapterAccess = r.chapter_access || {};
      }).catch(() => {}),
    ]);
    // 챕터 재진입 (현재 챕터 객체 갱신)
    const fresh = state.chapters.find(x => x.id === cid);
    if (!fresh) {
      toast('이 챕터는 삭제되었습니다.', true);
      goHome();
      return;
    }
    state.currentChapter = fresh;
    await loadTopics(cid);
    renderTree(cid);
    toast('최신 콘텐츠로 갱신됨');
  } catch (e) {
    toast('새로고침 실패: ' + e.message, true);
  } finally {
    showLoading(false);
  }
}

async function goPayment(chapterId) {
  closeModal();
  // 1순위: Worker가 동적으로 PayApp 결제 세션 생성 (var1=chapter_id로 매핑)
  //         → PayApp이 결제 완료 시 Worker /payapp/webhook으로 통보
  // 2순위 (fallback): 만약 Worker 호출 실패 + chapter.pay_url이 설정돼 있으면 정적 링크 사용
  try {
    toast('결제 페이지로 이동 중…');
    const r = await api('POST', '/payment/request', { chapter_id: chapterId });
    if (!r.payurl) throw new Error('payurl missing');
    window.open(r.payurl, '_blank');
    toast('결제 후 잠시 후 갱신됩니다. (Pull-to-refresh 또는 새로고침)');
  } catch (e) {
    // Fallback — 옛 정적 링크 (deprecated)
    const c = state.chapters.find(x => x.id === chapterId);
    const payUrl = c && c.pay_url ? String(c.pay_url).trim() : '';
    if (payUrl) {
      window.open(payUrl, '_blank');
      toast('결제 후 잠시 후 갱신됩니다.');
      return;
    }
    toast('결제 세션 생성 실패: ' + (e.message || ''), true);
  }
}

  showLoading(true);
  try {

    state.chapterAccess[chapterId] = { expires_at: r.expires_at, source: 'point_redeem' };

    toast(`${REDEEM_COST.toLocaleString()}P 사용 — 30일 연장됨`);

// 내 계정 모달 — 포인트·구독·관심·비밀번호·로그아웃 종합
// ============================================================
function openAccountModal() {
  const u = state.user || {};
  // 구독 정보 (활성 + 만료된 챕터)
  const access = state.chapterAccess || {};
  const isTeacher = u.role === 'teacher';
  const chapterMap = {};
  for (const c of state.chapters || []) chapterMap[c.id] = c;
  const now = Date.now() + 9 * 3600 * 1000; // KST
  const active = [];
  const expired = [];
  for (const cid in access) {
    const a = access[cid];
    const ch = chapterMap[cid];
    if (!ch) continue;
    const exp = new Date(a.expires_at).getTime();
    if (exp > now) active.push({ ch, expiresAt: a.expires_at, dLeft: Math.ceil((exp - now) / 86400000) });
    else expired.push({ ch, expiresAt: a.expires_at });
  }
  active.sort((a, b) => a.dLeft - b.dLeft);

  const subscriptionsHtml = isTeacher
    ? '<div class="acc-row" style="color:#ffd54f;font-weight:600;">🛠 관리자 — 모든 챕터 무제한</div>'
    : active.length === 0
      ? '<div class="acc-empty">활성 구독이 없습니다</div>'
      : active.map(a => `
          <div class="acc-row">
            <div class="acc-row-main">
              <span class="acc-row-icon">${escapeHtml(a.ch.icon || '📘')}</span>
              <span class="acc-row-title">${escapeHtml(a.ch.title)}</span>
            </div>
            <span class="acc-badge ${a.dLeft <= 7 ? 'warn' : ''}">D-${a.dLeft}</span>
          </div>
          <div class="acc-row-sub">만료: ${fmtKstDate(a.expiresAt)} KST</div>
        `).join('');

  const expiredHtml = expired.length === 0 ? '' : `
    <div class="acc-section-title" style="margin-top:14px;color:rgba(255,255,255,0.45);">만료된 구독 ${expired.length}개</div>
    ${expired.slice(0, 3).map(e => `
      <div class="acc-row" style="opacity:0.55">
        <div class="acc-row-main">
          <span class="acc-row-icon">${escapeHtml(e.ch.icon || '📘')}</span>
          <span class="acc-row-title">${escapeHtml(e.ch.title)}</span>
        </div>
        <span class="acc-badge expired">만료</span>
      </div>
    `).join('')}
  `;

  const interestsHtml = (state.interests || []).length === 0
    ? '<div class="acc-empty" style="font-size:12px;">설정 없음 (전체 노출)</div>'
    : `<div class="acc-tag-row">${state.interests.map(i => `<span class="acc-tag">${escapeHtml(i)}</span>`).join('')}</div>`;

  showModal({
    title: `${escapeHtml(u.name || '내')} 계정`,
    klass: 'account-modal',
    body: `
      <div class="acc-info-row">
        <div class="acc-info-label">이름</div><div>${escapeHtml(u.name || '-')}</div>
        <div class="acc-info-label">이메일</div><div>${escapeHtml(u.email || '-')}</div>
        <div class="acc-info-label">전화</div><div>${escapeHtml(u.phone || '-')}</div>
        <div class="acc-info-label">추천 코드</div>
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
          <strong style="color:#ffd54f;">${escapeHtml(u.referral_code || '-')}</strong>
          ${u.referral_code ? `
            <button class="acc-mini-btn" onclick="copyMyReferralCode()" style="padding:3px 9px;">📋 코드</button>
            <button class="acc-mini-btn" onclick="copyMyReferralLinkFromAccount()" style="padding:3px 9px;">🔗 링크</button>
          ` : ''}
        </div>
      </div>

      <div class="acc-section-title">💰 포인트</div>
      <div class="acc-row">
        <div class="acc-row-main"><span class="acc-row-title">${state.point.toLocaleString()} P</span></div>
        <button class="acc-mini-btn" onclick="closeModal();openPointModal();">사용하기 →</button>
      </div>
      <div class="acc-row-sub">친구 추천 시 둘 다 1,000P 적립. 모인 포인트로 챕터 연장 가능.</div>

      <div class="acc-section-title">📚 내 구독 ${isTeacher ? '' : `· 활성 ${active.length}개`}</div>
      ${subscriptionsHtml}
      ${expiredHtml}

      <div class="acc-section-title">🎯 관심 주제</div>
      ${interestsHtml}
      <button class="acc-mini-btn" style="margin-top:8px;" onclick="closeModal();openInterestModal();">관심 주제 편집 →</button>

      <div class="acc-section-title">🔒 보안</div>
      <button class="acc-mini-btn" onclick="closeModal();openChangePasswordModal();">비밀번호 변경 →</button>
    `,
    foot: `
      <button onclick="closeModal();doLogout();" style="background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.4);color:#fca5a5;">🚪 로그아웃</button>
      <button onclick="closeModal()">닫기</button>
    `
  });
}

        <input type="password" id="cp_old" placeholder="현재 비밀번호" autocomplete="current-password"
          style="padding:10px 12px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#fff;font-size:14px;">
        <label style="font-size:12px;color:rgba(255,255,255,0.6);margin-top:6px;">새 비밀번호 (6자 이상)</label>
        <input type="password" id="cp_new" placeholder="새 비밀번호" autocomplete="new-password"

        <label style="font-size:12px;color:rgba(255,255,255,0.6);margin-top:6px;">새 비밀번호 확인</label>
        <input type="password" id="cp_confirm" placeholder="다시 입력" autocomplete="new-password"
          style="padding:10px 12px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#fff;font-size:14px;">
        <div id="cp_err" style="display:none;color:#fca5a5;font-size:12px;margin-top:4px;"></div>
      </div>
    `,
    foot: `
      <button onclick="closeModal()">취소</button>
      <button class="primary" onclick="submitChangePassword()">변경</button>
    `
  });
  setTimeout(() => { $('cp_old') && $('cp_old').focus(); }, 100);
}

async function submitChangePassword() {
  const oldPw = $('cp_old').value;
  const newPw = $('cp_new').value;
  const confirmPw = $('cp_confirm').value;
  const err = $('cp_err');
  err.style.display = 'none';
  if (!oldPw || !newPw) { err.textContent = '모든 칸을 입력하세요.'; err.style.display = 'block'; return; }
  if (newPw.length < 6) { err.textContent = '새 비밀번호는 6자 이상.'; err.style.display = 'block'; return; }
  if (newPw !== confirmPw) { err.textContent = '새 비밀번호 확인이 일치하지 않습니다.'; err.style.display = 'block'; return; }
  showLoading(true);
  try {
    await api('POST', '/auth/change-password', { old_password: oldPw, new_password: newPw });
    closeModal();
    toast('비밀번호가 변경되었습니다.');
  } catch (e) {
    err.textContent = e.message;
    err.style.display = 'block';
  } finally {
    showLoading(false);
  }
}

function doLogout() {
  localStorage.removeItem(TOKEN_KEY);
  state.user = null;
  stopTimers();
  $('watermark').classList.remove('show');
  $('homeScreen').style.display = 'none';
  $('chapterScreen').style.display = 'none';
  $('authScreen').style.display = 'flex';
}

function fpBackToStep1() {
  $('fp_step1').style.display = 'flex';
  $('fp_step2').style.display = 'none';
  $('fp_submitBtn').textContent = '코드 받기';
  $('fp_submitBtn').onclick = fpSendCode;
  setTimeout(() => { $('fp_email') && $('fp_email').focus(); }, 50);
}

async function fpSendCode() {
  const email = $('fp_email').value.trim();
  const err = $('fp_err1');
  err.style.display = 'none';
  if (!email) { err.textContent = '이메일을 입력하세요.'; err.style.display = 'block'; return; }

  const btn = $('fp_submitBtn');
  btn.disabled = true;
  showLoading(true);
  try {
    const r = await api('POST', '/auth/forgot-password', { email });
    // 보안상 가입 여부 노출 안 함 — sent=false여도 동일 UI 흐름
    const info = r.sent
      ? `<strong style="color:#4fc3f7;">${escapeHtml(r.phone_masked || '등록 번호')}</strong> 번호로 6자리 코드를 보냈습니다.<br>10분 이내에 입력하세요.`
      : `등록된 이메일이 있다면 휴대폰으로 코드가 발송됐습니다.<br>10분 이내에 입력하세요.`;
    $('fp_sent_info').innerHTML = info;
    $('fp_step1').style.display = 'none';
    $('fp_step2').style.display = 'flex';
    btn.textContent = '비밀번호 변경';
    btn.onclick = fpResetPassword;
    setTimeout(() => { $('fp_code') && $('fp_code').focus(); }, 50);
  } catch (e) {
    err.textContent = e.message;
    err.style.display = 'block';
  } finally {
    btn.disabled = false;
    showLoading(false);
  }
}

async function fpResetPassword() {
  const email = $('fp_email').value.trim();
  const code = $('fp_code').value.trim();
  const newPw = $('fp_new').value;
  const confirmPw = $('fp_confirm').value;
  const err = $('fp_err2');
  err.style.display = 'none';
  if (!/^\d{6}$/.test(code)) { err.textContent = '6자리 숫자 코드를 입력하세요.'; err.style.display = 'block'; return; }
  if (newPw.length < 6) { err.textContent = '새 비밀번호는 6자 이상.'; err.style.display = 'block'; return; }
  if (newPw !== confirmPw) { err.textContent = '새 비밀번호 확인이 일치하지 않습니다.'; err.style.display = 'block'; return; }

  const btn = $('fp_submitBtn');
  btn.disabled = true;
  showLoading(true);
  try {
    await api('POST', '/auth/reset-password', { email, code, new_password: newPw });
    closeModal();
    toast('비밀번호가 변경되었습니다. 새 비밀번호로 로그인하세요.');
    // 로그인 화면 이메일 칸에 그대로 두고 비밀번호 칸에 포커스
    $('li_email').value = email;
    $('li_password').value = '';
    setTimeout(() => { $('li_password') && $('li_password').focus(); }, 100);
  } catch (e) {
    err.textContent = e.message;
    err.style.display = 'block';
  } finally {
    btn.disabled = false;
    showLoading(false);
  }
}

// 관심 주제 모달 — 체크한 주제의 챕터만 홈에 표시 (필터). 비우면 전체 노출.

function openInterestModal() {
  // 전체 과목 목록 — state.chapters에서 distinct subject 추출
  const allSubjects = [...new Set(state.chapters.map(c => c.subject || '기타'))].sort();
  const selectedSet = new Set(state.interests);
  const checkboxes = allSubjects.length === 0
    ? '<div style="text-align:center;color:rgba(255,255,255,0.5);font-size:13px;padding:20px 0;">아직 챕터가 없습니다.</div>'
    : allSubjects.map(subj => `
        <label class="interest-row">
          <input type="checkbox" class="interest-cb" value="${escapeHtml(subj)}" ${selectedSet.has(subj) ? 'checked' : ''}>
          <span>${escapeHtml(subj)}</span>
        </label>
      `).join('');
  showModal({
    title: '🎯 관심 주제',
    klass: 'interest-modal',
    body: `
      <p style="font-size:13px;color:rgba(255,255,255,0.7);line-height:1.6;margin-bottom:14px;">
        <strong>체크한 주제의 챕터만</strong> 홈 화면에 표시됩니다.<br>
        비우면 전체 노출.
      </p>
      <div class="interest-list">
        ${checkboxes}
      </div>
    `,
    foot: `
      <button onclick="clearAllInterests()" style="background:rgba(255,255,255,0.06);">전체 보기 (모두 해제)</button>
      <button onclick="closeModal()">취소</button>
      <button class="primary" onclick="saveInterests()">저장</button>
    `
  });
}

function clearAllInterests() {
  // 모달 안의 모든 체크박스 해제 (저장은 사용자가 '저장' 누를 때)
  document.querySelectorAll('.interest-cb').forEach(cb => { cb.checked = false; });
}

async function saveInterests() {
  const cbs = document.querySelectorAll('.interest-cb');
  const selected = [];
  cbs.forEach(cb => { if (cb.checked) selected.push(cb.value); });
  showLoading(true);
  try {
    await api('PUT', '/auth/me/interests', { interests: selected });
    state.interests = selected;
    closeModal();
    renderHome();
    if (selected.length === 0) toast('관심 주제 비움 — 전체 챕터 표시');
    else toast(`관심 주제 ${selected.length}개 저장됨`);
  } catch (e) {
    toast('저장 실패: ' + e.message, true);
  } finally {
    showLoading(false);
  }
}

async function copyToClipboard(text, label) {
  try {
    await navigator.clipboard.writeText(text);
    toast(`${label} 복사됨`);
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast(`${label} 복사됨`); }
    catch { toast('복사 실패 — 직접 선택해주세요.', true); }
    document.body.removeChild(ta);
  }
}
async function copyReferralLink() {
  await copyToClipboard($('refLinkBox').textContent, '추천 링크');
}
async function copyMyReferralCode() {
  const code = (state.user && state.user.referral_code) || '';
  if (!code) { toast('추천 코드 없음', true); return; }
  await copyToClipboard(code, '추천 코드');
}
async function copyMyReferralLinkFromAccount() {
  const code = (state.user && state.user.referral_code) || '';
  if (!code) { toast('추천 코드 없음', true); return; }
  await copyToClipboard(`${LANDING_URL}?ref=${code}`, '추천 링크');
}

function showModal({ title, body, foot = '', klass = '' }) {
  const m = $('modal');
  m.innerHTML = `
    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal ${klass}" onclick="event.stopPropagation()">
        <div class="modal-head">
          <h3>${escapeHtml(title)}</h3>
          <button class="close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body">${body}</div>
        <div class="modal-foot">${foot}</div>
      </div>
    </div>
  `;
  $('modalBackdrop').onclick = (e) => { if (e.target.id === 'modalBackdrop') closeModal(); };
}
function closeModal() { $('modal').innerHTML = ''; }

// ============================================================
// 타이머 — ping 60초마다 + live count 30초마다
// ============================================================
function sendPing() {
  // 마지막 ping 이후 학습한 카드 수(델타)를 실어 보내고 즉시 0으로 리셋
  const cards = state.studyDelta;
  state.studyDelta = 0;
  api('POST', '/stats/ping', { cards }).catch(() => {
    state.studyDelta += cards;   // 실패 시 델타 복구 — 다음 ping에서 재전송
  });
}
// 탭이 숨겨질 때(앱 종료·전환) 남은 델타를 즉시 전송 — 한 번만 등록
if (!window.__opPingFlush) {
  window.__opPingFlush = true;
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && state.user && state.studyDelta > 0) sendPing();
  });
}
function startTimers() {
  stopTimers();
  sendPing();   // 즉시 1회
  state.pingTimer = setInterval(sendPing, 60000);
  state.liveTimer = setInterval(loadLiveCount, 30000);
}
function stopTimers() {
  if (state.pingTimer) clearInterval(state.pingTimer);
  if (state.liveTimer) clearInterval(state.liveTimer);
  state.pingTimer = state.liveTimer = null;
}

// ============================================================
// 자동 업데이트 감지 — Vercel ETag 기반 (Service Worker 불필요)
// ============================================================
// 배포되면 정적 자원의 ETag가 콘텐츠 해시 기반으로 자동 변경됨.
// 앱이 시작 시 자기 자신(index.html)의 ETag를 기억하고, 주기적으로 비교.
// 다르면 비침습적 배너 노출 → 사용자가 "지금 업데이트" 누르면 새로고침.
// 학습 중(퀴즈/정교화 모드)에는 배너 안 띄움 — 흐름 방해 X.
const UPDATE_CHECK_INTERVAL_MS = 5 * 60 * 1000;     // 5분 폴링
const UPDATE_DISMISS_COOLDOWN_MS = 30 * 60 * 1000;  // "나중에" 닫고 30분 침묵
const UPDATE_LOG = (...a) => { try { console.log('[update]', ...a); } catch {} };
let _appInitialEtag = null;
let _updateBannerShown = false;

// HEAD + cache-bust 쿼리 — 일부 PWA/모바일 환경에서 fetch cache:no-store가 무시되는 케이스 우회.
// 콘텐츠 같으면 ETag도 같음 (Vercel은 URL 쿼리 무시하고 콘텐츠 해시로 ETag 발급).
async function _fetchAppEtag() {
  try {
    const base = location.pathname || '/';
    const sep = base.includes('?') ? '&' : '?';
    const url = base + sep + '_u=' + Date.now();
    const res = await fetch(url, { method: 'HEAD', cache: 'no-store' });
    if (!res.ok) { UPDATE_LOG('HEAD not ok:', res.status); return null; }
    const tag = res.headers.get('etag') || res.headers.get('last-modified') || '';
    return tag;
  } catch (e) { UPDATE_LOG('fetch fail:', e && e.message); return null; }
}

async function _captureInitialEtag() {
  if (_appInitialEtag) return;
  _appInitialEtag = await _fetchAppEtag();
  UPDATE_LOG('initial captured:', _appInitialEtag);
}

function _isUpdateDismissedRecently() {
  try {
    const t = Number(localStorage.getItem('op_update_dismissed_at') || 0);
    return t && (Date.now() - t < UPDATE_DISMISS_COOLDOWN_MS);
  } catch { return false; }
}

function _isLearningActive() {
  return !!(state && (state.voiceQuizActive || state.firstLetterQuizActive || state.elaborationActive));
}

async function _checkForUpdate() {
  if (_updateBannerShown) return;
  if (_isUpdateDismissedRecently()) return;
  if (!_appInitialEtag) { await _captureInitialEtag(); return; }
  if (_isLearningActive()) { UPDATE_LOG('learning active — defer'); return; }
  const current = await _fetchAppEtag();
  UPDATE_LOG('check: initial=', _appInitialEtag, 'current=', current);
  if (current && current !== _appInitialEtag) {
    UPDATE_LOG('CHANGED → show banner');
    _showUpdateBanner();
  }
}

function _showUpdateBanner() {
  if (_updateBannerShown) return;
  if (document.querySelector('.update-banner')) return;
  _updateBannerShown = true;
  const banner = document.createElement('div');
  banner.className = 'update-banner';
  banner.innerHTML = `
    <span class="update-banner-icon">✨</span>
    <span class="update-banner-text">새 버전이 있어요</span>
    <button class="update-banner-btn" onclick="applyUpdate()">지금 업데이트</button>
    <button class="update-banner-close" onclick="dismissUpdate()" title="나중에">✕</button>
  `;
  document.body.appendChild(banner);
}

function applyUpdate() {
  // 강력 새로고침 — 쿠키/스토리지는 유지, 캐시는 우회
  try { location.reload(); } catch {}
}

function dismissUpdate() {
  const banner = document.querySelector('.update-banner');
  if (banner) banner.remove();
  _updateBannerShown = false; // 다시 보일 수는 있지만 30분 쿨다운 적용됨
  try { localStorage.setItem('op_update_dismissed_at', String(Date.now())); } catch {}
}

// 디버깅용 — 콘솔에서 checkUpdate() / forceUpdateBanner() 호출 가능
window.applyUpdate = applyUpdate;
window.dismissUpdate = dismissUpdate;
window.checkUpdate = async () => {
  const cur = await _fetchAppEtag();
  console.log('initial:', _appInitialEtag, '\ncurrent:', cur, '\nchanged:', _appInitialEtag !== cur,
              '\ndismissedCool:', _isUpdateDismissedRecently(), '\nbannerShown:', _updateBannerShown);
  await _checkForUpdate();
};
window.forceUpdateBanner = () => { _updateBannerShown = false; _showUpdateBanner(); };
window.resetUpdateState = () => {
  _appInitialEtag = null; _updateBannerShown = false;
  try { localStorage.removeItem('op_update_dismissed_at'); } catch {}
  console.log('update state reset');
};

// 초기화 — 리스너 먼저, 캡처 나중 (캡처 중 focus 발생해도 흐름 끊기지 않게)
setTimeout(async () => {
  setInterval(_checkForUpdate, UPDATE_CHECK_INTERVAL_MS);
  window.addEventListener('focus', _checkForUpdate);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') _checkForUpdate();
  });
  await _captureInitialEtag();
}, 3000); // 3초 후 시작 — 초기 렌더 안 막음

// ============================================================
// 콘텐츠 라이트박스 — 학습 카드 안 이미지/SVG 터치 시 확대
// ============================================================
//   대상: .item-image (kind=image) / .item-svg svg (kind=svg) /
//         .item-html img·svg (kind=html 안에 임베드된 그래프 등)
//   동작: 이벤트 위임 — 어디 클릭하든 closest로 대상 찾음.
//         닫기: 배경 클릭 / ✕ 버튼 / ESC 키.
(function initContentLightbox() {
  const lb = document.createElement('div');
  lb.className = 'content-lightbox';
  lb.innerHTML = `
    <div class="content-lightbox-body" id="contentLightboxBody"></div>
    <button class="content-lightbox-close" onclick="closeContentLightbox()" title="닫기 (ESC)">×</button>
  `;
  document.body.appendChild(lb);

  // 배경 클릭 닫기
  lb.addEventListener('click', (e) => {
    if (e.target === lb || e.target.classList.contains('content-lightbox-body')) closeContentLightbox();
  });

  // 본문 이미지/SVG 클릭 → 라이트박스 열기 (이벤트 위임)
  document.addEventListener('click', (e) => {
    if (lb.classList.contains('open')) return; // 이미 열려있으면 무시 (lb 안 클릭은 위 핸들러가 처리)
    const target = e.target.closest('.item-image, .item-html svg, .item-html img, .item-svg svg, .item-svg img');
    if (!target) return;
    e.preventDefault();
    const body = document.getElementById('contentLightboxBody');
    body.innerHTML = '';
    body.appendChild(target.cloneNode(true));
    lb.classList.add('open');
    document.body.style.overflow = 'hidden'; // 배경 스크롤 잠금
  }, true); // capture 단계 — 다른 핸들러보다 먼저

  // ESC 닫기
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && lb.classList.contains('open')) closeContentLightbox();
  });

  window.closeContentLightbox = function () {
    lb.classList.remove('open');
    document.body.style.overflow = '';
    setTimeout(() => { document.getElementById('contentLightboxBody').innerHTML = ''; }, 200);
  };
})();

// 풀이 보기 토글 — caption='내용' html item의 가림/펼침
//   상태에 따라 라벨을 "풀이 보기" ↔ "풀이 가리기"로 변경
window.toggleSolution = function (btn) {
  const content = btn.nextElementSibling;
  if (!content) return;
  const opened = content.classList.toggle('open');
  btn.classList.toggle('open', opened);
  const label = btn.querySelector('.solution-toggle-label');
  if (label) label.textContent = opened ? '풀이 가리기' : '풀이 보기';
  // 펼치면서 풀이 영역에 LaTeX 있으면 MathJax 재시도 보장 (이미 typeset됐어도 무해)
  if (opened && typeof _typesetMathInTree === 'function') {
    _typesetMathInTree();
  }
};
