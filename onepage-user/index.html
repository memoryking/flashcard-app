// 같은 학습 카드의 동시 중복 fetch 방지 + prefetch 일 때는 강제 리렌더 안 함
const _itemsLoading = new Map();    // subtopicId → Promise
const _itemsNeedRerender = new Set(); // foreground 호출자가 있는 subtopicId — 완료 시 리렌더 보장
async function ensureItems(subId, isPrefetch) {
  const existing = state.itemsBySubtopic[subId];
  if (existing !== undefined) return existing;
  // foreground 호출 표시 — prefetch가 먼저 시작됐어도 완료 시 리렌더되도록
  if (!isPrefetch) _itemsNeedRerender.add(Number(subId));
  if (_itemsLoading.has(subId)) return _itemsLoading.get(subId);

  const p = (async () => {
    try {
      const r = await api('GET', '/items?subtopic_id=' + subId);
      state.itemsBySubtopic[subId] = r.items || [];
    } catch (e) {
      if (e.status === 402) {
        state.itemsBySubtopic[subId] = { locked: true, chapter_id: e.data?.chapter_id };
      } else if (e.status === 404) {
        // 학습 카드가 삭제됨 — 자동 새로고침 (포그라운드 클릭일 때만)
        if (!isPrefetch && state.expanded.subtopic.has(Number(subId))) {
          toast('콘텐츠가 변경되었습니다. 새로고침합니다.');
          refreshChapter();
        }
        return;
      } else if (e.status !== 401) {
        state.itemsBySubtopic[subId] = { error: e.message };
      } else {
        return;
      }
    } finally {
      _itemsLoading.delete(subId);
    }
    // 리렌더 조건: foreground 호출이 있었거나 펼쳐진 카드 (스테이지 포커스 카드 포함)
    const needRerender = _itemsNeedRerender.has(Number(subId)) || state.expanded.subtopic.has(Number(subId));
    _itemsNeedRerender.delete(Number(subId));
    if (needRerender && state.currentChapter) renderTree(state.currentChapter.id);
  })();
  _itemsLoading.set(subId, p);
  return p;
}

// 펼친 목차들의 모든 학습 카드 items를 백그라운드로 미리 가져오기
function prefetchOpenTopics() {
  if (!state.currentChapter) return;
  const topics = state.topicsByChapter[state.currentChapter.id] || [];
  for (const t of topics) {
    if (!state.expanded.topic.has(t.id)) continue;
    const subs = state.subtopicsByTopic[t.id] || [];
    for (const s of subs) ensureItems(s.id, true);
  }
}

function renderTree(chapterId) {
  const topics = state.topicsByChapter[chapterId] || [];
  const c = state.currentChapter;
  const isTeacher = state.user && state.user.role === 'teacher';
  const access = state.chapterAccess[chapterId];
  const dLeft = access ? daysLeft(access.expires_at) : null;
  const hasAccess = isTeacher || Number(c.is_all_free) === 1 || (dLeft != null && dLeft > 0);

  // 암기 모음 모드 — 챕터 전체에서 understood인 학습 카드만 평면 리스트로
  if (state.memorizedView) {
    $('chapterTree').innerHTML = renderMemorizedView(chapterId, hasAccess);
    return;
  }

  if (!topics.length) {
    $('chapterTree').innerHTML = '<div class="empty-state">아직 콘텐츠가 없습니다.</div>';
    return;
  }
  $('chapterTree').innerHTML = topics.map(t => renderTopic(t, hasAccess)).join('');
}

// 다지기 모드 v2 — 6박스 (오늘/내일/4/8/16/32일) + 오늘 클리어율 진행바
// 카드의 효과적 박스 = next_review_at 가 이미 due면 box=1 로 자동 승급, 아니면 review_box
function effectiveBox(subId) {
  const days = dueDaysLeft(state.understoodNextReview[Number(subId)]);
  if (days <= 0) return 1; // overdue/due = 오늘 학습
  return Math.min(Math.max(Number(state.understoodBox[Number(subId)]) || 1, 1), 6);
}

const SRS_BOX_META = [
  null,
  { label: '오늘 학습',  tier: 'today',  defaultOpen: true  },
  { label: '내일 학습',  tier: 'tomo',   defaultOpen: false },
  { label: '4일 후',     tier: 'd4',     defaultOpen: false },
  { label: '8일 후',     tier: 'd8',     defaultOpen: false },
  { label: '16일 후',    tier: 'd16',    defaultOpen: false },
  { label: '32일 후',    tier: 'd32',    defaultOpen: false },
];

function renderMemorizedView(chapterId, hasAccess) {
  // 통계 베이스라인 갱신 (데이터 로드 늦었거나 자정 지난 경우)
  ensureTodayStatsCurrent(chapterId);
  const topics = state.topicsByChapter[chapterId] || [];

  // 스냅샷 안 카드들을 효과 박스(1~6)로 그룹화
  const byBox = {1:[], 2:[], 3:[], 4:[], 5:[], 6:[]};
  for (const t of topics) {
    const subs = state.subtopicsByTopic[t.id] || [];
    for (const s of subs) {
      if (!state.memoSnapshotIds.has(Number(s.id))) continue;
      const box = effectiveBox(s.id);
      byBox[box].push(s);
    }
  }

  // 박스 안 정렬 — last_moved_at 오름차순(오래 기다린 카드 먼저), 동률이면 sort_order
  const innerSort = (a, b) => {
    const la = state.understoodLastMovedAt[Number(a.id)] || '';
    const lb = state.understoodLastMovedAt[Number(b.id)] || '';
    if (la !== lb) return la.localeCompare(lb);
    return (Number(a.sort_order) || 0) - (Number(b.sort_order) || 0);
  };
  for (let i=1; i<=6; i++) byBox[i].sort(innerSort);

  const totalCards = Object.values(byBox).reduce((sum, arr) => sum + arr.length, 0);
  if (totalCards === 0) {
    return `
      <div class="memo-empty">
        <div class="memo-icon">●</div>
        <div>아직 다지기 카드가 없습니다.</div>
        <div class="memo-hint">일반 모드에서 패스하면 여기로 모입니다.</div>
      </div>
    `;
  }

  // 오늘 클리어율 — 분모: 현재 오늘 박스 카드 수 + 오늘 cleared 누적 / 분자: cleared
  const cleared = state.todayStatsCleared || 0;
  const currentBox1 = byBox[1].length;
  const entered = currentBox1 + cleared;
  const pct = entered > 0 ? Math.round((cleared / entered) * 100) : 0;
  const clearBar = `
    <div class="srs-clear">
      <div class="srs-clear-head">
        <span>📊 오늘 암기 클리어율</span>
        <span class="srs-clear-num">${cleared} / ${entered}</span>
      </div>
      <div class="srs-clear-bar"><div class="srs-clear-fill" style="width:${Math.min(100, pct)}%"></div></div>
      <div class="srs-clear-foot">
        <span style="opacity:0.7">분모 = 오늘 박스 ${currentBox1} + 이미 진급 ${cleared}</span> · ${pct}%
      </div>
    </div>
  `;

  // 능동 회상 토글 — 학습 과학 모드. ON이면 본문 블러 + 정답 보기 + 자기평가 흐름
  const recallOn = !!state.activeRecallMode;
  const recallToggle = `
    <div class="recall-toggle-bar ${recallOn ? 'on' : ''}" onclick="toggleActiveRecall()" title="능동 회상 — 회상 시도 후 정답 보기">
      <div class="recall-toggle-inner">
        <span class="recall-toggle-icon">🧠</span>
        <span class="recall-toggle-label">능동 회상</span>
        <span class="recall-toggle-state">${recallOn ? 'ON' : 'OFF'}</span>
      </div>
      ${recallOn ? '<div class="recall-toggle-hint">제목만 보고 머릿속으로 답을 떠올린 뒤 카드를 펼치세요</div>' : ''}
    </div>
  `;

  // 오늘 학습 (b=1): 단일 카드 스테이지로 렌더 (큰 카드 + 우상단 더미 시각화)
  // 음성 퀴즈 또는 첫글자 퀴즈 활성 시 포커스 카드를 해당 모드 카드로 대체.
  // 퀴즈는 SRS 박스 변경 없이 quizDoneSet에만 추가 → 우상단 카운트만 줄어듦
  let todayStageHtml;
  if (state.voiceQuizActive || state.firstLetterQuizActive) {
    // pendingCards: 카운트(badge/스택)용 — quizDoneSet만 제외
    const pendingCards = byBox[1].filter(s => !state.quizDoneSet.has(Number(s.id)));
    const pendingCount = pendingCards.length;
    // 표시할 현재 카드는 voiceQuizCurrentCardId() 결과 — quizDoneSet + lastWrongSid 후순위까지 반영
    // → TTS가 읽는 카드와 표시되는 카드가 항상 일치
    const currentQuizSid = voiceQuizCurrentCardId();
    const stackLayers = pendingCount > 0 ? Math.min(pendingCount, 4) : 0;
    const deckCardsHtml = Array(stackLayers).fill('<div class="deck-back-card"></div>').join('');
    const countColor = pendingCount === 0 ? 'style="color:rgba(255,255,255,0.35)"' : '';
    const deckStackHtml = `<div class="srs-deck-stack">${deckCardsHtml}<div class="deck-count" ${countColor}>${pendingCount}</div></div>`;
    const stopFn = state.voiceQuizActive ? 'stopVoiceQuiz' : 'stopFirstLetterQuiz';
    const stopBtnHtml = `<button class="vq-stop-small" onclick="event.stopPropagation();${stopFn}()" title="퀴즈 중단">× 중단</button>`;
    if (state.voiceQuizActive) {
      todayStageHtml = `<div class="srs-today-stage open vq-active"><div class="stage-head"><span class="srs-box-arrow">▼</span><span class="stage-name">🎤 음성 퀴즈</span>${stopBtnHtml}${deckStackHtml}</div>${renderVoiceQuizCard(pendingCards, currentQuizSid)}</div>`;
    } else {
      todayStageHtml = `<div class="srs-today-stage open fl-active"><div class="stage-head"><span class="srs-box-arrow">▼</span><span class="stage-name">✏️ 첫글자 퀴즈</span>${stopBtnHtml}${deckStackHtml}</div>${renderFirstLetterQuizCard(pendingCards, currentQuizSid)}</div>`;
    }
  } else {
    todayStageHtml = renderTodayStage(byBox[1], hasAccess);
  }

  // 미래 박스 (b=2~6): 인벤토리 리스트 — 전체 카드 표시, 패스 버튼 없음, 펼침→접음=강등
  const boxBlocks = [];
  for (let b = 2; b <= 6; b++) {
    const cards = byBox[b];
    const meta = SRS_BOX_META[b];
    const isOpen = !!state.memorizedBoxOpen[b];
    const totalInBox = cards.length;

    if (totalInBox === 0) continue;

    // 펼침 상태일 때만 카드 HTML 생성 (전체 카드 표시 — 미래 박스는 인벤토리 뷰)
    const cardsHtml = isOpen
      ? cards.map(s => renderSubtopic(s, false)).join('')
      : '';

    boxBlocks.push(`
      <div class="srs-box srs-box-${meta.tier}${isOpen ? ' opened' : ''}">
        <div class="srs-box-head" onclick="toggleSrsBox(${b})">
          <span class="srs-box-arrow">${isOpen ? '▼' : '▶'}</span>
          <span class="srs-box-name">${meta.label}</span>
          <span class="srs-box-count" title="박스 전체 카드 수">${totalInBox}</span>
        </div>
        <div class="srs-box-body">${cardsHtml}</div>
      </div>
    `);
  }

  // 퀴즈 시작 버튼 + 설정 (chapter.voice_quiz_enabled === 1 인 챕터만)
  // 퀴즈 활성 중에는 stage-head 안에 작은 [× 중단] 버튼 (아래 stage 렌더에서 처리).
  // 비활성 + 모두 클리어 → "퀴즈 클리어!" 안내. 비활성 + 미클리어 → 시작 버튼.
  const c = state.currentChapter;
  let quizBtnHtml = '';
  if (c && Number(c.voice_quiz_enabled) === 1 && !state.voiceQuizActive && !state.firstLetterQuizActive) {
    // 모두 클리어 안내는 자리 차지하는 카드 대신 toast로 띄움 (자동 종료 / 시작 시도 시).
    // 시작 버튼 오른쪽에 남은 퀴즈 카드 수 badge 표시 — 0이면 초록(클리어), 1+이면 주황.
    const qs = quizStats();
    const badgeClass = qs.pending === 0 ? 'vq-pending-badge zero' : 'vq-pending-badge';
    const badgeTitle = qs.pending === 0
      ? '퀴즈 클리어 — 카드 터치 학습으로 진행'
      : `퀴즈를 풀 단어 ${qs.pending}개 남음`;
    quizBtnHtml = renderVoiceQuizSettings() + `
      <div class="vq-start-row">
        <button class="vq-toggle vq-toggle-start vq-half" onclick="startVoiceQuiz()">🎤 음성 (4초)</button>
        <button class="vq-toggle vq-toggle-fl vq-half" onclick="startFirstLetterQuiz()">✏️ 첫글자</button>
        <span class="${badgeClass}" title="${badgeTitle}">${qs.pending}</span>
      </div>
    `;
  }

  return clearBar + quizBtnHtml + todayStageHtml + boxBlocks.join('');
}

// 다지기 박스 펼침 토글 — 아코디언 동작 (한 번에 한 박스만 펼침)
//  - 닫혀 있었음 → 다 닫고 이것만 펼침
//  - 열려 있었음 → 그냥 닫기
function toggleSrsBox(box) {
  const b = Number(box);
  const wasOpen = !!state.memorizedBoxOpen[b];
  state.memorizedBoxOpen = {1:false, 2:false, 3:false, 4:false, 5:false, 6:false};
  state.memorizedBoxOpen[b] = !wasOpen;
  if (state.currentChapter) renderTree(state.currentChapter.id);
}

// ============================================================
// 능동 회상 (Active Recall) — 다지기 모드 토글
// ============================================================
// 학습 과학 핵심: 본문을 강제로 회상한 뒤 공개 → 자기평가 → SRS 신호
// 사용자 토글 OFF면 기존 빠른 패스 흐름 유지.
function toggleActiveRecall() {
  state.activeRecallMode = !state.activeRecallMode;
  try { localStorage.setItem('op_active_recall_v1', state.activeRecallMode ? '1' : '0'); } catch {}
  // 모드 전환 → 펼침/공개 진행상태 모두 정리 (새 모드로 fresh 시작)
  state.activeRecallRevealed = new Set();
  state.expanded.subtopic.clear();
  if (state.currentChapter) renderTree(state.currentChapter.id);
}

// "정답 보기" 버튼: 본문 블러 해제 + 평가 버튼 노출
function activeRecallReveal(subId) {
  const sid = Number(subId);
  state.activeRecallRevealed.add(sid);
  if (state.currentChapter) renderTree(state.currentChapter.id);
}

// 자기평가 결과 → memorizedPass로 SRS 진행
//  - correct=true  → forcePeeked=false → anpel 흐름 (effPrev=1이면 advance)
//  - correct=false → forcePeeked=true  → peek+pass 흐름 (오늘 학습 강등, miss_count +1)
function activeRecallJudge(subId, correct) {
  const sid = Number(subId);
  // 평가 완료 → reveal 진행상태 정리, 카드 닫음 (memorizedPass도 닫지만 명시적으로)
  state.activeRecallRevealed.delete(sid);
  state.expanded.subtopic.delete(sid);
  // memorizedExpandedSet은 memorizedPass 끝에서 cleanup되므로 그대로 둠
  // forcePeeked로 wasPeeked 명시 오버라이드 (자기평가가 진실 신호)
  memorizedPass(sid, { forcePeeked: !correct });
}

// 단일 카드 스테이지(오늘 학습) 평가 — fly-out 애니메이션 후 memorizedPass
function todayStageJudge(subId, correct) {
  const sid = Number(subId);
  state.activeRecallRevealed.delete(sid);
  const finalize = () => {
    memorizedPass(sid, { forcePeeked: !correct });
    // 퀴즈 풀과 sync:
    //  - ✓ 맞췄어요 → 퀴즈 풀에서 제외 (이미 안다는 신호)
    //  - ✗ 틀렸어요 → 퀴즈 풀에 등재 (빠른 단어-뜻 연결 다시 확인 필요)
    if (correct) state.quizDoneSet.add(sid);
    else state.quizDoneSet.delete(sid);
  };
  const cardEl = document.querySelector('.focus-card[data-sub="' + sid + '"]');
  if (cardEl) {
    cardEl.classList.add(correct ? 'flying-correct' : 'flying-wrong');
    setTimeout(finalize, 500);
  } else {
    finalize();
  }
}

// ============================================================
// 음성 퀴즈 (Voice Quiz) — chapter.voice_quiz_enabled 인 챕터에서만 사용
// ============================================================
const VOICE_QUIZ_TIME_LIMIT_MS = 4000;
const VOICE_CORRECT_FLASH_MS = 1500;
const VOICE_AUTO_WRONG_DISPLAY_MS = 2500; // 자동 모드 오답/타임아웃 노출 시간 (auto-advance 전)

// 정답 텍스트 추출 — items[0]의 text 필드 사용 (컨벤션: 첫 항목 = 정답)
function getCardAnswer(subId) {
  const items = state.itemsBySubtopic[Number(subId)];
  if (!items || !Array.isArray(items) || !items.length) return '';
  const first = items[0];
  // items[0].text 우선, 없으면 caption, 없으면 빈 문자열
  return String(first.text || first.caption || '').trim();
}

// 정규화 + 단순 비교 (Phase 1)
function voiceQuizNormalize(s) {
  return String(s || '')
    .replace(/[\s.,'"!?~()·、。:;\-_/]/g, '')
    .toLowerCase()
    .normalize('NFC');
}
function voiceQuizCompare(spoken, expected) {
  const a = voiceQuizNormalize(spoken);
  const b = voiceQuizNormalize(expected);
  if (!a || !b) return false;
  if (a === b) return true;
  // 한 쪽이 다른 쪽을 포함하면 정답 (긴 답 중에 핵심어 있음)
  if (a.includes(b) || b.includes(a)) return true;
  return false;
}

// 다음 퀴즈 카드 선택:
//  1. byBox[1] effective + 스냅샷 + 퀴즈에서 클리어 안 됨 후보 모음
//  2. lastWrongSid는 다른 후보가 있으면 후순위 (반복 노출 방지)
//  3. last_moved_at 오래된 순 + sort_order로 정렬
function voiceQuizCurrentCardId() {
  if (!state.currentChapter) return null;
  const topics = state.topicsByChapter[state.currentChapter.id] || [];
  const candidates = [];
  for (const t of topics) {
    const subs = state.subtopicsByTopic[t.id] || [];
    for (const s of subs) {
      const sid = Number(s.id);
      if (!state.memoSnapshotIds.has(sid)) continue;
      if (state.quizDoneSet && state.quizDoneSet.has(sid)) continue;
      const days = dueDaysLeft(state.understoodNextReview[sid]);
      const effBox = days <= 0 ? 1 : (Number(state.understoodBox[sid]) || 1);
      if (effBox !== 1) continue;
      candidates.push(s);
    }
  }
  if (candidates.length === 0) return null;
  // 다른 카드 있으면 lastWrongSid 제외 (방금 틀린 카드 바로 다시 보지 않게)
  let filtered = candidates;
  if (state.quizLastWrongSid != null && candidates.length > 1) {
    const others = candidates.filter(s => Number(s.id) !== state.quizLastWrongSid);
    if (others.length > 0) filtered = others;
  }
  filtered.sort((a, b) => {
    const la = state.understoodLastMovedAt[Number(a.id)] || '';
    const lb = state.understoodLastMovedAt[Number(b.id)] || '';
    if (la !== lb) return la.localeCompare(lb);
    return (Number(a.sort_order) || 0) - (Number(b.sort_order) || 0);
  });
  return Number(filtered[0].id);
}

// 모드 / 문제 읽기 토글 (localStorage 영속화)
function setVoiceQuizMode(mode) {
  if (mode !== 'manual' && mode !== 'auto') return;
  state.voiceQuizMode = mode;
  try { localStorage.setItem('op_voice_quiz_mode', mode); } catch {}
  if (state.currentChapter) renderTree(state.currentChapter.id);
}
function toggleVoiceQuizRead() {
  state.voiceQuizReadAloud = !state.voiceQuizReadAloud;
  try { localStorage.setItem('op_voice_quiz_read', state.voiceQuizReadAloud ? '1' : '0'); } catch {}
  if (state.currentChapter) renderTree(state.currentChapter.id);
}

// 음성 퀴즈용 텍스트 언어 감지 — 한국어 우선 (한국어 TTS가 한영 혼용 더 잘 읽음)
//  - 한글 있음 → ko-KR
//  - 라틴 only → en-US
//  - 둘 다 없음 → null (호출자가 default 사용)
function detectVoiceQuizLang(text) {
  if (!text) return null;
  const hasKorean = /[가-힯ᄀ-ᇿ㄰-㆏]/.test(text);
  const hasLatin = /[a-zA-Z]/.test(text);
  if (hasKorean) return 'ko-KR';
  if (hasLatin) return 'en-US';
  return null;
}

// 정답/오답 신호음 — Web Audio API로 짧고 명확한 톤 생성
let _quizAudioCtx = null;
function getQuizAudioCtx() {
  if (_quizAudioCtx) return _quizAudioCtx;
  try { _quizAudioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch {}
  return _quizAudioCtx;
}
// 띵동 — 정답 (상승 2음, sine)
function playDingCorrect() {
  const ctx = getQuizAudioCtx(); if (!ctx) return;
  try {
    const tones = [880, 1175]; // A5, D6
    for (let i = 0; i < tones.length; i++) {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.connect(g); g.connect(ctx.destination);
      const t = ctx.currentTime + i * 0.13;
      osc.type = 'sine';
      osc.frequency.setValueAtTime(tones[i], t);
      g.gain.setValueAtTime(0.0, t);
      g.gain.linearRampToValueAtTime(0.25, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
      osc.start(t); osc.stop(t + 0.30);
    }
  } catch {}
}
// 삑 — 오답 (하행 톤, square)
function playBuzzWrong() {
  const ctx = getQuizAudioCtx(); if (!ctx) return;
  try {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.connect(g); g.connect(ctx.destination);
    osc.type = 'square';
    osc.frequency.setValueAtTime(180, ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(110, ctx.currentTime + 0.35);
    g.gain.setValueAtTime(0.0, ctx.currentTime);
    g.gain.linearRampToValueAtTime(0.14, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.42);
    osc.start();
    osc.stop(ctx.currentTime + 0.42);
  } catch {}
}

// TTS — 문제 읽어주기. onDone 콜백은 발화 끝났을 때 또는 오류/타임아웃 시 호출.
function speakVoiceQuiz(text, lang, onDone) {
  if (!text || !('speechSynthesis' in window)) { if (onDone) onDone(); return; }
  try {
    speechSynthesis.cancel(); // 이전 발화 중단
    const utt = new SpeechSynthesisUtterance(String(text));
    utt.lang = lang || 'ko-KR';
    utt.rate = 1.0;
    utt.pitch = 1.0;
    let done = false;
    const fire = () => { if (done) return; done = true; if (onDone) onDone(); };
    utt.onend = fire;
    utt.onerror = fire;
    // 안전망: 5초 내 이벤트 없으면 강제 진행
    setTimeout(fire, 5000);
    speechSynthesis.speak(utt);
  } catch { if (onDone) onDone(); }
}

// 마이크 장치 존재 여부 사전 체크 — enumerateDevices로 audioinput 검색
// 반환: true=있음, false=없음, null=확인 불가 (체크 시도)
async function checkMicrophoneAvailable() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return null;
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    return devices.some(d => d.kind === 'audioinput');
  } catch { return null; }
}

// 음성 퀴즈 세션 시작 — 다지기 모드 안에서 호출
async function startVoiceQuiz() {
  // 브라우저 지원 확인
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    toast('이 브라우저는 음성 인식을 지원하지 않습니다 (Chrome/Edge/Safari 권장)', true);
    return;
  }
  if (!state.memorizedView) {
    toast('다지기 모드에서만 음성 퀴즈 가능', true);
    return;
  }
  if (state.firstLetterQuizActive) {
    toast('첫글자 퀴즈를 먼저 종료하세요', true);
    return;
  }
  const qs = quizStats();
  if (qs.total > 0 && qs.pending === 0) {
    toast('퀴즈는 모두 풀었어요. 카드 터치 학습으로 진행하세요.', true);
    return;
  }
  // 마이크 장치 사전 체크 — 없으면 깔끔하게 첫글자 퀴즈 안내
  const hasMic = await checkMicrophoneAvailable();
  if (hasMic === false) {
    toast('마이크가 연결되어 있지 않습니다. 첫글자 퀴즈(✏️)를 이용해주세요.', true);
    return;
  }
  state.voiceQuizActive = true;
  state.voiceQuizPhase = 'idle';
  if (state.currentChapter) renderTree(state.currentChapter.id);
  // 첫 카드로 진행
  voiceQuizNextCard();
}

// 음성 퀴즈 세션 종료
function stopVoiceQuiz() {
  voiceQuizCleanup();
  try { speechSynthesis.cancel(); } catch {} // 진행 중인 TTS 발음 즉시 중단
  state.voiceQuizActive = false;
  state.voiceQuizPhase = 'idle';
  state.voiceQuizTranscript = '';
  state.voiceQuizExpected = '';
  state.quizLastWrongSid = null;
  if (state.currentChapter) renderTree(state.currentChapter.id);
}

function voiceQuizCleanup() {
  if (state._voiceQuizTimer) { clearTimeout(state._voiceQuizTimer); state._voiceQuizTimer = null; }
  if (state._voiceQuizRecognition) {
    try { state._voiceQuizRecognition.abort(); } catch {}
    state._voiceQuizRecognition = null;
  }
}

// 다음 카드 진행 — 오늘 학습 박스 첫 카드를 큐로. 문제 읽기 ON이면 TTS 후 listening.
function voiceQuizNextCard() {
  if (!state.voiceQuizActive) return; // 중단된 세션은 더 진행 안 함
  voiceQuizCleanup();
  const sid = voiceQuizCurrentCardId();
  if (sid == null) {
    // 더 풀 카드 없음 → 세션 종료. quizDoneSet 기준 toast 안내
    const qs = quizStats();
    state.voiceQuizActive = false;
    state.voiceQuizPhase = 'idle';
    state.quizLastWrongSid = null;
    if (qs.total > 0 && qs.done > 0 && qs.pending === 0) {
      toast('🎉 퀴즈 클리어! 카드 터치로 깊은 학습을 진행하세요.', false);
    }
    if (state.currentChapter) renderTree(state.currentChapter.id);
    return;
  }
  state.voiceQuizExpected = getCardAnswer(sid);
  state.voiceQuizTranscript = '';

  // 본문 prefetch 보장 (이미 캐시면 즉시)
  ensureItems(sid, false).then(() => {
    state.voiceQuizExpected = getCardAnswer(sid);
  }).catch(() => {});

  // 카드 제목 찾기 (TTS 읽기용)
  let cardTitle = '';
  const topics = state.topicsByChapter[state.currentChapter.id] || [];
  for (const t of topics) {
    const subs = state.subtopicsByTopic[t.id] || [];
    const found = subs.find(x => Number(x.id) === sid);
    if (found) { cardTitle = found.title || ''; break; }
  }

  const lang = (state.currentChapter && state.currentChapter.voice_quiz_lang) || 'ko-KR';
  // 챕터가 "문제 읽기 가능" 설정인지 확인 (1=가능, 0=한자·국기 등 읽기 불가 콘텐츠)
  const canReadQuestion = !state.currentChapter || Number(state.currentChapter.voice_quiz_read_question == null ? 1 : state.currentChapter.voice_quiz_read_question) === 1;
  const questionLang = detectVoiceQuizLang(cardTitle) || lang;

  // 문제 읽기 ON + 챕터가 읽기 가능이면 TTS 후 listening, 그 외엔 즉시 listening
  if (state.voiceQuizReadAloud && canReadQuestion && cardTitle) {
    state.voiceQuizPhase = 'reading';
    if (state.currentChapter) renderTree(state.currentChapter.id);
    speakVoiceQuiz(cardTitle, questionLang, () => {
      if (!state.voiceQuizActive) return;
      voiceQuizStartListening(sid, lang);
    });
  } else {
    voiceQuizStartListening(sid, lang);
  }
}

// 실제 음성 인식 시작 — TTS 끝난 후 (또는 직접) 호출
function voiceQuizStartListening(sid, lang) {
  if (!state.voiceQuizActive) return; // 중단된 세션은 마이크 켜지 않음
  state.voiceQuizPhase = 'listening';
  if (state.currentChapter) renderTree(state.currentChapter.id);

  // Web Speech API 시작
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new SR();
  rec.lang = lang;
  rec.interimResults = false;
  rec.maxAlternatives = 5;
  rec.continuous = false;

  let resolved = false;
  let timerStarted = false;     // 실제 listening 시작 여부 — onstart/onaudiostart에서 true
  let userIsSpeaking = false;   // onspeechstart 후 onspeechend 전 = 발화 중
  let fallbackTimer = null;     // onstart 이벤트가 안 와도 안전망 1초 후 강제 시작

  const resolveOnce = (outcome) => {
    if (resolved) return;
    resolved = true;
    voiceQuizResolve(sid, outcome);
  };

  const startTimer = () => {
    if (timerStarted || resolved) return;
    timerStarted = true;
    if (fallbackTimer) { clearTimeout(fallbackTimer); fallbackTimer = null; }
    // 실제 listening 시작 시점부터 2초 카운트
    state._voiceQuizTimer = setTimeout(() => {
      if (resolved) return;
      // 사용자가 말하는 중이면 끝맺기까지 800ms 추가 grace
      if (userIsSpeaking) {
        state._voiceQuizTimer = setTimeout(() => {
          if (resolved) return;
          try { rec.stop(); } catch {}
          // stop() 후 onresult/onend가 자연스럽게 fire 되도록 잠시 대기
          setTimeout(() => resolveOnce('timeout'), 800);
        }, 800);
      } else {
        try { rec.stop(); } catch {}
        setTimeout(() => resolveOnce('timeout'), 800);
      }
    }, VOICE_QUIZ_TIME_LIMIT_MS);
  };

  // 어떤 이벤트가 먼저 와도 OK — 첫 번째 도착에서 타이머 시작
  rec.onstart = startTimer;
  rec.onaudiostart = startTimer;
  rec.onspeechstart = () => { userIsSpeaking = true; };
  rec.onspeechend = () => { userIsSpeaking = false; };

  rec.onresult = (e) => {
    if (resolved) return;
    if (state._voiceQuizTimer) { clearTimeout(state._voiceQuizTimer); state._voiceQuizTimer = null; }
    const alternatives = [];
    for (let i = 0; i < (e.results[0].length || 0); i++) {
      alternatives.push(e.results[0][i].transcript);
    }
    state.voiceQuizTranscript = alternatives[0] || '';
    const expected = state.voiceQuizExpected;
    const matched = alternatives.some(alt => voiceQuizCompare(alt, expected));
    resolveOnce(matched ? 'correct' : 'wrong');
  };
  rec.onerror = (e) => {
    if (resolved) return;
    const err = (e && e.error) || '';
    // 명시적 실패는 사용자에게 알림
    if (err === 'not-allowed' || err === 'service-not-allowed') {
      toast('마이크 권한이 거부되었습니다 — 브라우저 설정에서 허용해주세요', true);
      stopVoiceQuiz(); return;
    }
    if (err === 'audio-capture') {
      toast('마이크 장치를 인식할 수 없습니다', true);
      stopVoiceQuiz(); return;
    }
    // no-speech / aborted / network 등 → timeout 처리
    resolveOnce('timeout');
  };
  rec.onend = () => {
    if (resolved) return;
    resolveOnce('timeout');
  };

  try {
    rec.start();
    state._voiceQuizRecognition = rec;
  } catch (err) {
    toast('마이크 시작 실패: ' + (err && err.message ? err.message : ''), true);
    stopVoiceQuiz();
    return;
  }

  // 안전망: onstart/onaudiostart가 1초 내 발생 안 하면 강제로 타이머 시작
  fallbackTimer = setTimeout(() => {
    if (!timerStarted && !resolved) startTimer();
  }, 1000);
}

// 결과 처리 — correct/wrong/timeout
// SRS 박스는 변경하지 않음 (퀴즈는 단순 단어-뜻 빠른 연결 확인).
// 시각: 색상으로만 정답/오답 구분 (글자 라벨 없음). 청각: 띵동/삑 + 뜻 발음.
function voiceQuizResolve(sid, outcome) {
  voiceQuizCleanup();
  const isAuto = state.voiceQuizMode === 'auto';
  const lang = (state.currentChapter && state.currentChapter.voice_quiz_lang) || 'ko-KR';
  const readAloud = !!state.voiceQuizReadAloud;
  const isCorrect = outcome === 'correct';

  state.voiceQuizPhase = isCorrect ? 'correct-flash' : (outcome === 'timeout' ? 'timeout' : 'wrong-reveal');
  if (state.currentChapter) renderTree(state.currentChapter.id);

  // 신호음 (시각 효과와 즉시 동기) — 항상 재생
  if (isCorrect) playDingCorrect(); else playBuzzWrong();

  const proceed = () => {
    if (!state.voiceQuizActive) return;
    if (isCorrect) { state.quizDoneSet.add(sid); state.quizLastWrongSid = null; }
    else { state.quizLastWrongSid = sid; }
    setTimeout(() => voiceQuizNextCard(), 50);
  };

  const meaning = state.voiceQuizExpected;
  const advanceAuto = isAuto || isCorrect; // 자동 모드 또는 정답이면 자동 진행

  if (readAloud && meaning) {
    // 신호음 끝나고 TTS 뜻 발음 → 끝나면 진행 (수동 오답은 대기)
    const meaningLang = detectVoiceQuizLang(meaning) || lang;
    setTimeout(() => {
      if (!state.voiceQuizActive) return;
      speakVoiceQuiz(meaning, meaningLang, () => {
        if (advanceAuto) setTimeout(proceed, isCorrect ? 100 : 500);
        // 수동 오답: 사용자 탭 대기
      });
    }, 350);
  } else {
    // readAloud OFF: 시각/신호음만, 시간 후 진행
    if (advanceAuto) {
      setTimeout(proceed, isCorrect ? VOICE_CORRECT_FLASH_MS : VOICE_AUTO_WRONG_DISPLAY_MS);
    }
    // 수동 오답: 사용자 탭 대기
  }
}

// 오답/타임아웃 후 "다음" 버튼 (수동 모드 전용)
//  → done에 등록 안 함, lastWrongSid 기록만
function voiceQuizContinue(sid) {
  state.quizLastWrongSid = sid;
  setTimeout(() => voiceQuizNextCard(), 50);
}

// 스테이지 포커스 카드 HTML — byBox[1]의 첫 번째 카드를 큰 카드로 렌더
// items 미로드면 로딩 상태. 능동 회상 ON + 미공개면 블러 + 정답 보기 버튼.
function renderFocusCard(s, remaining, hasAccess) {
  const sid = Number(s.id);
  const items = state.itemsBySubtopic[sid];
  // 학습 카드 대표 이미지 (subtopic.image_b64) — 본문 맨 위에 노출
  const hasImg = !!s.image_b64;
  const previewHtml = hasImg
    ? `<div class="focus-preview"><img src="${escapeHtml(s.image_b64)}" alt="" oncontextmenu="return false">${s.caption ? `<div class="focus-preview-cap">${escapeHtml(s.caption)}</div>` : ''}</div>`
    : '';
  let body = '';
  let bodyReady = false;
  if (items === undefined) {
    loadItems(sid);
    body = previewHtml + '<div class="empty-state" style="padding:30px 10px;">로딩…</div>';
  } else if (items.locked) {
    body = `
      <div class="locked-banner">
        <h4>🔒 구독 후 볼 수 있습니다</h4>
        <button onclick="event.stopPropagation();openPayModal(${items.chapter_id})">구독하기 →</button>
      </div>`;
  } else if (items.error) {
    body = `<div class="empty-state">오류: ${escapeHtml(items.error)}</div>`;
  } else if (!items.length) {
    // 이미지만 있고 items 없는 경우도 학습 가능하게 처리
    if (hasImg) { body = previewHtml; bodyReady = true; }
    else body = '<div class="empty-state">아직 내용이 없습니다.</div>';
  } else {
    body = previewHtml + items.map(it => renderItem(it)).join('');
    bodyReady = true;
  }

  const recallOn = !!state.activeRecallMode;
  const revealed = state.activeRecallRevealed.has(sid);
  const showRevealBtn = recallOn && bodyReady && !revealed;
  const showAssessBar = bodyReady && (!recallOn || revealed);

  const isAlpha = /[a-zA-Z]/.test(s.title || '') && !/[가-힯ᄀ-ᇿ㄰-㆏]/.test(s.title || '');
  const speakBtn = isAlpha
    ? `<button class="speak-btn" onclick="event.stopPropagation();speakText(${JSON.stringify(s.title).replace(/"/g, '&quot;')})" title="발음 듣기">🔊</button>`
    : '';

  // 카드 자체를 터치하면 정답 공개 (정답 보기 버튼 대체). 본문 로딩 중엔 비활성.
  const cardClass = `focus-card${showRevealBtn ? ' clickable' : ''}`;
  const cardOnClick = showRevealBtn ? `onclick="activeRecallReveal(${sid})"` : '';

  return `
    <div class="${cardClass}" data-sub="${sid}" ${cardOnClick}>
      <div class="focus-title">${escapeHtml(s.title)}${speakBtn}</div>
      <div class="focus-body-wrap">
        <div class="focus-body${showRevealBtn ? ' blurred' : ''}">${body}</div>
        ${showRevealBtn ? '<div class="focus-tap-hint">카드터치</div>' : ''}
      </div>
      ${showAssessBar ? `
        <div class="focus-bottom-bar">
          <button class="recall-btn recall-wrong" onclick="event.stopPropagation();todayStageJudge(${sid}, false)">✗ 더 학습</button>
          <button class="recall-btn recall-correct" onclick="event.stopPropagation();todayStageJudge(${sid}, true)">✓ 학습 OK</button>
        </div>
      ` : ''}
    </div>
  `;
}

// 음성 퀴즈 카드 — 큐만 보임 + 마이크 + 타이머 + (모드별 결과 표시)
// currentSid: voiceQuizCurrentCardId() 결과. quizDoneSet + lastWrongSid 후순위 반영 → TTS와 표시 일치
function renderVoiceQuizCard(byBox1, currentSid) {
  if (byBox1.length === 0 || currentSid == null) {
    return `
      <div class="stage-empty">
        <div class="stage-empty-icon">🎉</div>
        <div class="stage-empty-text">오늘 분량 완료!</div>
      </div>
    `;
  }
  const s = byBox1.find(x => Number(x.id) === currentSid) || byBox1[0];
  const sid = Number(s.id);
  const phase = state.voiceQuizPhase || 'idle';
  const isAuto = state.voiceQuizMode === 'auto';
  const isAlpha = /[a-zA-Z]/.test(s.title || '') && !/[가-힯ᄀ-ᇿ㄰-㆏]/.test(s.title || '');
  const speakBtn = isAlpha
    ? `<button class="speak-btn" onclick="event.stopPropagation();speakText(${JSON.stringify(s.title).replace(/"/g, '&quot;')})" title="발음 듣기">🔊</button>`
    : '';

  const items = state.itemsBySubtopic[sid] || [];
  // 퀴즈는 단어와 뜻 빠른 연결에만 집중 — items[0](정답)만 표시. 자동/수동 모드 무관.
  const explainHtml = Array.isArray(items) && items.length
    ? renderItem(items[0])
    : '';
  const answer = state.voiceQuizExpected || getCardAnswer(sid);

  const isResult = phase === 'correct-flash' || phase === 'wrong-reveal' || phase === 'timeout';

  let bodyHtml = '';
  if (phase === 'reading') {
    bodyHtml = `
      <div class="vq-listening">
        <div class="vq-mic-ring vq-reading-ring"><div class="vq-mic-icon">🔊</div></div>
        <div class="vq-hint">문제 읽는 중…</div>
      </div>
    `;
  } else if (phase === 'listening') {
    bodyHtml = `
      <div class="vq-listening">
        <div class="vq-mic-ring"><div class="vq-mic-icon">🎤</div></div>
        <div class="vq-hint">말로 답해보세요</div>
        <div class="vq-timer-bar"><div class="vq-timer-fill"></div></div>
      </div>
    `;
  } else if (isResult) {
    // 사진 찍히듯이 — 단어와 뜻을 크게 위/아래로. 색상으로만 정답/오답 구분.
    const nextBtn = !isAuto
      ? `<button class="vq-next-btn vq-snap-next" onclick="voiceQuizContinue(${sid})">다음 카드 →</button>`
      : '';
    bodyHtml = `
      <div class="vq-snapshot">
        <div class="vq-snap-flash"></div>
        <div class="vq-snap-word">${escapeHtml(s.title)}</div>
        <div class="vq-snap-divider"></div>
        <div class="vq-snap-meaning">${escapeHtml(answer)}</div>
        ${nextBtn}
      </div>
    `;
  } else {
    bodyHtml = `<div class="vq-loading">준비 중…</div>`;
  }

  // 결과 phase에선 상단 제목 숨김 (스냅샷이 단어 자체를 크게 보여줌)
  return `
    <div class="focus-card vq-card vq-${phase}" data-sub="${sid}">
      ${isResult ? '' : `<div class="focus-title">${escapeHtml(s.title)}${speakBtn}</div>`}
      ${bodyHtml}
    </div>
  `;
}

// ============================================================
// 첫글자 퀴즈 — 음성 퀴즈와 같은 큐, 정답 첫 글자 + distractor 2개 중 선택
// ============================================================
// 텍스트의 첫 글자 추출 (영문은 대문자화)
function getFirstChar(text) {
  if (!text) return '';
  const t = String(text).trim();
  if (!t) return '';
  const ch = t.charAt(0);
  return /[a-z]/.test(ch) ? ch.toUpperCase() : ch;
}

// 같은 챕터의 다른 카드 items[0] 첫 글자 풀에서 랜덤 distractor 선택.
// 풀 부족시 기본 풀로 폴백.
function generateDistractor(correctChar, chapterId) {
  const pool = new Set();
  const topics = state.topicsByChapter[chapterId] || [];
  for (const t of topics) {
    const subs = state.subtopicsByTopic[t.id] || [];
    for (const s of subs) {
      const sid = Number(s.id);
      const items = state.itemsBySubtopic[sid];
      if (items && items.length && items[0] && (items[0].text || items[0].caption)) {
        const ch = getFirstChar(items[0].text || items[0].caption);
        if (ch && ch !== correctChar) pool.add(ch);
      }
    }
  }
  let candidates = Array.from(pool);
  if (candidates.length === 0) {
    if (/[가-힯]/.test(correctChar)) {
      candidates = ['가','나','다','라','마','바','사','아','자','차','카','타','파','하','강','김','이','박','최','정'];
    } else if (/[A-Z]/.test(correctChar)) {
      candidates = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    } else {
      candidates = ['?'];
    }
    candidates = candidates.filter(c => c !== correctChar);
  }
  return candidates[Math.floor(Math.random() * candidates.length)] || '?';
}

function startFirstLetterQuiz() {
  if (!state.memorizedView) { toast('다지기 모드에서만 가능', true); return; }
  if (state.voiceQuizActive) { toast('음성 퀴즈를 먼저 종료하세요', true); return; }
  const qs = quizStats();
  if (qs.total > 0 && qs.pending === 0) {
    toast('퀴즈는 모두 풀었어요. 카드 터치 학습으로 진행하세요.', true);
    return;
  }
  state.firstLetterQuizActive = true;
  state.firstLetterQuizPhase = 'idle';
  if (state.currentChapter) renderTree(state.currentChapter.id);
  firstLetterQuizNextCard();
}

function stopFirstLetterQuiz() {
  if (state._voiceQuizTimer) { clearTimeout(state._voiceQuizTimer); state._voiceQuizTimer = null; }
  try { speechSynthesis.cancel(); } catch {}
  state.firstLetterQuizActive = false;
  state.firstLetterQuizPhase = 'idle';
  state.firstLetterQuizChoices = [];
  state.firstLetterQuizSelected = '';
  state.firstLetterQuizExpected = '';
  state.quizLastWrongSid = null;
  if (state.currentChapter) renderTree(state.currentChapter.id);
}

function firstLetterQuizNextCard() {
  if (!state.firstLetterQuizActive) return; // 중단된 세션은 더 진행 안 함
  if (state._voiceQuizTimer) { clearTimeout(state._voiceQuizTimer); state._voiceQuizTimer = null; }
  const sid = voiceQuizCurrentCardId();
  if (sid == null) {
    const qs = quizStats();
    state.firstLetterQuizActive = false;
    state.firstLetterQuizPhase = 'idle';
    state.quizLastWrongSid = null;
    if (qs.total > 0 && qs.done > 0 && qs.pending === 0) {
      toast('🎉 퀴즈 클리어! 카드 터치로 깊은 학습을 진행하세요.', false);
    }
    if (state.currentChapter) renderTree(state.currentChapter.id);
    return;
  }
  state.firstLetterQuizSelected = '';
  state.firstLetterQuizChoices = [];

  // 카드 제목 찾기
  let cardTitle = '';
  const topics = state.topicsByChapter[state.currentChapter.id] || [];
  for (const t of topics) {
    const subs = state.subtopicsByTopic[t.id] || [];
    const found = subs.find(x => Number(x.id) === sid);
    if (found) { cardTitle = found.title || ''; break; }
  }

  const lang = (state.currentChapter && state.currentChapter.voice_quiz_lang) || 'ko-KR';
  const canReadQuestion = !state.currentChapter || Number(state.currentChapter.voice_quiz_read_question == null ? 1 : state.currentChapter.voice_quiz_read_question) === 1;
  const questionLang = detectVoiceQuizLang(cardTitle) || lang;

  // items 로드 보장 후 진행
  ensureItems(sid, false).then(() => {
    if (!state.firstLetterQuizActive) return;
    if (state.voiceQuizReadAloud && canReadQuestion && cardTitle) {
      state.firstLetterQuizPhase = 'reading';
      if (state.currentChapter) renderTree(state.currentChapter.id);
      speakVoiceQuiz(cardTitle, questionLang, () => {
        if (!state.firstLetterQuizActive) return;
        showFirstLetterChoices(sid);
      });
    } else {
      showFirstLetterChoices(sid);
    }
  }).catch(() => {
    if (state.firstLetterQuizActive) showFirstLetterChoices(sid);
  });
}

function showFirstLetterChoices(sid) {
  if (!state.firstLetterQuizActive) return; // 중단된 세션은 선택지 안 띄움
  const answer = getCardAnswer(sid);
  state.firstLetterQuizExpected = answer;
  const correctChar = getFirstChar(answer);
  if (!correctChar) {
    // 정답 추출 실패 — 한 카드 스킵 (quizDoneSet에 추가하여 무한 루프 방지)
    toast('정답을 찾을 수 없는 카드입니다', true);
    state.quizDoneSet.add(sid);
    setTimeout(() => firstLetterQuizNextCard(), 200);
    return;
  }
  const distractor = generateDistractor(correctChar, state.currentChapter.id);
  const correctFirst = Math.random() < 0.5;
  state.firstLetterQuizChoices = correctFirst
    ? [{ char: correctChar, isCorrect: true }, { char: distractor, isCorrect: false }]
    : [{ char: distractor, isCorrect: false }, { char: correctChar, isCorrect: true }];
  state.firstLetterQuizPhase = 'choosing';
  if (state.currentChapter) renderTree(state.currentChapter.id);
}

function firstLetterQuizSelect(sid, char) {
  if (state.firstLetterQuizPhase !== 'choosing') return;
  state.firstLetterQuizSelected = char;
  const chosen = state.firstLetterQuizChoices.find(c => c.char === char);
  const correct = !!(chosen && chosen.isCorrect);
  firstLetterQuizResolve(sid, correct);
}

function firstLetterQuizResolve(sid, correct) {
  // 음성 퀴즈와 동일 흐름 — 색상 시각화 + 띵동/삑 + 뜻 발음.
  const isAuto = state.voiceQuizMode === 'auto';
  const lang = (state.currentChapter && state.currentChapter.voice_quiz_lang) || 'ko-KR';
  const readAloud = !!state.voiceQuizReadAloud;

  state.firstLetterQuizPhase = correct ? 'correct-flash' : 'wrong-reveal';
  if (state.currentChapter) renderTree(state.currentChapter.id);

  if (correct) playDingCorrect(); else playBuzzWrong();

  const proceed = () => {
    if (!state.firstLetterQuizActive) return;
    if (correct) { state.quizDoneSet.add(sid); state.quizLastWrongSid = null; }
    else { state.quizLastWrongSid = sid; }
    setTimeout(() => firstLetterQuizNextCard(), 50);
  };

  const meaning = state.firstLetterQuizExpected;
  const advanceAuto = isAuto || correct;

  if (readAloud && meaning) {
    const meaningLang = detectVoiceQuizLang(meaning) || lang;
    setTimeout(() => {
      if (!state.firstLetterQuizActive) return;
      speakVoiceQuiz(meaning, meaningLang, () => {
        if (advanceAuto) setTimeout(proceed, correct ? 100 : 500);
      });
    }, 350);
  } else {
    if (advanceAuto) {
      setTimeout(proceed, correct ? VOICE_CORRECT_FLASH_MS : VOICE_AUTO_WRONG_DISPLAY_MS);
    }
  }
}

function firstLetterQuizContinue(sid) {
  state.quizLastWrongSid = sid;
  setTimeout(() => firstLetterQuizNextCard(), 50);
}

// 첫글자 퀴즈 카드 렌더
// currentSid: voiceQuizCurrentCardId() 결과 — quizDoneSet + lastWrongSid 후순위 반영
function renderFirstLetterQuizCard(byBox1, currentSid) {
  if (byBox1.length === 0 || currentSid == null) {
    return `<div class="stage-empty"><div class="stage-empty-icon">🎉</div><div class="stage-empty-text">오늘 분량 완료!</div></div>`;
  }
  const s = byBox1.find(x => Number(x.id) === currentSid) || byBox1[0];
  const sid = Number(s.id);
  const phase = state.firstLetterQuizPhase || 'idle';
  const isAuto = state.voiceQuizMode === 'auto';
  const items = state.itemsBySubtopic[sid] || [];
  // 퀴즈는 단어와 뜻 빠른 연결에만 집중 — items[0](정답)만 표시
  const explainHtml = Array.isArray(items) && items.length
    ? renderItem(items[0])
    : '';
  const answer = state.firstLetterQuizExpected || getCardAnswer(sid);
  const isAlpha = /[a-zA-Z]/.test(s.title || '') && !/[가-힯ᄀ-ᇿ㄰-㆏]/.test(s.title || '');
  const speakBtn = isAlpha
    ? `<button class="speak-btn" onclick="event.stopPropagation();speakText(${JSON.stringify(s.title).replace(/"/g, '&quot;')})" title="발음 듣기">🔊</button>`
    : '';

  const isResult = phase === 'correct-flash' || phase === 'wrong-reveal';

  let bodyHtml = '';
  if (phase === 'reading') {
    bodyHtml = `<div class="vq-listening"><div class="vq-mic-ring vq-reading-ring"><div class="vq-mic-icon">🔊</div></div><div class="vq-hint">문제 읽는 중…</div></div>`;
  } else if (phase === 'choosing') {
    const choices = state.firstLetterQuizChoices || [];
    bodyHtml = `
      <div class="fl-choices">
        ${choices.map(c => `
          <button class="fl-choice" onclick="firstLetterQuizSelect(${sid}, ${JSON.stringify(c.char).replace(/"/g, '&quot;')})">${escapeHtml(c.char)}</button>
        `).join('')}
      </div>
    `;
  } else if (isResult) {
    // 사진 찍히듯이 — 단어와 뜻을 크게 위/아래로. 색상으로만 정답/오답 구분.
    const nextBtn = !isAuto
      ? `<button class="vq-next-btn vq-snap-next" onclick="firstLetterQuizContinue(${sid})">다음 카드 →</button>`
      : '';
    bodyHtml = `
      <div class="vq-snapshot">
        <div class="vq-snap-flash"></div>
        <div class="vq-snap-word">${escapeHtml(s.title)}</div>
        <div class="vq-snap-divider"></div>
        <div class="vq-snap-meaning">${escapeHtml(answer)}</div>
        ${nextBtn}
      </div>
    `;
  } else {
    bodyHtml = `<div class="vq-loading">준비 중…</div>`;
  }

  return `
    <div class="focus-card vq-card fl-card vq-${phase}" data-sub="${sid}">
      ${isResult ? '' : `<div class="focus-title">${escapeHtml(s.title)}${speakBtn}</div>`}
      ${bodyHtml}
    </div>
  `;
}

// 오늘 학습 박스의 퀴즈 통계 — {total, done, pending}. byBox[1] effective 카드 기준.
function quizStats() {
  if (!state.currentChapter) return { total: 0, done: 0, pending: 0 };
  const topics = state.topicsByChapter[state.currentChapter.id] || [];
  let total = 0, done = 0;
  for (const t of topics) {
    const subs = state.subtopicsByTopic[t.id] || [];
    for (const s of subs) {
      const sid = Number(s.id);
      if (!state.memoSnapshotIds.has(sid)) continue;
      const days = dueDaysLeft(state.understoodNextReview[sid]);
      const effBox = days <= 0 ? 1 : (Number(state.understoodBox[sid]) || 1);
      if (effBox !== 1) continue;
      total++;
      if (state.quizDoneSet.has(sid)) done++;
    }
  }
  return { total, done, pending: total - done };
}

// 퀴즈 모두 클리어 안내 카드 — 시작 버튼 자리에 대체 노출
function renderQuizCleared(stats) {
  return `
    <div class="quiz-cleared-notice">
      <div class="qc-icon">🎉</div>
      <div class="qc-title">퀴즈 클리어!</div>
      <div class="qc-body">
        <strong>${stats.done}개</strong>의 카드를 모두 빠르게 확인했어요.<br>
        이제 <strong>카드를 터치</strong>해서 본문을 읽고<br>
        ✓ 학습 OK / ✗ 더 학습으로<br>
        <strong>깊은 학습</strong>을 진행하세요.
      </div>
    </div>
  `;
}

// 토글 라벨: 챕터가 "문제 읽기 가능" 인지에 따라 "문제 읽기"/"정답 뜻 읽기"로 분기
function voiceQuizReadToggleLabel() {
  const c = state.currentChapter;
  const canReadQ = !c || Number(c.voice_quiz_read_question == null ? 1 : c.voice_quiz_read_question) === 1;
  return canReadQ ? '문제 읽기' : '정답 뜻 읽기';
}

// 음성 퀴즈 설정 바 (모드 + 문제 읽기 토글) — 시작 버튼 위에 표시
function renderVoiceQuizSettings() {
  const mode = state.voiceQuizMode || 'manual';
  const read = !!state.voiceQuizReadAloud;
  return `
    <div class="vq-settings">
      <div class="vq-seg">
        <button class="vq-seg-btn ${mode === 'manual' ? 'on' : ''}" onclick="setVoiceQuizMode('manual')">수동</button>
        <button class="vq-seg-btn ${mode === 'auto' ? 'on' : ''}" onclick="setVoiceQuizMode('auto')">자동</button>
      </div>
      <button class="vq-read-btn ${read ? 'on' : ''}" onclick="toggleVoiceQuizRead()" title="${voiceQuizReadToggleLabel() === '정답 뜻 읽기' ? '이 챕터는 문제 제목 읽기 불가 — 정답 뜻만 읽힘' : '문제 제목과 정답 뜻 모두 읽기'}">
        <span style="font-size:14px;">🔊</span> ${voiceQuizReadToggleLabel()} <strong>${read ? 'ON' : 'OFF'}</strong>
      </button>
    </div>
  `;
}

// 스테이지 전체 HTML (헤더 + 더미 + 포커스 카드 OR 빈 상태)
//  - 헤더 클릭으로 펼침/접힘 (다른 박스와 아코디언 동작)
//  - 닫혀 있으면 헤더만 (더미 카운트는 그대로 보임)
function renderTodayStage(byBox1, hasAccess) {
  const remaining = byBox1.length;
  const isOpen = !!state.memorizedBoxOpen[1];

  // 더미 카드 시각화 — 펼침/접힘 상관없이 항상 보임
  const stackLayers = remaining > 0 ? Math.min(remaining, 4) : 0;
  const deckCardsHtml = Array(stackLayers).fill('<div class="deck-back-card"></div>').join('');
  const countColor = remaining === 0 ? 'style="color:rgba(255,255,255,0.35)"' : '';
  const head = `
    <div class="stage-head" onclick="toggleSrsBox(1)">
      <span class="srs-box-arrow">${isOpen ? '▼' : '▶'}</span>
      <span class="stage-name">오늘 학습</span>
      <div class="srs-deck-stack">
        ${deckCardsHtml}
        <div class="deck-count" ${countColor}>${remaining}</div>
      </div>
    </div>
  `;

  if (!isOpen) {
    return `<div class="srs-today-stage closed">${head}</div>`;
  }

  // 펼침 상태: 본문 (포커스 카드 또는 빈 상태)
  const bodyHtml = remaining === 0
    ? `
      <div class="stage-empty">
        <div class="stage-empty-icon">🎉</div>
        <div class="stage-empty-text">오늘 분량 완료!</div>
        <div class="stage-empty-hint">미래 박스를 살펴보거나 새 단어를 추가하세요</div>
      </div>
    `
    : renderFocusCard(byBox1[0], remaining, hasAccess);

  return `
    <div class="srs-today-stage open">
      ${head}
      ${bodyHtml}
    </div>
  `;
}

// ============================================================
// 자정 넘김 (day rollover) — 마지막 학습 KST 날짜와 다르면 안내 + 자동 정렬
// ============================================================
// 미래 박스(literal box≥2)인데 next_review_at <= 오늘인 카드 수 = 오늘로 흘러내려온 카드
function countNewlyDueCards() {
  if (!state.currentChapter) return 0;
  const cid = state.currentChapter.id;
  const topics = state.topicsByChapter[cid] || [];
  let count = 0;
  for (const t of topics) {
    const subs = state.subtopicsByTopic[t.id] || [];
    for (const s of subs) {
      const sid = Number(s.id);
      if (!state.understoodSet.has(sid)) continue;
      const literalBox = Number(state.understoodBox[sid]) || 1;
      if (literalBox === 1) continue; // 이미 오늘 박스 — 카운트 대상 아님
      const dueDays = dueDaysLeft(state.understoodNextReview[sid]);
      if (dueDays <= 0) count++;
    }
  }
  return count;
}

// 다지기 진입 시 호출. 마지막 학습이 어제 이전이면 안내 모달 노출.
function maybeShowDayRollover() {
  if (!state.currentChapter) return;
  const today = kstTodayDate();
  const last = state.lastStudyDate;

  // 첫 진입: 그냥 기록 (안내 안 함)
  if (!last) {
    state.lastStudyDate = today;
    try { localStorage.setItem('op_last_study_date', today); } catch {}
    return;
  }
  // 같은 날: 통과
  if (last === today) return;

  // 날짜 바뀜 — 기록 갱신 (중복 안내 방지)
  state.lastStudyDate = today;
  try { localStorage.setItem('op_last_study_date', today); } catch {}

  // 이동된 카드 카운트. 0장이면 안내 안 함 (학습 시작에 방해)
  const count = countNewlyDueCards();
  if (count === 0) return;
  showDayRolloverNotice(count);
}

// 자정 넘김 안내 오버레이 — 2.5초 후 자동 사라짐 + render
function showDayRolloverNotice(count) {
  const overlay = document.createElement('div');
  overlay.className = 'day-rollover-overlay';
  overlay.innerHTML = `
    <div class="day-rollover-card">
      <div class="day-rollover-icon">🌅</div>
      <div class="day-rollover-title">새로운 학습 일정</div>
      <div class="day-rollover-body">
        <strong>${count}장</strong>의 카드가<br>오늘 학습으로 도착했습니다
      </div>
      <div class="day-rollover-hint">잠시 후 시작합니다…</div>
    </div>
  `;
  document.body.appendChild(overlay);
  setTimeout(() => {
    overlay.classList.add('fade-out');
    setTimeout(() => {
      overlay.remove();
      if (state.currentChapter && state.memorizedView) renderTree(state.currentChapter.id);
    }, 400);
  }, 2500);
}

function rebuildMemoSnapshot() {
  state.memoSnapshotIds = new Set();
  const cid = state.currentChapter && state.currentChapter.id;
  if (!cid) return;
  const topics = state.topicsByChapter[cid] || [];
  for (const t of topics) {
    const subs = state.subtopicsByTopic[t.id] || [];
    for (const s of subs) {
      if (state.understoodSet.has(Number(s.id))) state.memoSnapshotIds.add(Number(s.id));
    }
  }
}

// 암기 모음 스냅샷의 모든 items 백그라운드 프리페치 → 펼침 시 즉각 표시
function prefetchMemoSnapshot() {
  for (const subId of state.memoSnapshotIds) {
    ensureItems(subId, true);
  }
}

function toggleMemorizedView() {
  state.memorizedView = !state.memorizedView;
  // 모드 전환 시 펼친 학습 카드 닫기 (혼선 방지)
  state.expanded.subtopic.clear();
  const btn = $('memorizedBtn');
  if (btn) btn.classList.toggle('active', state.memorizedView);
  // ON으로 전환 → 현재 암기된 것들을 스냅샷에 고정 + items 미리 받기
  if (state.memorizedView) {
    rebuildMemoSnapshot();
    prefetchMemoSnapshot();
    // 박스 펼침 기본 상태 (오늘만 펼침) — 매 진입 시 리셋
    state.memorizedBoxOpen = {1:true, 2:false, 3:false, 4:false, 5:false, 6:false};
    // 다지기 펼침 이력 초기화 — 다지기 안에서 펼친 것만 패스 판정에 사용
    state.memorizedExpandedSet = new Set();
    // 다지기 처리 이력 초기화 — celebration 판정용
    state.memorizedAddressedSet = new Set();
    state.memorizedClearedToday = false;
    // 능동 회상: 학습 효과 핵심이라 항상 ON. reveal 진행상태는 매 진입마다 리셋
    state.activeRecallMode = true;
    state.activeRecallRevealed = new Set();
    // 퀴즈 세션 상태 리셋 — 다지기 새 진입마다 0부터 시작
    state.voiceQuizActive = false;
    state.firstLetterQuizActive = false;
    state.quizDoneSet = new Set();
    state.quizLastWrongSid = null;
    // 일반 모드/이전 세션에서 누적된 passedSet 잔여 항목 제거 — 다지기에서는 카드가 다 보여야 함
    // (다지기 박스 안 카드들에 한해서만 클리어. 일반 모드의 다른 챕터/패스 이력은 보존)
    for (const sid of state.memoSnapshotIds) state.passedSet.delete(sid);
    savePassed();
    // 오늘 통계 KST 자정 지났을 수 있으니 다시 로드 (자동 리셋 포함)
    if (state.currentChapter) loadTodayStats(state.currentChapter.id);
    // 자정 넘김 안내 — 어제 이후 카드 자동 이동된 게 있으면 잠깐 모달
    maybeShowDayRollover();
  } else {
    state.memoSnapshotIds = new Set();
    // 다지기 → 챕터 모드 복귀 시: 학습하던 모든 목차 닫음 → 목차 화면으로
    state.expanded.topic.clear();
  }
  refreshModeTabsUI();
  if (state.currentChapter) renderTree(state.currentChapter.id);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// 암기 모음 모드의 패스 — 현재 항목을 이번 회에서 제외
function memorizedPass(subId, options) {
  // v2 다지기 패스 — was_peeked 판정은 '다지기 안에서 펼쳤는지'만 봄
  // (다른 모드(new/별표/all)에서 펼친 이력은 무시 — 다지기 안에서 안 펼치고 패스하면 advance)
  // options.forcePeeked: 능동 회상 모드에서 사용자 명시 자기평가(맞춤/틀림)로 wasPeeked 오버라이드
  const sid = Number(subId);
  const wasPeeked = options && typeof options.forcePeeked === 'boolean'
    ? options.forcePeeked
    : state.memorizedExpandedSet.has(sid);

  // 낙관적 박스/통계 갱신 — UI 즉시 반영, 서버 응답은 백그라운드
  if (state.understoodSet.has(sid)) {
    const cur = Number(state.understoodBox[sid]) || 1;
    // effective box: due 됐으면(시간 흘러 오늘 박스 위치) effective=1, 아니면 cur 그대로
    const dueDays = dueDaysLeft(state.understoodNextReview[sid]);
    const effPrev = dueDays <= 0 ? 1 : cur;
    let nxt = cur;
    if (wasPeeked) {
      // 펼친 뒤 패스 → box=1 강등
      nxt = 1;
    } else if (effPrev === 1) {
      // Model A (standard SRS): due 됐고 안 펼침 패스 → 다음 박스로 advance
      //  - box=1 → box=2 (내일)
      //  - box=2 → box=3 (4일 후)
      //  - box=3 → box=4 (8일 후)
      //  - ...
      nxt = Math.min(cur + 1, 6);
    }
    // 미래 박스 (due 아직 안 됨) + 안 펼침 → 변경 없음
    if (nxt !== cur) {
      state.understoodBox[sid] = nxt;
      // 통계: 오늘 박스 위치(effPrev=1)에서 미래(nxt>=2 or refresh)로 옮겨가면 cleared++
      bumpTodayStats(effPrev, nxt);
      // next_review_at 도 낙관적 계산
      const BOX_DUE_DAYS = [null, 0, 1, 4, 8, 16, 32];
      const days = BOX_DUE_DAYS[nxt] || 0;
      const due = new Date(Date.now() + 9*3600*1000 + days*86400*1000);
      state.understoodNextReview[sid] = due.toISOString().slice(0, 19).replace('T', ' ');
    }
    // last_moved_at 클라이언트 동기화 — 단일 카드 스테이지에서 "방금 본 카드가
    // 또 맨 위에 오는" 정렬 버그 차단 (peek+pass로 같은 박스에 머무는 경우 특히 필요)
    if (nxt !== cur || wasPeeked) {
      const nowKst = new Date(Date.now() + 9*3600*1000);
      state.understoodLastMovedAt[sid] = nowKst.toISOString().slice(0, 19).replace('T', ' ');
    }
    // 갱신 후의 effective box (state 반영 직후 재계산)
    const effNxt = dueDaysLeft(state.understoodNextReview[sid]) <= 0 ? 1 : (Number(state.understoodBox[sid]) || 1);
    // 박스 이동했으면 passedSet에서 제거 (새 박스에서 카드가 보여야 함).
    // 같은 박스에 머무르면 passedSet에 추가 (다음 패스가 다음 카드를 가리키도록 — 박스 내 진행).
    if (effPrev !== effNxt) {
      state.passedSet.delete(sid);
    } else {
      state.passedSet.add(sid);
    }
    // 오늘 학습에서 미래 박스로 이동(=실제 클리어) 추적 — celebration 트리거 조건
    if (effPrev === 1 && effNxt !== 1) {
      state.memorizedClearedToday = true;
    }
  } else {
    // understoodSet에 없는 카드 (이론상 다지기에서는 없어야 함) — 기존 동작 유지
    state.passedSet.add(sid);
  }
  // 서버 동기화 (백그라운드, 통계는 이미 낙관적 처리됨 — apiPass 중복 호출 X)
  api('POST', '/understood/pass', { subtopic_id: sid, was_peeked: wasPeeked }).catch(() => {});

  // 다지기 처리 이력 — celebration 판정용 (박스 이동과 무관하게 "이번 라운드에서 처리한 카드")
  state.memorizedAddressedSet.add(sid);
  // 펼침 이력은 이 pass로 소비됨 — 다음 pass는 fresh 평가 (peek+pass로 강등된 카드를 다시 anpel로 advance 가능)
  state.memorizedExpandedSet.delete(sid);
  state.expanded.subtopic.delete(sid);
  savePassed();

  // 라운드 완료 조건:
  //  1) 오늘 학습(effective box=1) 박스가 비었음
  //  2) 이번 라운드에서 오늘 학습 카드를 한 번이라도 클리어했음 (미래 박스 무한 사이클로 발사 안 함)
  //  3) celebration 진행 중 아님
  const cid = state.currentChapter && state.currentChapter.id;
  if (!cid) return;
  const todayBoxCount = countTodayBoxCards(cid);

  if (todayBoxCount === 0 && state.memorizedClearedToday && !state.celebrationActive) {
    const topics = state.topicsByChapter[cid] || [];
    state.celebrationActive = true;
    showCelebration();
    setTimeout(() => {
      state.celebrationActive = false;
      state.memorizedClearedToday = false; // 새 라운드 시작
      // 암기 모음 내 패스/처리 이력 정리 (정상 모드의 다른 챕터 패스는 건드리지 않음)
      //  + 펼침 이력도 초기화 — 새 라운드 시작이므로 이전에 펼친 카드도 "안 펼침" 상태로 리셋
      for (const t of topics) {
        const subs = state.subtopicsByTopic[t.id] || [];
        for (const s of subs) {
          if (state.memoSnapshotIds.has(Number(s.id))) {
            state.passedSet.delete(Number(s.id));
            state.memorizedAddressedSet.delete(Number(s.id));
            state.memorizedExpandedSet.delete(Number(s.id));
          }
        }
      }
      savePassed();
      // 미암기로 분류된 학습 카드는 다음 회 스냅샷에서 빠짐 + 새 스냅샷 items 프리페치
      rebuildMemoSnapshot();
      prefetchMemoSnapshot();
      if (state.memorizedView && state.currentChapter) renderTree(state.currentChapter.id);
    }, 2200);
  }

  // 항상 화면 갱신 — celebration 진행 중에도 카드 이동을 즉시 반영
  if (state.currentChapter) renderTree(state.currentChapter.id);
}

function renderTopic(t, hasAccess) {
  const isFree = Number(t.is_free) === 1;
  const locked = !isFree && !hasAccess;
  const opened = state.expanded.topic.has(t.id);
  const cls = 'topic-card' + (opened ? ' opened' : '') + (locked ? ' locked' : '');

  let body = '';
  let topSubId = null;          // 학습 대상 (맨 위 미학습 = 주황)
  let hasPassed = false;        // 이 토픽에 패스된 게 있나
  if (opened) {
    if (locked) {
      body = `
        <div class="locked-banner">
          <h4>🔒 구독 후 볼 수 있는 내용입니다</h4>
          <p>이 챕터를 결제하거나, 보유 포인트로 1개월 무료 연장하세요.</p>
          <button onclick="event.stopPropagation();openPayModal(${state.currentChapter.id})">구독하기 →</button>
        </div>
      `;
    } else {
      const subs = state.subtopicsByTopic[t.id];
      if (subs === undefined) {
        loadSubtopics(t.id);
        body = '<div class="empty-state">학습 카드 로딩…</div>';
      } else if (!subs.length) {
        body = '<div class="empty-state">학습 카드 없음</div>';
      } else {
        // v2 일반 모드 — new / star / all 탭에 따라 다르게 렌더링
        let pool;
        if (state.normalMode === 'new') {
          // new: 아직 학습 안 한 카드만 (op_understood 행 없음 = understoodSet 미포함)
          pool = subs.filter(s => !state.understoodSet.has(Number(s.id)));
        } else if (state.normalMode === 'star') {
          // 별표: miss_count > 0 인 카드, 별표(miss) 많은 순
          pool = subs.filter(s => (state.understoodMissCount[Number(s.id)] || 0) > 0);
        } else {
          // all: 모든 카드, 원순 (sort_order)
          pool = subs.slice();
        }

        if (pool.length === 0) {
          const emptyMsg = state.normalMode === 'new'
            ? '이 목차의 모든 카드가 학습 시작됨 — <strong>★ 별표</strong> 또는 <strong>all</strong> 탭에서 확인'
            : state.normalMode === 'star'
            ? '아직 틀린 카드 없음'
            : '카드 없음';
          body = `<div class="empty-state" style="padding:18px 14px;text-align:center;font-size:13px;color:rgba(255,255,255,0.55);">${emptyMsg}</div>`;
          topSubId = null;
        } else {
          const allPassed = pool.every(s => state.passedSet.has(Number(s.id)));
          if (allPassed) {
            for (const s of pool) state.passedSet.delete(Number(s.id));
            savePassed();
          }
          hasPassed = pool.some(s => state.passedSet.has(Number(s.id)));
          const visible = pool.filter(s => !state.passedSet.has(Number(s.id)));

          let sortedSubs;
          if (state.normalMode === 'star') {
            sortedSubs = [...visible].sort((a, b) => {
              const ma = state.understoodMissCount[Number(a.id)] || 0;
              const mb = state.understoodMissCount[Number(b.id)] || 0;
              if (ma !== mb) return mb - ma; // miss 많은 순
              return (Number(a.sort_order) || 0) - (Number(b.sort_order) || 0);
            });
          } else {
            // new 또는 all: sort_order 순
            sortedSubs = [...visible].sort((a, b) =>
              (Number(a.sort_order) || 0) - (Number(b.sort_order) || 0)
            );
          }

          const target = sortedSubs[0];
          topSubId = target ? Number(target.id) : null;
          body = sortedSubs.map(s => renderSubtopic(s, Number(s.id) === topSubId)).join('');
        }
        // 일반 모드 — 학습 카드 위에 3탭 (다지기 ON일 땐 안 보임)
        if (!state.memorizedView) {
          body = renderModeTabs() + body;
        }
      }
    }
  }

  // 학습 컨트롤 — 큰 패스 버튼 1개 (펼친 상태 + 접근권 있을 때)
  // 펼침은 학습 카드 직접 클릭, 완료/다시는 꾹누르기로 처리되므로 버튼은 패스만
  let studyBtns = '';
  if (opened && !locked) {
    const hasTop = topSubId != null;
    studyBtns = hasTop ? `
      <div class="study-controls">
        <button class="study-btn skip-big" onclick="event.stopPropagation();studyPass(${topSubId},${t.id})" title="맨 위 항목 패스 — 이 챕터에서 펼친 적 있으면 미암기, 없으면 ● 자동">⤴ 패스</button>
      </div>` : '';
  }

  // 목차별 암기 진도 — understoodSet 기준 비율
  const subsAll = state.subtopicsByTopic[t.id] || [];
  const total = subsAll.length || Number(t.subtopic_count) || 0;
  const learned = subsAll.filter(s => state.understoodSet.has(Number(s.id))).length;
  const pct = total ? Math.round(learned / total * 100) : 0;
  const doneCls = (total > 0 && learned === total) ? ' done' : '';
  const progress = `
    <div class="topic-progress" title="암기 ${learned}/${total} (${pct}%)">
      <div class="topic-progress-fill${doneCls}" style="width:${pct}%"></div>
      <div class="topic-progress-text">${learned}/${total}</div>
    </div>
  `;

  return `
    <div class="${cls}" data-topic="${t.id}">
      <div class="topic-head" onclick="toggleTopic(${t.id})">
        <div class="topic-arrow">▶</div>
        <div class="topic-title">${escapeHtml(t.title)}${isFree ? '<span class="free-tag">✨무료</span>' : (locked ? '<span class="lock-icon">🔒</span>' : '')}</div>
        ${progress}
        ${studyBtns}
      </div>
      <div class="topic-body">${body}</div>
    </div>
  `;
}

// miss_count → 별 개수 (1-2:★, 3-4:★★, 5-6:★★★, 7-8:★★★★, 9+:★★★★★)
function missToStarCount(miss) {
  const m = Number(miss) || 0;
  if (m <= 0) return 0;
  if (m <= 2) return 1;
  if (m <= 4) return 2;
  if (m <= 6) return 3;
  if (m <= 8) return 4;
  return 5;
}
// effective box → 짧은 라벨 (오늘/내일/4일/8일/16일/32일)
const BOX_SHORT_LABELS = [null, '오늘', '내일', '4일', '8일', '16일', '32일'];

function renderSubtopic(s, isCurrent) {
  const opened = state.expanded.subtopic.has(s.id);
  // 암기 모음 모드: 스냅샷 기준으로 understood 처리 → 펼친 직후 깜빡임(초록 → 기본) 방지
  const understood = state.memorizedView
    ? state.memoSnapshotIds.has(Number(s.id))
    : state.understoodSet.has(Number(s.id));
  // 정상 모드: understood면 current 강조 안 함 (이미 학습 완료)
  // 암기 모음 모드: understood여도 맨 위 항목은 current로 강조 (학습 대상)
  const showCurrent = isCurrent && (state.memorizedView || !understood);
  // 다지기에서 실패해 챕터 뷰로 돌아온 카드 — ↺ 표시 (정상 모드만)
  const failedFromMemo = !state.memorizedView && state.recentlyFailedFromMemo.has(Number(s.id));
  // 챕터에서 펼친 뒤 패스해 "틀린 단어"로 확정된 카드 — 색 다름 (다지기 복귀 카드와 별도)
  // 펼치는 순간이 아니라 패스 후에야 색 변경 → state.peekedPassedSet 기준
  const peeked = !state.memorizedView && !understood && !failedFromMemo
              && state.peekedPassedSet.has(Number(s.id));
  const cls = 'subtopic'
    + (opened ? ' opened' : '')
    + (understood ? ' understood' : '')
    + (showCurrent ? ' current' : '')
    + (failedFromMemo ? ' failed-from-memo' : '')
    + (peeked ? ' peeked' : '');
  const hasImg = !!s.image_b64;

  // 항상 보이는 미리보기 (제목 아래)
  const preview = hasImg ? `
    <div class="subtopic-preview"
         onclick="subClick(event,${s.id})"
         onmousedown="pressStart(${s.id})"
         onmouseup="pressEnd()"
         onmouseleave="pressEnd()"
         ontouchstart="pressStart(${s.id})"
         ontouchend="pressEnd()"
         ontouchcancel="pressEnd()">
      <img src="${escapeHtml(s.image_b64)}" alt="" oncontextmenu="return false">
      ${s.caption ? `<div class="cap">${escapeHtml(s.caption)}</div>` : ''}
    </div>
  ` : '';

  // 펼침 시 본문 (items만)
  let body = '';
  if (opened) {
    const items = state.itemsBySubtopic[s.id];
    if (items === undefined) {
      loadItems(s.id);
      body = '<div class="empty-state">로딩…</div>';
    } else if (items.locked) {
      body = `
        <div class="locked-banner">
          <h4>🔒 구독 후 볼 수 있습니다</h4>
          <button onclick="event.stopPropagation();openPayModal(${items.chapter_id})">구독하기 →</button>
        </div>`;
    } else if (items.error) {
      body = `<div class="empty-state">오류: ${escapeHtml(items.error)}</div>`;
    } else if (!items.length) {
      body = '<div class="empty-state">아직 내용이 없습니다.</div>';
    } else {
      body = items.map(it => renderItem(it)).join('');
    }

    // 미래 박스 인벤토리에서는 능동 회상 흐름 사용 안 함 — 본문 즉시 노출 후
    // 카드 접으면 자동 강등(subClick의 신비로운 dissolve)으로 처리.
    // 능동 회상은 오늘 학습 스테이지(renderFocusCard)에만 적용.
  }

  return `
    <div class="${cls}" data-sub="${s.id}">
      <div class="subtopic-head"
           onclick="subClick(event,${s.id})"
           onmousedown="pressStart(${s.id})"
           onmouseup="pressEnd()"
           onmouseleave="pressEnd()"
           ontouchstart="pressStart(${s.id})"
           ontouchend="pressEnd()"
           ontouchcancel="pressEnd()">
        <div class="subtopic-dot"></div>
        <div class="subtopic-arrow">▶</div>
        ${failedFromMemo ? `<span class="failed-memo-badge" title="다지기에서 다시 보고 싶다고 한 카드">↺</span>` : ''}
        <div class="subtopic-title">${escapeHtml(s.title)}</div>
        ${(() => {
          // 별표 표시: 별표/all 탭 + miss_count > 0 일 때 (다지기에선 카드 색이 이미 정보 전달)
          if (state.memorizedView) return '';
          if (state.normalMode !== 'star' && state.normalMode !== 'all') return '';
          const miss = state.understoodMissCount[Number(s.id)] || 0;
          const stars = missToStarCount(miss);
          if (stars === 0) return '';
          return `<span class="subtopic-stars" title="틀린 횟수 ${miss}회">${'★'.repeat(stars)}</span>`;
        })()}
        ${(() => {
          // 박스 위치 라벨: all 탭에서, understoodSet 카드만 (학습 시작된 것만 박스가 있음)
          if (state.memorizedView) return '';
          if (state.normalMode !== 'all') return '';
          if (!state.understoodSet.has(Number(s.id))) return '';
          const dueDays = dueDaysLeft(state.understoodNextReview[Number(s.id)]);
          const effBox = dueDays <= 0 ? 1 : (Number(state.understoodBox[Number(s.id)]) || 1);
          const lbl = BOX_SHORT_LABELS[effBox] || '?';
          return `<span class="subtopic-box-label box-${effBox}" title="현재 박스 위치">${lbl}</span>`;
        })()}
        ${(/[a-zA-Z]/.test(s.title || '') && !/[가-힯ᄀ-ᇿ㄰-㆏]/.test(s.title || '')) ? `
        <button class="speak-btn"
                onclick="event.stopPropagation();speakText(${JSON.stringify(s.title).replace(/"/g, '&quot;')})"
                onmousedown="event.stopPropagation()"
                ontouchstart="event.stopPropagation()"
                title="발음 듣기">🔊</button>` : ''}
        <div class="subtopic-hint">${opened ? '꾹눌러 ●' : ''}</div>
      </div>
      ${preview}
      <div class="subtopic-body">${body}</div>
    </div>
  `;
}

// ── 발음 재생 (Web Speech API) ─────────────────────────────
// 라틴 문자가 하나라도 있으면 영어로 간주, 아니면 한국어
function detectSpeechLang(text) {
  return /[a-zA-Z]/.test(String(text || '')) ? 'en-US' : 'ko-KR';
}
function speakText(text) {
  if (!('speechSynthesis' in window)) {
    toast('이 브라우저는 음성 재생을 지원하지 않습니다.', true);
    return;
  }
  const t = String(text || '').trim();
  if (!t) return;
  // 진행 중인 발음 중단 → 연속 클릭에도 깔끔하게
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = detectSpeechLang(t);
  u.rate = 0.85;   // 살짝 천천히 — 학습용
  u.pitch = 1.0;
  window.speechSynthesis.speak(u);
}
window.speakText = speakText;

// YouTube URL에서 videoId 추출 — 링크 카드 썸네일용 (embed는 YouTube 정책상 안 함)
function getYouTubeId(url) {
  const patterns = [
    /[?&]v=([a-zA-Z0-9_-]{11})/,
    /youtu\.be\/([a-zA-Z0-9_-]{11})/,
    /youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/,
    /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/,
  ];
  for (const p of patterns) {
    const m = String(url || '').match(p);
    if (m) return m[1];
  }
  return null;
}

// Gumlet 동영상 — iframe embed 허용. URL을 embed 형식으로 정규화.
function getGumletEmbedUrl(url) {
  const s = String(url || '');
  // play.gumlet.io/embed/ID 또는 play.gumlet.io/ID (둘 다 embed로 변환)
  const m = s.match(/play\.gumlet\.io\/(?:embed\/)?([a-zA-Z0-9_-]+)/);
  if (!m) return null;
  return `https://play.gumlet.io/embed/${m[1]}`;
}
// URL에 프로토콜이 없으면 https:// 자동 추가 → 클릭 시 상대 경로로 잘못 가는 것 방지
function normalizeUrl(url) {
  const s = String(url || '').trim();
  if (!s) return '';
  if (/^https?:\/\//i.test(s)) return s;
  if (s.startsWith('//')) return 'https:' + s;
  return 'https://' + s;
}
// 텍스트 안의 URL(http(s)://… 또는 www.…)을 자동으로 클릭 가능한 <a>로 변환
// 텍스트 그대로 박혀있어도 링크가 동작하게 — kind='text' 아이템에도 적용됨
function autolinkText(text) {
  const s = String(text || '');
  const urlRegex = /(https?:\/\/[^\s<>"]+|www\.[^\s<>"]+)/g;
  let result = '';
  let lastIndex = 0;
  let m;
  while ((m = urlRegex.exec(s)) !== null) {
    result += escapeHtml(s.slice(lastIndex, m.index));
    const url = m[0];
    const href = /^https?:\/\//i.test(url) ? url : 'https://' + url;
    result += `<a href="${escapeHtml(href)}" target="_blank" rel="noopener" class="inline-link">${escapeHtml(url)}</a>`;
    lastIndex = m.index + url.length;
  }
  result += escapeHtml(s.slice(lastIndex));
  return result;
}

function renderItem(it) {
  if (it.kind === 'image') {
    const url = unwrapImage(it.image_b64);
    return `
      <div class="item">
        <img class="item-image" src="${escapeHtml(url)}" alt="" oncontextmenu="return false">
        ${it.caption ? `<div class="item-caption">${escapeHtml(it.caption)}</div>` : ''}
      </div>
    `;
  }
  if (it.kind === 'link') {
    const rawUrl = it.text || '';
    const url = normalizeUrl(rawUrl); // http(s):// 없으면 자동 추가
    // Gumlet만 iframe embed (YouTube는 정책상 링크로)
    const gumletUrl = getGumletEmbedUrl(url);
    if (gumletUrl) {
      return `
        <div class="item">
          <div class="video-embed">
            <iframe src="${gumletUrl}" frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen></iframe>
          </div>
          ${it.caption ? `<div class="item-caption">${escapeHtml(it.caption)}</div>` : ''}
        </div>
      `;
    }
    // YouTube → 링크 카드 + 썸네일
    const ytId = getYouTubeId(url);
    if (ytId) {
      return `
        <div class="item">
          <a href="${escapeHtml(url)}" target="_blank" rel="noopener" class="link-card link-card-yt">
            <img class="link-thumb" src="https://img.youtube.com/vi/${ytId}/mqdefault.jpg" alt="">
            <div class="link-body">
              <div class="link-title">${escapeHtml(it.caption || 'YouTube에서 보기')}</div>
              <div class="link-url">▶ ${escapeHtml(url)}</div>
            </div>
          </a>
        </div>
      `;
    }
    // 일반 URL → 링크 카드 + 🔗
    return `
      <div class="item">
        <a href="${escapeHtml(url)}" target="_blank" rel="noopener" class="link-card">
          <div class="link-icon">🔗</div>
          <div class="link-body">
            <div class="link-title">${escapeHtml(it.caption || rawUrl)}</div>
            ${it.caption ? `<div class="link-url">${escapeHtml(rawUrl)}</div>` : ''}
          </div>
        </a>
      </div>
    `;
  }
  return `
    <div class="item">
      <div class="item-text">${autolinkText(it.text)}</div>
      ${it.caption ? `<div class="item-caption">${escapeHtml(it.caption)}</div>` : ''}
    </div>
  `;
}

// ───── 학습 컨트롤 — 플래시카드 스타일 ─────
// 패스 상태 영구 저장 (챕터 단위) — 새로고침·재진입 후에도 마지막 위치 유지
function passKey(cid) { return 'op_passed_' + cid; }
function savePassed() {
  if (!state.currentChapter) return;
  try {
    localStorage.setItem(passKey(state.currentChapter.id), JSON.stringify([...state.passedSet]));
  } catch {}
}
function loadPassed(chapterId) {
  try {
    const raw = localStorage.getItem(passKey(chapterId));
    state.passedSet = new Set(raw ? JSON.parse(raw).map(Number) : []);
  } catch { state.passedSet = new Set(); }
}

// 목차 헤더의 화면 Y 위치를 고정한 채 렌더링 (스크롤 보정)
// → 패스/완료 누를 때 위쪽 콘텐츠가 흔들리지 않고 헤더가 같은 자리에 머무름
function withTopicAnchor(topicId, callback) {
  const sel = `[data-topic="${topicId}"] > .topic-head`;
  const headEl = document.querySelector(sel);
  const beforeY = headEl ? headEl.getBoundingClientRect().top : null;
  callback();
  if (beforeY == null) return;
  // 즉시 1회 보정 + 다음 frame에 한 번 더 (브라우저 auto-scroll 대응)
  const adjust = () => {
    const newHead = document.querySelector(sel);
    if (!newHead) return;
    const afterY = newHead.getBoundingClientRect().top;
    const delta = afterY - beforeY;
    if (Math.abs(delta) > 1) window.scrollBy(0, delta);
  };
  adjust();
  requestAnimationFrame(adjust);
}

// 패스 — 모드별로 다르게 동작:
//   new: 펼쳤으면 box=1 강등(miss=1) / 안 펼쳤으면 box=2 진입
//   별표/all: 서버 변화 없음 (펼침은 peek에서 이미 처리). 화면에서만 다음 카드로
//   다지기 오늘/내일/4/8/16/32: was_peeked 기준 advance/강등/유지
function studyPass(subId, topicId) {
  const wasOpened = state.everExpandedSet.has(Number(subId));
  state.passedSet.add(Number(subId));
  state.expanded.subtopic.delete(Number(subId));
  const sameTopicSubs = state.subtopicsByTopic[topicId] || [];
  for (const s of sameTopicSubs) state.expanded.subtopic.delete(Number(s.id));
  savePassed();

  // v2: 별표/all 탭은 서버 변화 없음. new 또는 다지기에서만 서버 호출.
  // 다지기 모드는 memorizedView 분기로 별도 처리 (memorizedPass)
  const skipServer = !state.memorizedView && (state.normalMode === 'star' || state.normalMode === 'all');
  if (!skipServer) {
    apiPass(Number(subId), wasOpened);
  }

  // ● 카드는 챕터 뷰에서 안 보이므로 미암기 기준으로 "다 패스했나" 판정
  const subs = state.subtopicsByTopic[topicId] || [];
  const unmastered = subs.filter(s => !state.understoodSet.has(Number(s.id)));
  const stillVisible = unmastered.filter(s => !state.passedSet.has(Number(s.id)));

  if (stillVisible.length === 0) {
    // 미암기 0개면 (모두 ●) 빈 상태 안내가 그 자리를 채움 — celebrate 호출 안 함
    if (unmastered.length === 0) {
      withTopicAnchor(topicId, () => {
        if (state.currentChapter) renderTree(state.currentChapter.id);
      });
      return;
    }
    celebrateAndReset(topicId);
    return;
  }

  // 일반 패스 — 헤더 위치 고정한 채 렌더
  withTopicAnchor(topicId, () => {
    if (state.currentChapter) renderTree(state.currentChapter.id);
  });
}

// 모두 패스 시 축하 폭죽 → 패스 자동 초기화 → 처음부터 다시 시작
function celebrateAndReset(topicId) {
  showCelebration();
  setTimeout(() => {
    const subs = state.subtopicsByTopic[topicId] || [];
    for (const s of subs) state.passedSet.delete(Number(s.id));
    savePassed();
    if (state.currentChapter) renderTree(state.currentChapter.id);
  }, 2200);
}
