<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="원페이지 학습">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8a9e"/>
      <stop offset="100%" stop-color="#e94560"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- 배경 라운드 사각형 -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  <!-- 글로우 라인 (페이지 아랫줄 강조) -->
  <rect x="64" y="396" width="384" height="6" rx="3" fill="url(#dot)" opacity="0.85" filter="url(#glow)"/>
  <!-- 큰 숫자 "1" — 원페이지의 1 -->
  <text x="200" y="370"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif"
        font-size="380" font-weight="900" text-anchor="middle" fill="#ffffff"
        letter-spacing="-12">1</text>
  <!-- 다지기 ● 액센트 -->
  <circle cx="370" cy="160" r="48" fill="url(#dot)" filter="url(#glow)"/>
  <circle cx="370" cy="160" r="48" fill="url(#dot)"/>
</svg>
