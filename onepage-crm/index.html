<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OnePage CRM</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', sans-serif; background: #0a0a1a; color: #e5e7eb; }
body { line-height: 1.5; -webkit-text-size-adjust: 100%; }
button { font: inherit; cursor: pointer; border: none; color: inherit; }
input, textarea, select { font: inherit; outline: none; color: #fff; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 8px 12px; }
input:focus, textarea:focus, select:focus { border-color: #e94560; }
a { color: #4fc3f7; text-decoration: none; }
table { border-collapse: collapse; width: 100%; }

/* ── 로그인 ── */
#loginScreen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
.login-card {
  width: 100%; max-width: 380px;
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  border: 1px solid #2a2a4e; border-radius: 18px;
  padding: 30px 26px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}
.login-card h1 { font-size: 1.6em; font-weight: 800; text-align: center; margin-bottom: 4px; color: #fff; }
.login-card .sub { text-align: center; font-size: 13px; color: rgba(255,255,255,0.5); margin-bottom: 22px; }
.login-card label { display: block; font-size: 12px; color: rgba(255,255,255,0.6); margin-bottom: 4px; margin-top: 12px; }
.login-card input { width: 100%; }
.login-card .err { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.4); color: #fca5a5; padding: 9px 12px; border-radius: 8px; font-size: 13px; margin-top: 14px; display: none; }
.login-card button { width: 100%; margin-top: 18px; padding: 12px; background: linear-gradient(135deg, #e94560, #ff6b6b); color: #fff; font-weight: 700; border-radius: 8px; }
.login-card button:disabled { opacity: 0.5; cursor: wait; }

/* ── 헤더 ── */
.app-header {
  display: flex; align-items: center; gap: 14px; padding: 12px 20px;
  background: rgba(10,10,26,0.94); backdrop-filter: blur(12px);
  border-bottom: 1px solid #1f1f3a;
  position: sticky; top: 0; z-index: 20;
}
.brand { font-weight: 800; font-size: 17px; color: #fff; letter-spacing: -0.02em; }
.brand em { font-style: normal; background: linear-gradient(135deg, #ffb74d, #e94560); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand-sub { font-size: 11px; color: rgba(255,255,255,0.45); margin-left: 8px; font-weight: 600; }
.user-chip {
  margin-left: auto; display: flex; align-items: center; gap: 10px;
  font-size: 13px; color: rgba(255,255,255,0.7);
}
.user-chip .role { background: rgba(255,193,7,0.2); color: #ffd54f; font-size: 10px; padding: 2px 8px; border-radius: 50px; font-weight: 700; }
.icon-btn { background: rgba(255,255,255,0.06); color: #ddd; padding: 7px 12px; border-radius: 8px; font-size: 12px; }
.icon-btn:hover { background: rgba(255,255,255,0.12); }

/* ── 탭 ── */
.tab-bar {
  display: flex; gap: 2px; padding: 0 20px;
  background: rgba(10,10,26,0.9); border-bottom: 1px solid #1f1f3a;
  position: sticky; top: 53px; z-index: 19;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.tab-btn {
  background: transparent; color: rgba(255,255,255,0.55);
  padding: 13px 18px; font-size: 14px; font-weight: 600;
  border-bottom: 2px solid transparent; white-space: nowrap;
  transition: color 0.15s, border-color 0.15s;
}
.tab-btn:hover { color: #fff; }
.tab-btn.active { color: #fff; border-bottom-color: #e94560; }

/* ── 메인 ── */
.app-main { max-width: 1400px; margin: 0 auto; padding: 22px; }
.tab-pane { display: none; }
.tab-pane.active { display: block; animation: fadeIn 0.2s; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

.loading { text-align: center; padding: 50px; color: rgba(255,255,255,0.5); font-size: 14px; }
.empty-state { text-align: center; padding: 36px 20px; color: rgba(255,255,255,0.4); font-size: 13px; }
.err-box { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.35); color: #fca5a5; padding: 12px 16px; border-radius: 10px; margin: 16px 0; font-size: 13px; }

/* ── KPI 카드 ── */
.kpi-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 14px; margin-bottom: 28px;
}
.kpi-card {
  background: linear-gradient(135deg, #161628, #1a1a2e);
  border: 1px solid rgba(255,255,255,0.08); border-radius: 14px;
  padding: 18px 20px; position: relative; overflow: hidden;
}
.kpi-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--kpi-color, #4fc3f7), transparent 60%);
}
.kpi-card .label { font-size: 12px; color: rgba(255,255,255,0.55); font-weight: 600; }
.kpi-card .value {
  font-size: 28px; font-weight: 900; color: #fff; margin-top: 6px;
  font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
}
.kpi-card .value .unit { font-size: 13px; color: rgba(255,255,255,0.5); margin-left: 3px; font-weight: 700; }
.kpi-card .desc { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 6px; }
.kpi-card.green { --kpi-color: #81c784; }
.kpi-card.orange { --kpi-color: #ffb74d; }
.kpi-card.blue { --kpi-color: #4fc3f7; }
.kpi-card.purple { --kpi-color: #ce93d8; }
.kpi-card.red { --kpi-color: #ef9a9a; }
.kpi-card.gold { --kpi-color: #ffd54f; }

/* ── 섹션 ── */
.section {
  background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06);
  border-radius: 14px; padding: 18px 20px; margin-bottom: 18px;
}
.section-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 10px; flex-wrap: wrap; }
.section-h h3 { font-size: 15px; font-weight: 700; color: #fff; }
.section-h .meta { font-size: 12px; color: rgba(255,255,255,0.45); }

/* ── 테이블 ── */
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -6px; }
.tbl {
  width: 100%; font-size: 13px; min-width: 600px;
}
.tbl th, .tbl td {
  padding: 10px 12px; text-align: left;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  vertical-align: middle;
}
.tbl th {
  font-weight: 700; font-size: 11px; color: rgba(255,255,255,0.5);
  text-transform: uppercase; letter-spacing: 0.04em;
  position: sticky; top: 0; background: #0a0a1a; z-index: 2;
}
.tbl tbody tr { cursor: pointer; transition: background 0.1s; }
.tbl tbody tr:hover { background: rgba(255,255,255,0.03); }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl td.muted { color: rgba(255,255,255,0.45); }
.tbl td .pill {
  display: inline-block; font-size: 10px; padding: 2px 7px;
  border-radius: 50px; font-weight: 700; vertical-align: middle;
}
.pill.active { background: rgba(76,175,80,0.2); color: #81c784; }
.pill.expired { background: rgba(239,68,68,0.18); color: #fca5a5; }
.pill.free { background: rgba(79,195,247,0.18); color: #81d4fa; }
.pill.teacher { background: rgba(255,193,7,0.2); color: #ffd54f; }
.pill.never { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.5); }
.pill.warn { background: rgba(255,138,0,0.2); color: #ffb74d; }

/* ── 필터 바 ── */
.filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
.filter-bar input[type=search] { flex: 1; min-width: 200px; max-width: 380px; }
.chip {
  background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.7);
  padding: 6px 12px; border-radius: 50px; font-size: 12px; font-weight: 600;
  border: 1px solid transparent; transition: all 0.15s;
}
.chip:hover { background: rgba(255,255,255,0.1); }
.chip.on { background: rgba(233,69,96,0.18); color: #ff8fa3; border-color: rgba(233,69,96,0.4); }

/* ── 버튼 ── */
.btn-primary { background: linear-gradient(135deg, #e94560, #ff6b6b); color: #fff; padding: 9px 16px; border-radius: 8px; font-weight: 700; font-size: 13px; }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-sec { background: rgba(255,255,255,0.08); color: #ddd; padding: 7px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; }
.btn-sec:hover { background: rgba(255,255,255,0.14); }
.btn-warn { background: rgba(255,193,7,0.18); color: #ffd54f; padding: 6px 11px; border-radius: 6px; font-size: 12px; font-weight: 700; border: 1px solid rgba(255,193,7,0.3); }
.btn-warn:hover { background: rgba(255,193,7,0.28); }
.btn-blue { background: rgba(79,195,247,0.18); color: #81d4fa; padding: 6px 11px; border-radius: 6px; font-size: 12px; font-weight: 700; border: 1px solid rgba(79,195,247,0.3); }
.btn-blue:hover { background: rgba(79,195,247,0.28); }

/* ── 차트 (CSS bar) ── */
.bar-chart {
  display: flex; align-items: flex-end; gap: 2px; height: 200px;
  padding: 0 4px; margin-top: 8px; border-bottom: 1px solid rgba(255,255,255,0.08);
}
.bar {
  flex: 1; background: linear-gradient(180deg, #e94560 0%, #ff6b6b 100%);
  border-radius: 3px 3px 0 0; min-height: 2px;
  position: relative; transition: background 0.15s;
  cursor: pointer;
}
.bar:hover { background: linear-gradient(180deg, #ffd54f 0%, #ffb74d 100%); }
.bar.zero { background: rgba(255,255,255,0.06); }
.bar-tooltip {
  display: none; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
  background: #16213e; color: #fff; padding: 5px 8px; border-radius: 4px;
  font-size: 11px; white-space: nowrap; margin-bottom: 4px; z-index: 5;
  border: 1px solid #2a2a4e;
}
.bar:hover .bar-tooltip { display: block; }
.chart-axis {
  display: flex; gap: 2px; padding: 4px 4px 0; font-size: 10px;
  color: rgba(255,255,255,0.4); justify-content: space-between;
}

/* ── 모달 ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.75);
  display: none; align-items: flex-start; justify-content: center;
  padding: 30px 16px; z-index: 100; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.modal-overlay.open { display: flex; }
.modal {
  background: #131329; border: 1px solid #2a2a4e; border-radius: 16px;
  width: 100%; max-width: 720px; padding: 20px 22px;
  box-shadow: 0 24px 80px rgba(0,0,0,0.6);
}
.modal.wide { max-width: 980px; }
.modal-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 10px; }
.modal-h h2 { font-size: 17px; font-weight: 800; color: #fff; }
.modal-h .close-x {
  background: rgba(255,255,255,0.06); border-radius: 50%;
  width: 30px; height: 30px; font-size: 16px; color: #ddd;
}
.modal-foot {
  margin-top: 18px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.06);
  display: flex; gap: 8px; justify-content: flex-end;
}

/* 사용자 상세 모달 */
.detail-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 10px; margin-bottom: 18px;
}
.detail-cell {
  background: rgba(255,255,255,0.04); border-radius: 10px; padding: 10px 12px;
}
.detail-cell .lbl { font-size: 10px; color: rgba(255,255,255,0.5); text-transform: uppercase; font-weight: 700; letter-spacing: 0.04em; }
.detail-cell .val { font-size: 14px; color: #fff; margin-top: 3px; font-weight: 600; word-break: break-all; }

.detail-sec {
  margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.06);
}
.detail-sec h4 { font-size: 13px; font-weight: 700; color: #ffb74d; margin-bottom: 8px; }
.detail-sec .scroll { max-height: 230px; overflow-y: auto; }

/* 폼 */
.form-row { margin-bottom: 12px; }
.form-row label { display: block; font-size: 12px; color: rgba(255,255,255,0.6); margin-bottom: 4px; font-weight: 600; }
.form-row input, .form-row select, .form-row textarea { width: 100%; }
.form-row textarea { min-height: 80px; resize: vertical; font-family: inherit; }
.form-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-hint { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 4px; }

/* 토스트 */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: #16213e; color: #fff; padding: 11px 18px; border-radius: 10px;
  font-size: 13px; font-weight: 600; opacity: 0; transition: opacity 0.2s, transform 0.2s;
  z-index: 999; border: 1px solid #2a2a4e; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.err { border-color: rgba(239,68,68,0.6); }
.toast.ok { border-color: rgba(76,175,80,0.6); }

/* 매출 차트 그리드 */
.split-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; }
@media (max-width: 900px) {
  .split-2 { grid-template-columns: 1fr; }
}

/* 콘텐츠 차트 */
.ch-card {
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px; padding: 14px 16px; margin-bottom: 10px;
  display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center;
}
.ch-card .ch-icon { font-size: 28px; }
.ch-card .ch-info .ch-title { font-size: 14px; font-weight: 700; color: #fff; }
.ch-card .ch-info .ch-meta { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 2px; }
.ch-card .ch-info .ch-warn { font-size: 11px; color: #ffb74d; margin-top: 4px; }
.ch-card .ch-stats { display: flex; gap: 14px; text-align: right; }
.ch-card .ch-stats .stat { min-width: 70px; }
.ch-card .ch-stats .stat-v { font-size: 17px; font-weight: 800; color: #fff; }
.ch-card .ch-stats .stat-l { font-size: 10px; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.04em; }

/* 캠페인 */
.campaign-presets {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; margin-bottom: 14px;
}
.preset-btn {
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px; padding: 12px 14px; text-align: left;
  transition: all 0.15s;
}
.preset-btn:hover { background: rgba(255,255,255,0.08); border-color: rgba(233,69,96,0.4); }
.preset-btn.on { background: rgba(233,69,96,0.15); border-color: rgba(233,69,96,0.5); }
.preset-btn .ptitle { font-size: 13px; font-weight: 700; color: #fff; margin-bottom: 2px; }
.preset-btn .pdesc { font-size: 11px; color: rgba(255,255,255,0.5); }
.preset-btn .pcount { font-size: 10px; color: #ffb74d; margin-top: 4px; font-weight: 700; }

.selected-summary {
  background: rgba(79,195,247,0.08); border: 1px solid rgba(79,195,247,0.3);
  border-radius: 10px; padding: 10px 14px; margin-bottom: 14px;
  font-size: 13px; color: #81d4fa;
}

@media (max-width: 600px) {
  .app-main { padding: 14px 10px; }
  .section { padding: 14px 12px; }
  .kpi-card { padding: 14px 16px; }
  .kpi-card .value { font-size: 22px; }
  .tab-btn { padding: 11px 14px; font-size: 13px; }
}

/* QR 빌더 */
.qr-builder { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: start; }
@media (max-width: 760px) { .qr-builder { grid-template-columns: 1fr; } }
.qr-preview {
  width: 280px; padding: 18px; background: #fff; border-radius: 14px;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
}
.qr-preview canvas, .qr-preview img { width: 240px; height: 240px; image-rendering: pixelated; }
.qr-preview .qr-label { font-size: 13px; font-weight: 700; color: #111; text-align: center; word-break: keep-all; }
.qr-preview .qr-sub { font-size: 10px; color: #666; }
.qr-actions { display: flex; gap: 6px; margin-top: 4px; }
.qr-actions button {
  background: #16213e; color: #fff; padding: 6px 12px; border-radius: 6px;
  font-size: 12px; font-weight: 700;
}
.url-display {
  background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px; padding: 10px 12px; font-family: monospace;
  font-size: 12px; color: #81d4fa; word-break: break-all; margin-top: 6px;
}
/* 관심 주제 체크박스 그리드 — QR URL에 ?interest=A&interest=B 자동 추가 */
.qr-interests-box {
  background: rgba(79,195,247,0.06);
  border: 1px solid rgba(79,195,247,0.20);
  border-radius: 10px;
  padding: 12px 14px;
  margin-top: 6px;
}
.qr-interests-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; margin-bottom: 8px;
}
.qr-interests-head .label {
  font-size: 13px; font-weight: 700; color: #fff;
}
.qr-interests-head .clear-btn {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.75);
  font-size: 11px; padding: 4px 10px; border-radius: 6px;
  cursor: pointer;
}
.qr-interests-head .clear-btn:hover { background: rgba(255,255,255,0.14); }
.qr-interests-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 6px;
}
.qr-interests-grid label {
  display: flex; align-items: center; gap: 6px;
  font-size: 12.5px; color: rgba(255,255,255,0.82);
  cursor: pointer;
  padding: 5px 8px; border-radius: 6px;
  transition: background 0.12s ease;
}
.qr-interests-grid label:hover { background: rgba(255,255,255,0.04); }
.qr-interests-grid input[type="checkbox"] { width: 14px; height: 14px; cursor: pointer; flex-shrink: 0; }
.qr-interests-grid input:checked + span { color: #4fc3f7; font-weight: 700; }
.qr-interests-empty {
  font-size: 12px; color: rgba(255,255,255,0.4);
  padding: 8px 0; text-align: center;
}
/* ── 전단지 생성기 ──────────────────────────────────────── */
.flyer-wrap { display: grid; grid-template-columns: minmax(0,1fr) 380px; gap: 18px; align-items: start; }
@media (max-width: 980px) { .flyer-wrap { grid-template-columns: 1fr; } }
.flyer-stage {
  background: #2a2f3a; border-radius: 12px; padding: 16px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  position: sticky; top: 12px;
}
.flyer-toolbar { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; width: 100%; }
.flyer-toolbar button, .flyer-size-sel {
  background: rgba(255,255,255,0.08); color: #e8e8ee; border: 1px solid rgba(255,255,255,0.12);
  padding: 7px 11px; border-radius: 7px; font-size: 12.5px; font-weight: 600; cursor: pointer;
}
.flyer-toolbar button:hover { background: rgba(255,255,255,0.15); }
.flyer-toolbar button.primary { background: linear-gradient(135deg,#e94560,#ff6b6b); border-color: transparent; color:#fff; }
.flyer-preview-scroll { width: 100%; overflow: auto; display: flex; justify-content: center; }
.flyer-scaler { transform-origin: top center; }
.flyer-scaler iframe { border: 0; background: #fff; box-shadow: 0 10px 40px rgba(0,0,0,0.5); display: block; }

.flyer-panel { background: #2a2f3a; border-radius: 12px; padding: 16px; }
.flyer-panel h3 { font-size: 14px; margin: 0 0 4px; color: #fff; }
.flyer-panel .hint { font-size: 11.5px; color: rgba(255,255,255,0.45); margin: 0 0 12px; line-height: 1.5; }
.flyer-acc { border: 1px solid rgba(255,255,255,0.1); border-radius: 9px; margin-bottom: 10px; overflow: hidden; }
.flyer-acc > summary {
  list-style: none; cursor: pointer; padding: 11px 13px; font-size: 13px; font-weight: 700; color: #e8e8ee;
  background: rgba(255,255,255,0.04); display: flex; align-items: center; gap: 7px;
}
.flyer-acc > summary::-webkit-details-marker { display: none; }
.flyer-acc > summary::before { content: '▸'; color: #ff8a9e; transition: transform .15s; }
.flyer-acc[open] > summary::before { transform: rotate(90deg); }
.flyer-acc-body { padding: 12px 13px; }
.flyer-field { margin-bottom: 11px; }
.flyer-field label { display: block; font-size: 11px; font-weight: 700; color: #9fa6b8; margin-bottom: 4px; text-transform: uppercase; letter-spacing: .03em; }

}
</style>
</head>

<div id="loginScreen">
  <div class="login-card">

          <option value="adopted">채택</option><option value="rejected">반려</option><option value="answered">답변완료</option>

<!-- 모달 -->

  <div class="modal" id="modalInner"></div>

<div class="toast" id="toast"></div>

<!-- QR 코드 생성 라이브러리 (CDN, 동기식) -->
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>
const API = 'https://onepage-api.memoryking.workers.dev';
const TOKEN_KEY = 'op_crm_token';
const KST_OFFSET_MS = 9 * 60 * 60 * 1000;
const KST_TZ = 'Asia/Seoul';
const LANDING_BASE_URL = 'https://memoryking.kr';              // QR이 가리키는 랜딩 URL

// ============================================================
// 상태
// ============================================================
const state = {
  user: null,
  token: localStorage.getItem(TOKEN_KEY) || '',
  currentTab: 'dashboard',
  // dashboard
  overview: null,
  // users
  users: [],
  userFilter: 'all',
  userQuery: '',
  selectedPhones: new Set(),
  // revenue
  revenueDays: 30,
  revenue: null,
  // content
  contentStats: null,
  chapters: [],   // 권한 지급 모달의 챕터 선택용 (CRM 진입 시 미리 로드)
  // campaigns
  campaign: { template: 'custom', phones: [], message: '', subject: '', channel: 'sms' },
  campaignDays: 30,
  campaignStats: null,
  conversionWindow: 7,
  campaignConversion: null,
  // attribution
  attribution: null,
  attrDays: 90,
  qrBuilder: { source: 'flyer', medium: 'qr', campaign: '', content: '', term: '', interests: [] },
  savedCampaigns: [],   // 서버에서 로드 (Airtable OnepageCampaigns)
  savedLoaded: false,
};

// ============================================================
// 유틸
// ============================================================
function $(id) { return document.getElementById(id); }
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function fmtWon(n) { return (Number(n)||0).toLocaleString('ko-KR') + '원'; }
function fmtNum(n) { return (Number(n)||0).toLocaleString('ko-KR'); }
function fmtKst(iso, opts) {
  if (!iso) return '—';
  // 서버는 KST wall-clock을 UTC 표기로 저장 → 9시간 빼서 실제 UTC 복원 후 Asia/Seoul 표기
  const realMs = new Date(iso).getTime() - KST_OFFSET_MS;
  if (isNaN(realMs)) return '—';
  const d = new Date(realMs);
  return d.toLocaleString('ko-KR', Object.assign({
    timeZone: KST_TZ,
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit',
  }, opts || {}));
}
function fmtKstDate(iso) { return fmtKst(iso, { hour: undefined, minute: undefined }); }
function daysUntil(iso) {
  if (!iso) return null;
  const nowKstMs = Date.now() + KST_OFFSET_MS;
  const expMs = new Date(iso).getTime();
  return Math.ceil((expMs - nowKstMs) / (1000 * 60 * 60 * 24));
}
function toast(msg, kind) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (kind === 'err' ? ' err' : kind === 'ok' ? ' ok' : '');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.className = 'toast', 2400);
}

async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (state.token) opts.headers.Authorization = 'Bearer ' + state.token;
  if (body !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const r = await fetch(API + path, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) {
    const err = new Error(j.message || j.error || ('HTTP ' + r.status));
    err.status = r.status;
    err.data = j;
    throw err;
  }
  return j;
}

// ============================================================
// 인증
// ============================================================
async function tryAutoLogin() {
  if (!state.token) { showLogin(); return; }
  try {
    const r = await api('GET', '/auth/me');
    if (r.user && r.user.role === 'teacher') {
      state.user = r.user;
      showApp();
    } else {
      toast('관리자(teacher) 권한이 필요합니다', 'err');
      logout();
    }
  } catch (e) {
    logout();
  }
}
function showLogin() {
  $('loginScreen').style.display = 'flex';
  $('appShell').style.display = 'none';
}
function showApp() {
  $('loginScreen').style.display = 'none';
  $('appShell').style.display = 'block';
  $('userName').textContent = state.user.name || state.user.email || '';
  // 챕터 목록 미리 로드 (권한 지급 모달의 선택지로 사용)
  api('GET', '/chapters').then(r => { state.chapters = r.chapters || []; }).catch(() => {});
  loadDashboard();
}
async function doLogin() {
  const email = $('loginEmail').value.trim();
  const password = $('loginPwd').value;
  const errEl = $('loginErr');
  errEl.style.display = 'none';
  const btn = $('loginBtn');
  btn.disabled = true; btn.textContent = '로그인 중…';
  try {
    const r = await api('POST', '/auth/login', { email, password });
    if (!r.user || r.user.role !== 'teacher') {
      throw new Error('관리자(teacher) 권한이 없는 계정입니다');
    }
    state.token = r.token; localStorage.setItem(TOKEN_KEY, r.token);
    state.user = r.user;
    showApp();
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = '로그인';
  }
}
function logout() {
  state.token = ''; state.user = null;
  localStorage.removeItem(TOKEN_KEY);
  showLogin();
}
$('loginBtn').onclick = doLogin;
$('loginPwd').onkeydown = e => { if (e.key === 'Enter') doLogin(); };

// ============================================================
// 탭
// ============================================================
function switchTab(tab) {
  state.currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  $('tab' + tab[0].toUpperCase() + tab.slice(1)).classList.add('active');
  if (tab === 'dashboard') loadDashboard();
  else if (tab === 'users') loadUsers();
  else if (tab === 'revenue') loadRevenue();
  else if (tab === 'content') loadContent();
  else if (tab === 'campaigns') renderCampaigns();
  else if (tab === 'attribution') loadAttribution();
  else if (tab === 'routine') loadRoutine();
  else if (tab === 'reports') loadReports();
  else if (tab === 'reviews') loadReviews();
  else if (tab === 'flyer') initFlyer();
}

// ============================================================
// 대시보드
// ============================================================
async function loadDashboard() {
  $('dashboardBody').innerHTML = '<div class="loading">집계 중…</div>';
  try {
    const r = await api('GET', '/admin/overview');
    state.overview = r;
    renderDashboard();
  } catch (e) {
    $('dashboardBody').innerHTML = `<div class="err-box">대시보드 로드 실패: ${escapeHtml(e.message)}</div>`;
  }
}
function renderDashboard() {
  const o = state.overview; if (!o) return;
  const kpis = `
    <div class="kpi-grid">
      <div class="kpi-card gold">
        <div class="label">💰 오늘 매출</div>
        <div class="value">${fmtNum(o.today_revenue)}<span class="unit">원</span></div>
        <div class="desc">KST ${new Date().toLocaleDateString('ko-KR')} 기준</div>
      </div>
      <div class="kpi-card green">
        <div class="label">📅 이번 달 매출</div>
        <div class="value">${fmtNum(o.month_revenue)}<span class="unit">원</span></div>
        <div class="desc">누적 ${fmtNum(o.total_revenue)}원</div>
      </div>
      <div class="kpi-card blue">

async function loadUsers() {
  if (state.users.length === 0) {
    $('usersBody').innerHTML = '<div class="loading">집계 중…</div>';
  }
  try {
    const r = await api('GET', '/admin/users');
    state.users = r.users || [];
    renderUsers();
  } catch (e) {
    $('usersBody').innerHTML = `<div class="err-box">사용자 로드 실패: ${escapeHtml(e.message)}</div>`;
  }
}
function setUserFilter(f) {
  state.userFilter = f;
  document.querySelectorAll('#tabUsers .chip').forEach(c => c.classList.toggle('on', c.dataset.filter === f));
  renderUsers();
}
function filteredUsers() {
  const q = state.userQuery.trim().toLowerCase();
  const now = Date.now() + KST_OFFSET_MS;
  const weekMs = 7 * 86400 * 1000;
  return state.users.filter(u => {
    if (q) {
      const blob = (u.name + u.phone + u.email).toLowerCase();
      if (!blob.includes(q)) return false;
    }
    switch (state.userFilter) {
      case 'active': return u.active_chapters.length > 0;
      case 'expiring':
        return u.active_chapters.some(c => {
          const exp = new Date(c.expires_at).getTime();
          return exp - now <= weekMs && exp > now;
        });
      case 'lapsed':
        return u.active_chapters.length === 0 && u.expired_chapters.length > 0;
      case 'never':
        return u.role !== 'teacher' && u.payment_count === 0;
      case 'hivalue':
        return u.total_spent >= 50000;
      default: return true;
    }
  });
}
function renderUsers() {
  const list = filteredUsers();
  const rows = list.map(u => {
    let statusPill = '';
    if (u.role === 'teacher') statusPill = '<span class="pill teacher">🛠 관리자</span>';
    else if (u.active_chapters.length > 0) {
      const earliest = u.active_chapters.reduce((m, c) => !m || c.expires_at < m ? c.expires_at : m, '');
      const d = daysUntil(earliest);
      statusPill = d <= 7
        ? `<span class="pill warn">⏰ D-${d}</span>`
        : `<span class="pill active">✓ 활성 ${u.active_chapters.length}</span>`;
    } else if (u.expired_chapters.length > 0) {
      statusPill = '<span class="pill expired">만료</span>';
    } else {
      statusPill = '<span class="pill never">미결제</span>';
    }
    const selected = state.selectedPhones.has(u.phone);
    return `
      <tr>
        <td onclick="event.stopPropagation();toggleSelectUser('${escapeHtml(u.phone)}')" style="text-align:center">
          <input type="checkbox" ${selected ? 'checked' : ''} onclick="toggleSelectUser('${escapeHtml(u.phone)}');event.stopPropagation()">
        </td>
        <td onclick="openUserDetail('${escapeHtml(u.phone)}')">${escapeHtml(u.name || '—')}</td>
        <td onclick="openUserDetail('${escapeHtml(u.phone)}')" class="muted">${escapeHtml(u.phone)}</td>
        <td onclick="openUserDetail('${escapeHtml(u.phone)}')">${statusPill}</td>
        <td onclick="openUserDetail('${escapeHtml(u.phone)}')" class="num" style="color:#81c784;font-weight:700">${fmtWon(u.total_spent)}</td>
        <td onclick="openUserDetail('${escapeHtml(u.phone)}')" class="num" style="color:#ffd54f;font-weight:600">${fmtNum(u.point)}P</td>
        <td onclick="openUserDetail('${escapeHtml(u.phone)}')" class="muted">${u.last_ping_at || '—'}</td>
        <td onclick="openUserDetail('${escapeHtml(u.phone)}')" class="muted">${fmtKstDate(u.joined_at)}</td>
        <td style="white-space:nowrap">
          <button class="btn-blue" onclick="event.stopPropagation();openGrantPoints('${escapeHtml(u.phone)}','${escapeHtml(u.name)}')">+P</button>
          <button class="btn-warn" onclick="event.stopPropagation();campaignSinglePhone('${escapeHtml(u.phone)}')">📤</button>
        </td>
      </tr>
    `;
  }).join('') || '<tr><td colspan="9" class="empty-state">조건에 맞는 사용자 없음</td></tr>';

  $('usersBody').innerHTML = `
    <div class="section">
      <div class="section-h">
        <h3>👥 사용자 — ${list.length}명 표시 (전체 ${state.users.length}명)</h3>
        <div>
          ${state.selectedPhones.size > 0 ? `
            <span style="color:#81d4fa;font-size:12px;margin-right:8px">${state.selectedPhones.size}명 선택</span>
            <button class="btn-warn" onclick="campaignFromSelected()">📤 선택한 사용자에 발송</button>
            <button class="btn-sec" onclick="clearSelection()">선택 해제</button>
          ` : `<button class="btn-sec" onclick="selectAllFiltered()">현재 결과 모두 선택</button>`}
        </div>
      </div>
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr>
          <th style="width:30px"></th>
          <th>이름</th><th>전화</th><th>상태</th>
          <th class="num">누적</th><th class="num">포인트</th>
          <th>최근 학습</th><th>가입</th><th>액션</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>
  `;
}
$('userSearch').oninput = e => { state.userQuery = e.target.value; renderUsers(); };
function toggleSelectUser(phone) {
  if (state.selectedPhones.has(phone)) state.selectedPhones.delete(phone);
  else state.selectedPhones.add(phone);
  renderUsers();
}
function clearSelection() {
  state.selectedPhones.clear();
  renderUsers();
}
function selectAllFiltered() {
  for (const u of filteredUsers()) state.selectedPhones.add(u.phone);
  renderUsers();
}

// 회원 완전 삭제 — 휴대폰 번호 재입력 + 연관 데이터 일괄 삭제
async function confirmDeleteUser(phone, name) {
  const entered = prompt(
    `⚠️ ${name} 님 (${phone}) 을(를) 완전히 삭제합니다.\n\n` +
    `삭제되는 데이터:\n` +
    `· 사용자 본인 정보 (Airtable)\n` +
    `· 챕터 구독·결제·포인트 이력 (Airtable)\n` +
    `· 마케팅 발송 이력 (Airtable)\n` +
    `· 학습 진도(꾹누른 표시)·실시간 핑 (nocodebackend)\n\n` +
    `되돌릴 수 없습니다.\n\n` +
    `확인을 위해 휴대폰 번호를 그대로 입력하세요:`
  );
  if (entered === null) return; // 취소
  const normalized = String(entered).replace(/\D/g, '');
  if (normalized !== String(phone).replace(/\D/g, '')) {
    alert('번호가 일치하지 않습니다. 삭제 취소됨.');
    return;
  }
  try {
    showLoading && showLoading(true);
    const r = await api('DELETE', '/admin/user/' + encodeURIComponent(phone));
    const d = r.deleted || {};
    alert(
      `✅ 삭제 완료\n\n` +
      `· 사용자: ${d.user}\n` +
      `· 챕터 구독: ${d.access}\n` +
      `· 결제: ${d.payments}\n` +
      `· 포인트 이력: ${d.point_tx}\n` +
      `· 마케팅 발송: ${d.sends}\n` +
      `· 학습 진도: ${d.understood}\n` +
      `· 실시간 핑: ${d.pings}\n` +
      `합계: ${r.total}건`
    );
    closeModal && closeModal();
    // 사용자 목록 갱신
    if (typeof loadUsers === 'function') loadUsers();
  } catch (e) {
    if (e.status === 413) {
      alert('이 회원은 데이터가 너무 많아 한 번에 삭제할 수 없습니다.\n\n' + (e.message || ''));
    } else if (e.status === 403) {
      alert(e.message || '관리자 계정은 삭제할 수 없습니다.');
    } else {
      alert('삭제 실패: ' + (e.message || e));
    }
  } finally {

async function submitGrantAccess(phone) {
  const chapterId = Number($('grantAccessChapterId').value);

  const memo = $('grantAccessMemo').value.trim();

  try {

      user_phone: phone,
      chapter_id: chapterId,
      days,

      memo,
    });

    setTimeout(() => openUserDetail(phone), 300);

  }

async function revokeAccess(phone, chapterId, chapterTitle) {
  if (!confirm(`${chapterTitle || '#' + chapterId} 챕터 권한을 ${phone} 사용자에게서 회수하시겠습니까?\n(OnepageChapterAccess 행 삭제)`)) return;
  try {
    await api('DELETE', `/admin/access/${encodeURIComponent(phone)}/${chapterId}`);
    toast('권한 회수됨', 'ok');
    setTimeout(() => openUserDetail(phone), 300);
  } catch (e) {
    toast(e.message, 'err');
  }
}

async function updatePresetCounts() {
  if (state.users.length === 0) {
    try { const r = await api('GET', '/admin/users'); state.users = r.users || []; }
    catch (e) { return; }
  }
  const now = Date.now() + KST_OFFSET_MS;
  const weekMs = 7 * 86400 * 1000;
  const counts = {
    welcome: state.users.filter(u => u.role !== 'teacher' && u.joined_at && (Date.now() - new Date(u.joined_at).getTime()) < 7*86400*1000).length,
    renewal: state.users.filter(u => u.active_chapters.some(c => {
      const e = new Date(c.expires_at).getTime();
      return e - now <= weekMs && e > now;
    })).length,
    winback: state.users.filter(u => u.active_chapters.length === 0 && u.expired_chapters.length > 0).length,
    convert: state.users.filter(u => u.role !== 'teacher' && u.payment_count === 0).length,
    vip: state.users.filter(u => u.total_spent >= 50000).length,
    custom: state.selectedPhones.size,
  };
  for (const k of Object.keys(counts)) {
    const el = $('presetCnt_' + k);
    if (el) el.textContent = counts[k] > 0 ? `→ ${counts[k]}명 대상` : '대상 없음';
  }
}
function selectPreset(id) {
  state.campaign.template = id;
  renderCampaigns();
  const preset = CAMPAIGN_PRESETS.find(p => p.id === id);
  const targets = computeCampaignTargets(preset);
  $('campaignForm').style.display = 'block';
  $('campaignTarget').innerHTML = `
    <strong>${preset.title}</strong> — ${targets.length}명에게 발송 예정
    ${targets.length > 0 ? `<div style="margin-top:6px;font-size:11px;color:rgba(255,255,255,0.5)">
      ${targets.slice(0, 8).map(u => escapeHtml(u.name || u.phone)).join(', ')}${targets.length > 8 ? ` 외 ${targets.length-8}명` : ''}
    </div>` : ''}
  `;
  state.campaign.phones = targets.map(u => u.phone);
  // 기본 채널: 전화 있으면 sms, 없으면 email
  const sample = targets[0];
  if (sample) {
    $('campaignChannel').value = sample.phone ? 'sms' : 'email';
  }
}
function computeCampaignTargets(preset) {
  if (!preset || !preset.filter) {
    return state.users.filter(u => state.selectedPhones.has(u.phone));
  }
  const now = Date.now() + KST_OFFSET_MS;
  const weekMs = 7 * 86400 * 1000;
  switch (preset.filter) {
    case 'new_signup':
      return state.users.filter(u => u.role !== 'teacher' && u.joined_at && (Date.now() - new Date(u.joined_at).getTime()) < 7*86400*1000);
    case 'expiring':
      return state.users.filter(u => u.active_chapters.some(c => {
        const e = new Date(c.expires_at).getTime();
        return e - now <= weekMs && e > now;
      }));
    case 'lapsed':
      return state.users.filter(u => u.active_chapters.length === 0 && u.expired_chapters.length > 0);
    case 'never':
      return state.users.filter(u => u.role !== 'teacher' && u.payment_count === 0);
    case 'hivalue':
      return state.users.filter(u => u.total_spent >= 50000);
    default: return [];
  }
}

  if (!confirm(`${c.phones.length}명에게 발송합니다. 진행할까요?`)) return;
  try {
    const r = await api('POST', '/admin/webhook/send', {
      phones: c.phones,
      template: c.template,
      channel: c.channel,
      custom_message: c.message,
      subject: c.subject,

    state.campaignLog = r;
    toast(`발송 완료: 성공 ${r.sent} / 전체 ${r.total}`, 'ok');

function exportCampaignsCsv() {
  const r = state.campaignStats;
  if (!r || !r.campaigns) { toast('데이터 없음', 'err'); return; }
  const rows = [['시간(KST)','campaign_id','template','channel','subject','대상수','성공수','성공률(%)','관리자','phone','email','수신자명','수신ok','status','error']];
  for (const c of r.campaigns) {
    for (const x of c.recipients) {
      rows.push([
        c.sent_at, c.campaign_id, c.template, c.channel, c.subject,
        c.total, c.sent, c.total ? Math.round(c.sent/c.total*100) : 0,
        c.sent_by, x.phone, x.email, x.name, x.ok ? 1 : 0,
        x.status_code, x.error,
      ]);
    }
  }
  const csv = '﻿' + rows.map(row =>
    row.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')
  ).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `campaigns_${state.campaignDays}d_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

async function loadAttribution() {
  $('attributionBody').innerHTML = '<div class="loading">집계 중…</div>';
  try {
    const [attr, camps] = await Promise.all([
      api('GET', '/admin/attribution?days=' + state.attrDays),
      api('GET', '/admin/campaigns').catch(e => ({ campaigns: [], _err: e.message })),
    ]);
    state.attribution = attr;
    state.savedCampaigns = camps.campaigns || [];
    state.savedLoaded = true;
    if (camps._err) toast('캐페인 목록 로드 실패: ' + camps._err, 'err');
    renderAttribution();
  } catch (e) {
    $('attributionBody').innerHTML = `<div class="err-box">어트리뷰션 로드 실패: ${escapeHtml(e.message)}</div>`;
  }
}

async function saveCampaign() {
  const b = state.qrBuilder;
  if (!b.source && !b.medium && !b.campaign) {
    toast('소스 · 매체 · 캐페인 중 하나는 입력하세요', 'err');
    return;
  }
  const suggested = (b.campaign || b.source) + (b.content ? ' · ' + b.content : '');
  const name = prompt('이 캐페인의 이름을 정해주세요 (라이브러리에서 알아볼 수 있는 짧은 라벨)', suggested);
  if (name === null) return;
  const trimmed = (name.trim() || suggested);

  // 같은 UTM 조합 중복 검사
  const dup = state.savedCampaigns.find(c =>
    c.source === b.source && c.medium === b.medium &&
    c.campaign === b.campaign && c.content === b.content && (c.term || '') === (b.term || '')
  );
  if (dup) {
    if (!confirm(`같은 UTM 조합 "${dup.name}"이 이미 서버에 있습니다.\n새 이름으로 추가 저장할까요?\n(취소하면 저장 안 함)`)) return;
  }

  const notes = prompt('메모 (선택 — 어디에 어떻게 배포했는지 기록해두면 좋아요)', '') || '';

  try {
    const r = await api('POST', '/admin/campaigns', {
      name: trimmed,
      source: b.source, medium: b.medium,
      campaign: b.campaign, content: b.content, term: b.term,
      notes,
    });
    if (r.campaign) state.savedCampaigns.unshift(r.campaign);
    renderAttribution();
    toast(`"${trimmed}" 서버에 저장됨`, 'ok');
  } catch (e) {
    toast('저장 실패: ' + e.message, 'err');
  }
}

function loadSavedCampaign(id) {
  const c = state.savedCampaigns.find(x => x.id === id);
  if (!c) return;
  state.qrBuilder = {
    source: c.source || '', medium: c.medium || '',
    campaign: c.campaign || '', content: c.content || '', term: c.term || '',
    interests: [], // 저장된 캐페인엔 관심 주제 별도 보존 안 함 — 사용자가 다시 체크
  };
  $('qr_source').value = state.qrBuilder.source;
  $('qr_medium').value = state.qrBuilder.medium;
  $('qr_campaign').value = state.qrBuilder.campaign;
  $('qr_content').value = state.qrBuilder.content;
  $('qr_term').value = state.qrBuilder.term;
  document.querySelectorAll('.qr-interest-cb').forEach(cb => { cb.checked = false; });
  updateQr();
  $('qrCanvas').scrollIntoView({ behavior: 'smooth', block: 'center' });
  toast(`"${c.name}" 불러옴`, 'ok');
}

async function deleteSavedCampaign(id) {
  const c = state.savedCampaigns.find(x => x.id === id);
  if (!c) return;
  if (!confirm(`"${c.name}" 을(를) 서버에서 영구 삭제할까요?\n(다른 기기에서도 사라집니다)`)) return;
  try {
    await api('DELETE', '/admin/campaigns/' + encodeURIComponent(id));
    state.savedCampaigns = state.savedCampaigns.filter(x => x.id !== id);
    renderAttribution();
    toast('삭제됨', 'ok');
  } catch (e) {
    toast('삭제 실패: ' + e.message, 'err');
  }
}

function exportSavedCampaigns() {
  const data = JSON.stringify(state.savedCampaigns, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `onepage-campaigns-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('JSON 백업 다운로드 완료', 'ok');
}

function buildTrackingUrl() {
  const params = new URLSearchParams();
  ['source','medium','campaign','content','term'].forEach(k => {
    const v = $('qr_' + k)?.value.trim();
    if (v) params.set('utm_' + k, v);
  });
  // 관심 주제 — 체크된 것들 ?interest=A&interest=B 형태로 추가 (학생 앱이 그대로 파싱)
  const interests = getSelectedQrInterests();
  for (const it of interests) params.append('interest', it);
  const qs = params.toString();
  return LANDING_BASE_URL + (qs ? '?' + qs : '');
}

// 챕터 DB(state.chapters)에서 distinct subject 추출 → 체크박스 그리드 렌더
function renderQrInterestsGrid() {
  const target = $('qrInterestsGrid');
  if (!target) return;
  const subjects = [...new Set((state.chapters || []).map(c => c.subject || '기타'))]
    .filter(Boolean).sort();
  if (subjects.length === 0) {
    target.innerHTML = '<div class="qr-interests-empty">아직 챕터가 없습니다 — 챕터 추가 후 새로고침</div>';
    return;
  }
  const checked = new Set(state.qrBuilder.interests || []);
  target.innerHTML = subjects.map(s => `
    <label>
      <input type="checkbox" class="qr-interest-cb" value="${escapeHtml(s)}" ${checked.has(s) ? 'checked' : ''} onchange="onQrInterestChange()">
      <span>${escapeHtml(s)}</span>
    </label>
  `).join('');
}

function getSelectedQrInterests() {
  const cbs = document.querySelectorAll('.qr-interest-cb:checked');
  return Array.from(cbs).map(cb => cb.value).filter(Boolean);
}

function onQrInterestChange() {
  state.qrBuilder.interests = getSelectedQrInterests();
  updateQr();
}

function clearQrInterests() {
  document.querySelectorAll('.qr-interest-cb').forEach(cb => { cb.checked = false; });
  state.qrBuilder.interests = [];
  updateQr();
}
function updateQr() {
  const url = buildTrackingUrl();
  $('qrUrl').textContent = url;
  $('qrSub').textContent = url.length > 60 ? url.slice(0, 57) + '…' : url;
  const campaign = $('qr_campaign')?.value.trim();
  const content = $('qr_content')?.value.trim();
  $('qrLabel').textContent = campaign ? (campaign + (content ? ' · ' + content : '')) : '캐페인을 입력하세요';

  state.qrBuilder = {
    source: $('qr_source').value.trim(),
    medium: $('qr_medium').value.trim(),
    campaign: $('qr_campaign').value.trim(),
    content: $('qr_content').value.trim(),
    term: $('qr_term').value.trim(),
    interests: getSelectedQrInterests(),
  };

  drawQr(url);
}
function drawQr(url) {
  const target = $('qrCanvas');
  if (!target || typeof qrcode === 'undefined') return;
  // typeNumber=0 → 자동 최소 버전, 'M' = 15% 오류 정정
  const qr = qrcode(0, 'M');
  qr.addData(url);
  qr.make();
  // 5px = 한 모듈 크기 → 작은 QR은 220px 정도
  target.innerHTML = qr.createImgTag(5, 8);  // imgTag(cellSize, margin)
  const img = target.querySelector('img');
  if (img) { img.style.width = '240px'; img.style.height = '240px'; img.id = 'qrImg'; }
}
function applyAttrPreset(idx) {
  const p = ATTR_PRESETS[idx];
  state.qrBuilder = { source: p.source, medium: p.medium, campaign: p.campaign, content: p.content, term: '', interests: [] };
  $('qr_source').value = p.source;
  $('qr_medium').value = p.medium;
  $('qr_campaign').value = p.campaign;
  $('qr_content').value = p.content;
  $('qr_term').value = '';
  // 관심 주제 체크 모두 해제
  document.querySelectorAll('.qr-interest-cb').forEach(cb => { cb.checked = false; });
  updateQr();
  $('qrCanvas').scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function rebuildUrlForCampaign(source, medium, campaign, content) {
  // 표의 (없음) 같은 placeholder는 비우기
  function clean(s) { return s === '(없음)' || s === '(직접)' ? '' : s; }
  state.qrBuilder = {
    source: clean(source), medium: clean(medium),
    campaign: clean(campaign), content: clean(content), term: '', interests: [],
  };
  switchTab('attribution');
  setTimeout(() => {
    if ($('qr_source')) {
      $('qr_source').value = state.qrBuilder.source;
      $('qr_medium').value = state.qrBuilder.medium;
      $('qr_campaign').value = state.qrBuilder.campaign;
      $('qr_content').value = state.qrBuilder.content;
      $('qr_term').value = '';
      document.querySelectorAll('.qr-interest-cb').forEach(cb => { cb.checked = false; });
      updateQr();
      $('qrCanvas').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }, 150);
}
function copyQrUrl() {
  const url = buildTrackingUrl();
  navigator.clipboard.writeText(url).then(
    () => toast('URL이 클립보드에 복사되었습니다', 'ok'),
    () => toast('복사 실패 — URL 박스를 직접 선택하세요', 'err')
  );
}
function openQrUrl() {
  window.open(buildTrackingUrl(), '_blank');
}
function downloadQrPng() {
  const img = document.getElementById('qrImg');
  if (!img) { toast('QR이 아직 만들어지지 않았습니다', 'err'); return; }
  // SVG 또는 data URL 이미지를 PNG로 변환 → 다운로드
  const canvas = document.createElement('canvas');
  const size = 600;   // 고해상도 (인쇄용)
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, size, size);
  const tmp = new Image();
  tmp.onload = () => {
    // 가운데 정렬, 여백 포함
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(tmp, 0, 0, size, size);
    const url = canvas.toDataURL('image/png');
    const a = document.createElement('a');
    const camp = (state.qrBuilder.campaign || 'qr').replace(/[^\w-]/g, '_');
    const cont = state.qrBuilder.content ? '-' + state.qrBuilder.content.replace(/[^\w-]/g, '_') : '';
    a.download = `qr-${camp}${cont}.png`;
    a.href = url;
    a.click();
    toast('QR PNG 다운로드 완료', 'ok');
  };
  tmp.onerror = () => toast('PNG 변환 실패', 'err');
  tmp.src = img.src;
}
function printQrCode() {
  const url = buildTrackingUrl();
  const img = document.getElementById('qrImg');
  if (!img) { toast('QR이 아직 만들어지지 않았습니다', 'err'); return; }
  const label = $('qrLabel').textContent || '';
  const win = window.open('', '_blank');
  win.document.write(`
    <!DOCTYPE html><html><head><title>QR — ${label}</title>
    <style>
      body { font-family: sans-serif; text-align: center; padding: 40px; }
      img { width: 300px; height: 300px; image-rendering: pixelated; }
      h1 { font-size: 22px; margin-top: 18px; }
      p { color: #555; font-size: 13px; word-break: break-all; }
    </style></head><body>
    <img src="${img.src}">
    <h1>${escapeHtml(label)}</h1>
    <p>${escapeHtml(url)}</p>
    </body></html>
  `);
  win.document.close();
  setTimeout(() => win.print(), 500);
}

function flyerApplyHtml(html) {

function flyerSerialize() { return '<!DOCTYPE html>\n' + flyer.doc.documentElement.outerHTML; }

function flyerApplySizeToDoc() {
  const s = FLYER_SIZES[flyer.size];
  const pg = flyer.doc.querySelector('.page');
  if (pg) { pg.style.width = s.w; pg.style.height = s.h; pg.style.fontSize = s.fs; }
  const st = flyer.doc.querySelector('style');
  if (st && /@page/.test(st.textContent)) {
    st.textContent = st.textContent.replace(/@page\s*\{[^}]*\}/, '@page{size:' + flyer.size + ';margin:0}');

function flyerSetSize(size) {

function renderFlyerPreview() {

function flyerScale() {
  const f = $('flyerFrame'), scaler = $('flyerScaler'); if (!f || !scaler) return;
  const s = FLYER_SIZES[flyer.size];
  const scroll = scaler.parentElement;
  const avail = (scroll ? scroll.clientWidth : s.pxW) - 4;
  const scale = Math.min(1, avail / s.pxW);
  const pages = flyer.doc ? Math.max(1, flyer.doc.querySelectorAll('.page').length) : 1;
  const totalH = s.pxH * pages;
  f.style.width = s.pxW + 'px'; f.style.height = totalH + 'px';
  f.style.transform = 'scale(' + scale + ')'; f.style.transformOrigin = 'top left';
  scaler.style.width = (s.pxW * scale) + 'px';
  scaler.style.height = (totalH * scale) + 'px';
}

function flyerOnUpload(e) {
  const file = e.target.files && e.target.files[0]; if (!file || !flyer.uploadTarget) return;
  const target = flyer.uploadTarget;
  const reader = new FileReader();
  reader.onload = async () => {
    const src = reader.result;
    let out = src;
    if (/^feat\d+img$/.test(target)) {
      // 아이콘: 256px PNG로 축소 (투명 배경 유지)
      try { const small = await flyerCompressImage(src, 256, 0.92, 'image/png'); if (small) out = small; } catch (e2) {}
    } else {
      try { const small = await flyerCompressImage(src, 1600, 0.85); if (small && small.length < src.length) out = small; } catch (e2) {}
    }
    flyerSetImage(target, out);
  };
  reader.readAsDataURL(file);
}

function flyerMakeQr(slotId, url) {

  const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
  flyerSetImage(slotId, qr.createDataURL(6, 4));
}

// ── 이미지 압축 (용량 절감 — localStorage/서버 한도 방지) ──
function flyerCompressImage(dataUrl, maxDim, quality, mime) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight;
      if (!w || !h) { res(dataUrl); return; }
      if (Math.max(w, h) > maxDim) { const r = maxDim / Math.max(w, h); w = Math.round(w * r); h = Math.round(h * r); }
      try {
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        res(c.toDataURL(mime || 'image/jpeg', quality));   // 아이콘은 'image/png'으로 투명 유지
      } catch (e) { res(dataUrl); }
    };
    img.onerror = () => res(dataUrl);
    img.src = dataUrl;
  });
}
// 문서 내 업로드 이미지(큰 raster)를 일괄 재압축. QR·SVG placeholder는 건너뜀.
async function flyerCompressDocImages() {
  // 앞면 이미지 슬롯
  for (const el of [...flyer.doc.querySelectorAll('[data-image-id]')]) {
    const id = el.getAttribute('data-image-id');
    const src = el.getAttribute('src') || '';
    if (id === 'barcode') continue;
    if (!/^data:image\/(png|jpe?g|webp)/i.test(src)) continue;  // svg placeholder 제외
    if (src.length < 120000) continue;                          // 이미 작으면 스킵
    const small = await flyerCompressImage(src, 1600, 0.82);
    if (small && small.length < src.length) el.setAttribute('src', small);
  }
}

// ── 저장 / A·B 테스트 (localStorage) ──────────────────────
function flyerNowStr() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function flyerGetSaves() { try { return JSON.parse(localStorage.getItem(FLYER_SAVE_KEY) || '[]'); } catch (e) { return []; } }
function flyerPutSaves(a) {
  try { localStorage.setItem(FLYER_SAVE_KEY, JSON.stringify(a)); return true; }
  catch (e) {
    alert('브라우저 저장 공간이 가득 찼습니다.\n아래 목록에서 오래된 완성본을 🗑로 몇 개 삭제한 뒤 다시 저장하세요.\n(이제 이미지는 자동 압축되어 새 저장본은 훨씬 작습니다.)');
    return false;
  }
}
function flyerNextId(saves) { return saves.reduce((m, s) => Math.max(m, Number(s.id) || 0), 0) + 1; }

async function flyerSaveCurrent(asNew) {
  try { await flyerCompressDocImages(); } catch (e) {}
  const saves = flyerGetSaves();
  const name = ($('flyerSaveName').value || '').trim();
  const html = flyerSerialize();
  const now = flyerNowStr();
  let target = (!asNew && flyer.currentSaveId) ? saves.find(s => s.id === flyer.currentSaveId) : null;
  if (target) {
    target.name = name || target.name; target.html = html; target.size = flyer.size; target.updatedAt = now;
  } else {
    const id = flyerNextId(saves);
    target = { id, name: name || ('버전 ' + id), html, size: flyer.size, updatedAt: now };
    saves.push(target);
    flyer.currentSaveId = id;
  }
  flyerPutSaves(saves);
  flyerRenderSaves(); flyerUpdateSaveCur();
}
function flyerLoadSave(id) {
  const e = flyerGetSaves().find(s => s.id === id); if (!e) return;
  flyer.size = e.size || 'A4';
  const sel = $('flyerSize'); if (sel) sel.value = flyer.size;
  flyerApplyHtml(e.html);
  flyer.currentSaveId = id;
  $('flyerSaveName').value = e.name || '';
  flyerRenderSaves(); flyerUpdateSaveCur();
}
function flyerDuplicateSave(id) {
  const saves = flyerGetSaves();
  const e = saves.find(s => s.id === id); if (!e) return;
  const nid = flyerNextId(saves);
  saves.push({ id: nid, name: (e.name || '버전') + ' 복제', html: e.html, size: e.size || 'A4', updatedAt: flyerNowStr() });
  flyerPutSaves(saves); flyerRenderSaves();
}
function flyerDeleteSave(id) {
  if (!confirm('이 저장 버전을 삭제할까요?')) return;
  const saves = flyerGetSaves().filter(s => s.id !== id);
  flyerPutSaves(saves);
  if (flyer.currentSaveId === id) flyer.currentSaveId = null;
  flyerRenderSaves(); flyerUpdateSaveCur();
}
function flyerDownloadSave(id) {
  const e = flyerGetSaves().find(s => s.id === id); if (!e) return;
  const blob = new Blob([e.html], { type: 'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'flyer-' + e.id + '-' + (e.size || 'A4') + '.html';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function flyerNewFlyer() {
  flyer.size = 'A4';
  const sel = $('flyerSize'); if (sel) sel.value = 'A4';
  flyer.currentSaveId = null;
  const nm = $('flyerSaveName'); if (nm) nm.value = '';
  flyer._reassureBackup = '';
  flyerApplyHtml(flyerDefaultHtml());
  flyerRenderSaves(); flyerUpdateSaveCur();
}
function flyerUpdateSaveCur() {
  const el = $('flyerSaveCur'); if (!el) return;
  if (flyer.currentSaveId) {
    const e = flyerGetSaves().find(s => s.id === flyer.currentSaveId);
    el.textContent = e ? ('편집 중: #' + e.id + ' ' + (e.name || '') + ' (' + (e.size || 'A4') + ')') : '새 전단지 (저장 안 됨)';
  } else el.textContent = '새 전단지 (저장 안 됨)';
}

function flyerCopyApply(id) {
  const c = (flyer._copysets || []).find(x => x.id === id);
  if (!c) { flyerCopyRefresh(); return; }
  let data = {};
  try { data = JSON.parse(c.data || '{}'); } catch (e) {}
  let applied = 0;
  Object.keys(data).forEach(k => {
    if (flyer.doc.querySelector('[data-edit-id="' + k + '"]')) { flyerEditText(k, data[k]); applied++; }

  renderFlyerEditPanel();

function stripHtml(h) {
  const d = document.createElement('div'); d.innerHTML = String(h||'');
  return (d.textContent||'').replace(/\s+\n/g, String.fromCharCode(10)).trim();
}

async function copyVerifyPrompt(id) {
  const x = (window._reports||[]).find(r=>r.id===id); if(!x) return;
  const nl = String.fromCharCode(10);
  // 문제 원문 — 신고에 subtopic_id 가 있으면 실제 카드 내용(문제/해설)을 가져와 동봉
  let srcBlock = '[문제 원문] (신고에 문제가 지정되지 않아 원문 미첨부 — 챕터 전반 신고)';
  if (Number(x.subtopic_id)) {
    try {
      const it = await api('GET', '/items?subtopic_id=' + x.subtopic_id);
      const items = it.items || [];
      const q = items.filter(i=>i.caption==='암기카드').map(i=>stripHtml(i.text)).join(nl);
      const e = items.filter(i=>i.caption!=='암기카드').map(i=>stripHtml(i.text)).join(nl);
      srcBlock = '[문제 원문]' + nl + (q || '(문제 항목 없음)') + nl + nl + '[해설 원문]' + nl + (e || '(해설 항목 없음)');
    } catch(err) { srcBlock = '[문제 원문] 로드 실패: ' + err.message; }
  }
  const t = ['학생이 학습앱 콘텐츠의 오류를 신고했다. 아래 신고가 타당한지 엄격하게 검증해줘.','',
    '[신고 대상] ' + (x.chapter_title||'') + (x.subtopic_title?' › '+x.subtopic_title:''),
    '[신고 내용] ' + (x.content||''),'',
    srcBlock,'',
    '검증할 것:',
    '1. 신고가 지적하는 오류가 실제로 오류인지 — 관련 개념을 독립적으로 처음부터 풀어 판정',
    '2. 오류가 맞다면: 정확히 무엇이 왜 틀렸고, 올바른 값/문장은 무엇인지',
    '3. 오류가 아니라면: 학생이 왜 그렇게 느꼈을지와, 학생에게 보낼 정중한 설명 문안(2~3문장)','',
    '출력: "판정: 타당/타당하지 않음" 한 줄 + 근거 + (타당 시) [math-bank 수정요청] 형식 블록 / (아닐 시) 학생 답변 문안'
  ].join(nl);
  navigator.clipboard.writeText(t).then(()=>alert('검증 프롬프트가 복사되었습니다. GPT/Gemini/Claude에 붙여넣어 판정을 받으세요.'));
}

async function feedbackReport(id) {
  const x=(window._reports||[]).find(r=>r.id===id); if(!x) return;
  const msg = prompt('보낼 메시지 (문자)', '[원페이지 학습] ' + (x.user_name||'') + '님, 제보해 주신 내용을 확인했습니다. ');
  if(!msg) return;
  const ch = confirm('확인=문자만 / 취소=문자+메일') ? 'sms' : 'both';
  try { await api('POST', '/admin/error-reports/'+id+'/feedback', { channel: ch, message: msg });
    alert('발송 완료 (상태: 답변완료)'); loadReports();
  } catch(e){ alert('실패: '+e.message); }
}

async function setReportStatus(id, st) {
  const note = st==='rejected' ? (prompt('반려 사유(내부 메모)','')||'') : undefined;
  try { await api('PUT', '/admin/error-reports/'+id, note!==undefined?{status:st,admin_note:note}:{status:st}); loadReports(); }
  catch(e){ alert(e.message); }
}

const RV_SN = { positive:['긍정','#14532d'], negative:['부정','#7f1d1d'], neutral:['중립','#374151'], pending:['미분류','#78350f'] };
async function loadReviews() {
  $('rvPts').value = localStorage.getItem('crm_rev_pts') || 300;
  const sn = $('rvSent').value;
  try {
    const r = await api('GET', '/admin/reviews' + (sn && sn !== '_adopted' ? '?sentiment='+sn : ''));
    window._reviews = (r.reviews || []).filter(x => sn !== '_adopted' || Number(x.adopted));
    $('rvList').innerHTML = window._reviews.map(x => { const m=RV_SN[x.sentiment]||[x.sentiment,'#374151']; return `
      <div style="border:1px solid #334155;border-radius:10px;padding:12px;margin-bottom:10px;">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px;">
          ${fbBadge(m[0],m[1])} ${Number(x.adopted)?fbBadge('홈 노출중','#1e40af'):''}
          <b>${escapeHtml(x.user_name||'')}</b> <span style="opacity:.6">${escapeHtml(x.user_phone||'')}</span>
          <span style="opacity:.5;font-size:11px;margin-left:auto;">${escapeHtml(String(x.created_at||''))}${Number(x.points_awarded)?' · +'+x.points_awarded+'P':''}</span>
        </div>
        <div style="white-space:pre-wrap;font-size:13px;margin-bottom:8px;">${escapeHtml(x.content||'')}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          ${Number(x.adopted)
            ? `<button onclick="unadoptReview(${x.id})" style="background:#7f1d1d;">노출 해제</button>`
            : `<button onclick="adoptReview(${x.id})" style="background:#166534;">✅ 채택+포인트 (홈 노출)</button>`}
          <button onclick="reclassifyReview(${x.id})">🤖 AI 재분류</button>
          <button onclick="setReviewSentiment(${x.id},'positive')">긍정으로</button>
          <button onclick="setReviewSentiment(${x.id},'negative')">부정으로</button>
          <button onclick="deleteReview(${x.id})" style="background:#7f1d1d;">🗑 삭제</button>
        </div>
      </div>`; }).join('') || '<p>후기가 없습니다.</p>';
  } catch(e){ $('rvList').textContent = '오류: '+e.message; }
}

async function adoptReview(id) {
  const def = localStorage.getItem('crm_rev_pts') || 300;
  const p = prompt('적립할 포인트', def); if(p===null) return;
  if(!confirm('채택(홈 마퀴 노출) + ' + p + 'P 적립 + 감사 문자를 보낼까요?')) return;
  try { const r = await api('POST', '/admin/reviews/'+id+'/adopt', { points: Number(p)||0 });
    alert('완료! 적립 후 잔액 ' + r.new_point + 'P'); loadReviews();
  } catch(e){ alert('실패: '+e.message); }
}
async function unadoptReview(id) {
  if(!confirm('홈 노출을 해제할까요? (포인트는 회수되지 않음)')) return;
  try { await api('PUT', '/admin/reviews/'+id, { adopted: 0 }); loadReviews(); } catch(e){ alert(e.message); }
}
async function setReviewSentiment(id, sn) {
  try { await api('PUT', '/admin/reviews/'+id, { sentiment: sn }); loadReviews(); } catch(e){ alert(e.message); }
}

];

function routineKey() {
  const d = new Date(Date.now() + 9*3600*1000);
  return d.toISOString().slice(0,10);
}
function routineWeekKey() {
  const d = new Date(Date.now() + 9*3600*1000);
  const onejan = new Date(d.getFullYear(),0,1);
  const week = Math.ceil((((d - onejan) / 86400000) + onejan.getDay() + 1) / 7);
  return d.getFullYear() + '-W' + week;
}
function routineGet(scope) { try { return JSON.parse(localStorage.getItem('crm_routine_'+scope)||'{}'); } catch { return {}; } }
function routineToggle(scope, id) {
  const st = routineGet(scope); st[id] = !st[id];
  localStorage.setItem('crm_routine_'+scope, JSON.stringify(st));
  renderRoutine();
}

let _routineBadges = {};
async function loadRoutine() {
  renderRoutine();
  // 자동 배지 — 오류신고 신규 / 미채택 긍정 후기
  try {
    const [er, rv] = await Promise.all([
      api('GET','/admin/error-reports?status=new').catch(()=>({reports:[]})),
      api('GET','/admin/reviews').catch(()=>({reviews:[]})),
    ]);
    _routineBadges = {
      errNew: (er.reports||[]).length,
      rvPending: (rv.reviews||[]).filter(x=>!Number(x.adopted) && x.sentiment!=='negative').length,
    };
  } catch { _routineBadges = {}; }
  renderRoutine();
}

function renderRoutine() {
  const dk = routineKey(), wk = routineWeekKey();
  const ds = routineGet(dk), ws = routineGet(wk);
  const dDone = ROUTINE_D.filter(i=>ds[i.id]).length;
  const wDone = ROUTINE_W.filter(i=>ws[i.id]).length;
  const row = (i, scope, st) => {
    const badge = i.badge && _routineBadges[i.badge] ? `<span style="background:#7c2d12;color:#fdba74;font-size:11px;font-weight:800;padding:2px 8px;border-radius:10px;">${_routineBadges[i.badge]}건</span>` : '';
    return `
    <div style="display:flex;gap:10px;align-items:flex-start;border:1px solid ${st[i.id]?'#14532d':'#334155'};border-radius:10px;padding:11px 13px;margin-bottom:8px;${st[i.id]?'opacity:.55;':''}">
      <input type="checkbox" ${st[i.id]?'checked':''} onchange="routineToggle('${scope}','${i.id}')" style="width:18px;height:18px;margin-top:2px;cursor:pointer;">
      <div style="flex:1;">
        <div style="font-weight:700;display:flex;gap:8px;align-items:center;">${i.icon} ${i.label} ${badge}</div>
        <div style="font-size:12px;opacity:.6;margin-top:2px;">${i.desc}</div>
      </div>
      ${i.act?`<button onclick="${i.act.replace(/"/g,'&quot;')}" style="white-space:nowrap;">${i.actLabel} →</button>`:''}
    </div>`;
  };
  $('routineBox').innerHTML = `
    <h3 style="margin-bottom:4px;">☀️ 매일 루틴 <span style="font-size:13px;opacity:.6;">(${dk} · ${dDone}/${ROUTINE_D.length} 완료${dDone===ROUTINE_D.length?' 🎉':''})</span></h3>
    <p style="font-size:12px;opacity:.55;margin-bottom:10px;">체크는 자정(KST)에 자동 리셋됩니다. 순서대로 5~10분.</p>
    ${ROUTINE_D.map(i=>row(i,dk,ds)).join('')}
    <h3 style="margin:18px 0 4px;">📅 주간 루틴 <span style="font-size:13px;opacity:.6;">(${wk} · ${wDone}/${ROUTINE_W.length} 완료)</span></h3>
    <p style="font-size:12px;opacity:.55;margin-bottom:10px;">매주 월요일 권장. 주가 바뀌면 자동 리셋.</p>
    ${ROUTINE_W.map(i=>row(i,wk,ws)).join('')}`;
}

async function reclassifyReview(id) {
  try { const r = await api('POST', '/admin/reviews/'+id+'/classify');
    alert('분류 결과: ' + r.sentiment + ' (' + r.via + ')' + (r.ai_error ? ' / AI메모: ' + r.ai_error : ''));
    loadReviews();
  } catch(e){ alert('실패: '+e.message); }
}
async function deleteReview(id) {
  if(!confirm('이 후기를 완전히 삭제할까요? (복구 불가)')) return;
  try { await api('DELETE', '/admin/reviews/'+id); loadReviews(); } catch(e){ alert(e.message); }
}
async function deleteReport(id) {
  if(!confirm('이 신고를 완전히 삭제할까요? (복구 불가 — 테스트 데이터 정리용)')) return;
